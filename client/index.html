<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>Dakzo Systems</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Comprehensive ERP and POS system for multi-company warehouse management with inventory tracking, financial reports, and analytics." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .catch(function () {
              // Older browsers may not understand updateViaCache. Keep the
              // original registration path as a compatibility fallback.
              return navigator.serviceWorker.register('/sw.js');
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
