name: Finalize bandwidth phases 7-8

on:
  push:
    branches:
      - agent/bandwidth-phases-7-8

permissions:
  contents: write

concurrency:
  group: finalize-bandwidth-phases-7-8
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bandwidth-phases-7-8
          fetch-depth: 0
      - run: python scripts/finalize-bandwidth-phases-7-8.py
      - run: |
          rm -f scripts/finalize-bandwidth-phases-7-8.py
          rm -f .github/workflows/finalize-bandwidth-phases-7-8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish bandwidth company boundaries and scoped cache identities"
          git push origin HEAD:agent/bandwidth-phases-7-8
