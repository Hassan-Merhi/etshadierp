name: Phase 14 Branch Format

on:
  push:
    branches:
      - phase-14-final-security-reaudit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore: apply phase 14 prettier')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed source files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.css')
          if (( ${#files[@]} > 0 )); then
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          fi

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.ts' '*.tsx' '*.css'
          git commit -m "chore: apply phase 14 prettier"
          git push origin HEAD:${GITHUB_REF_NAME}
