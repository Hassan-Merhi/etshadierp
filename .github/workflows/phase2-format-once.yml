name: Phase 2 Format Once

on:
  push:
    branches:
      - program/erp-90-phase-2
    paths:
      - .github/workflows/phase2-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format exact Phase 2 blockers
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/account-currency-route-behavior.test.ts \
            tests/pos-sales-route-behavior.test.ts \
            tests/stock-transfer-revision-write-route-behavior.test.ts \
            tests/ui/pos-price-list-page-behavior.test.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- \
            tests/account-currency-route-behavior.test.ts \
            tests/pos-sales-route-behavior.test.ts \
            tests/stock-transfer-revision-write-route-behavior.test.ts \
            tests/ui/pos-price-list-page-behavior.test.tsx; then
            echo "Files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/account-currency-route-behavior.test.ts \
            tests/pos-sales-route-behavior.test.ts \
            tests/stock-transfer-revision-write-route-behavior.test.ts \
            tests/ui/pos-price-list-page-behavior.test.tsx
          git commit -m "chore: format remaining phase 2 tests"
          git push origin HEAD:program/erp-90-phase-2
