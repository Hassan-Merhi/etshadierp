name: Diagnostic Postgres PR818 Shards

on:
  push:
    branches: [diagnostic/postgres-pr818-shards]

permissions:
  contents: read

jobs:
  backend-shard:
    name: Backend shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: diagnostic-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.14.0"
      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Run backend shard verbosely
        shell: bash
        run: |
          set -o pipefail
          mapfile -t all_files < <(
            find tests server shared -type f -name '*.test.ts' \
              ! -path 'tests/ui/*' \
              ! -path 'tests/api-smoke-sweep.test.ts' | sort
          )
          selected=()
          for i in "${!all_files[@]}"; do
            if (( i % 4 == ${{ matrix.shard }} )); then
              selected+=("${all_files[$i]}")
            fi
          done
          printf 'Shard %s has %s files\n' '${{ matrix.shard }}' "${#selected[@]}"
          printf '%s\n' "${selected[@]}"
          node node_modules/vitest/vitest.mjs run "${selected[@]}" --maxWorkers=1 --no-file-parallelism --reporter=verbose 2>&1 | tee "backend-shard-${{ matrix.shard }}.log"
