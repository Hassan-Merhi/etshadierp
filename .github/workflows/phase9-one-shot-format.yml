name: Phase 9 One-Shot Format

on:
  push:
    branches:
      - chatgpt/golden-coast-phase9-hassan-savings-withdrawals

permissions:
  contents: write

jobs:
  format:
    name: Format Phase 9 and remove helper
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format exact Phase 9 files
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          server/routes/sp/index.ts
          server/routes/sp/spGoldenCoastPhase9HassanSavingsWithdrawalRoutes.ts
          server/services/accounting/goldenCoastPhase9HassanSavingsWithdrawal.test.ts
      - name: Remove one-shot helper and push formatting
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase9-one-shot-format.yml
          if git diff --quiet; then
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routes/sp/index.ts \
            server/routes/sp/spGoldenCoastPhase9HassanSavingsWithdrawalRoutes.ts \
            server/services/accounting/goldenCoastPhase9HassanSavingsWithdrawal.test.ts \
            .github/workflows/phase9-one-shot-format.yml
          git commit -m 'chore: format Golden Coast Phase 9'
          git push
