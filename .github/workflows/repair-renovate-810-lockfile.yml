name: Repair Renovate #810 lockfile

on:
  push:
    branches:
      - renovate/dompurify-3.x

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: renovate/dompurify-3.x
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change produced."
            exit 0
          fi
          git commit -m "fix(deps): regenerate DOMPurify lockfile"
          git push origin HEAD:renovate/dompurify-3.x
