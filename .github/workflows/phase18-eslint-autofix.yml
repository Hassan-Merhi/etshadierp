name: Phase 18 ESLint Autofix

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  autofix:
    if: contains(github.event.head_commit.message, '[phase18-eslint-autofix]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Fix lint and compile-gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run lint:fix || true
          npm run check
          git add client/src server shared
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: apply compiler-safe ESLint fixes [phase18-eslint-fixes] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
