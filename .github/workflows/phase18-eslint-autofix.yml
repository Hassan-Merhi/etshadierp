name: Phase 18 ESLint Autofix

on:
  workflow_dispatch:
  push:
    branches: [fix/account-statement-exports-20260819]

permissions:
  contents: write

env:
  CI: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/account-statement-exports-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format PR 778 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node node_modules/prettier/bin/prettier.cjs --write server/lib/accountStatementExportSafety.ts server/routes/accountStatementRoutes.ts tests/account-statement-export-safety.test.ts
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase18-eslint-autofix.yml
          rm -f .github/workflows/temp-format-pr778.yml
          git add -A -- server/lib/accountStatementExportSafety.ts server/routes/accountStatementRoutes.ts tests/account-statement-export-safety.test.ts .github/workflows/phase18-eslint-autofix.yml .github/workflows/temp-format-pr778.yml
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'style(accounts): format statement export fix'
          git push origin HEAD:fix/account-statement-exports-20260819
