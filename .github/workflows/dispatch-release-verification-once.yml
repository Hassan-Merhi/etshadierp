name: Dispatch Final Release Verification

on:
  push:
    branches:
      - main
      - agent/release-verification-gate-diagnostics
    paths:
      - .github/workflows/dispatch-release-verification-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release Verification on current ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/release-verification.yml/dispatches" \
            --data "{\"ref\":\"${TARGET_REF}\"}"
