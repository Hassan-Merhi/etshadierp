name: Phase 5 Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry and install
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Apply repository formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/lib/factoryApi.ts \
            tests/factory-post-offload-phase5-reconciliation.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/lib/factoryApi.ts tests/factory-post-offload-phase5-reconciliation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Phase 5: format client reconciliation refresh"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Type-check
        run: npm run check

      - name: Focused Phase 5 tests
        run: |
          node node_modules/vitest/vitest.mjs run \
            tests/factory-post-offload-phase5-reconciliation.test.ts \
            --maxWorkers=1 --no-file-parallelism
