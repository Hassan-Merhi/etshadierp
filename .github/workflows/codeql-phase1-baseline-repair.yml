name: CodeQL Phase 1 Baseline Repair

on:
  push:
    branches: ["security/codeql-phase1-inventory"]
    paths:
      - ".github/workflows/codeql-phase1-baseline-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Align inventory metadata with analyzed SHA
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const jsonPath = 'artifacts/security/codeql-phase1-open-alerts.json';
          const mdPath = 'artifacts/security/codeql-phase1-inventory.md';
          const inventory = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          const codeql = inventory.alerts.filter((alert) => String(alert.toolName).toLowerCase().includes('codeql'));
          const analyzedShas = [...new Set(codeql.map((alert) => alert.commitSha).filter(Boolean))];
          if (analyzedShas.length !== 1) {
            throw new Error(`Expected one CodeQL analyzed SHA, found: ${analyzedShas.join(', ') || '(none)'}`);
          }
          const analyzedSha = analyzedShas[0];
          const observedMainSha = inventory.summary.repositoryMainShaAtCollection || inventory.summary.mainSha;
          inventory.summary.repositoryMainShaAtCollection = observedMainSha;
          inventory.summary.codeqlAnalyzedMainSha = analyzedSha;
          inventory.summary.mainSha = analyzedSha;
          fs.writeFileSync(jsonPath, `${JSON.stringify(inventory, null, 2)}\n`);

          let report = fs.readFileSync(mdPath, 'utf8');
          const oldSnapshotLine = `Main snapshot: \`${observedMainSha}\``;
          const replacement = `Main ref observed at collection: \`${observedMainSha}\`\nCodeQL analyzed main snapshot: \`${analyzedSha}\``;
          if (!report.includes(oldSnapshotLine)) {
            throw new Error('Could not find the original main snapshot line in the Phase 1 report');
          }
          report = report.replace(oldSnapshotLine, replacement);
          const scopeNeedle = `CodeQL accounts for **${inventory.summary.codeqlOpenAlerts}** open alerts; the remaining **${inventory.summary.nonCodeqlOpenAlerts}** are from other code-scanning tools.`;
          const scopeReplacement = `${scopeNeedle}\n\nThe open-alert state was queried for \`refs/heads/main\`, while CodeQL's most recent analyzed instances all point to \`${analyzedSha}\`. Alert locations and line numbers therefore belong to that analyzed SHA, not the newer observed branch head \`${observedMainSha}\`. Remediation must re-check the live alert/scan state after each fix rather than treating stale line numbers as exact current-main locations.`;
          if (!report.includes(scopeNeedle)) {
            throw new Error('Could not find the CodeQL scope sentence in the Phase 1 report');
          }
          report = report.replace(scopeNeedle, scopeReplacement);
          fs.writeFileSync(mdPath, report);
          console.log(JSON.stringify({ observedMainSha, analyzedSha, codeqlAlerts: codeql.length }));
          NODE

      - name: Commit corrected baseline metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ets-ci-inventory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/security/codeql-phase1-open-alerts.json artifacts/security/codeql-phase1-inventory.md
          git commit -m "security: record CodeQL analyzed baseline SHA"
          git push origin HEAD:${GITHUB_REF_NAME}
