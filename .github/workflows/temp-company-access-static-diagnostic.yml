name: Temporary company access static diagnostic

on:
  push:
    branches:
      - agent/fix-route-aware-company-context-rebased

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'Trigger company access static diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-route-aware-company-context-rebased
          fetch-depth: 0

      - name: Reproduce first static-build failure
        shell: bash
        run: |
          set +e
          diagnostic="tmp-company-access-static-diagnostic.txt"
          rm -f "$diagnostic"

          run_check() {
            local name="$1"
            shift
            local log
            log="$(mktemp)"
            "$@" >"$log" 2>&1
            local status=$?
            if [ $status -ne 0 ]; then
              {
                echo "FAILED STEP: $name"
                echo
                tail -n 500 "$log"
              } > "$diagnostic"
              return 1
            fi
            return 0
          }

          run_check "npm ci" npm ci --no-audit --bin-links=true || true
          if [ ! -f "$diagnostic" ]; then run_check "verify lockfile" npm run verify:lockfile || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "verify production dependencies" npm run verify:production-dependencies || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "lint" npm run lint || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "TypeScript" npm run check || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "production build" npm run build || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "server bundle" npm run verify:server-bundle || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "observability" npm run verify:program1-observability || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "production readiness" npm run verify:final-production-readiness || true; fi
          if [ ! -f "$diagnostic" ]; then run_check "bandwidth" npm run verify:bandwidth || true; fi
          if [ ! -f "$diagnostic" ]; then echo "ALL STATIC STEPS PASSED" > "$diagnostic"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$diagnostic"
          git commit -m "Record company access static diagnostic"
          git push origin HEAD:agent/fix-route-aware-company-context-rebased
