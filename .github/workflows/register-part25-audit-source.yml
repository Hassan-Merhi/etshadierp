name: Register part25 with i18n audit

on:
  push:
    branches:
      - fix/supplier-partner-customer-legacy-zero-net-position

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-partner-customer-legacy-zero-net-position
          fetch-depth: 0

      - name: Register compatibility translation file
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-i18n-phase14.mjs')
          text = path.read_text()
          old = '  "client/src/i18n/phase3RemainingTranslations.part24.ts",\n'
          new = old + '  "client/src/i18n/phase3RemainingTranslations.part25.ts",\n'
          if old not in text:
              raise SystemExit('part24 audit anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/register-part25-audit-source.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: register phase3 part25 with audit"
          git push origin HEAD:fix/supplier-partner-customer-legacy-zero-net-position
