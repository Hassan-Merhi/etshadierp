name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Capture production dependency audit
        id: production_audit_report
        if: always()
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          npm audit --omit=dev --audit-level=high || true

      - name: Block critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: production-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit all dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=critical

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for verified secrets
        uses: trufflesecurity/trufflehog@v3.90.4
        with:
          extra_args: --results=verified,unknown
