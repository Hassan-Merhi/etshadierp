name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Cancel superseded pull-request runs only; every commit on main is gated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Capture production dependency audit
        id: production_audit_report
        if: always()
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          npm audit --omit=dev --audit-level=high || true

      - name: Block unreviewed high and critical production vulnerabilities
        run: npm run verify:dependency-audit

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-dependency-audit
          path: production-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit all dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run verify:dependency-audit -- --include-dev

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block verified secrets
        uses: trufflesecurity/trufflehog@v3.90.4
        with:
          extra_args: --results=verified

      - name: Report unknown secret candidates
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.90.4
        with:
          extra_args: --results=unknown
