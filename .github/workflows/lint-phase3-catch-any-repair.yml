name: Lint Phase 3 Catch Any Repair

on:
  push:
    branches:
      - agent/lint-phase-3-catch-any
    paths:
      - .github/workflows/lint-phase3-catch-any-repair.yml

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/lint-phase-3-catch-any
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
          git checkout -- package-lock.json
      - name: Classify remaining catch-any usages
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import ts from "typescript";

          const roots = ["client/src", "server", "shared"];
          const files = [];
          const walk = (dir) => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(?:ts|tsx)$/.test(entry.name)) files.push(full);
            }
          };
          roots.forEach(walk);

          const chainCounts = new Map();
          const parentCounts = new Map();
          let catches = 0;
          const sites = [];

          const rootIdentifier = (node) => {
            let current = node;
            while (
              ts.isPropertyAccessExpression(current) ||
              ts.isElementAccessExpression(current) ||
              ts.isCallExpression(current) ||
              ts.isNonNullExpression(current) ||
              ts.isParenthesizedExpression(current)
            ) {
              if (ts.isCallExpression(current)) current = current.expression;
              else current = current.expression;
            }
            return ts.isIdentifier(current) ? current : null;
          };

          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            const sf = ts.createSourceFile(
              file,
              source,
              ts.ScriptTarget.Latest,
              true,
              file.endsWith(".tsx") ? ts.ScriptKind.TSX : ts.ScriptKind.TS
            );
            const visit = (node) => {
              if (
                ts.isCatchClause(node) &&
                node.variableDeclaration &&
                ts.isIdentifier(node.variableDeclaration.name) &&
                node.variableDeclaration.type?.getText(sf) === "any"
              ) {
                catches += 1;
                const name = node.variableDeclaration.name.text;
                const line = sf.getLineAndCharacterOfPosition(node.getStart(sf)).line + 1;
                const usages = new Set();
                const scan = (child) => {
                  if (
                    ts.isIdentifier(child) &&
                    child.text === name &&
                    child !== node.variableDeclaration.name
                  ) {
                    let top = child;
                    while (
                      top.parent &&
                      (ts.isPropertyAccessExpression(top.parent) ||
                        ts.isElementAccessExpression(top.parent) ||
                        ts.isCallExpression(top.parent) ||
                        ts.isNonNullExpression(top.parent) ||
                        ts.isParenthesizedExpression(top.parent)) &&
                      (top.parent.expression === top ||
                        (ts.isCallExpression(top.parent) && top.parent.arguments.includes(top)))
                    ) {
                      if (ts.isCallExpression(top.parent) && top.parent.arguments.includes(top)) break;
                      top = top.parent;
                    }
                    const text = top.getText(sf).replace(/\s+/g, " ").slice(0, 180);
                    usages.add(text);
                    const parentKind = ts.SyntaxKind[child.parent.kind];
                    parentCounts.set(parentKind, (parentCounts.get(parentKind) ?? 0) + 1);

                    let chainNode = child;
                    while (
                      chainNode.parent &&
                      (ts.isPropertyAccessExpression(chainNode.parent) || ts.isElementAccessExpression(chainNode.parent)) &&
                      chainNode.parent.expression === chainNode
                    ) chainNode = chainNode.parent;
                    if (chainNode !== child) {
                      const chain = chainNode.getText(sf).replace(/\s+/g, " ");
                      chainCounts.set(chain, (chainCounts.get(chain) ?? 0) + 1);
                    }
                  }
                  ts.forEachChild(child, scan);
                };
                scan(node.block);
                sites.push(`${file}:${line} catch (${name}: any) :: ${[...usages].join(" | ")}`);
              }
              ts.forEachChild(node, visit);
            };
            visit(sf);
          }

          console.log(`Remaining catch-any sites: ${catches}`);
          console.log("\n=== DIRECT/CHAIN USAGE COUNTS ===");
          for (const [chain, count] of [...chainCounts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))) {
            console.log(`${count}\t${chain}`);
          }
          console.log("\n=== IDENTIFIER PARENT KINDS ===");
          for (const [kind, count] of [...parentCounts].sort((a, b) => b[1] - a[1])) console.log(`${count}\t${kind}`);
          console.log("\n=== SITES ===");
          console.log(sites.join("\n"));
          NODE
