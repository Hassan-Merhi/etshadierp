name: TEMP CI Repair Transform
on:
  push:
    branches: [fix/ci-postgres-suite-cleanup-20260818]
permissions:
  contents: read
jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Apply test-harness repair and format
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/post-offload-charge-mutation-positive-path.test.ts')
          s = p.read_text()
          old = '''    voucherEntries: { name: "voucherEntries", id: "voucherEntries.id", voucherId: "voucherEntries.voucherId" },\n  };'''
          new = '''    voucherEntries: { name: "voucherEntries", id: "voucherEntries.id", voucherId: "voucherEntries.voucherId" },\n    accountingPostingRequests: {\n      name: "accountingPostingRequests",\n      companyId: "accountingPostingRequests.companyId",\n      idempotencyKey: "accountingPostingRequests.idempotencyKey",\n      sourceType: "accountingPostingRequests.sourceType",\n      sourceId: "accountingPostingRequests.sourceId",\n      requestFingerprint: "accountingPostingRequests.requestFingerprint",\n      voucherId: "accountingPostingRequests.voucherId",\n    },\n    auditLog: { name: "auditLog" },\n  };'''
          if old not in s:
              raise SystemExit('table anchor not found')
          s = s.replace(old, new, 1)
          old = '''        where: () => builder,\n        for: async () => result,'''
          new = '''        where: () => builder,\n        limit: async () => result,\n        for: async () => result,'''
          if old not in s:
              raise SystemExit('builder anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Prettier repair files
        run: npx prettier --write tests/ui/helpers.tsx tests/vouchers.test.ts tests/whatsapp-triggers.test.ts tests/post-offload-charge-mutation-positive-path.test.ts
      - name: Run targeted post-offload test
        id: targeted
        continue-on-error: true
        run: npx vitest run tests/post-offload-charge-mutation-positive-path.test.ts --maxWorkers=1 --no-file-parallelism 2>&1 | tee targeted.log
      - name: Package transformed files
        if: always()
        run: tar -czf repair-files.tar.gz tests/ui/helpers.tsx tests/vouchers.test.ts tests/whatsapp-triggers.test.ts tests/post-offload-charge-mutation-positive-path.test.ts targeted.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repair-transform-output
          path: repair-files.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Enforce targeted test
        if: steps.targeted.outcome != 'success'
        run: exit 1
