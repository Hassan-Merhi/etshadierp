name: Bandwidth phases 1-2

on:
  push:
    branches:
      - bandwidth-phases-1-2
  pull_request:
    branches:
      - main
    paths:
      - "client/src/app/useAuthenticatedAppData.ts"
      - "client/src/components/AppSidebar.tsx"
      - "client/src/components/FactorySidebar.tsx"
      - "client/src/components/NotificationsCenter.tsx"
      - "client/src/contexts/CompanyContext.tsx"
      - "client/src/hooks/use-presence.ts"
      - "client/src/lib/queryClient.ts"
      - "client/src/lib/queryPolicies.ts"
      - "tests/ui/queryPolicies.test.ts"
      - "scripts/enforce-bandwidth-phases-1-2.py"
      - "scripts/verify-bandwidth-query-phases-1-2.mjs"
      - ".github/workflows/bandwidth-phases-1-2.yml"

permissions:
  contents: write

concurrency:
  group: bandwidth-phases-1-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'bandwidth-phases-1-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bandwidth-phases-1-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply Phase 1-2 implementation
        run: python scripts/enforce-bandwidth-phases-1-2.py

      - name: Format changed files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/app/useAuthenticatedAppData.ts \
            client/src/components/AppSidebar.tsx \
            client/src/components/FactorySidebar.tsx \
            client/src/components/NotificationsCenter.tsx \
            client/src/contexts/CompanyContext.tsx \
            client/src/lib/queryClient.ts \
            client/src/lib/queryPolicies.ts \
            tests/ui/queryPolicies.test.ts \
            scripts/verify-bandwidth-query-phases-1-2.mjs

      - name: Verify Phase 1-2 contracts
        run: node scripts/verify-bandwidth-query-phases-1-2.mjs

      - name: Focused policy tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/queryPolicies.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Type-check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit completed Phase 1-2 implementation
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Phase 1-2 branch already contains the completed implementation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/app/useAuthenticatedAppData.ts \
            client/src/components/AppSidebar.tsx \
            client/src/components/FactorySidebar.tsx \
            client/src/components/NotificationsCenter.tsx \
            client/src/contexts/CompanyContext.tsx \
            client/src/lib/queryClient.ts \
            client/src/lib/queryPolicies.ts \
            tests/ui/queryPolicies.test.ts \
            scripts/enforce-bandwidth-phases-1-2.py \
            scripts/verify-bandwidth-query-phases-1-2.mjs
          git commit -m "Complete bandwidth polling and shared cache phases"
          git push origin HEAD:bandwidth-phases-1-2
