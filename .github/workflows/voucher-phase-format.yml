name: Voucher Phase Finalizer

on:
  push:
    branches:
      - codex/voucher-idempotency-phases4-8

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/voucher-idempotency-phases4-8
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#https://package-proxy.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Finalize Phase 7 inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = Path('scripts/audit-write-evidence.mjs')
          text = audit.read_text()
          old = '      if (!approvedDirectCreators.has(file)) unapprovedDirectVoucherCreation.push(file);'
          new = '''      if (!approvedDirectCreators.has(file) && !IDENTITY_OWNING_VOUCHER_WRITERS.has(file)) {
                unapprovedDirectVoucherCreation.push(file);
              }'''
          if old not in text:
              raise SystemExit('expected direct-creator guard not found')
          audit.write_text(text.replace(old, new))

          review_path = Path('config/voucher-write-evidence-review.json')
          review = json.loads(review_path.read_text())
          review['summary']['phase7PostReviewSafeWriters'] = 1
          review['completed']['phase-7-post-review-safe-writers'] = {
              'verdict': 'post-review creator already protected by durable stock-document request identity',
              'reason': 'This stock-transfer creator entered the live tree after the original 81-file voucher review. Its create-from-scratch branch already consumes clientRequestId, uses the stock-document idempotency key/marker inside the transfer transaction, replays the existing transfer on retry, and is protected by the global accounting request identity client path. Phase 7 records it explicitly so the direct-creation audit can distinguish reviewed growth from an unprotected escape hatch.',
              'files': ['server/routes/fiscal-transfers/create.ts'],
          }
          review_path.write_text(json.dumps(review, indent=2) + '\n')
          PY
      - name: Remove temporary diagnostics and branch note
        run: |
          rm -rf artifacts/voucher-phase-diagnostics
          rm -f docs/engineering/voucher-path-phases-4-8.md
      - name: Re-pin write evidence downward
        run: UPDATE_WRITE_EVIDENCE_BASELINE=1 node scripts/audit-write-evidence.mjs
      - name: Verify voucher evidence closure
        run: node scripts/audit-write-evidence.mjs
      - name: Run focused voucher phase tests
        run: npx vitest run tests/phase4-operational-voucher-idempotency.test.ts tests/voucher-path-phases5-8.test.ts tests/accounting-request-identity.test.ts tests/write-evidence-ratchet.test.ts
      - name: Format changed voucher files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/lib/accountingRequestFetchGuard.ts \
            client/src/lib/accountingRequestIdentity.ts \
            client/src/lib/phase5VoucherRequestIdentity.ts \
            config/voucher-write-evidence-review.json \
            config/write-evidence-baseline.json \
            scripts/audit-write-evidence.mjs \
            server/routes.ts \
            server/services/accounting/operationalVoucherRequestBoundary.ts \
            server/services/accounting/replayAuthorizationContext.ts \
            server/services/accounting/voucherPathPhase5to6Boundary.ts \
            shared/voucherPathIdentityPolicy.ts \
            tests/accounting-request-identity.test.ts \
            tests/phase4-operational-voucher-idempotency.test.ts \
            tests/voucher-path-phases5-8.test.ts \
            tests/voucher-path-request-boundary-postgres.test.ts \
            tests/write-evidence-ratchet.test.ts
      - name: Commit final voucher evidence state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finalize voucher phases 4-8 evidence"
          git push origin HEAD:codex/voucher-idempotency-phases4-8
