name: Voucher Phase Diagnostics

on:
  push:
    branches:
      - codex/voucher-idempotency-phases4-8

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/voucher-idempotency-phases4-8
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#https://package-proxy.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Collect failing gate reports
        run: |
          mkdir -p artifacts/voucher-phase-diagnostics
          node scripts/audit-write-evidence.mjs --json > artifacts/voucher-phase-diagnostics/write-evidence.json || true
          node scripts/audit-type-escapes.mjs --json > artifacts/voucher-phase-diagnostics/type-escapes.json || true
          node scripts/audit-doc-index.mjs --json > artifacts/voucher-phase-diagnostics/doc-index.json || true
          node scripts/audit-script-inventory.mjs --json > artifacts/voucher-phase-diagnostics/script-inventory.json || true
          node scripts/run-lint.mjs --quiet > artifacts/voucher-phase-diagnostics/lint.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/voucher-phase-diagnostics
          git commit -m "diagnose voucher phase verification gates"
          git push origin HEAD:codex/voucher-idempotency-phases4-8
