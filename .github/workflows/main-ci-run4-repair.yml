name: Main CI Run4 Repair

on:
  push:
    branches:
      - agent/main-ci-green-20260812-run4
    paths:
      - .github/workflows/main-ci-run4-repair.yml
      - scripts/repair-main-ci-run4.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-ci-green-20260812-run4
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Apply and verify focused repairs
        run: python3 scripts/repair-main-ci-run4.py

      - name: Commit repaired CI state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore main CI regressions"
          git push origin HEAD:agent/main-ci-green-20260812-run4
