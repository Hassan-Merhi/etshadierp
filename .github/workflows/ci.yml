name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
  PGSSLMODE: disable
  NODE_ENV: test
  SESSION_SECRET: ci-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  NODE_OPTIONS: --max-old-space-size=4096
  PORT: "5000"

jobs:
  repo-audits:
    name: Repository Audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Dependency diagnostics
        if: always() && steps.install.outcome == 'success'
        run: |
          node --version
          npm --version
          npm config get bin-links
          node -p "'TypeScript ' + require('typescript/package.json').version"
          node -p "'jsdom ' + require('jsdom/package.json').version"
          for binary in tsc vite eslint vitest; do
            if [ -x "node_modules/.bin/$binary" ]; then
              echo "$binary: available"
            else
              echo "::warning::$binary is missing from node_modules/.bin"
            fi
          done

      - name: Verify environment documentation
        if: always() && steps.install.outcome == 'success'
        run: npm run verify:env-docs

      - name: Type-escape ratchet
        if: always() && steps.install.outcome == 'success'
        run: npm run audit:type-escapes

      - name: Documentation state index
        if: always() && steps.install.outcome == 'success'
        run: npm run audit:doc-index

      - name: Write-route coverage ratchet
        if: always() && steps.install.outcome == 'success'
        run: npm run audit:write-routes

      - name: Write-evidence ratchet
        if: always() && steps.install.outcome == 'success'
        run: npm run audit:write-evidence

      - name: Toolchain coherence
        if: always() && steps.install.outcome == 'success'
        run: npm run audit:toolchain

      - name: Script inventory
        if: always() && steps.install.outcome == 'success'
        run: npm run audit:scripts

      - name: Readable logging contracts
        if: always() && steps.install.outcome == 'success'
        run: node scripts/verify-readable-logging-phase-10.mjs

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Type-check
        id: typecheck
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ts-errors-ci.txt

      - name: Upload type-check failure log
        if: always() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typecheck-errors
          path: ts-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

  lint-format:
    name: Lint / Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Lint
        id: lint
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-errors-ci.txt

      - name: Upload lint failure log
        if: always() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-errors
          path: lint-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Lint warning ratchet
        if: always() && steps.lint.conclusion != 'skipped'
        run: npm run audit:lint-ratchet

      - name: Format changed source files
        id: format_check
        if: always() && steps.install.outcome == 'success'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="HEAD^"
            fi
          fi

          mapfile -t changed_files < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${GITHUB_SHA}" \
              --jq '.files[] | select(.status != "removed") | .filename' |
              grep -E '^(client/src|server|shared|tests|scripts)/.*\.(ts|tsx|css|mjs)$' || true
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed TypeScript, TSX, or CSS source files require formatting checks." | tee "$RUNNER_TEMP/format-errors-ci.txt"
            exit 0
          fi

          printf 'Checking formatting for %s changed source file(s):\n' "${#changed_files[@]}" | tee "$RUNNER_TEMP/format-errors-ci.txt"
          printf ' - %s\n' "${changed_files[@]}" | tee -a "$RUNNER_TEMP/format-errors-ci.txt"
          node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}" 2>&1 | tee -a "$RUNNER_TEMP/format-errors-ci.txt"

      - name: Upload format failure log
        if: always() && steps.format_check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: format-errors
          path: ${{ runner.temp }}/format-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Build
        id: build
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-errors-ci.txt

      - name: Upload build failure log
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-errors
          path: build-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

  backend-tests:
    name: Backend / Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      PORT: "5000"
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Build for startup migration verification
        id: build
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee backend-build-errors-ci.txt

      - name: Upload backend build failure log
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-build-errors
          path: backend-build-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Prepare test database schema
        id: db_schema
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          node node_modules/drizzle-kit/bin.cjs push --force 2>&1 | tee db-schema-ci.txt

      - name: Upload database schema failure log
        if: always() && steps.db_schema.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-schema-errors
          path: db-schema-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run application startup migrations
        id: runtime_migrations
        if: always() && steps.db_schema.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          node dist/index.js > "$RUNNER_TEMP/startup-migrations-ci.txt" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 180); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health/db" > "$RUNNER_TEMP/health-db-ci.json"; then
              cat "$RUNNER_TEMP/health-db-ci.json"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before startup migrations became ready."
              cat "$RUNNER_TEMP/startup-migrations-ci.txt"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for application startup migrations."
          cat "$RUNNER_TEMP/startup-migrations-ci.txt"
          exit 1

      - name: Upload startup migration failure log
        if: always() && steps.runtime_migrations.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-migration-errors
          path: |
            ${{ runner.temp }}/startup-migrations-ci.txt
            ${{ runner.temp }}/health-db-ci.json
          if-no-files-found: warn
          retention-days: 7

      - name: Startup migration ratchet
        id: startup_migration_ratchet
        if: always() && steps.runtime_migrations.outcome == 'success'
        run: |
          set -o pipefail
          HEALTH_REPORT="$RUNNER_TEMP/health-db-ci.json" HEALTH_LABEL='first boot, fresh schema' \
            npm run verify:startup-migrations

          node dist/index.js > "$RUNNER_TEMP/startup-migrations-verify.txt" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 180); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/api/health/db" | grep -q '"status":"ok"'; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before the migration report was readable."
              cat "$RUNNER_TEMP/startup-migrations-verify.txt"
              exit 1
            fi
            sleep 1
          done

          HEALTH_URL="http://127.0.0.1:${PORT}" HEALTH_LABEL='second boot, schema already applied' \
            npm run verify:startup-migrations

      - name: Upload startup migration ratchet log
        if: always() && steps.startup_migration_ratchet.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-migration-ratchet
          path: ${{ runner.temp }}/startup-migrations-verify.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Backend tests and coverage thresholds
        id: backend_coverage
        if: always() && steps.runtime_migrations.outcome == 'success'
        run: |
          set -o pipefail
          npm run test:backend:coverage 2>&1 | tee backend-coverage-errors-ci.txt

      - name: Upload backend coverage failure log
        if: always() && steps.backend_coverage.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-errors
          path: backend-coverage-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend coverage summary
        if: always() && steps.backend_coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-summary
          path: coverage/backend/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Frontend tests and coverage thresholds
        id: frontend_coverage
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run test:frontend:coverage 2>&1 | tee frontend-coverage-errors-ci.txt

      - name: Upload frontend coverage failure log
        if: always() && steps.frontend_coverage.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-errors
          path: frontend-coverage-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend coverage summary
        if: always() && steps.frontend_coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-summary
          path: coverage/frontend/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  coverage-ratchet:
    name: Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Download backend coverage summary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backend-coverage-summary
          path: coverage/backend

      - name: Download frontend coverage summary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-coverage-summary
          path: coverage/frontend

      - name: Coverage ratchet audit
        run: npm run audit:coverage-ratchet
