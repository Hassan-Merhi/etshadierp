name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check / Build / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Dependency diagnostics
        if: always() && steps.install.outcome == 'success'
        run: |
          node --version
          npm --version
          npm config get bin-links
          node -p "'TypeScript ' + require('typescript/package.json').version"
          node -p "'jsdom ' + require('jsdom/package.json').version"
          for binary in tsc vite eslint vitest; do
            if [ -x "node_modules/.bin/$binary" ]; then
              echo "$binary: available"
            else
              echo "::warning::$binary is missing from node_modules/.bin"
            fi
          done

      - name: Type-check
        id: typecheck
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ts-errors-ci.txt

      - name: Upload type-check failure log
        if: always() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: ts-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build
        id: build
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-errors-ci.txt

      - name: Upload build failure log
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        id: lint
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-errors-ci.txt

      - name: Upload lint failure log
        if: always() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-errors
          path: lint-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Format changed source files
        id: format_check
        if: always() && steps.install.outcome == 'success'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="HEAD^"
            fi
          fi

          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" "$GITHUB_SHA" -- client/src server shared |
              grep -zE '\.(ts|tsx|css)$' || true
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed TypeScript, TSX, or CSS source files require formatting checks." | tee format-errors-ci.txt
            exit 0
          fi

          printf 'Checking formatting for %s changed source file(s):\n' "${#changed_files[@]}" | tee format-errors-ci.txt
          printf ' - %s\n' "${changed_files[@]}" | tee -a format-errors-ci.txt
          node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}" 2>&1 | tee -a format-errors-ci.txt

      - name: Upload format failure log
        if: always() && steps.format_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: format-errors
          path: format-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Prepare test database schema
        id: db_schema
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          node node_modules/drizzle-kit/bin.cjs push --force 2>&1 | tee db-schema-ci.txt

      - name: Upload database schema failure log
        if: always() && steps.db_schema.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: database-schema-errors
          path: db-schema-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run application startup migrations
        id: runtime_migrations
        if: always() && steps.db_schema.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          node dist/index.js > startup-migrations-ci.txt 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error http://127.0.0.1:${PORT}/api/health/db > health-db-ci.json; then
              cat health-db-ci.json
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before startup migrations became ready."
              cat startup-migrations-ci.txt
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for application startup migrations."
          cat startup-migrations-ci.txt
          exit 1

      - name: Upload startup migration failure log
        if: always() && steps.runtime_migrations.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: startup-migration-errors
          path: |
            startup-migrations-ci.txt
            health-db-ci.json
          if-no-files-found: warn
          retention-days: 7

      - name: Backend tests
        id: backend_tests
        if: always() && steps.runtime_migrations.outcome == 'success'
        run: |
          set -o pipefail
          npm run test:backend 2>&1 | tee backend-test-errors-ci.txt

      - name: Upload backend test failure log
        if: always() && steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-errors
          path: backend-test-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Backend coverage thresholds
        id: backend_coverage
        if: always() && steps.backend_tests.outcome == 'success'
        run: |
          set -o pipefail
          npm run test:backend:coverage 2>&1 | tee backend-coverage-errors-ci.txt

      - name: Upload backend coverage failure log
        if: always() && steps.backend_coverage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-errors
          path: backend-coverage-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend coverage summary
        if: always() && steps.backend_coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-summary
          path: coverage/backend/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Frontend tests
        id: frontend_tests
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run test:frontend 2>&1 | tee frontend-test-errors-ci.txt

      - name: Upload frontend test failure log
        if: always() && steps.frontend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-errors
          path: frontend-test-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Frontend coverage thresholds
        id: frontend_coverage
        if: always() && steps.frontend_tests.outcome == 'success'
        run: |
          set -o pipefail
          npm run test:frontend:coverage 2>&1 | tee frontend-coverage-errors-ci.txt

      - name: Upload frontend coverage failure log
        if: always() && steps.frontend_coverage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-errors
          path: frontend-coverage-errors-ci.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend coverage summary
        if: always() && steps.frontend_coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-summary
          path: coverage/frontend/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
