name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Check / Build / Lint / Format / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      NODE_ENV: test
      # Prevents exit-code 134 (OOM/SIGABRT) on memory-heavy steps.
      # ubuntu-latest runners have 7 GB RAM; 4096 MB heap is safe.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ── Blocking gates ─────────────────────────────────────────────────────
      # These three MUST pass. A failure here stops the workflow.

      - name: Type-check (tsc --noEmit)
        run: npm run check

      - name: Build (Vite + esbuild)
        run: npm run build

      - name: Tests (Vitest)
        run: npm run test

      # ── Advisory checks ────────────────────────────────────────────────────
      # Lint and format have pre-existing repo-wide debt (documented in
      # docs/service-layer-audit.md). They run and report, but do NOT fail
      # the workflow until a dedicated cleanup phase completes.
      # continue-on-error: true  →  step is annotated as failed in the UI
      #                             but the overall job still succeeds.

      - name: Lint (ESLint) — advisory
        run: npm run lint
        continue-on-error: true

      - name: Format check (Prettier) — advisory
        run: npm run format:check
        continue-on-error: true
