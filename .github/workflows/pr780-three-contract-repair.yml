name: PR780 Three Contract Repair

on:
  push:
    branches:
      - agent/god-files-recovery-latest-main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore test and apply exact contract repairs
        shell: bash
        run: |
          set -euo pipefail
          git checkout 7fa72d01495e264bb4ffc37c4409ba392259deb1 -- tests/frontend-layout.test.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/frontend-layout.test.ts')
          s = p.read_text()
          old = '''  it("JournalForm.tsx — waPendingPrompt state variable present", () => {
            expect(src("client/src/pages/vouchers/JournalForm.tsx")).toContain("waPendingPrompt");
          });'''
          new = '''  it("JournalForm model — waPendingPrompt state variable present", () => {
            expect(src("client/src/pages/vouchers/journalform/useJournalFormModel.tsx")).toContain("waPendingPrompt");
          });'''
          if old not in s:
              raise SystemExit('JournalForm stale assertion not found')
          p.write_text(s.replace(old, new))

          p = Path('tests/phase7-backend-messages-translations.test.ts')
          s = p.read_text()
          if s.count('597') != 2:
              raise SystemExit(f'Expected exactly two 597 assertions, found {s.count("597")}')
          p.write_text(s.replace('597', '599'))

          import json
          p = Path('config/god-file-boundaries.json')
          data = json.loads(p.read_text())
          stale = [
            'client/src/components/StockItemDetailsDialog.tsx',
            'client/src/pages/AccountsLegacy.tsx',
            'client/src/pages/BarcodeLookup.tsx',
            'client/src/pages/ContainerLoadingScan.tsx',
            'client/src/pages/daybook/VoucherDetailsDialog.tsx',
            'client/src/pages/factory/FactoryContainerLoadingScan.tsx',
            'client/src/pages/factory/FactoryDaybook.tsx',
            'client/src/pages/factory/FactoryLocationInventory.tsx',
            'client/src/pages/factory/FactoryPOS.tsx',
            'client/src/pages/factory/FactorySettings.tsx',
            'client/src/pages/factory/FactorySuppliers.tsx',
            'client/src/pages/pos/POSImport.tsx',
            'client/src/pages/pos/POSPriceList.tsx',
            'client/src/pages/settings/DataToolsTab.tsx',
            'client/src/pages/sp/GcLshiMigration.tsx',
            'client/src/pages/StockEntryHistory.tsx',
            'client/src/pages/StockItems.tsx',
            'client/src/pages/StockTransferOrder.tsx',
            'client/src/pages/SupplierProfitCheck.tsx',
            'client/src/pages/TransactionJournal.tsx',
            'client/src/pages/vouchers/JournalForm.tsx',
            'client/src/pages/vouchers/StockAdjustmentForm.tsx',
            'client/src/pages/vouchers/StockTransferForm.tsx',
          ]
          gf = data['repositoryScan']['grandfathered']
          missing = [x for x in stale if x not in gf]
          if missing:
              raise SystemExit(f'Expected stale baselines missing: {missing}')
          for x in stale:
              del gf[x]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify the three repaired contracts
        run: npx vitest run tests/frontend-layout.test.ts tests/god-file-boundaries.test.ts tests/phase7-backend-messages-translations.test.ts
      - name: Type-check and format
        run: |
          npx prettier --check tests/frontend-layout.test.ts tests/phase7-backend-messages-translations.test.ts config/god-file-boundaries.json
          npm run check
      - name: Commit repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/frontend-layout.test.ts tests/phase7-backend-messages-translations.test.ts config/god-file-boundaries.json
          git commit -m "test: refresh recovered architecture contracts"
          git push origin HEAD:agent/god-files-recovery-latest-main
