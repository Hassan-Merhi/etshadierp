name: Remote support Phase 3 static diagnostics

on:
  push:
    branches:
      - agent/remote-support-phase-3-viewing-quality
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-diagnostics:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-3-viewing-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-3-viewing-quality

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Production build
        run: npm run build

      - name: Run CircleCI static contracts
        run: |
          set -o pipefail
          {
            npm run verify:program1-observability
            npm run verify:final-production-readiness
            npm run verify:bandwidth
          } 2>&1 | tee phase3-static-diagnostics.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase3-static-diagnostics
          path: phase3-static-diagnostics.log
          if-no-files-found: warn
          retention-days: 1
