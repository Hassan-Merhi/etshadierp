name: Lint Phase 3 Formatting Repair

on:
  push:
    branches:
      - agent/lint-phase-3-catch-any
    paths:
      - .github/workflows/lint-phase3-format-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/lint-phase-3-catch-any

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
          git checkout -- package-lock.json

      - name: Snapshot pre-format architecture failures
        run: |
          npm run audit:god-files > /tmp/god-before.log 2>&1 || true

      - name: Format exactly the files reported by PR parity
        run: |
          files=(
            client/src/components/ChatWidget.tsx
            client/src/components/OfflinePrepPanel.tsx
            client/src/components/chat-widget/useChatActions.ts
            client/src/lib/factoryApi.ts
            client/src/pages/BalanceRepair.tsx
            client/src/pages/GITContainers.tsx
            client/src/pages/Login.tsx
            client/src/pages/PressingBales.tsx
            client/src/pages/StockTransferOrder.tsx
            client/src/pages/SupplierProfitCheck.tsx
            client/src/pages/TransporterStatement.tsx
            client/src/pages/factory/DailyScan.tsx
            client/src/pages/factory/FactoryInvoices.tsx
            client/src/pages/factory/FactoryOtwTrackingTab.tsx
            client/src/pages/factory/LabelBannersSettings.tsx
            client/src/pages/factory/WipersReEntry.tsx
            client/src/pages/factory/factoryshippingcontainers/components/WhatsAppModal.tsx
            client/src/pages/git-mockup/TabTruckLocation.tsx
            client/src/pages/location-inventory/useLocationInventoryExports.ts
            client/src/pages/pos/POSPriceList.tsx
            client/src/pages/pos/hooks/usePosCheckout.ts
            client/src/pages/pos/hooks/usePosWhatsApp.ts
            client/src/pages/settings/DataToolsTab.tsx
            client/src/pages/settings/DiagnosticsSection.tsx
            client/src/pages/settings/OfflineSyncPanel.tsx
            client/src/pages/settings/datatoolstab/components/BulkMergeStockItemsCard.tsx
            client/src/pages/settings/datatoolstab/components/MergeHistoryCard.tsx
            client/src/pages/settings/datatoolstab/components/MergeStockItemsCard.tsx
            client/src/pages/settings/datatoolstab/components/ReconcileOTWNamesCard.tsx
            client/src/pages/sp/SpReports.tsx
            client/src/pages/sp/gclshimigration/components/ReconciliationRunner.tsx
            client/src/pages/vouchers/JournalForm.tsx
            client/src/pages/vouchers/StockTransferForm.tsx
            client/src/pages/vouchers/useVoucherHandlers.ts
            server/routes/location/locationWhatsappScheduleRoutes.ts
            server/routes/transfers/transferRequestContext.ts
          )
          printf '%s\n' "${files[@]}" > /tmp/phase3-format-files.txt
          node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"

      - name: Preserve frozen line caps and synchronize live god-file backlog docs
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { auditGodFileBoundaries } from "./scripts/audit-god-file-boundaries.mjs";

          const config = JSON.parse(fs.readFileSync("config/god-file-boundaries.json", "utf8"));
          const caps = config.repositoryScan?.grandfathered ?? {};
          const formatted = new Set(
            fs.readFileSync("/tmp/phase3-format-files.txt", "utf8").split(/\r?\n/).filter(Boolean)
          );

          for (const file of [...formatted].filter((item) => Object.hasOwn(caps, item)).sort()) {
            let lines = fs.readFileSync(file, "utf8").split(/\r?\n/);
            const cap = caps[file];
            let over = lines.length - cap;
            if (over <= 0) continue;
            const removable = [];
            for (let i = 1; i < lines.length - 1; i += 1) {
              if (lines[i].trim() === "") removable.push(i);
            }
            if (removable.length < over) {
              throw new Error(`${file} exceeds frozen cap ${cap} by ${over} line(s) after formatting`);
            }
            const remove = new Set(removable.slice(0, over));
            lines = lines.filter((_, index) => !remove.has(index));
            fs.writeFileSync(file, lines.join("\n"));
            console.log(`${file}: removed ${over} blank line(s) to preserve frozen cap ${cap}`);
          }

          const report = auditGodFileBoundaries();
          const backlog = report.summary.grandfatheredExcessLines;
          for (const doc of ["docs/god-file-split-program.md", "docs/system-quality-program.md"]) {
            let text = fs.readFileSync(doc, "utf8");
            text = text.replace(/25,436/g, backlog.toLocaleString("en-US"));
            fs.writeFileSync(doc, text);
          }
          console.log(`Live god-file backlog: ${backlog.toLocaleString("en-US")} excess lines`);
          NODE

      - name: Verify formatted Phase 3 tree
        run: |
          npm run check
          npm run lint
          npm run audit:lint-ratchet
          npm run audit:type-escapes
          npm run audit:doc-index
          npm run audit:scripts
          npm run audit:toolchain
          npm run audit:write-routes
          node scripts/verify-i18n-audit-classifier.mjs
          node scripts/audit-i18n-phase14.mjs --json-out /tmp/i18n.json --markdown-out /tmp/i18n.md
          git diff --check
          mapfile -t files < /tmp/phase3-format-files.txt
          node node_modules/prettier/bin/prettier.cjs --check "${files[@]}"

      - name: Prove formatting introduced no new architecture failures
        run: |
          npm run audit:god-files > /tmp/god-after.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path

          def failures(path):
              out = set()
              for raw in Path(path).read_text(errors="replace").splitlines():
                  line = raw.strip()
                  if line.startswith("WARNING:"):
                      continue
                  if (
                      (" has " in line and " lines; " in line)
                      or " is missing" in line
                      or " contains forbidden architecture pattern:" in line
                      or " must remain deleted" in line
                  ):
                      out.add(line)
              return out

          before = failures("/tmp/god-before.log")
          after = failures("/tmp/god-after.log")
          new = sorted(after - before)
          print(f"God-file failures before/after formatting: {len(before)}/{len(after)}")
          if new:
              raise SystemExit("New architecture failures:\n" + "\n".join(new))
          PY

      - name: Commit verified formatting repair
        run: |
          git checkout -- package-lock.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server docs/god-file-split-program.md docs/system-quality-program.md
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit --no-verify -m "format phase 3 catch narrowing changes"
          git push --no-verify origin HEAD:agent/lint-phase-3-catch-any
