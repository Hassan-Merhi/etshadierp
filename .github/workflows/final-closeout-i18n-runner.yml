name: Final i18n closeout runner

on:
  push:
    branches:
      - agent/final-closeout-i18n-release

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/final-closeout-i18n-release
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply corrected i18n closeout
        run: python scripts/final-closeout-i18n-once.py

      - name: Format changed source files
        shell: bash
        run: |
          if [ -f /tmp/final-closeout-i18n-files.txt ]; then
            xargs -r npx prettier --write < /tmp/final-closeout-i18n-files.txt
          fi

      - name: Enforce final i18n release caps
        shell: bash
        run: |
          node scripts/audit-i18n-phase14.mjs --json-out /tmp/final-i18n-after.json --markdown-out /tmp/final-i18n-after.md
          node scripts/verify-phase9-current-main-release.mjs
          python - <<'PY'
          import json
          d = json.load(open('/tmp/final-i18n-after.json'))
          caps = {
              'backend-messages': 0,
              'inventory-logistics': 1381,
              'sales-pos': 776,
              'shared-ui': 0,
              'supplier-partner': 0,
          }
          actual = {k: d['modules'][k]['actionable'] for k in caps}
          print('Final release modules:', actual)
          failed = {k: (actual[k], cap) for k, cap in caps.items() if actual[k] > cap}
          if failed:
              raise SystemExit(f'Release caps still exceeded: {failed}')
          PY

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Focused multilingual release tests
        run: npx vitest run tests/phase9-final-release-gate.test.ts tests/phase14-i18n-release-gate.test.ts tests/phase4-supplier-partner-translations.test.ts tests/phase7-backend-messages-translations.test.ts

      - name: Commit final closeout
        shell: bash
        run: |
          rm -f scripts/final-closeout-i18n-once.py
          rm -f .github/workflows/final-closeout-i18n-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No closeout changes to commit."
          else
            git commit -m "Close final i18n release debt"
            git push origin HEAD:agent/final-closeout-i18n-release
          fi
