name: Phase 2.3 Sync Main

on:
  push:
    branches:
      - phase-2-3-api-service-boundary-typing

permissions:
  contents: write

jobs:
  sync-main:
    if: ${{ !contains(github.event.head_commit.message, '[phase23-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Merge latest main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Phase 2.3 already contains latest main."
            exit 0
          fi
          # Prefer current main only where both lanes changed the same hunk;
          # retain all non-conflicting Phase 2.3 boundary-typing work.
          git merge --no-edit -X theirs origin/main -m "chore: sync Phase 2.3 with main [phase23-sync]"
          git push origin HEAD:phase-2-3-api-service-boundary-typing

# Temporary synchronization runner; remove before Phase 2.3 certification.
