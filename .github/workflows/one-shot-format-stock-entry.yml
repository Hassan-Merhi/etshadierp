name: Format stock entry multi-select changes

on:
  push:
    branches:
      - agent/stock-entry-history-multiselect-filters

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stock-entry-history-multiselect-filters
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format changed source files
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/StockEntryHistory.tsx server/routes/factory/factoryStockEntryHistoryPaginationRoutes.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/StockEntryHistory.tsx server/routes/factory/factoryStockEntryHistoryPaginationRoutes.ts
          git diff --cached --quiet || git commit -m "style: format stock entry multi-select changes"
          git push origin HEAD:agent/stock-entry-history-multiselect-filters
