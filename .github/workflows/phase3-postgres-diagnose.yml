name: Phase 3 PostgreSQL Diagnose

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase3-postgres-diagnose
  cancel-in-progress: true

jobs:
  postgres:
    if: github.head_ref == 'phase3-translation-ui-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase3-postgres-diagnose
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: SKIP_GIT_HOOKS=1 npm ci --no-audit --bin-links=true
      - name: Migration registry
        run: node scripts/verify-migration-registry.mjs --json
      - name: Prepare disposable schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify disposable schema
        run: node scripts/verify-ci-disposable-schema.mjs
      - name: Integration backend tests
        run: |
          mapfile -t integration_test_files < <(
            find tests -type f -name '*.test.ts' \
              ! -path 'tests/ui/*' \
              ! -path 'tests/api-smoke-sweep.test.ts' \
              | sort
          )
          node node_modules/vitest/vitest.mjs run \
            "${integration_test_files[@]}" \
            --maxWorkers=1 \
            --no-file-parallelism
