name: God Files Wave 1 Publisher

on:
  pull_request:
    branches:
      - agent/god-files-final-wave1-tests
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Generate and statically certify Wave 1
        shell: bash
        run: |
          node scripts/god-files-wave1-split.mjs
          npm run audit:god-files
          npm run audit:doc-index
          npm run check
          git diff --check
      - name: Publish clean Wave 1 branch
        shell: bash
        run: |
          git show a1b3e57f63af1c4847e8851027868dc067bf68e8:.circleci/config.yml > .circleci/config.yml
          rm -f .github/workflows/god-files-wave1-test-split.yml scripts/god-files-wave1-split.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(god-files): split oversized Wave 1 test suites"
          git push origin HEAD:agent/god-files-final-wave1-tests
