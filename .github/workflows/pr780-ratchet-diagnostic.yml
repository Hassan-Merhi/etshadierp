name: PR780 Ratchet Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 780
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/god-files-recovery-latest-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reconcile recovery ratchets safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['docs/god-file-split-program.md', 'docs/system-quality-program.md']:
              p = Path(name)
              s = p.read_text()
              s2 = s.replace('47 files, 24,565', '47 files, 10,511')
              if s2 != s:
                  p.write_text(s2)
          PY

          cat > /tmp/pr780-type-repair.mjs <<'NODE'
          import fs from 'node:fs';
          import { execSync } from 'node:child_process';
          import ts from 'typescript';
          const { auditTypeEscapes } = await import('file://' + process.cwd() + '/scripts/audit-type-escapes.mjs');

          const targets = [
            'client/src/pages/vouchers/stock-transfer-form/useStockTransferFormModel.ts',
            'client/src/pages/settings/datatoolstab/useDataToolsModel.ts',
            'client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts',
            'client/src/pages/accountslegacy/useAccountsLegacyModel.ts',
            'client/src/pages/factory/factorypos/useFactoryPosModel.ts',
            'client/src/pages/pos/posimport/usePosImportModel.ts',
            'client/src/pages/pos/pospricelist/usePosPriceListModel.ts',
            'client/src/pages/containerloadingscan/useContainerLoadingScanModel.ts',
            'client/src/pages/vouchers/stock-adjustment-form/useStockAdjustmentFormModel.ts'
          ];

          function getCandidates(file, source) {
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true,
              file.endsWith('.tsx') ? ts.ScriptKind.TSX : ts.ScriptKind.TS);
            const out = [];
            const visit = (node) => {
              if (node.kind === ts.SyntaxKind.AnyKeyword && node.parent) {
                const p = node.parent;
                if (ts.isAsExpression(p) && p.type === node) {
                  out.push({ start: p.expression.end, end: p.end, kind: 'as-any' });
                } else if ((ts.isParameter(p) || ts.isVariableDeclaration(p)) && p.type === node) {
                  const start = ts.isParameter(p) && p.questionToken ? p.questionToken.end : p.name.end;
                  out.push({ start, end: node.end, kind: ts.isParameter(p) ? 'param-any' : 'var-any' });
                }
              }
              ts.forEachChild(node, visit);
            };
            visit(sf);
            return out.sort((a,b) => b.start - a.start);
          }

          function apply(source, edits) {
            let s = source;
            for (const e of [...edits].sort((a,b) => b.start - a.start)) {
              s = s.slice(0, e.start) + s.slice(e.end);
            }
            return s;
          }

          function check() {
            execSync('npm run check', { stdio: 'ignore', timeout: 240000 });
          }

          let report = auditTypeEscapes();
          console.log(`Starting type-escape total: ${report.summary.typeEscapeTotal}; ceiling ${report.summary.ceiling}`);
          const failedBatch = [];

          for (const file of targets) {
            if (report.summary.typeEscapeTotal <= report.summary.ceiling) break;
            if (!fs.existsSync(file)) continue;
            const original = fs.readFileSync(file, 'utf8');
            const edits = getCandidates(file, original);
            if (!edits.length) continue;
            fs.writeFileSync(file, apply(original, edits));
            try {
              check();
              report = auditTypeEscapes();
              console.log(`Kept ${edits.length} compiler-safe removals in ${file}; total ${report.summary.typeEscapeTotal}`);
            } catch {
              fs.writeFileSync(file, original);
              failedBatch.push({ file, original, edits });
              console.log(`Batch removal not type-safe in ${file}; will try candidates individually.`);
            }
          }

          for (const item of failedBatch) {
            if (report.summary.typeEscapeTotal <= report.summary.ceiling) break;
            let current = item.original;
            fs.writeFileSync(item.file, current);
            for (const edit of item.edits) {
              if (report.summary.typeEscapeTotal <= report.summary.ceiling) break;
              const candidate = current.slice(0, edit.start) + current.slice(edit.end);
              fs.writeFileSync(item.file, candidate);
              try {
                check();
                current = candidate;
                report = auditTypeEscapes();
                console.log(`Kept compiler-safe ${edit.kind} removal in ${item.file}; total ${report.summary.typeEscapeTotal}`);
              } catch {
                fs.writeFileSync(item.file, current);
              }
            }
          }

          report = auditTypeEscapes();
          console.log(`Post-cleanup type-escape total: ${report.summary.typeEscapeTotal}; ceiling ${report.summary.ceiling}`);
          if (report.summary.typeEscapeTotal <= report.summary.ceiling) {
            execSync('UPDATE_TYPE_ESCAPE_BASELINE=1 node scripts/audit-type-escapes.mjs', { stdio: 'inherit' });
            const final = auditTypeEscapes();
            const doc = 'docs/system-quality-program.md';
            let text = fs.readFileSync(doc, 'utf8');
            text = text.replace(/\| Type escapes \(AST\) \| [\d,]+ total \|/, `| Type escapes (AST) | ${final.summary.typeEscapeTotal.toLocaleString('en-US')} total |`);
            fs.writeFileSync(doc, text);
          }
          NODE

          node /tmp/pr780-type-repair.mjs
          npm run check
          node scripts/audit-type-escapes.mjs
          node scripts/audit-doc-index.mjs
          node scripts/audit-script-inventory.mjs

          if git diff --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/type-escape-boundaries.json docs client/src
          git commit -m 'fix(ci): reconcile PR780 recovery ratchets'
          git push origin HEAD:agent/god-files-recovery-latest-main
