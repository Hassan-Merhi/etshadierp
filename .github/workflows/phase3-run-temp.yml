name: Phase 3 Temporary Runner

on:
  push:
    branches:
      - codex/voucher-idempotency-phase3

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/voucher-idempotency-phase3
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: python3 scripts/phase3-finish-temp.py
      - run: python3 scripts/phase3-storage-source-temp.py
      - run: node node_modules/prettier/bin/prettier.cjs --write server/services/accounting/centralPostingEngine.ts server/services/accounting/voucherPostingService.ts server/services/accounting/voucherPostingService.test.ts server/services/accounting/infrastructureVoucherIdentity.ts server/routes/factory/factoryInsuranceRoutes.ts server/routes/payroll/_payrollAccountingHelper.ts server/services/containers/offload-lifecycle/charge-vouchers.ts server/services/containers/offload-lifecycle/sp-journals.ts server/services/factory/post-offload-charge/apply.ts server/services/pos/createSaleVoucher.ts server/services/rental/rentalPaymentPostingService.ts server/storage/accounting/fiscal-periods.ts server/storage/accounting/vouchers.ts server/storage/containers-store/offload.ts server/storage/containers-store/purchase-orders.ts server/routes/containers/poImportBackfillRoute.ts server/routes/containers/containerCrudRoutes.ts server/routes/stockAdjustmentWasteRoutes.ts server/routes/import/po-import.ts server/routes/vouchers/voucherCreateRoutes.ts tests/infrastructure-voucher-identity.test.ts tests/infrastructure-voucher-writer-contract.test.ts scripts/audit-write-evidence.mjs
      - name: Commit results
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server tests scripts
          git commit -m "require stable identity across phase 3 voucher writers"
          git -c core.hooksPath=/dev/null push origin HEAD:codex/voucher-idempotency-phase3
