name: Audit Phase 3 formatter

on:
  push:
    branches:
      - agent/audit-phase-3-runtime-recovery

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-phase-3-runtime-recovery
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize package registry
        run: sed -i 's#https://registry.npmjs.org/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Register ERP workspace translation
        run: |
          python - <<'PY'
          from pathlib import Path

          translations = Path("client/src/i18n/applicationTranslations.ts")
          content = translations.read_text()
          marker = '  "accessibility.openSearch": { en: "Open search", ar: "فتح البحث", fr: "Ouvrir la recherche" },'
          entry = '''  "accessibility.erpWorkspace": {
            en: "ERP workspace",
            ar: "مساحة عمل نظام تخطيط موارد المؤسسة",
            fr: "Espace de travail ERP",
          },
          '''
          if '"accessibility.erpWorkspace"' not in content:
              content = content.replace(marker, entry + marker)
              translations.write_text(content)

          shell = Path("client/src/app/ErpShell.tsx")
          shell.write_text(shell.read_text().replace('t("ERP workspace")', 't("accessibility.erpWorkspace")'))
          PY

      - name: Format Phase 3 files
        run: >-
          npx prettier --write
          client/src/App.tsx
          client/src/app/AppLoadingState.tsx
          client/src/app/AuthenticatedApp.tsx
          client/src/app/ErpShell.tsx
          client/src/app/authenticatedAppRouteGuard.ts
          client/src/app/useAuthenticatedAppData.ts
          client/src/app/useAuthenticatedUser.ts
          client/src/contexts/CompanyContext.tsx
          client/src/contracts/sessionQueryContracts.ts
          client/src/i18n/applicationTranslations.ts
          tests/ui/audit-phase3-runtime-recovery.test.ts
          tests/ui/authenticated-request-gating.test.ts

      - name: Commit formatting and translation
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx client/src/app/AppLoadingState.tsx client/src/app/AuthenticatedApp.tsx client/src/app/ErpShell.tsx client/src/app/authenticatedAppRouteGuard.ts client/src/app/useAuthenticatedAppData.ts client/src/app/useAuthenticatedUser.ts client/src/contexts/CompanyContext.tsx client/src/contracts/sessionQueryContracts.ts client/src/i18n/applicationTranslations.ts tests/ui/audit-phase3-runtime-recovery.test.ts tests/ui/authenticated-request-gating.test.ts
          git commit -m "style: format Audit Phase 3 files"
          SKIP_TSC_CHECK=1 git push origin HEAD:agent/audit-phase-3-runtime-recovery
