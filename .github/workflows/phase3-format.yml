name: Phase 3 exact formatting

on:
  push:
    branches:
      - agent/phase-3-shared-interface-conversion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-3-shared-interface-conversion
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply repository-pinned Prettier
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/i18n/sharedUiPhase3TranslationTypes.ts \
            client/src/i18n/sharedUiPhase3Translations.ts \
            client/src/i18n/sharedUiPhase3Translations.part1.ts \
            client/src/i18n/sharedUiPhase3Translations.part2.ts \
            client/src/i18n/sharedUiPhase3Translations.part3.ts \
            client/src/i18n/sharedUiPhase3Translations.part4.ts \
            client/src/i18n/sharedUiPhase3Translations.part5.ts \
            scripts/audit-i18n-phase14.mjs \
            tests/phase3-shared-interface-translations.test.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "Files already match the pinned formatter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src scripts/audit-i18n-phase14.mjs tests/phase3-shared-interface-translations.test.ts
          git commit -m "Phase 3: apply pinned formatter output"
          git push origin HEAD:agent/phase-3-shared-interface-conversion
