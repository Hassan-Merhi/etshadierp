name: Wave H Format Static Six

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-format-static-six.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24.19.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format exact static offenders
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/AccountsLegacy.tsx \
            client/src/pages/factory/FactoryDaybook.tsx \
            client/src/pages/factory/FactoryLocationInventory.tsx \
            client/src/pages/pos/POSPriceList.tsx \
            client/src/pages/stockentryhistory/utils.tsx \
            client/src/pages/vouchers/StockAdjustmentForm.tsx
      - name: Verify formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/pages/AccountsLegacy.tsx \
            client/src/pages/factory/FactoryDaybook.tsx \
            client/src/pages/factory/FactoryLocationInventory.tsx \
            client/src/pages/pos/POSPriceList.tsx \
            client/src/pages/stockentryhistory/utils.tsx \
            client/src/pages/vouchers/StockAdjustmentForm.tsx
      - name: Commit formatting and self-remove
        run: |
          rm -f .github/workflows/wave-h-format-static-six.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/AccountsLegacy.tsx \
            client/src/pages/factory/FactoryDaybook.tsx \
            client/src/pages/factory/FactoryLocationInventory.tsx \
            client/src/pages/pos/POSPriceList.tsx \
            client/src/pages/stockentryhistory/utils.tsx \
            client/src/pages/vouchers/StockAdjustmentForm.tsx \
            .github/workflows/wave-h-format-static-six.yml
          git commit -m "style: satisfy static-build formatting"
          git push origin HEAD:wave-i/convergence-automation
