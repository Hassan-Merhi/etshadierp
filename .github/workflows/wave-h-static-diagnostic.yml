name: Wave H Static Diagnostic

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-static-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@v6
        with: { node-version: "22.14.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Formatting
        id: formatting
        continue-on-error: true
        run: |
          set -o pipefail
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/lib/phase4BandwidthFetch.test.ts \
            client/src/pages/factory/factoryotwtrackingtab/utils.test.ts \
            tests/ui/wave-h-populated-factory-surfaces.test.tsx \
            tests/ui/wave-h-zero-coverage-surfaces.test.tsx \
            tests/ui/wave-h-populated-core-pages.test.tsx \
            tests/ui/wave-h-production-bales-behavior.test.tsx \
            tests/ui/helpers.tsx \
            vitest.config.ts 2>&1 | tee /tmp/format.log
      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/ts.log
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log
      - name: Record static diagnostics and self-remove
        if: always()
        run: |
          {
            echo "Formatting: ${{ steps.formatting.outcome }}"
            tail -n 120 /tmp/format.log || true
            echo
            echo "TypeScript: ${{ steps.typescript.outcome }}"
            tail -n 180 /tmp/ts.log || true
            echo
            echo "Lint: ${{ steps.lint.outcome }}"
            tail -n 180 /tmp/lint.log || true
          } > phase2-static-diagnostic.txt
          rm -f .github/workflows/wave-h-static-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-static-diagnostic.txt .github/workflows/wave-h-static-diagnostic.yml
          git commit -m "test: record Wave H static diagnostic"
          git push origin HEAD:wave-i/convergence-automation
