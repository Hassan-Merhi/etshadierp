name: Phase 2 Format Helper

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format remaining phase 2 tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format remaining Phase 2 tests
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/ui/daybook-page-behavior.test.tsx \
            tests/ui/factory-container-loading-scan-behavior.test.tsx \
            tests/ui/payroll-page-behavior.test.tsx \
            tests/ui/stock-transfer-form-revision-behavior.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/ui/daybook-page-behavior.test.tsx \
            tests/ui/factory-container-loading-scan-behavior.test.tsx \
            tests/ui/payroll-page-behavior.test.tsx \
            tests/ui/stock-transfer-form-revision-behavior.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git commit -m "style: format remaining phase 2 tests"
          git push origin HEAD:program/erp-90-phase-2
