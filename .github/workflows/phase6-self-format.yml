name: Phase 6 Exact Self Formatting

on:
  push:
    branches:
      - agent/mobile-responsive-phase-6-core-erp

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phase-6-core-erp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Phase 5 and 6 formatting
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/components/ui/pagination.tsx
          client/src/components/ui/responsive-accessibility.tsx
          client/src/components/ui/responsive-data-list.tsx
          client/src/components/ui/core-erp-mobile.tsx
          client/src/components/ui/period-filter.tsx
          client/src/components/ui/tabs.tsx
          client/src/pages/daybook/DaybookFilters.tsx

      - name: Commit exact output when changed
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            client/src/components/ui/pagination.tsx
            client/src/components/ui/responsive-accessibility.tsx
            client/src/components/ui/responsive-data-list.tsx
            client/src/components/ui/core-erp-mobile.tsx
            client/src/components/ui/period-filter.tsx
            client/src/components/ui/tabs.tsx
            client/src/pages/daybook/DaybookFilters.tsx
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Formatting already exact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Phase 6: apply exact core ERP formatting"
          git push origin HEAD:agent/mobile-responsive-phase-6-core-erp
