name: Phase 3 Verification

on:
  push:
    branches:
      - codex/voucher-idempotency-phase3

permissions:
  contents: read

env:
  NODE_ENV: test
  SESSION_SECRET: github-actions-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  PORT: "5000"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
  PGSSLMODE: disable

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: TypeScript
        run: npm run check
      - name: Write-evidence audit
        run: node scripts/audit-write-evidence.mjs --json
      - name: Prepare database
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Ensure runtime evidence tables
        run: >-
          node node_modules/tsx/dist/cli.mjs -e
          'import { pool } from "./server/db.ts";
          import { ensureCanonicalStockMovementJournal } from "./server/services/inventory/ensureCanonicalStockMovementJournal.ts";
          void (async () => { await ensureCanonicalStockMovementJournal(pool); await pool.end(); })();'
      - name: Phase 3 tests
        run: node node_modules/vitest/vitest.mjs run server/services/accounting/voucherPostingService.test.ts tests/infrastructure-voucher-writer-contract.test.ts tests/infrastructure-voucher-identity.test.ts tests/write-evidence-ratchet.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Production build
        run: npm run build
