name: Phases 10-11 dependency regeneration

on:
  push:
    branches:
      - agent/phases-10-11-lock-regeneration-current-main
    paths:
      - .github/workflows/phases-10-11-lock-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: agent/phases-10-11-lock-regeneration-current-main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Apply Phase 10 and 11 versions
        run: node scripts/regenerate-phases-10-11.mjs

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Regenerate pnpm lockfile
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Commit coherent dependency graph
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json pnpm-lock.yaml render.yaml .nvmrc
          git diff --cached --check
          git commit -m "chore(deps): complete phases 10 and 11 upgrades"
          git push origin HEAD:agent/phases-10-11-lock-regeneration-current-main

      - name: Install regenerated dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Type-check major SDK and runtime upgrades
        run: npm run check

      - name: Build upgraded application
        run: npm run build
