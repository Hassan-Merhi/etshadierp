name: Phases 10-11 dependency regeneration

on:
  push:
    branches:
      - agent/phases-10-11-lock-regeneration-current-main
    paths:
      - .github/workflows/phases-10-11-lock-regeneration.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: agent/phases-10-11-lock-regeneration-current-main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install regenerated dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Apply Node 26 buffer compatibility
        run: node scripts/apply-node26-buffer-compat.mjs

      - name: Format compatibility changes
        shell: bash
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/lib/bufferCompatibility.ts \
            server/excelHelper.ts \
            server/routes/accountStatementRoutes.ts \
            server/routes/factory-payroll/exports.ts \
            server/routes/factory-reports/_helpers.ts \
            server/routes/factory/customer-orders/orderHelpers.ts \
            server/routes/factory/customer-orders/pdf-export/loading-status.ts \
            server/routes/factory/customer-orders/pdf-export/pending.ts \
            server/routes/factory/customer-proformas/exports.ts \
            server/routes/factory/customers-core/statement-excel.ts \
            server/routes/payroll/core/preview.ts \
            server/services/export-excel/workbook.ts \
            server/services/sp-sales-form/generate.ts \
            server/services/whatsappService.ts

      - name: Commit compatibility repairs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server
          git diff --cached --check
          git commit -m "fix: support TypeScript 6 and Node 26 buffer types"
          git push origin HEAD:agent/phases-10-11-lock-regeneration-current-main

      - name: Type-check major SDK and runtime upgrades
        run: npm run check

      - name: Build upgraded application
        run: npm run build
