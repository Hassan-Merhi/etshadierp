# Final post-manifest Phase 5 verification trigger.
name: Bandwidth Phase 5 Repair

on:
  push:
    branches:
      - agent/bandwidth-phase4-global-request-pressure
    paths:
      - .github/workflows/bandwidth-phase5-repair.yml
      - config/ci-ratchet-allowances.json
      - tests/god-file-boundaries.test.ts
      - tests/ui/bandwidth-phase-4-heavy-pages.test.ts

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: bandwidth-phase5-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/bandwidth-phase4-global-request-pressure
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Normalize registry and install
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Regenerate route manifest
        env:
          UPDATE_ROUTE_MANIFEST: "1"
        run: npx vitest run tests/route-manifest.test.ts
      - name: Run Phase 5 targeted regression set
        run: |
          npx vitest run tests/loading-proforma-summary-lines.test.ts tests/phase7-backend-messages-translations.test.ts tests/god-file-boundaries.test.ts tests/source-text-assertions.test.ts tests/route-manifest.test.ts
          npx vitest run --config vitest.config.frontend.ts tests/ui/bandwidth-phase-1-invalidation-policy.test.ts tests/ui/bandwidth-phase-2-payloads.test.ts tests/ui/bandwidth-phase-4-heavy-pages.test.ts
      - name: Commit regenerated manifest
        run: |
          if git diff --quiet config/route-manifest.json; then
            echo "Route manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/route-manifest.json
          git commit --no-verify -m "refresh route manifest for bandwidth phase 5"
          git push --no-verify origin HEAD:agent/bandwidth-phase4-global-request-pressure