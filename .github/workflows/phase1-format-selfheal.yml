name: Phase 1 Format Self-Heal

on:
  push:
    branches: [phase1-testing-coverage-expansion]
    paths:
      - .github/workflows/phase1-format-selfheal.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: phase1-testing-coverage-expansion
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format Phase 1 tests and self-remove
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/ai-action-permission.test.ts \
            tests/phase5-performance-operations.test.ts \
            tests/ui/account-statement-pagination-client.test.ts \
            tests/ui/account-transfer-behavior.test.tsx \
            tests/ui/login-behavior.test.tsx \
            tests/ui/operational-phase4-bandwidth-fetch.test.ts
          git rm .github/workflows/phase1-format-selfheal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai-action-permission.test.ts \
            tests/phase5-performance-operations.test.ts \
            tests/ui/account-statement-pagination-client.test.ts \
            tests/ui/account-transfer-behavior.test.tsx \
            tests/ui/login-behavior.test.tsx \
            tests/ui/operational-phase4-bandwidth-fetch.test.ts
          git commit -m "style: format Phase 1 coverage tests"
          git push origin HEAD:phase1-testing-coverage-expansion
