name: Remote support Phase 8 finish

on:
  push:
    branches:
      - agent/remote-support-phase-8-current-main
    paths:
      - .github/workflows/remote-support-phase8-finish.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/remote-support-phase8-finish.yml

permissions:
  contents: write

concurrency:
  group: remote-support-phase8-finish
  cancel-in-progress: true

jobs:
  finish:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-8-current-main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: remote-support-phase8-final-test-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-8-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format affected source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/remoteControlSessionRoutes.ts \
            server/routes/remoteKeyboardControlRoutes.ts \
            server/routes/remoteSupportAuditRoutes.ts \
            server/routes/screenFeedRoutes.ts \
            server/services/remoteSupportRollout.ts
      - name: Verify Phase 8 contracts
        run: |
          node scripts/verify-env-documentation.mjs
          npm run check
          node node_modules/drizzle-kit/bin.cjs push --force
          node node_modules/vitest/vitest.mjs run \
            tests/remote-control-session-service.test.ts \
            tests/remote-control-command-service.test.ts \
            tests/remote-keyboard-command-service.test.ts \
            tests/remote-support-audit-service.test.ts \
            tests/remote-support-sensitive-action-policy.test.ts \
            tests/remote-support-permission-contract.test.ts \
            tests/remote-support-rollout.test.ts \
            tests/remote-support-phase8-release.test.ts \
            --maxWorkers=1 --no-file-parallelism
      - name: Commit final formatting
        run: |
          rm .github/workflows/remote-support-phase8-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(remote-support): finalize Phase 8 source formatting"
          git push --no-verify origin HEAD:agent/remote-support-phase-8-current-main
