name: God Files Sync Latest Main

on:
  push:
    branches: [agent/god-files-recovery-main]

permissions:
  contents: write

concurrency:
  group: god-files-sync-main-recovery
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-main
          fetch-depth: 0
      - name: Merge latest main and preserve recovered StockItems split
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[god-files-main-sync]'; then
            echo 'Latest-main sync commit already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Recovery branch already contains latest main.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            unexpected=$(printf '%s\n' "$conflicts" | grep -v '^client/src/pages/StockItems.tsx$' || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected latest-main conflicts; refusing automatic resolution.'
              exit 1
            fi
            git checkout --ours client/src/pages/StockItems.tsx
            git add client/src/pages/StockItems.tsx
          fi

          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/stockitems/useStockItems.ts')
          s=p.read_text()
          if 'useCompany' not in s:
              s=s.replace('import { useCurrencyContext } from "@/contexts/CurrencyContext";', 'import { useCurrencyContext } from "@/contexts/CurrencyContext";\nimport { useCompany } from "@/contexts/CompanyContext";')
          if 'useStockItemsFilters' not in s:
              s=s.replace('import { PAGE_SIZE } from "./utils";', 'import { PAGE_SIZE } from "./utils";\nimport { useStockItemsFilters } from "./useStockItemsFilters";')
          old='''  const [searchTerm, setSearchTerm] = useState("");\n  const [debouncedSearch, setDebouncedSearch] = useState("");\n  const [selectedGroupFilter, setSelectedGroupFilter] = useState<number | null>(null);\n  const [selectedGradeFilter, setSelectedGradeFilter] = useState<number | null>(null);\n  const [selectedCategoryFilter, setSelectedCategoryFilter] = useState<number | "none" | null>(null);\n  const [currentPage, setCurrentPage] = useState(1);'''
          new='''  const { selectedCompany } = useCompany();\n  const {\n    filters: { searchTerm, selectedGroupFilter, selectedGradeFilter, selectedCategoryFilter },\n    currentPage,\n    setPage: setCurrentPage,\n    debouncedSearch,\n    setSearchTerm,\n    setSelectedGroupFilter,\n    setSelectedGradeFilter,\n    setSelectedCategoryFilter,\n  } = useStockItemsFilters(selectedCompany?.id);'''
          if old not in s and 'useStockItemsFilters(selectedCompany?.id)' not in s:
              raise SystemExit('StockItems model state shape changed unexpectedly; refusing sync')
          s=s.replace(old,new)
          old_effect='''  useEffect(() => {\n    const timer = setTimeout(() => {\n      setDebouncedSearch(searchTerm);\n      setCurrentPage(1);\n    }, 300);\n    return () => clearTimeout(timer);\n  }, [searchTerm]);\n\n  useEffect(() => {\n    setCurrentPage(1);\n  }, [selectedGroupFilter, selectedGradeFilter, selectedCategoryFilter]);\n\n'''
          s=s.replace(old_effect,'')
          if 'useEffect(' not in s:
              s=s.replace('import { useEffect, useState, type MouseEvent } from "react";', 'import { useState, type MouseEvent } from "react";')
          p.write_text(s)
          PY

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          npm ci
          npm run check
          node scripts/audit-god-file-boundaries.mjs
          git commit -m 'merge: sync latest main into God Files recovery [god-files-main-sync]'
          git push origin HEAD:agent/god-files-recovery-main
