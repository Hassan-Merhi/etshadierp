name: Wave H Static Precheck

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-static-precheck.yml

permissions:
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SESSION_SECRET: phase2-static-precheck
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@v6
        with: { node-version: "22.14.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Run prechecks
        shell: bash
        run: |
          set +e
          : > phase2-static-precheck.txt
          echo '===== formatting =====' >> phase2-static-precheck.txt
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts | grep -zE '\.(ts|tsx|css|mjs)$' || true)
          node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}" > phase2-step.log 2>&1
          echo "exit=$?" >> phase2-static-precheck.txt
          tail -n 120 phase2-step.log >> phase2-static-precheck.txt
          echo >> phase2-static-precheck.txt
          echo '===== lint-ratchet =====' >> phase2-static-precheck.txt
          npm run lint >/dev/null 2>&1
          npm run audit:lint-ratchet > phase2-step.log 2>&1
          echo "exit=$?" >> phase2-static-precheck.txt
          tail -n 120 phase2-step.log >> phase2-static-precheck.txt
      - name: Commit result and self-remove
        run: |
          rm -f .github/workflows/wave-h-static-precheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-static-precheck.txt .github/workflows/wave-h-static-precheck.yml
          git commit -m "test: record Wave H static precheck"
          git push origin HEAD:wave-i/convergence-automation
