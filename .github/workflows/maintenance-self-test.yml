name: Maintenance - Workflow Self Test

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/maintenance-bots.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow YAML parses
        shell: python
        run: |
          import pathlib
          import sys
          try:
              import yaml
          except Exception:
              print('PyYAML is unavailable; using Ruby parser fallback in next step')
              sys.exit(0)
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              with path.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f'validated {path}')

      - name: Check maintenance workflows for destructive unmerged-branch deletion
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "git/refs/heads" .github/workflows/repository-janitor.yml | grep -qv "DELETE"; then
            true
          fi
          grep -q "merged_at != null" .github/workflows/repository-janitor.yml
          grep -q "open_count" .github/workflows/repository-janitor.yml
