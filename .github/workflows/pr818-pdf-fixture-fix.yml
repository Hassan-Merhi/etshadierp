name: PR 818 PDF Fixture Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 818
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair stale account-statement PDF fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/account-statement-routes-behavior.test.ts')
          text = path.read_text()
          old = 'Buffer.from("pdf-statement")'
          new = 'Buffer.from("%PDF-1.4\\npdf-statement")'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 stale PDF fixtures, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- tests/account-statement-routes-behavior.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/account-statement-routes-behavior.test.ts
          git commit -m "Fix account statement PDF test fixture"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
