name: Phase 3 Type Fix

on:
  push:
    branches:
      - codex/voucher-idempotency-phase3

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/voucher-idempotency-phase3
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: python3 scripts/phase3-type-fix-temp.py
      - run: node node_modules/prettier/bin/prettier.cjs --write server/routes/factory/factoryInsuranceRoutes.ts
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/factory/factoryInsuranceRoutes.ts
          git commit -m "fix phase 3 insurance posting result type"
          git -c core.hooksPath=/dev/null push origin HEAD:codex/voucher-idempotency-phase3
