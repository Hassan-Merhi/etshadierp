name: GitHub Actions Quality

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "renovate.json"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "renovate.json"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Select workflow files
        id: workflow-files
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA" "$HEAD_SHA" -- \
                '.github/workflows/*.yml' '.github/workflows/*.yaml' > /tmp/actionlint-files.txt
              ;;
            push)
              git diff --name-only --diff-filter=ACMR "$PUSH_BEFORE_SHA" "$HEAD_SHA" -- \
                '.github/workflows/*.yml' '.github/workflows/*.yaml' > /tmp/actionlint-files.txt
              ;;
            *)
              find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
                -print | sort > /tmp/actionlint-files.txt
              ;;
          esac
          if [[ -s /tmp/actionlint-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            cat /tmp/actionlint-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed workflow files to lint."
          fi

      - name: Lint changed workflows
        if: steps.workflow-files.outputs.has_files == 'true'
        shell: bash
        run: xargs -r ./actionlint -color < /tmp/actionlint-files.txt

  zizmor:
    name: zizmor
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          inputs: .github
          version: "v1.29.0"
          persona: regular
          min-severity: medium
          min-confidence: medium
          online-audits: true
