name: Phase 18 Land Barcode Contracts

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  land:
    if: contains(github.event.head_commit.message, '[phase18-barcode-land]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Replay verified Barcode contract extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/phase18-barcode-types.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=='- name: Extract API result contracts')
          run_i=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
          out=[]
          for l in lines[run_i+1:]:
              if l.startswith('      - name:'):
                  break
              out.append(l[10:] if l.startswith('          ') else l)
          Path('/tmp/barcode-transform.sh').write_text('\n'.join(out)+'\n')
          PY
          bash /tmp/barcode-transform.sh
      - name: Verify compiler and targeted boundary
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; npm run audit:god-files >/tmp/god.log 2>&1; rc=$?; set -e
          cat /tmp/god.log
          if grep -Fq 'client/src/pages/BarcodeLookup.tsx has ' /tmp/god.log; then exit 1; fi
          echo "OTHER_GOD_FILE_FAILURES_REMAIN=$rc"
      - name: Commit and robustly push
        shell: bash
        run: |
          set -euo pipefail
          git add client/src/pages/BarcodeLookup.tsx client/src/pages/barcodelookup/types.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: extract Barcode Lookup result contracts [phase18-barcode] [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            npm run check
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
