name: Phase 2 Prettier Repair

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format Phase 2 changed tests
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/account-statement-pdf-generator-behavior.test.ts \
            tests/credential-version-service-behavior.test.ts \
            tests/currency-amounts-behavior.test.ts \
            tests/export-excel-workbook-behavior.test.ts \
            tests/financial-close-service-behavior.test.ts \
            tests/immutable-stock-transfer-revision-lifecycle-behavior.test.ts \
            tests/named-permission-service-behavior.test.ts \
            tests/pos-create-sale-service-validation.test.ts \
            tests/production-bale-routes-behavior.test.ts \
            tests/smart-transfer-feedback-behavior.test.ts \
            tests/supplier-proforma-routes-behavior.test.ts \
            tests/ui/bale-products-page-behavior.test.tsx \
            tests/ui/data-tools-page-behavior.test.tsx \
            tests/ui/stock-entry-history-page-behavior.test.tsx \
            tests/ui/supplier-profit-check-page-behavior.test.tsx
      - name: Commit formatting-only repair
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'chore: format Phase 2 coverage tests'
          git push origin HEAD:program/erp-90-phase-2
