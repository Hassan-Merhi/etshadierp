name: Phase 2 Prettier Repair

on:
  push:
    branches: [program/erp-90-phase-2]
    paths:
      - ".github/workflows/phase2-prettier-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format current-main parity file set
        run: |
          git fetch origin main
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed source files."
            exit 0
          fi
          printf 'Formatting %s current-main diff file(s).\n' "${#files[@]}"
          node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format current-main Phase 2 diff"
          git push
