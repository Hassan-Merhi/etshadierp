name: Phase 2 Prettier Repair

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format all changed Phase 2 source files
        run: |
          base_sha=58f7adc5b8f0a045a21692839ca6f850db128083
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi
      - name: Commit, type-check, rebase, and push formatting repair
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src server shared tests scripts
          git commit -m 'chore: format Phase 2 coverage tests'
          npm run check
          for attempt in 1 2 3 4; do
            git fetch origin program/erp-90-phase-2
            git rebase origin/program/erp-90-phase-2
            npm run check
            if git push --no-verify origin HEAD:program/erp-90-phase-2; then
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt/4)."
            sleep 2
          done
          echo 'Unable to push formatting repair after retries.' >&2
          exit 1
