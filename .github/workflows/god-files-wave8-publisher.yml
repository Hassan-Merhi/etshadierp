name: God Files Wave 8 Publisher

on:
  pull_request:
    branches:
      - agent/god-files-final-wave1-tests
    paths:
      - ".wave8-trigger"

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'tmp/god-files-wave8-trigger'
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0

      - name: Reconcile exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff -X ours origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Apply final Wave 8 split
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tmp-god-files-wave8.mjs
          node node_modules/eslint/bin/eslint.js --fix \
            server/chatService.ts \
            server/chat/earlyMultiSourceTransfer.ts \
            server/chat/voucherAndStockDrafts.ts \
            server/chat/lookupDrafts.ts \
            server/chat/stockTransferDrafts.ts || true
          node node_modules/prettier/bin/prettier.cjs --write \
            server/chatService.ts \
            server/chat/earlyMultiSourceTransfer.ts \
            server/chat/voucherAndStockDrafts.ts \
            server/chat/lookupDrafts.ts \
            server/chat/stockTransferDrafts.ts \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md

      - name: Certify final God-file architecture
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            server/chatService.ts \
            server/chat/earlyMultiSourceTransfer.ts \
            server/chat/voucherAndStockDrafts.ts \
            server/chat/lookupDrafts.ts \
            server/chat/stockTransferDrafts.ts; do
            echo "WAVE8_FORMATTED_SIZE $f=$(wc -l < "$f")"
            test "$(wc -l < "$f")" -le 900
          done
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('config/god-file-boundaries.json','utf8'));
          if (cfg.version !== 33) throw new Error(`Expected v33, found v${cfg.version}`);
          if (Object.keys(cfg.repositoryScan.grandfathered).length !== 0) throw new Error('Final grandfathered backlog is not zero');
          const t = JSON.parse(fs.readFileSync('config/type-escape-boundaries.json','utf8'));
          if (t.totals.typeEscapeCeiling !== 3174) throw new Error(`Type ceiling widened to ${t.totals.typeEscapeCeiling}`);
          NODE
          npm run audit:god-files
          npm run audit:doc-index
          npm run audit:source-text-assertions
          npm run audit:type-escapes
          npm run check
          node node_modules/prettier/bin/prettier.cjs --check \
            server/chatService.ts \
            server/chat/earlyMultiSourceTransfer.ts \
            server/chat/voucherAndStockDrafts.ts \
            server/chat/lookupDrafts.ts \
            server/chat/stockTransferDrafts.ts \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md

      - name: Run canonical static-build chain
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:lockfile
          npm run verify:production-dependencies
          npm run lint
          npm run audit:lint-ratchet
          npm run check
          npm run build
          npm run verify:server-bundle
          npm run verify:observability
          npm run verify:final-production-readiness
          npm run verify:bandwidth

      - name: Publish final cumulative Wave 8 and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- package-lock.json
          rm -f .github/workflows/god-files-wave8-publisher.yml scripts/tmp-god-files-wave8.mjs
          git add -- \
            server/chatService.ts \
            server/chat/earlyMultiSourceTransfer.ts \
            server/chat/voucherAndStockDrafts.ts \
            server/chat/lookupDrafts.ts \
            server/chat/stockTransferDrafts.ts \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md
          git add -u -- .github/workflows/god-files-wave8-publisher.yml scripts/tmp-god-files-wave8.mjs
          git status --short
          git commit -m "refactor(god-files): complete cumulative wave 8 on current main"
          git fetch origin agent/god-files-final-wave1-tests
          if [ "$(git rev-parse origin/agent/god-files-final-wave1-tests)" != "$(git rev-parse HEAD^)" ]; then
            echo "Cumulative branch advanced during certification; refusing stale publish."
            exit 2
          fi
          SKIP_TSC_CHECK=1 git push origin HEAD:agent/god-files-final-wave1-tests
          git push origin --delete tmp/god-files-wave8-trigger || true
