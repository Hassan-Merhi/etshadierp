name: Phase 18 Unknown Boundary Harvest

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[phase18-unknown-harvest]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Replace explicit any with unknown where compiler proves safety
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          cat >.phase18-unknown.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path');
          const roots=['client/src','server','shared'],edits=new Map();
          function rec(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())rec(p);else if(/\.(ts|tsx)$/.test(e.name)&&!e.name.endsWith('.d.ts'))walk(p)}}
          function walk(file){const text=fs.readFileSync(file,'utf8'),sf=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),a=[];function v(n){if(n.kind===ts.SyntaxKind.AnyKeyword)a.push({start:n.getStart(sf),end:n.end});ts.forEachChild(n,v)}v(sf);if(a.length){a.sort((x,y)=>y.start-x.start);let s=text;for(const e of a)s=s.slice(0,e.start)+'unknown'+s.slice(e.end);fs.writeFileSync(file,s);edits.set(file.replaceAll('\\','/'),a.length)}}
          roots.forEach(rec);fs.writeFileSync('.phase18-unknown.files',[...edits.keys()].sort().join('\n')+'\n');console.log('UNKNOWN_CANDIDATES='+[...edits.values()].reduce((a,b)=>a+b,0)+' FILES='+edits.size);
          NODE
          cat >.phase18-unknown-gate.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path'),cp=require('child_process');
          const root=process.cwd(),list='.phase18-unknown.files',changed=new Set(fs.readFileSync(list,'utf8').trim().split(/\n/).filter(Boolean)),log=fs.readFileSync('.phase18-unknown.check','utf8');
          const errors=new Set([...log.matchAll(/^(.+?\.(?:ts|tsx))\(\d+,\d+\):\s+error\s+TS\d+:/gm)].map(m=>m[1].replaceAll('\\','/'))),revert=new Set([...errors].filter(f=>changed.has(f)));
          if(errors.size&&revert.size===0){const cp0=ts.findConfigFile(root,ts.sys.fileExists,'tsconfig.json'),cf=ts.readConfigFile(cp0,ts.sys.readFile),pc=ts.parseJsonConfigFileContent(cf.config,ts.sys,root),deps=new Map();for(const file of pc.fileNames){const r=path.relative(root,file).replaceAll('\\','/');if(!changed.has(r)&&!errors.has(r))continue;const sf=ts.createSourceFile(file,fs.readFileSync(file,'utf8'),ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),set=new Set();for(const st of sf.statements){if((ts.isImportDeclaration(st)||ts.isExportDeclaration(st))&&st.moduleSpecifier&&ts.isStringLiteral(st.moduleSpecifier)){const q=ts.resolveModuleName(st.moduleSpecifier.text,file,pc.options,ts.sys).resolvedModule?.resolvedFileName;if(q)set.add(path.relative(root,q).replaceAll('\\','/'))}}deps.set(r,set)}for(const e of errors){const q=[[e,0]],seen=new Set();while(q.length){const [f,d]=q.shift();if(seen.has(f)||d>10)continue;seen.add(f);for(const dep of deps.get(f)||[]){if(changed.has(dep))revert.add(dep);else q.push([dep,d+1]);}}}}
          console.log(`ERROR_FILES=${errors.size} REVERT_FILES=${revert.size} REMAINING=${changed.size}`);if(errors.size&&!revert.size){fs.writeFileSync('.phase18-unknown-unresolved','1');process.exit(0)}for(const f of revert){try{cp.execFileSync('git',['restore','--source=HEAD','--worktree','--',f])}catch{}changed.delete(f)}fs.writeFileSync(list,[...changed].sort().join('\n')+(changed.size?'\n':''));
          NODE
          node .phase18-unknown.cjs
          green=0
          for attempt in $(seq 1 20); do
            set +e; npm run check >.phase18-unknown.check 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then green=1; echo "UNKNOWN_GREEN_ATTEMPT=$attempt"; break; fi
            rm -f .phase18-unknown-unresolved
            node .phase18-unknown-gate.cjs
            if [ -f .phase18-unknown-unresolved ]; then echo UNKNOWN_UNRESOLVED; tail -n 120 .phase18-unknown.check; break; fi
            [ -s .phase18-unknown.files ] || break
          done
          if [ "$green" != 1 ]; then git reset --hard HEAD; exit 0; fi
          survivors=$(wc -l <.phase18-unknown.files | tr -d ' ')
          echo "UNKNOWN_SURVIVOR_FILES=$survivors"
          rm -f .phase18-unknown.cjs .phase18-unknown-gate.cjs .phase18-unknown.files .phase18-unknown.check .phase18-unknown-unresolved
          git add client/src server shared
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: replace compiler-safe any boundaries with unknown [phase18-unknown-safe] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
