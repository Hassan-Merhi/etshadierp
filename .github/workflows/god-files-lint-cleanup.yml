name: God Files Lint Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: god-files-lint-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/god-files-recovery-latest-main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-latest-main
          fetch-depth: 0
      - name: Make Stock Entry pagination native
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          plugin = Path('build/viteHeavyListPaginationPlugin.ts')
          text = plugin.read_text()
          old = 'const STOCK_ENTRY_SUFFIX = "/client/src/pages/StockEntryHistory.tsx";'
          retired = 'const STOCK_ENTRY_SUFFIX = "/__god_files_native__/StockEntryHistory.tsx";'
          if old in text:
              text = text.replace(old, retired, 1)
          elif retired not in text:
              raise SystemExit('Stock Entry Vite suffix not found')
          plugin.write_text(text)

          page = Path('client/src/pages/StockEntryHistory.tsx')
          text = page.read_text()
          old_group = '''      if (group.erpLocationId) gp.set("locationId", String(group.erpLocationId));
                return {'''
          new_group = '''      if (group.erpLocationId) gp.set("locationId", String(group.erpLocationId));
                if (statusFilter.length > 0) gp.set("status", statusFilter.join(","));
                if (debouncedSearch.trim()) gp.set("search", debouncedSearch.trim());
                return {'''
          if old_group in text:
              text = text.replace(old_group, new_group, 1)
          elif 'if (statusFilter.length > 0) gp.set("status", statusFilter.join(","));' not in text:
              # Formatting-safe fallback for the split page.
              anchor = '      if (group.erpLocationId) gp.set("locationId", String(group.erpLocationId));'
              if anchor not in text:
                  raise SystemExit('Stock Entry lazy group location filter not found')
              text = text.replace(
                  anchor,
                  anchor + '\n'
                  '      if (statusFilter.length > 0) gp.set("status", statusFilter.join(","));\n'
                  '      if (debouncedSearch.trim()) gp.set("search", debouncedSearch.trim());',
                  1,
              )
          page.write_text(text)
          PY

          if git diff --quiet; then
            echo 'Stock Entry pagination cleanup already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/viteHeavyListPaginationPlugin.ts
          git add client/src/pages/StockEntryHistory.tsx
          git commit -m 'fix: make Stock Entry pagination native [lint-cleanup]'
          git push origin HEAD:agent/god-files-recovery-latest-main
