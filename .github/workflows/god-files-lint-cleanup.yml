name: God Files Lint Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: god-files-lint-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/god-files-recovery-latest-main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-latest-main
          fetch-depth: 0
      - name: Remove split-only unused imports
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^import type { ClientErrorLike } from "@\/lib\/clientError";$/d' client/src/pages/StockEntryHistory.tsx
          sed -i '/^import { getErrorDetails } from "@shared\/errorUtils";$/d' client/src/pages/factory/factorylocationinventory/useFactoryLocationReprint.ts
          if git diff --quiet; then
            echo 'No lint cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/StockEntryHistory.tsx client/src/pages/factory/factorylocationinventory/useFactoryLocationReprint.ts
          git commit -m 'fix: remove split-only unused imports [lint-cleanup]'
          git push origin HEAD:agent/god-files-recovery-latest-main
