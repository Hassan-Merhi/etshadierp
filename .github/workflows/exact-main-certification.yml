name: Exact Main Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: exact-main-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      SESSION_SECRET: exact-main-certification-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PORT: "5000"
    steps:
      - name: Mark certification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"phase3/exact-main-certification","description":"Exact-main certification is running"}'

      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        id: install
        continue-on-error: true
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true

      - name: Static, build, and safety contracts
        id: static
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm run verify:lockfile
          npm run verify:production-dependencies
           npm run format:check:changed -- --base HEAD^
          npm run lint
          npm run audit:lint-ratchet
          npm run check
          npm run build
          npm run verify:server-bundle
          npm run verify:final-production-readiness
          npm run verify:observability
          npm run verify:stabilization
          npm run verify:mobile-web-routing
          npm run verify:bandwidth
          node scripts/verify-program7d-accessibility-responsive.mjs

      - name: Prepare and verify disposable PostgreSQL schema
        id: schema
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/verify-migration-registry.mjs --json
          node node_modules/drizzle-kit/bin.cjs push --force
          node scripts/verify-ci-disposable-schema.mjs

      - name: Backend regression and coverage
        id: backend
        if: always() && steps.schema.outcome == 'success'
        continue-on-error: true
        run: |
          npm run test:backend:verify
          npm run test:backend:verify:coverage
          npm run test:smoke-sweep

      - name: Frontend regression and coverage
        id: frontend
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm run test:frontend
          npm run test:frontend:coverage

      - name: I18n and security gates
        id: security
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/verify-phase9-final-i18n-baseline.mjs
          npm run check:security
          npm audit --omit=dev --audit-level=critical

      - name: Backup and restore rehearsal
        id: resilience
        if: always() && steps.schema.outcome == 'success'
        continue-on-error: true
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE exact_main_rehearsal_sentinel (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO exact_main_rehearsal_sentinel (id, marker) VALUES (1, 'exact-main-certification');
          SQL
          BACKUP_FILE="$RUNNER_TEMP/exact-main.dump"
          pg_dump --format=custom --no-owner --no-acl --file="$BACKUP_FILE" "$DATABASE_URL"
          pg_restore --list "$BACKUP_FILE" > "$RUNNER_TEMP/exact-main.toc.txt"
          test -s "$RUNNER_TEMP/exact-main.toc.txt"
          node scripts/verify-database-backup.mjs "$BACKUP_FILE" --max-age-hours=1 --json
          dropdb --if-exists -h localhost -U postgres heliumdb_restore
          createdb -h localhost -U postgres heliumdb_restore
          pg_restore --exit-on-error --no-owner --no-acl --dbname=postgresql://postgres:postgres@localhost:5432/heliumdb_restore "$BACKUP_FILE"
          RESTORE_URL=postgresql://postgres:postgres@localhost:5432/heliumdb_restore
          test "$(psql "$RESTORE_URL" -Atqc "SELECT marker FROM exact_main_rehearsal_sentinel WHERE id=1")" = "exact-main-certification"
          DATABASE_URL="$RESTORE_URL" node scripts/verify-ci-disposable-schema.mjs
          node node_modules/vitest/vitest.mjs run tests/scheduler-tick-guard.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Publish authoritative certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          STATIC: ${{ steps.static.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          RESILIENCE: ${{ steps.resilience.outcome }}
        run: |
          set -euo pipefail
          state=success
          for result in "$INSTALL" "$STATIC" "$SCHEMA" "$BACKEND" "$FRONTEND" "$SECURITY" "$RESILIENCE"; do
            if [ "$result" != "success" ]; then state=failure; fi
          done
          description="Exact-main certification passed"
          if [ "$state" != "success" ]; then description="Exact-main certification failed"; fi
          payload=$(printf '{"state":"%s","context":"phase3/exact-main-certification","description":"%s"}' "$state" "$description")
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
          printf 'install=%s\nstatic=%s\nschema=%s\nbackend=%s\nfrontend=%s\nsecurity=%s\nresilience=%s\n' \
            "$INSTALL" "$STATIC" "$SCHEMA" "$BACKEND" "$FRONTEND" "$SECURITY" "$RESILIENCE"
          test "$state" = "success"
