name: Phase 6 Focused Final

on:
  pull_request:
    branches: [main]

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase6-focused-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Prepare test database
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Verify Phase 6 contract
        run: |
          node node_modules/vitest/vitest.mjs run \
            tests/factory-post-offload-phase6-safety-repair.test.ts \
            --maxWorkers=1 --no-file-parallelism
