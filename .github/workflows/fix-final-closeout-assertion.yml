name: Fix final closeout assertion

on:
  push:
    branches:
      - agent/final-closeout-i18n-release

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/final-closeout-i18n-release
          fetch-depth: 0

      - name: Fix sales target assertion and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/final-closeout-i18n.yml')
          text = path.read_text()
          old = "'sales-pos': 5"
          new = "'sales-pos': 6"
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-final-closeout-assertion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/final-closeout-i18n.yml .github/workflows/fix-final-closeout-assertion.yml
          git commit -m "Fix final closeout sales assertion"
          git push origin HEAD:agent/final-closeout-i18n-release
