name: Phase 13 Final Validator

on:
  push:
    branches:
      - phase-13-dependency-platform-modernization

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply controlled dependency modernization
        shell: python
        run: |
          import json
          from pathlib import Path

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          for name, version in {
              '@capacitor/android': '^8.5.0',
              '@capacitor/cli': '^8.5.0',
              '@capacitor/core': '^8.5.0',
              '@capacitor/ios': '^8.5.0',
              'nodemailer': '^9.0.5',
              'react-day-picker': '^8.10.2',
          }.items():
              pkg['dependencies'][name] = version
          pkg['devDependencies']['@types/node'] = '^24.13.3'
          pkg['devDependencies'].pop('@types/pdf-parse', None)
          pkg['devDependencies'].pop('@types/bcryptjs', None)
          pkg['devDependencies'].pop('@tailwindcss/vite', None)
          pkg['scripts']['audit:platform'] = 'node scripts/audit-platform-modernization.mjs'
          pkg['scripts']['test:platform'] = 'node --test tests/platform-modernization-contract.node.test.mjs'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          route_path = Path('server/routes/chatbotPoImportRoutes.ts')
          route = route_path.read_text()
          old = '''        try {
                    const pdfParseModule: any = await import("pdf-parse");
                    const pdfParse = (pdfParseModule.default ?? pdfParseModule) as (buf: Buffer) => Promise<{ text: string }>;
                    const parsed = await pdfParse(req.file.buffer);
                    pdfText = parsed.text;
                  } catch (pdfErr: unknown) {'''
          new = '''        try {
                    const { PDFParse } = await import("pdf-parse");
                    const parser = new PDFParse({ data: new Uint8Array(req.file.buffer) });
                    try {
                      const parsed = await parser.getText();
                      pdfText = parsed.text;
                    } finally {
                      await parser.destroy();
                    }
                  } catch (pdfErr: unknown) {'''
          if old not in route:
              raise SystemExit('Expected legacy pdf-parse compatibility block was not found')
          route_path.write_text(route.replace(old, new, 1))

      - name: Align Android project with Capacitor 8
        shell: bash
        run: |
          cat > android/variables.gradle <<'EOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.11.0'
              androidxAppCompatVersion = '1.7.1'
              androidxCoordinatorLayoutVersion = '1.3.0'
              androidxCoreVersion = '1.17.0'
              androidxFragmentVersion = '1.8.9'
              coreSplashScreenVersion = '1.2.0'
              androidxWebkitVersion = '1.14.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.3.0'
              androidxEspressoCoreVersion = '3.7.0'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/build.gradle')
          text = build.read_text()
          text = text.replace("classpath 'com.android.tools.build:gradle:9.3.1'", "classpath 'com.android.tools.build:gradle:8.13.0'")
          text = text.replace("classpath 'com.google.gms:google-services:4.5.0'", "classpath 'com.google.gms:google-services:4.4.4'")
          build.write_text(text)

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper.write_text(wrapper.read_text().replace('gradle-9.7.1-all.zip', 'gradle-8.14.3-all.zip'))

          app = Path('android/app/build.gradle')
          text = app.read_text()
          text = text.replace('namespace "com.erp.warehouse"', 'namespace = "com.erp.warehouse"')
          text = text.replace('compileSdk rootProject.ext.compileSdkVersion', 'compileSdk = rootProject.ext.compileSdkVersion')
          text = text.replace("ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'", "ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'")
          text = text.replace("getDefaultProguardFile('proguard-android.txt')", "getDefaultProguardFile('proguard-android-optimize.txt')")
          app.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = 'orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation'
          if marker in text and marker + '|density' not in text:
              text = text.replace(marker, marker + '|density')
          manifest.write_text(text)
          PY

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 13 files
        run: npx prettier --write package.json package-lock.json server/routes/chatbotPoImportRoutes.ts scripts/audit-platform-modernization.mjs tests/platform-modernization-contract.node.test.mjs docs/phase13-dependency-platform-modernization.md

      - name: Platform coherence audit
        run: npm run audit:platform

      - name: TypeScript
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Phase 13 contract
        run: npm run test:platform

      - name: Production build
        run: npm run build

      - name: Sync Android native project
        run: |
          npm run build:cap
          npx cap sync android

      - name: Re-check platform coherence after sync
        run: npm run audit:platform

      - name: Resolve Android SDK manager and install API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type d -print 2>/dev/null | head -n 100
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Commit validated modernization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/routes/chatbotPoImportRoutes.ts android ios desktop \
            scripts/audit-platform-modernization.mjs tests/platform-modernization-contract.node.test.mjs \
            docs/phase13-dependency-platform-modernization.md
          if git diff --cached --quiet; then
            echo "No Phase 13 changes to commit" >&2
            exit 1
          fi
          git commit -m "chore: complete phase 13 platform modernization"
          git push origin HEAD:phase-13-dependency-platform-modernization
