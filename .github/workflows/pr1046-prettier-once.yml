name: PR 1046 Prettier Once

on:
  push:
    branches:
      - restore-legacy-production-planner

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only failed PR 1046 files
        run: |
          npx prettier --write \
            client/src/i18n/phase3RemainingTranslations.part24.ts \
            client/src/pages/POImport.tsx \
            client/src/pages/factory/factorycontainerloadingscan/FinalizeLoadingDialog.tsx \
            client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts \
            client/src/pages/settings/BackupStatusCard.tsx \
            client/src/pages/settings/datatoolstab/components/LocationCostPriceOverride.tsx \
            client/src/pages/settings/datatoolstab/components/MergeStockItemsLauncher.tsx \
            server/routes/factory/customer-orders/finalize-loading/loading.ts \
            tests/customer-loading-finalization-concurrency.test.ts \
            tests/customer-loading-routes-behavior.test.ts \
            tests/factory-loading-soft-delete-overload-regression.test.ts \
            tests/setup.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            client/src/i18n/phase3RemainingTranslations.part24.ts \
            client/src/pages/POImport.tsx \
            client/src/pages/factory/factorycontainerloadingscan/FinalizeLoadingDialog.tsx \
            client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts \
            client/src/pages/settings/BackupStatusCard.tsx \
            client/src/pages/settings/datatoolstab/components/LocationCostPriceOverride.tsx \
            client/src/pages/settings/datatoolstab/components/MergeStockItemsLauncher.tsx \
            server/routes/factory/customer-orders/finalize-loading/loading.ts \
            tests/customer-loading-finalization-concurrency.test.ts \
            tests/customer-loading-routes-behavior.test.ts \
            tests/factory-loading-soft-delete-overload-regression.test.ts \
            tests/setup.ts
          git commit -m 'style: format PR 1046 changed files'
          git push origin HEAD:restore-legacy-production-planner
