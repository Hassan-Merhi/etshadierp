name: Remote support Phase 3 test formatter

on:
  push:
    branches:
      - agent/remote-support-phase-3-viewing-quality
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: remote-support-phase3-test-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-3-viewing-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-3-viewing-quality
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Normalize registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format Phase 3 tests
        run: node node_modules/prettier/bin/prettier.cjs --write tests/screen-feed-viewing-metadata.test.ts tests/screen-feed-live-hub.test.ts
      - name: Commit formatted tests
        run: |
          if git diff --quiet -- tests/screen-feed-viewing-metadata.test.ts tests/screen-feed-live-hub.test.ts; then
            echo "Tests already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/screen-feed-viewing-metadata.test.ts tests/screen-feed-live-hub.test.ts
          git commit -m "style(remote-support): format Phase 3 tests"
          git push origin HEAD:agent/remote-support-phase-3-viewing-quality
