name: CodeQL Phase 2 Worker

on:
  push:
    branches: ["security/codeql-phase2-parameter-tampering"]
    paths:
      - ".github/workflows/codeql-phase2-worker.yml"

permissions:
  contents: write

concurrency:
  group: codeql-phase2-worker
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Apply repairs
        shell: bash
        run: |
          sed -i 's/if count != 1:/if count < 1:/' scripts/codeql-phase2-worker.py
          python3 scripts/codeql-phase2-worker.py

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ets-ci-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/inventory-movement/movement.ts server/routes/sp/spExportRoutes.ts server/routes/accountStatementRoutes.ts tests/account-statement-routes-behavior.test.ts
          git commit -m "security: validate CodeQL critical query boundaries"
          git push origin HEAD:${GITHUB_REF_NAME}
