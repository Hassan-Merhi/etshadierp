name: CodeQL Phase 2 Worker

on:
  push:
    branches: ["security/codeql-phase2-parameter-tampering"]
    paths:
      - ".github/workflows/codeql-phase2-worker.yml"

permissions:
  contents: write

concurrency:
  group: codeql-phase2-worker
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Apply parameter-tampering repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

