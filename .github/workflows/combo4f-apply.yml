name: Combo 4F Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/combo-4f-fiscal-sp-typescript'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Combo 4F branch
        uses: actions/checkout@v4
        with:
          ref: agent/combo-4f-fiscal-sp-typescript
          fetch-depth: 0

      - name: Apply audited safe structural fixes
        run: node scripts/combo-4f-apply.mjs

      - name: Commit production changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix safe fiscal and Supplier Partner TypeScript diagnostics"
          git push origin HEAD:agent/combo-4f-fiscal-sp-typescript
