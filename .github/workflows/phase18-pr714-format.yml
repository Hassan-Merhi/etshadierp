name: Phase 18 PR 714 formatter

on:
  push:
    branches:
      - phase18/final-certification-repair-20260817

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[phase18-format-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase18/final-certification-repair-20260817
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format repair files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/accounting.test.ts \
            tests/factory-insurance-company-isolation.test.ts \
            tests/ui/helpers.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet -- tests/accounting.test.ts tests/factory-insurance-company-isolation.test.ts tests/ui/helpers.tsx; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/accounting.test.ts tests/factory-insurance-company-isolation.test.ts tests/ui/helpers.tsx
          git commit -m "style: normalize Phase 18 repair tests [phase18-format-done]"
          git push origin HEAD:phase18/final-certification-repair-20260817
