name: Combo 1 temporary SP test fix

on:
  push:
    branches: [combo-1-ci-safe-types]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Combo 1 branch
        uses: actions/checkout@v4
        with:
          ref: combo-1-ci-safe-types
          fetch-depth: 0

      - name: Apply guarded test-only replacement
        run: node scripts/combo1-fix-sp-test.mjs

      - name: Commit replacement when needed
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No test update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/sp-sales-accounting.test.ts
          git commit -m "test: use seeded cash account in SP sale regression"
          git push origin HEAD:combo-1-ci-safe-types
