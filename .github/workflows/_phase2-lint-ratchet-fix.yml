name: Phase 2 lint ratchet fix

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  fix-ratchet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tighten lint warning ratchets and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          config_path = Path('config/lint-warning-ratchet.json')
          config = json.loads(config_path.read_text())
          assert config['totals']['warningCeiling'] == 9461
          assert config['perRule']['@typescript-eslint/no-explicit-any'] == 8834
          config['totals']['warningCeiling'] = 9457
          config['perRule']['@typescript-eslint/no-explicit-any'] = 8830
          config['notes']['@typescript-eslint/no-explicit-any'] = (
              'Exactly the type-escape backlog seen from ESLint: 8830 = the 8832 in '
              'config/type-escape-boundaries.json minus its 2 suppressions, which are not an ESLint '
              'rule. The binding gate for this rule stays config/type-escape-boundaries.json, which '
              'freezes every file individually and is therefore strictly stronger than a repository '
              'total. This ceiling exists so the two cannot disagree - it must be lowered whenever '
              'the type-escape ceiling is.'
          )
          config_path.write_text(json.dumps(config, indent=2) + '\n')

          doc_path = Path('docs/system-quality-program.md')
          text = doc_path.read_text()
          replacements = {
              '| ESLint warnings | 9,461 total |': '| ESLint warnings | 9,457 total |',
              'currently 9,461, and may': 'currently 9,457, and may',
              '8,832 of the\n  9,461 warnings': '8,830 of the\n  9,457 warnings',
              '(8,984 = 8,986 − 2)': '(8,830 = 8,832 − 2)',
          }
          for old, new in replacements.items():
              assert old in text, f'missing expected documentation text: {old!r}'
              text = text.replace(old, new)
          doc_path.write_text(text)
          PY

          git rm .github/workflows/_phase2-lint-ratchet-fix.yml
          git add config/lint-warning-ratchet.json docs/system-quality-program.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: lock lint warning ratchet gains'
          git push origin HEAD:program/erp-90-phase-2
