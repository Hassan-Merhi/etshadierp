name: Phase 4 exact formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase4-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-4-current-main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply pinned Prettier output
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/app/AuthenticatedApp.tsx \
            client/src/app/PosShell.tsx \
            client/src/components/RemoteSupportIndicator.tsx \
            client/src/hooks/use-remote-control-session.ts \
            client/src/i18n/applicationTranslations.ts \
            client/src/i18n/backendMessagesPhase7Translations.ts \
            client/src/i18n/currentMainSupplierPartnerTranslations.ts \
            client/src/i18n/remoteSupportPhase4Translations.ts \
            client/src/styles/rtl-hardening.css \
            server/routes/applicationRoutes.ts \
            server/routes/remoteControlSessionRoutes.ts \
            server/routes/screenFeedRoutes.ts \
            server/services/remoteControlSessionService.ts \
            tests/remote-control-session-service.test.ts \
            scripts/audit-i18n-phase14.mjs \
            scripts/verify-dependency-audit.mjs

      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Formatting already exact."
          else
            git commit -m "Apply exact Phase 4 formatting"
            git push origin HEAD:agent/remote-support-phase-4-current-main
          fi
