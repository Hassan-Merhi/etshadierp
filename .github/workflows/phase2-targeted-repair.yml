name: Phase 2 Targeted Repair

on:
  push:
    branches:
      - program/erp-90-phase-2
    paths:
      - .github/workflows/phase2-targeted-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Format every changed source file checked by CI
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed source files require formatting."
            exit 0
          fi
          printf 'Formatting %s changed source file(s):\n' "${#changed_files[@]}"
          printf ' - %s\n' "${changed_files[@]}"
          node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"
      - name: Verify TypeScript after formatting
        run: npm run check
      - name: Publish formatting repair and remove runner
        run: |
          rm .github/workflows/phase2-targeted-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format Phase 2 changed source files"
          git push origin HEAD:program/erp-90-phase-2
