name: Phase 3 Release Verification Dispatch

on:
  push:
    branches:
      - agent/phase3-release-verification-20260810

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Release Verification for Phase 3 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-verification.yml --repo Hassan-Merhi/etshadierp --ref agent/phase3-release-verification-20260810
