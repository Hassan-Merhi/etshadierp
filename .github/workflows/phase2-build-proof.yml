name: Phase 2 Build Proof

on:
  push:
    branches:
      - codex/voucher-idempotency-phase2

permissions:
  contents: read

env:
  NODE_ENV: test
  SESSION_SECRET: github-actions-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  PORT: "5000"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  phase2-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: TypeScript
        run: npm run check
      - name: Production build
        run: npm run build
