name: Postgres Regression Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-regression:
    if: github.event.pull_request.head.ref == 'diagnostic/postgres-regression-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      SESSION_SECRET: diagnostic-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify disposable database schema
        run: node scripts/verify-ci-disposable-schema.mjs
      - name: Backend tests
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism
      - name: Frontend tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts --maxWorkers=1 --no-file-parallelism

  postgres-regression-macos:
    if: github.event.pull_request.head.ref == 'diagnostic/postgres-regression-20260818'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
      SESSION_SECRET: diagnostic-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=6144
      PORT: "5000"
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Start PostgreSQL 15
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list postgresql@15 >/dev/null 2>&1; then brew install postgresql@15; fi
          PGBIN="$(brew --prefix postgresql@15)/bin"
          echo "$PGBIN" >> "$GITHUB_PATH"
          rm -rf /tmp/erp-pgdata
          "$PGBIN/initdb" -D /tmp/erp-pgdata -A trust
          "$PGBIN/pg_ctl" -D /tmp/erp-pgdata -l /tmp/erp-postgres.log -o "-p 5432" start
          "$PGBIN/createdb" -p 5432 heliumdb
          echo "DATABASE_URL=postgresql://$(whoami)@localhost:5432/heliumdb" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --bin-links=true
      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify disposable database schema
        run: node scripts/verify-ci-disposable-schema.mjs
      - name: Backend tests
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism
      - name: Frontend tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts --maxWorkers=1 --no-file-parallelism
