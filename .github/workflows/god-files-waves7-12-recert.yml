name: God Files Waves 7-12 Re-certification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: god-files-waves7-12-recert-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recert:
    if: github.event.pull_request.head.ref == 'agent/god-files-recovery-latest-main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-latest-main
          fetch-depth: 0
      - name: Integrate Waves 7-12 while preserving latest-main helpers
        shell: bash
        run: |
          set -euo pipefail
          if git log --format=%B -80 | grep -Fq '[waves7-12-recert]'; then
            echo 'Waves 7-12 already re-certified.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git fetch origin agent/god-files-claude-waves-07-12:refs/remotes/origin/god-files-7-12
          BASE=4e2eb176ddfb141c3d1407e0a61cd6cdf3823da4
          OLD=origin/god-files-7-12

          dirs=(
            client/src/pages/accountslegacy
            client/src/pages/containerloadingscan
            client/src/pages/containerverification
            client/src/pages/transactionjournal
            client/src/pages/daybook/voucherdetailsdialog
            client/src/pages/factory/factorycontainerloadingscan
            client/src/pages/factory/daybook
            client/src/pages/factory/factorypos
            client/src/pages/pos/posimport
            client/src/pages/pos/pospricelist
          )

          # Copy the extracted support modules, then restore every helper that has
          # changed on latest main since the historical split base.
          git diff --name-only "$BASE" origin/main -- "${dirs[@]}" | sort -u >/tmp/latest-main-support.txt
          for d in "${dirs[@]}"; do
            git checkout "$OLD" -- "$d"
          done
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git checkout HEAD -- "$f"
            else
              git rm -f --ignore-unmatch -- "$f"
            fi
          done </tmp/latest-main-support.txt

          # Nine roots were genuinely split on the historical Waves 7-12 branch.
          git checkout "$OLD" -- \
            client/src/pages/AccountsLegacy.tsx \
            client/src/pages/ContainerLoadingScan.tsx \
            client/src/pages/TransactionJournal.tsx \
            client/src/pages/daybook/VoucherDetailsDialog.tsx \
            client/src/pages/factory/FactoryContainerLoadingScan.tsx \
            client/src/pages/factory/FactoryDaybook.tsx \
            client/src/pages/factory/FactoryPOS.tsx \
            client/src/pages/pos/POSImport.tsx \
            client/src/pages/pos/POSPriceList.tsx

          # ContainerVerification had extracted modules but its 1,122-line root was
          # never switched. Finish that root now from those modules.
          cat > client/src/pages/ContainerVerification.tsx <<'EOF'
          import { ArrowLeft, List } from "lucide-react";
          import { Button } from "@/components/ui/button";
          import { PageHeader } from "@/components/PageHeader";
          import { useContainerVerificationModel } from "./containerverification/useContainerVerificationModel";
          import { LoadedItemsCard } from "./containerverification/LoadedItemsCard";
          import { AliasConflictAlert, ComparisonSetupCard } from "./containerverification/ComparisonSetupCard";
          import { ComparisonCards } from "./containerverification/ComparisonCards";
          import { ComparisonSummaryCards } from "./containerverification/ComparisonSummaryCards";

          export default function ContainerVerification() {
            const model = useContainerVerificationModel();
            return (
              <div className="flex flex-col h-full p-4 lg:p-6 overflow-y-auto">
                <input ref={model.fileInputRef} type="file" accept=".xlsx,.csv" className="hidden" onChange={model.handleFileImport} />
                <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                  <div className="flex items-center gap-3">
                    <Button variant="ghost" size="icon" onClick={() => model.navigate(`/containers/${model.containerId}`)} data-testid="button-back">
                      <ArrowLeft className="h-5 w-5" />
                    </Button>
                    <PageHeader
                      title="Container Verification"
                      subtitle={`${model.container?.containerNumber || `Container #${model.containerId}`} - Proforma vs Loaded Items`}
                    />
                  </div>
                </div>
                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
                  <LoadedItemsCard model={model} />
                  <ComparisonSetupCard model={model} />
                </div>
                {model.verificationResult && (
                  <>
                    <AliasConflictAlert model={model} />
                    <div className="flex items-center gap-2 mb-4">
                      <Button
                        variant={model.viewMode === "summary" ? "default" : "outline"}
                        size="sm"
                        onClick={() => model.setViewMode(model.viewMode === "summary" ? "detailed" : "summary")}
                        className="toggle-elevate"
                        data-testid="button-toggle-summary"
                      >
                        <List className="mr-1.5 h-3.5 w-3.5" />
                        {model.viewMode === "summary" ? "Hide Summary" : "Show Summary"}
                      </Button>
                    </div>
                    <ComparisonCards model={model} />
                    {model.viewMode === "summary" && <ComparisonSummaryCards model={model} />}
                  </>
                )}
              </div>
            );
          }
          EOF

          cat > client/src/pages/containerverification/ComparisonSummaryCards.tsx <<'EOF'
          import { AlertTriangle, ArrowDownRight, ArrowUpRight, DollarSign, type LucideIcon } from "lucide-react";
          import { Badge } from "@/components/ui/badge";
          import { Card, CardContent, CardHeader, CardTitle } from "@/components/ui/card";
          import { Table, TableBody, TableCell, TableHead, TableHeader, TableRow } from "@/components/ui/table";
          import type { ComparisonItem } from "./types";
          import type { ContainerVerificationModel } from "./useContainerVerificationModel";

          function SummaryCard({ icon: Icon, title, items, metric, total, className = "" }: {
            icon: LucideIcon;
            title: string;
            items: ComparisonItem[];
            metric: (item: ComparisonItem) => string;
            total: () => string;
            className?: string;
          }) {
            return (
              <Card className="flex flex-col">
                <CardHeader className="flex flex-row items-center justify-between gap-2 space-y-0 pb-2">
                  <div className="flex items-center gap-2"><Icon className={`h-4 w-4 ${className}`} /><CardTitle className="text-xs">{title}</CardTitle></div>
                  <Badge variant="secondary">{items.length}</Badge>
                </CardHeader>
                <CardContent className="flex-1 p-0">
                  {items.length === 0 ? <p className="text-xs text-muted-foreground text-center py-3">None</p> : (
                    <div className="max-h-[300px] overflow-y-auto">
                      <Table>
                        <TableHeader className="sticky top-0 z-30 bg-background"><TableRow><TableHead className="text-xs py-1.5 px-3">Name</TableHead><TableHead className="text-xs text-right py-1.5 px-3">Value</TableHead></TableRow></TableHeader>
                        <TableBody>{items.map((item) => <TableRow key={item.barcode}><TableCell className="text-xs py-1.5 px-3">{item.itemName}</TableCell><TableCell className={`text-right font-mono text-xs py-1.5 px-3 ${className}`}>{metric(item)}</TableCell></TableRow>)}</TableBody>
                      </Table>
                    </div>
                  )}
                  {items.length > 0 && <div className="border-t bg-muted/50 px-3 py-2 flex items-center justify-between gap-2 text-xs font-bold"><span>Total ({items.length})</span><span className={`font-mono ${className}`}>{total()}</span></div>}
                </CardContent>
              </Card>
            );
          }

          export function ComparisonSummaryCards({ model }: { model: ContainerVerificationModel }) {
            const priceTotal = model.priceDiffs.reduce((sum, item) => sum + item.totalPriceDiff, 0);
            const priceClass = priceTotal > 0 ? "text-red-600 dark:text-red-400" : "text-green-600 dark:text-green-400";
            return (
              <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mt-6">
                <SummaryCard icon={ArrowUpRight} title="Overloaded" items={model.overloaded} className="text-red-600 dark:text-red-400" metric={(item) => `+${item.loadedQty - item.expectedQty}`} total={() => `+${model.overloaded.reduce((sum, item) => sum + item.loadedQty - item.expectedQty, 0)}`} />
                <SummaryCard icon={ArrowDownRight} title="Less Loaded" items={model.lessLoaded} className="text-amber-600 dark:text-amber-400" metric={(item) => `-${item.expectedQty - item.loadedQty}`} total={() => `-${model.lessLoaded.reduce((sum, item) => sum + item.expectedQty - item.loadedQty, 0)}`} />
                <SummaryCard icon={AlertTriangle} title="Not Requested" items={model.notRequested} className="text-orange-600 dark:text-orange-400" metric={(item) => String(item.loadedQty)} total={() => String(model.notRequested.reduce((sum, item) => sum + item.loadedQty, 0))} />
                <SummaryCard icon={DollarSign} title="Price Diff" items={model.priceDiffs} className={priceClass} metric={(item) => `${item.priceDiffPerBale > 0 ? "+" : ""}${item.priceDiffPerBale.toFixed(2)}`} total={() => `${priceTotal > 0 ? "+" : ""}${priceTotal.toFixed(2)}`} />
              </div>
            );
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          # Preserve current-main Accounts dependency/memo semantics in the split model.
          p=Path('client/src/pages/accountslegacy/useAccountsLegacyModel.ts')
          s=p.read_text()
          if 'useMemo' not in s.split('\n', 12)[8:]:
              pass
          s=s.replace('const allAccounts: Account[] = accountsResponse?.accounts ?? [];', 'const allAccounts: Account[] = useMemo(() => (accountsResponse?.accounts ?? []), [accountsResponse?.accounts]);')
          s=s.replace('[allAccounts, urlAccountId, urlAccountType]', '[allAccounts, selectedAccount, urlAccountId, urlAccountType]')
          s=s.replace('}, [bankToEdit]);', '}, [bankForm, bankToEdit]);')
          p.write_text(s)

          # Preserve current-main Factory Daybook permissions in memo dependencies.
          p=Path('client/src/pages/factory/daybook/useFactoryDaybookModel.ts')
          s=p.read_text().replace(
              '[entries, statusFilter, debouncedSearchQuery, minAmount, maxAmount, sortOrder]',
              '[entries, isAdminOrOwner, currentUser?.role, currentUser.id, statusFilter, debouncedSearchQuery, minAmount, maxAmount, sortOrder]'
          )
          p.write_text(s)

          # Preserve current-main Container Verification error/dependency hardening.
          p=Path('client/src/pages/containerverification/useContainerVerificationModel.ts')
          s=p.read_text()
          if 'getErrorDetails' not in s:
              s=s.replace('import { useState, useRef, useEffect, useCallback, type ChangeEvent } from "react";', 'import { getErrorDetails } from "@shared/errorUtils";\nimport { useState, useRef, useEffect, useCallback, type ChangeEvent } from "react";')
          s=s.replace('catch (err: any)', 'catch (err)')
          s=s.replace('description: err.message', 'description: getErrorDetails(err).message')
          s=s.replace('[loadedItems, loadingItems, containerData]);', '[loadedItems, loadingItems, containerData, autoPopulateMutation]);')
          p.write_text(s)

          # Preserve latest-main persisted/paginated Transaction Journal filters.
          p=Path('client/src/pages/transactionjournal/useTransactionJournalModel.ts')
          s=p.read_text()
          s=s.replace('import { PeriodFilterValue, getDefaultPeriodValue } from "@/components/ui/period-filter";', 'import type { PeriodFilterValue } from "@/components/ui/period-filter";\nimport { usePaginatedFilterState } from "@/hooks/use-paginated-filter-state";\nimport { createTransactionJournalFilters, type TransactionJournalFilters } from "./filterState";')
          old='''  const [periodFilter, setPeriodFilter] = useState<PeriodFilterValue>(getDefaultPeriodValue("today"));\n  const [selectedCos, setSelectedCos] = useState<number[]>([]); // empty = all\n  const [voucherType, setVoucherType] = useState("all");\n  const [currency, setCurrency] = useState("all");\n  const [optionalFilter, setOptionalFilter] = useState("active");\n  const [includeFactory, setIncludeFactory] = useState(false);\n  const [searchInput, setSearchInput] = useState("");\n  const [search, setSearch] = useState("");\n  const [page, setPage] = useState(1);\n  const LIMIT = JOURNAL_PAGE_LIMIT;'''
          new='''  const { filters: journalFilters, page, setPage, setFilter, resetFilters, hasActiveFilters } =\n    usePaginatedFilterState<TransactionJournalFilters>({\n      createInitialFilters: createTransactionJournalFilters,\n      storageKey: "erp-transaction-journal-filters-v1",\n    });\n  const { periodFilter, selectedCos, voucherType, currency, optionalFilter, includeFactory, searchInput, search } = journalFilters;\n  const setPeriodFilter = (value: PeriodFilterValue | ((current: PeriodFilterValue) => PeriodFilterValue)) => setFilter("periodFilter", value);\n  const setSelectedCos = (value: number[] | ((current: number[]) => number[])) => setFilter("selectedCos", value);\n  const setVoucherType = (value: string) => setFilter("voucherType", value);\n  const setCurrency = (value: string) => setFilter("currency", value);\n  const setOptionalFilter = (value: string) => setFilter("optionalFilter", value);\n  const setIncludeFactory = (value: boolean | ((current: boolean) => boolean)) => setFilter("includeFactory", value);\n  const setSearchInput = (value: string) => setFilter("searchInput", value);\n  const setSearch = (value: string) => setFilter("search", value);\n  const LIMIT = JOURNAL_PAGE_LIMIT;'''
          if old not in s:
              raise SystemExit('TransactionJournal legacy filter state not found')
          s=s.replace(old,new)
          s=s.replace('    // filters\n    periodFilter,', '    // filters\n    journalFilters,\n    setFilter,\n    resetFilters,\n    hasActiveFilters,\n    periodFilter,')
          p.write_text(s)

          p=Path('client/src/pages/TransactionJournal.tsx')
          s=p.read_text()
          s=s.replace('import { JournalFilters } from "./transactionjournal/components/JournalFilters";\n', 'import { TransactionJournalFilterControls } from "./transactionjournal/components/TransactionJournalFilterControls";\n')
          s=s.replace('import { JournalSummaryCards, JournalTypeChips } from "./transactionjournal/components/JournalOverview";', 'import { JournalSummaryCards } from "./transactionjournal/components/JournalOverview";')
          s=s.replace('      <JournalFilters model={model} />\n      <JournalTypeChips model={model} />', '      <TransactionJournalFilterControls filters={model.journalFilters} availableCompanies={model.availableCompanies} voucherTypes={model.voucherTypes} setFilter={model.setFilter} resetFilters={model.resetFilters} hasActiveFilters={model.hasActiveFilters} />')
          p.write_text(s)
          PY

          for f in \
            client/src/pages/AccountsLegacy.tsx \
            client/src/pages/ContainerLoadingScan.tsx \
            client/src/pages/ContainerVerification.tsx \
            client/src/pages/TransactionJournal.tsx \
            client/src/pages/daybook/VoucherDetailsDialog.tsx \
            client/src/pages/factory/FactoryContainerLoadingScan.tsx \
            client/src/pages/factory/FactoryDaybook.tsx \
            client/src/pages/factory/FactoryPOS.tsx \
            client/src/pages/pos/POSImport.tsx \
            client/src/pages/pos/POSPriceList.tsx
          do
            lines=$(wc -l < "$f")
            echo "$f -> $lines lines"
            [ "$lines" -le 900 ] || { echo "Root remains over 900 lines: $f"; exit 1; }
          done

          npm ci
          npm run check
          node scripts/audit-god-file-boundaries.mjs
          git add -A
          git commit -m 'refactor: integrate and re-certify God Files Waves 7-12 [waves7-12-recert]'
          git push origin HEAD:agent/god-files-recovery-latest-main
