name: One-shot postgres regression repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/postgres-regression-isolate-879e5a8f
          fetch-depth: 0

      - name: Apply exact CI repairs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          allowance_path = Path('config/ci-ratchet-allowances.json')
          allowance = json.loads(allowance_path.read_text())
          route = 'DELETE /api/locations/:locationId [requireAuth > <anonymous>]'
          routes = allowance['routeManifestAdditions']
          if route not in routes:
              routes.append(route)
          allowance_path.write_text(json.dumps(allowance, indent=2) + '\n')

          god_file_doc = Path('docs/god-file-split-program.md')
          text = god_file_doc.read_text()
          old = '**Backlog: 49 files, 24,985 lines over the limit**'
          new = '**Backlog: 47 files, 24,565 lines over the limit**'
          if old not in text and new not in text:
              raise SystemExit('Expected god-file backlog line not found')
          god_file_doc.write_text(text.replace(old, new))

          quality_doc = Path('docs/system-quality-program.md')
          text = quality_doc.read_text()
          old = '| God-file backlog | 49 files, 24,985 excess lines |'
          new = '| God-file backlog | 47 files, 24,565 excess lines |'
          if old not in text and new not in text:
              raise SystemExit('Expected system-quality backlog row not found')
          quality_doc.write_text(text.replace(old, new))
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/ci-ratchet-allowances.json docs/god-file-split-program.md docs/system-quality-program.md
          git commit -m 'ci: apply postgres regression repairs'
          git push origin HEAD:agent/postgres-regression-isolate-879e5a8f
