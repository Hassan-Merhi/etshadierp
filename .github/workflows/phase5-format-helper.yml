name: Phase 5 formatting helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts
      - name: Format Phase 5 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/RemoteControlSessionWatchdog.tsx \
            client/src/components/RemoteControllerSessionContext.tsx \
            client/src/components/RemoteKeyboardControllerOverlay.tsx \
            client/src/components/RemoteMouseControllerOverlay.tsx \
            client/src/components/remote-control-panel-portal.ts \
            client/src/hooks/screen-feed-capture-engine.ts \
            client/src/hooks/use-presence.ts \
            client/src/hooks/use-remote-control-session.ts \
            client/src/hooks/use-screen-feed.ts \
            client/src/pages/settings/RemoteSupportWatchDialog.tsx \
            server/routes/remoteControllerTargetRoute.ts \
            server/routes/screenFeedRoutes.ts \
            server/services/screenFeedService.ts \
            tests/screen-feed-fast-transport-current-main.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/RemoteControlSessionWatchdog.tsx \
            client/src/components/RemoteControllerSessionContext.tsx \
            client/src/components/RemoteKeyboardControllerOverlay.tsx \
            client/src/components/RemoteMouseControllerOverlay.tsx \
            client/src/components/remote-control-panel-portal.ts \
            client/src/hooks/screen-feed-capture-engine.ts \
            client/src/hooks/use-presence.ts \
            client/src/hooks/use-remote-control-session.ts \
            client/src/hooks/use-screen-feed.ts \
            client/src/pages/settings/RemoteSupportWatchDialog.tsx \
            server/routes/remoteControllerTargetRoute.ts \
            server/routes/screenFeedRoutes.ts \
            server/services/screenFeedService.ts \
            tests/screen-feed-fast-transport-current-main.test.ts
          git commit -m "phase 5 apply Prettier to remote support changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
