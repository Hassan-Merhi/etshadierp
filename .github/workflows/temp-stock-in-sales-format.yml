name: Temporary Stock Flow Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/stock-in-sales-phase-1-inventory-flow'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format stock flow files
        run: |
          npx prettier --write \
            client/src/pages/StockInSalesReport.tsx \
            client/src/pages/StockInSalesReportDetail.tsx \
            server/routes/stats/stockInSalesReportRoutes.ts \
            server/services/reports/stockInSalesComparisonService.ts \
            server/services/reports/stockInSalesOutboundBreakdown.ts \
            server/services/reports/stockInSalesReportService.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/StockInSalesReport.tsx \
            client/src/pages/StockInSalesReportDetail.tsx \
            server/routes/stats/stockInSalesReportRoutes.ts \
            server/services/reports/stockInSalesComparisonService.ts \
            server/services/reports/stockInSalesOutboundBreakdown.ts \
            server/services/reports/stockInSalesReportService.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Format stock flow report files'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
