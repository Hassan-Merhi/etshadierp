name: Phase 18 Phase 1 Landing Repair
on:
  push:
    branches: [agent/phase18-phase1-safe-macos-result]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-phase1-safe-macos-result
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Verify certified Phase 1 count
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/audit-type-escapes.mjs --json > /tmp/type-escapes-before.json
          set -e
          total=$(node -e "const r=require('/tmp/type-escapes-before.json');process.stdout.write(String(r.summary.typeEscapeTotal))")
          explicit=$(node -e "const r=require('/tmp/type-escapes-before.json');process.stdout.write(String(r.summary.explicitAny))")
          casts=$(node -e "const r=require('/tmp/type-escapes-before.json');process.stdout.write(String(r.summary.asAny))")
          suppressions=$(node -e "const r=require('/tmp/type-escapes-before.json');process.stdout.write(String(r.summary.suppressions))")
          test "$total" = "3297"
          test "$explicit" = "3207"
          test "$casts" = "88"
          test "$suppressions" = "2"
      - name: Lock Phase 1 gains into type-escape ratchet
        run: |
          UPDATE_TYPE_ESCAPE_BASELINE=1 node scripts/audit-type-escapes.mjs
          npm run audit:type-escapes
      - name: Verify static gates and compiler
        run: |
          npm run audit:scripts
          npm run check
      - name: Verify formatting
        run: |
          npx prettier --write \
            server/services/rental/rentalPaymentPostingService.ts \
            server/storage/containers-store/containers.ts \
            server/storage/factory/production.ts \
            server/storage/stock-ops/item-history.ts \
            server/storage/stock-ops/transfers-create.ts \
            server/storage/stock-ops/transfers-update.ts \
            config/type-escape-boundaries.json
      - name: Commit ratchet baseline and remove temporary repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase18-phase1-format-fix.yml
          git add config/type-escape-boundaries.json \
            server/services/rental/rentalPaymentPostingService.ts \
            server/storage/containers-store/containers.ts \
            server/storage/factory/production.ts \
            server/storage/stock-ops/item-history.ts \
            server/storage/stock-ops/transfers-create.ts \
            server/storage/stock-ops/transfers-update.ts
          git commit -m 'ci: lock certified Phase 1 type-escape baseline'
          git push origin HEAD:agent/phase18-phase1-safe-macos-result
# retrigger landing repair 2026-08-18T18:23Z
