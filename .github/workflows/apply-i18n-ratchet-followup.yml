name: Apply i18n ratchet follow-up

on:
  push:
    branches:
      - fix/supplier-partner-equity-loan-net-position-v2

permissions:
  contents: write

jobs:
  apply-i18n:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-partner-equity-loan-net-position-v2
          fetch-depth: 0
      - name: Register translations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/i18n/phase3RemainingTranslations.part24.ts')
          s = p.read_text()
          anchor = 'export const phase3RemainingTranslationsPart24: readonly Phase3SharedUiEntry[] = [\n'
          entries = '''  { en: "Partner Equity", ar: "حقوق ملكية الشركاء", fr: "Capitaux propres des partenaires" },
          {
            en: "PO Import company scope does not match the active company.",
            ar: "نطاق شركة استيراد أمر الشراء لا يطابق الشركة النشطة.",
            fr: "Le périmètre de société de l’importation du bon de commande ne correspond pas à la société active.",
          },
          {
            en: "Upload company scope does not match the active company.",
            ar: "نطاق شركة الرفع لا يطابق الشركة النشطة.",
            fr: "Le périmètre de société du téléversement ne correspond pas à la société active.",
          },
          '''
          if 'en: "Partner Equity"' in s:
              raise SystemExit('Partner Equity translation already exists')
          if anchor not in s:
              raise SystemExit('translation array anchor not found')
          p.write_text(s.replace(anchor, anchor + entries, 1))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-i18n-ratchet-followup.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: register supplier net position follow-up strings"
          git push origin HEAD:fix/supplier-partner-equity-loan-net-position-v2
