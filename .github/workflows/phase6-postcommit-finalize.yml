name: Phase 6 Post-Commit Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Harden post-commit reporting
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("server/services/factory/postOffloadPhase6Safety.ts")
          service = service_path.read_text()
          service = service.replace(
              "post_offload_phase6_applied_and_verified",
              "post_offload_phase6_applied",
          )
          old_verification = '''  const readiness = await inspectPostOffloadPhase6Readiness({
            companyId: params.companyId,
            supplierIds: payload.supplierIds,
          });

          return {'''
          new_verification = '''  let readiness: PostOffloadPhase6Readiness;
          try {
            readiness = await inspectPostOffloadPhase6Readiness({
              companyId: params.companyId,
              supplierIds: payload.supplierIds,
            });
          } catch (error) {
            throw Object.assign(
              new Error(
                `Phase 6 repair committed with undo log ${undoLogId}, but post-commit verification failed: ${
                  error instanceof Error ? error.message : String(error)
                }`
              ),
              {
                code: "POST_OFFLOAD_PHASE6_POST_COMMIT_VERIFICATION_FAILED",
                repairCommitted: true,
                undoLogId,
                applied,
                cause: error,
              }
            );
          }

          return {'''
          if old_verification not in service:
              raise SystemExit("Post-commit verification block not found")
          service = service.replace(old_verification, new_verification)
          service_path.write_text(service)

          route_path = Path("server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts")
          route = route_path.read_text()
          route = route.replace(
              '''  dryRun: boolean;
          }): Promise<void> {''',
              '''  dryRun: boolean;
            repairCommitted: boolean;
            undoLogId: number | null;
          }): Promise<void> {''',
          )
          route = route.replace(
              '''        dryRun: params.dryRun,
                httpStatus: params.httpStatus,''',
              '''        dryRun: params.dryRun,
                repairCommitted: params.repairCommitted,
                undoLogId: params.undoLogId,
                httpStatus: params.httpStatus,''',
          )
          route = route.replace(
              '''      await auditFailure({ context, error, httpStatus: status, dryRun: true });''',
              '''      await auditFailure({
                context,
                error,
                httpStatus: status,
                dryRun: true,
                repairCommitted: false,
                undoLogId: null,
              });''',
          )
          route = route.replace(
              '''    const confirmationToken = req.body?.confirmationToken;
            const isDryRun = req.body?.dryRun === true || !confirmationToken;

            try {''',
              '''    const confirmationToken = req.body?.confirmationToken;
            const isDryRun = req.body?.dryRun === true || !confirmationToken;
            let repairCommitted = false;
            let committedUndoLogId: number | null = null;

            try {''',
          )
          route = route.replace(
              '''      const result = await applyPostOffloadPhase6Repair({
                companyId: context.companyId,
                userId: context.userId,
                username: context.username,
                confirmationToken,
              });
              await persistPostOffloadPhase6Audit({''',
              '''      const result = await applyPostOffloadPhase6Repair({
                companyId: context.companyId,
                userId: context.userId,
                username: context.username,
                confirmationToken,
              });
              repairCommitted = true;
              committedUndoLogId = result.undoLogId;
              await persistPostOffloadPhase6Audit({''',
          )
          old_catch = '''    } catch (error: unknown) {
              const status = phase6ErrorStatus(error);
              await auditFailure({ context, error, httpStatus: status, dryRun: isDryRun });
              logger.error("Post-offload Phase 6 repair rejected or failed", {
                error,
                companyId: context.companyId,
                userId: context.userId,
                status,
                dryRun: isDryRun,
              });
              return res.status(status).json({
                success: false,
                repairCommitted: false,
                noPartialChanges: true,
                message: getErrorMessage(error) || "Post-offload Phase 6 repair failed.",
                code: (error as { code?: string }).code || "POST_OFFLOAD_PHASE6_REPAIR_FAILED",
              });
            }'''
          new_catch = '''    } catch (error: unknown) {
              const status = phase6ErrorStatus(error);
              const errorState = error as {
                code?: string;
                repairCommitted?: boolean;
                undoLogId?: number;
                applied?: unknown;
              };
              const repairWasCommitted = repairCommitted || errorState.repairCommitted === true;
              const undoLogId = committedUndoLogId ?? errorState.undoLogId ?? null;
              await auditFailure({
                context,
                error,
                httpStatus: status,
                dryRun: isDryRun,
                repairCommitted: repairWasCommitted,
                undoLogId,
              });
              logger.error("Post-offload Phase 6 repair rejected or failed", {
                error,
                companyId: context.companyId,
                userId: context.userId,
                status,
                dryRun: isDryRun,
                repairCommitted: repairWasCommitted,
                undoLogId,
              });
              return res.status(status).json({
                success: false,
                repairCommitted: repairWasCommitted,
                transactionRolledBack: !repairWasCommitted,
                partialChanges: false,
                undoLogId,
                applied: errorState.applied ?? null,
                message: getErrorMessage(error) || "Post-offload Phase 6 repair failed.",
                code: errorState.code || "POST_OFFLOAD_PHASE6_REPAIR_FAILED",
              });
            }'''
          if old_catch not in route:
              raise SystemExit("Route error boundary not found")
          route = route.replace(old_catch, new_catch)
          route_path.write_text(route)

          test_path = Path("tests/factory-post-offload-phase6-safety-repair.test.ts")
          test = test_path.read_text()
          test = test.replace(
              '''    expect(routes).toContain("repairCommitted: false");
              expect(routes).toContain("noPartialChanges: true");''',
              '''    expect(routes).toContain("repairWasCommitted");
              expect(routes).toContain("transactionRolledBack: !repairWasCommitted");
              expect(routes).toContain("partialChanges: false");
              expect(routes).toContain("undoLogId");''',
          )
          test = test.replace(
              'expect(service).toContain("post_offload_phase6_applied_and_verified");',
              'expect(service).toContain("post_offload_phase6_applied");',
          )
          test = test.replace(
              '''    expect(exactApply).toContain('await client.query("ROLLBACK")');''',
              '''    expect(exactApply).toContain('await client.query("ROLLBACK")');
              expect(service).toContain("POST_OFFLOAD_PHASE6_POST_COMMIT_VERIFICATION_FAILED");
              expect(service).toContain("repairCommitted: true");''',
          )
          test_path.write_text(test)
          PY

      - name: Format files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/factory/postOffloadPhase6Safety.ts \
            server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts \
            tests/factory-post-offload-phase6-safety-repair.test.ts

      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/factory/postOffloadPhase6Safety.ts \
            server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts \
            tests/factory-post-offload-phase6-safety-repair.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Phase 6: report post-commit verification failures truthfully"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Type-check
        run: npm run check
