name: Phase 6 Post-Commit Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Harden post-commit reporting
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          service_path = Path("server/services/factory/postOffloadPhase6Safety.ts")
          service = service_path.read_text()
          service = service.replace(
              "post_offload_phase6_applied_and_verified",
              "post_offload_phase6_applied",
          )
          verification_pattern = re.compile(
              r"  const readiness = await inspectPostOffloadPhase6Readiness\(\{\n"
              r"    companyId: params\.companyId,\n"
              r"    supplierIds: payload\.supplierIds,\n"
              r"  \}\);\n\n"
              r"  return \{"
          )
          verification_replacement = '''  let readiness: PostOffloadPhase6Readiness;
          try {
            readiness = await inspectPostOffloadPhase6Readiness({
              companyId: params.companyId,
              supplierIds: payload.supplierIds,
            });
          } catch (error) {
            throw Object.assign(
              new Error(
                `Phase 6 repair committed with undo log ${undoLogId}, but post-commit verification failed: ${
                  error instanceof Error ? error.message : String(error)
                }`
              ),
              {
                code: "POST_OFFLOAD_PHASE6_POST_COMMIT_VERIFICATION_FAILED",
                repairCommitted: true,
                undoLogId,
                applied,
                cause: error,
              }
            );
          }

          return {'''
          service, replacements = verification_pattern.subn(verification_replacement, service, count=1)
          if replacements != 1:
              raise SystemExit(f"Expected one post-commit verification block, found {replacements}")
          service_path.write_text(service)

          route_path = Path("server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts")
          route = route_path.read_text()
          signature_old = "  dryRun: boolean;\n}): Promise<void> {"
          signature_new = "  dryRun: boolean;\n  repairCommitted: boolean;\n  undoLogId: number | null;\n}): Promise<void> {"
          if signature_old not in route:
              raise SystemExit("Audit failure signature not found")
          route = route.replace(signature_old, signature_new, 1)

          details_old = "        dryRun: params.dryRun,\n        httpStatus: params.httpStatus,"
          details_new = (
              "        dryRun: params.dryRun,\n"
              "        repairCommitted: params.repairCommitted,\n"
              "        undoLogId: params.undoLogId,\n"
              "        httpStatus: params.httpStatus,"
          )
          if details_old not in route:
              raise SystemExit("Failure audit details marker not found")
          route = route.replace(details_old, details_new, 1)

          readiness_old = "      await auditFailure({ context, error, httpStatus: status, dryRun: true });"
          readiness_new = '''      await auditFailure({
            context,
            error,
            httpStatus: status,
            dryRun: true,
            repairCommitted: false,
            undoLogId: null,
          });'''
          if readiness_old not in route:
              raise SystemExit("Readiness failure audit call not found")
          route = route.replace(readiness_old, readiness_new, 1)

          state_old = '''    const confirmationToken = req.body?.confirmationToken;
          const isDryRun = req.body?.dryRun === true || !confirmationToken;

          try {'''
          state_new = '''    const confirmationToken = req.body?.confirmationToken;
          const isDryRun = req.body?.dryRun === true || !confirmationToken;
          let repairCommitted = false;
          let committedUndoLogId: number | null = null;

          try {'''
          if state_old not in route:
              raise SystemExit("Repair state marker not found")
          route = route.replace(state_old, state_new, 1)

          apply_start = route.find("      const result = await applyPostOffloadPhase6Repair({")
          if apply_start < 0:
              raise SystemExit("Apply start not found")
          audit_start = route.find("      await persistPostOffloadPhase6Audit({", apply_start)
          if audit_start < 0:
              raise SystemExit("Post-apply audit start not found")
          route = (
              route[:audit_start]
              + "      repairCommitted = true;\n"
              + "      committedUndoLogId = result.undoLogId;\n"
              + route[audit_start:]
          )

          catch_start = route.rfind('    } catch (error: unknown) {')
          if catch_start < 0:
              raise SystemExit("Repair catch boundary not found")
          catch_end_marker = '\n    }\n  });'
          catch_end = route.find(catch_end_marker, catch_start)
          if catch_end < 0:
              raise SystemExit("Repair catch end not found")
          catch_end += len('\n    }')
          new_catch = '''    } catch (error: unknown) {
            const status = phase6ErrorStatus(error);
            const errorState = error as {
              code?: string;
              repairCommitted?: boolean;
              undoLogId?: number;
              applied?: unknown;
            };
            const repairWasCommitted = repairCommitted || errorState.repairCommitted === true;
            const undoLogId = committedUndoLogId ?? errorState.undoLogId ?? null;
            await auditFailure({
              context,
              error,
              httpStatus: status,
              dryRun: isDryRun,
              repairCommitted: repairWasCommitted,
              undoLogId,
            });
            logger.error("Post-offload Phase 6 repair rejected or failed", {
              error,
              companyId: context.companyId,
              userId: context.userId,
              status,
              dryRun: isDryRun,
              repairCommitted: repairWasCommitted,
              undoLogId,
            });
            return res.status(status).json({
              success: false,
              repairCommitted: repairWasCommitted,
              transactionRolledBack: !repairWasCommitted,
              partialChanges: false,
              undoLogId,
              applied: errorState.applied ?? null,
              message: getErrorMessage(error) || "Post-offload Phase 6 repair failed.",
              code: errorState.code || "POST_OFFLOAD_PHASE6_REPAIR_FAILED",
            });
          }'''
          route = route[:catch_start] + new_catch + route[catch_end:]
          route_path.write_text(route)

          test_path = Path("tests/factory-post-offload-phase6-safety-repair.test.ts")
          test = test_path.read_text()
          test = test.replace(
              '''    expect(routes).toContain("repairCommitted: false");
            expect(routes).toContain("noPartialChanges: true");''',
              '''    expect(routes).toContain("repairWasCommitted");
            expect(routes).toContain("transactionRolledBack: !repairWasCommitted");
            expect(routes).toContain("partialChanges: false");
            expect(routes).toContain("undoLogId");''',
          )
          test = test.replace(
              'expect(service).toContain("post_offload_phase6_applied_and_verified");',
              'expect(service).toContain("post_offload_phase6_applied");',
          )
          rollback_assertion = '''    expect(exactApply).toContain('await client.query("ROLLBACK")');'''
          if "POST_OFFLOAD_PHASE6_POST_COMMIT_VERIFICATION_FAILED" not in test:
              if rollback_assertion not in test:
                  raise SystemExit("Rollback test assertion not found")
              test = test.replace(
                  rollback_assertion,
                  rollback_assertion
                  + '''
            expect(service).toContain("POST_OFFLOAD_PHASE6_POST_COMMIT_VERIFICATION_FAILED");
            expect(service).toContain("repairCommitted: true");''',
              )
          test_path.write_text(test)
          PY

      - name: Format files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/factory/postOffloadPhase6Safety.ts \
            server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts \
            tests/factory-post-offload-phase6-safety-repair.test.ts

      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/factory/postOffloadPhase6Safety.ts \
            server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts \
            tests/factory-post-offload-phase6-safety-repair.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Phase 6: report post-commit verification failures truthfully"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Type-check
        run: npm run check
