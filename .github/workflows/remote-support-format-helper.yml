name: Remote support format helper

on:
  push:
    branches:
      - agent/remote-support-phase-1-safety-foundation

concurrency:
  group: remote-support-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format remote support sources
        run: npx prettier --write server/routes/screenFeedRoutes.ts server/services/remoteSupportRuntime.ts

      - name: Upload formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: remote-support-formatted-sources
          path: |
            server/routes/screenFeedRoutes.ts
            server/services/remoteSupportRuntime.ts
          if-no-files-found: error
          retention-days: 1
