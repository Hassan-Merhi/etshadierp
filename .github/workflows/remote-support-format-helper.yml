name: Remote support format helper

on:
  push:
    branches:
      - agent/remote-support-phase-1-safety-foundation

permissions:
  contents: write

concurrency:
  group: remote-support-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-1-safety-foundation

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format remote support sources
        run: npx prettier --write server/routes/screenFeedRoutes.ts server/services/remoteSupportRuntime.ts

      - name: Commit formatted sources
        run: |
          if git diff --quiet -- server/routes/screenFeedRoutes.ts server/services/remoteSupportRuntime.ts; then
            echo "Sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/screenFeedRoutes.ts server/services/remoteSupportRuntime.ts
          git commit -m "style(remote-support): apply Prettier"
          git push origin HEAD:agent/remote-support-phase-1-safety-foundation
