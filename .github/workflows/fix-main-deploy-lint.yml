name: Fix main deploy lint blocker

on:
  push:
    branches:
      - fix/unblock-main-net-position-deploy
    paths:
      - .github/workflows/fix-main-deploy-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unblock-main-net-position-deploy
      - name: Fix filename regex warnings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/sp/SpReports.tsx")
          lines = path.read_text().splitlines()
          count = 0
          for index, line in enumerate(lines):
              if "const match = disposition.match(" in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = indent + 'const match = disposition.match(/filename="?([^"]+)"?/);'
                  count += 1
          if count != 2:
              raise SystemExit(f"Expected 2 filename regex lines, found {count}")
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-main-deploy-lint.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/sp/SpReports.tsx .github/workflows/fix-main-deploy-lint.yml
          git commit -m "fix: remove SP report regex lint warnings"
          git push origin HEAD:fix/unblock-main-net-position-deploy
