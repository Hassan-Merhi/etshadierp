name: Apply stock transfer revision save fix

on:
  push:
    branches:
      - agent/fix-stock-transfer-revision-save-flow

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stock-transfer-revision-save-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source patch
        run: node scripts/apply-stock-transfer-revision-save-fix.cjs
      - name: Remove one-time patch files
        run: |
          rm scripts/apply-stock-transfer-revision-save-fix.cjs
          rm .github/workflows/apply-stock-transfer-revision-save-fix.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/vouchers/StockTransferForm.tsx \
            server/routes/vouchers/immutableStockTransferRevisionRoutes.ts \
            server/services/immutableStockTransferRevisionLifecycle.ts \
            scripts/apply-stock-transfer-revision-save-fix.cjs \
            .github/workflows/apply-stock-transfer-revision-save-fix.yml
          git commit -m "fix: persist stock transfer revisions after update"
          git push origin HEAD:agent/fix-stock-transfer-revision-save-flow
