name: God Files Wave 5 Delta

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  delta:
    if: github.event.pull_request.head.ref == 'agent/god-files-recovery-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-main
          fetch-depth: 0
      - name: Print exact newer-main Wave 5 deltas
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE=4e2eb176ddfb141c3d1407e0a61cd6cdf3823da4
          for f in \
            client/src/components/StockItemDetailsDialog.tsx \
            client/src/pages/factory/FactoryLocationInventory.tsx \
            client/src/pages/StockItems.tsx \
            client/src/pages/StockEntryHistory.tsx
          do
            echo "===== $f ====="
            git diff --unified=2 "$BASE" origin/main -- "$f" || true
          done
