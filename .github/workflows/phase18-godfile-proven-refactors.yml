name: Phase 18 Proven God-file Refactors

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  refactor:
    if: contains(github.event.head_commit.message, '[phase18-godfile-proven]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Apply current-compatible proven extractions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for c in 2bc3ca8a1ad9209cf3369e3221ca04733f29abd3 9828aea61e67a603276f5a23d02c019e205c8253; do
            set +e
            git cherry-pick "$c"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "CHERRY_PICK_FAILED=$c"
              git cherry-pick --abort
            fi
          done
      - run: npm ci
      - name: Verify architecture-safe result
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx vitest run tests/god-file-boundaries.test.ts tests/ui/god-files-wave13-import-contract.test.ts --pool=forks --maxWorkers=2
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
