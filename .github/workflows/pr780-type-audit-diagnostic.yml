name: PR 780 Type Audit Diagnostic

on:
  push:
    branches:
      - agent/god-files-recovery-latest-main
    paths:
      - .github/workflows/pr780-type-audit-diagnostic.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/god-files-recovery-latest-main
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - name: Capture exact type audit
        shell: bash
        run: |
          node scripts/audit-type-escapes.mjs --json > .github/pr780-type-audit.json || true
      - name: Publish diagnostic and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr780-type-audit-diagnostic.yml
          git add .github/pr780-type-audit.json
          git commit -m "chore: capture PR 780 type audit [skip ci]"
          git push origin HEAD:agent/god-files-recovery-latest-main
