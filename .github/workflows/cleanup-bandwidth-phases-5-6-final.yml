name: Final cleanup bandwidth phases 5-6

on:
  push:
    branches:
      - agent/bandwidth-phases-5-6

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bandwidth-phases-5-6
          fetch-depth: 0
      - run: python scripts/cleanup-bandwidth-phases-5-6-final.py
      - run: |
          rm -f scripts/cleanup-bandwidth-phases-5-6-final.py
          rm -f .github/workflows/cleanup-bandwidth-phases-5-6-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete Phase 5-6 query props"
          git push origin HEAD:agent/bandwidth-phases-5-6
