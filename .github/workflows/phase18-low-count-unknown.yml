name: Phase 18 Low-count Unknown Harvest
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[phase18-low-count-unknown]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Replace compiler-safe low-count any occurrences
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          cat > .phase18-low-count.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path');
          const root=process.cwd();
          const configPath=ts.findConfigFile(root,ts.sys.fileExists,'tsconfig.json');
          const cf=ts.readConfigFile(configPath,ts.sys.readFile);
          const parsed=ts.parseJsonConfigFileContent(cf.config,ts.sys,path.dirname(configPath));
          const candidates=[];
          function rel(f){return path.relative(root,f).replaceAll('\\','/')}
          function anyPos(file,text){const sf=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),out=[];const v=n=>{if(n.kind===ts.SyntaxKind.AnyKeyword)out.push({start:n.getStart(sf),end:n.end});ts.forEachChild(n,v)};v(sf);return out}
          for(const file of parsed.fileNames){const r=rel(file);if(!/^(client\/src|server|shared)\//.test(r)||!fs.existsSync(file)||r.endsWith('.d.ts'))continue;const text=fs.readFileSync(file,'utf8'),pos=anyPos(file,text);if(pos.length>=1&&pos.length<=3)candidates.push({file,r,text,pos})}
          console.log('LOW_COUNT_CANDIDATE_FILES='+candidates.length);
          const state=new Map(parsed.fileNames.filter(fs.existsSync).map(f=>[path.resolve(f),{text:fs.readFileSync(f,'utf8'),version:0}]));
          const host={getCompilationSettings:()=>parsed.options,getScriptFileNames:()=>parsed.fileNames,getScriptVersion:f=>String(state.get(path.resolve(f))?.version??0),getScriptSnapshot:f=>{const e=state.get(path.resolve(f));if(e)return ts.ScriptSnapshot.fromString(e.text);if(!fs.existsSync(f))return;return ts.ScriptSnapshot.fromString(fs.readFileSync(f,'utf8'))},getCurrentDirectory:()=>root,getDefaultLibFileName:o=>ts.getDefaultLibFilePath(o),fileExists:ts.sys.fileExists,readFile:ts.sys.readFile,readDirectory:ts.sys.readDirectory,directoryExists:ts.sys.directoryExists,getDirectories:ts.sys.getDirectories,realpath:ts.sys.realpath};
          const ls=ts.createLanguageService(host,ts.createDocumentRegistry());
          function set(file,text){const k=path.resolve(file),e=state.get(k)||{text:fs.readFileSync(file,'utf8'),version:0};e.text=text;e.version++;state.set(k,e)}
          function apply(text,positions){for(const p of [...positions].sort((a,b)=>b.start-a.start))text=text.slice(0,p.start)+'unknown'+text.slice(p.end);return text}
          let accepted=0,files=0;
          for(const c of candidates){let keep=[];
            for(const p of c.pos){const trial=apply(c.text,[...keep,p]);set(c.file,trial);const d=[...ls.getSyntacticDiagnostics(c.file),...ls.getSemanticDiagnostics(c.file)];if(d.length===0)keep.push(p);else set(c.file,apply(c.text,keep));}
            if(!keep.length){set(c.file,c.text);continue}
            const out=apply(c.text,keep);set(c.file,out);const d=[...ls.getSyntacticDiagnostics(c.file),...ls.getSemanticDiagnostics(c.file)];if(d.length===0){fs.writeFileSync(c.file,out);accepted+=keep.length;files++;console.log(`ACCEPT ${c.r} ${keep.length}/${c.pos.length}`)}else set(c.file,c.text)
          }
          console.log(`LOW_COUNT_ACCEPTED=${accepted} FILES=${files}`);
          NODE
          node .phase18-low-count.cjs
          rm -f .phase18-low-count.cjs
          git diff --name-only -- '*.ts' '*.tsx' > /tmp/low-count-files
          echo "CHANGED_FILES=$(wc -l </tmp/low-count-files | tr -d ' ')"
          if [ ! -s /tmp/low-count-files ]; then exit 0; fi
      - name: Full compiler gate with conservative rollback
        shell: bash
        run: |
          set -euo pipefail
          green=0
          for attempt in $(seq 1 12); do
            set +e; npm run check >/tmp/low-count-check 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then green=1; echo "FULL_GREEN_ATTEMPT=$attempt"; break; fi
            mapfile -t errs < <(sed -nE 's#^(.+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/low-count-check | sort -u)
            reverted=0
            for f in "${errs[@]}"; do if git diff --name-only | grep -Fxq "$f"; then git restore --source=HEAD --worktree -- "$f"; reverted=$((reverted+1)); fi; done
            echo "ROLLBACK=$attempt ERROR_FILES=${#errs[@]} REVERTED=$reverted"
            if [ "$reverted" -eq 0 ]; then git reset --hard HEAD; exit 0; fi
            git diff --name-only -- '*.ts' '*.tsx' > /tmp/low-count-files
            [ -s /tmp/low-count-files ] || { git reset --hard HEAD; exit 0; }
          done
          [ "$green" = 1 ] || { git reset --hard HEAD; exit 0; }
      - name: Require real debt reduction and push
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/after.json
          set -e
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/after.json','utf8'));
          console.log('AFTER_TYPE_ESCAPES='+r.summary.typeEscapeTotal);
          if(r.summary.typeEscapeTotal>=3508) process.exit(1);
          NODE
          git add client/src server shared
          git commit -m 'refactor: replace compiler-safe low-count any sites with unknown [phase18-low-count] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
