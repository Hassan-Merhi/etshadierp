name: God Files Wave 2 Publisher v3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  publish:
    if: github.event.pull_request.base.ref == 'agent/god-files-final-wave1-tests' && github.event.pull_request.head.ref == 'tmp/god-files-wave2-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Reuse verified Wave 2 transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/god-files-wave2-publisher-v2.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/wave2-transform.js').write_text(body)
          PY
          node /tmp/wave2-transform.js
      - name: Extract Status Builder view toggle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const page = 'client/src/pages/factory/FactoryStatusBuilder.tsx';
          const component = 'client/src/pages/factory/factorystatusbuilder/components/StatusViewToggle.tsx';
          let src = fs.readFileSync(page, 'utf8');
          const importAnchor = 'import {DeleteConfirmationDialog} from "./factorystatusbuilder/components/DeleteConfirmationDialog";';
          if (!src.includes(importAnchor)) throw new Error('Status component import anchor missing');
          src = src.replace(importAnchor, importAnchor + '\nimport {StatusViewToggle} from "./factorystatusbuilder/components/StatusViewToggle";');
          src = src.replace(', History as HistoryIcon', '');
          const startMarker = '        {/* Sheet / History toggle */}';
          const endMarker = '        {/* Tabs */}';
          const start = src.indexOf(startMarker);
          const end = src.indexOf(endMarker, start);
          if (start < 0 || end < 0 || end <= start) throw new Error('Status view-toggle block missing');
          const usage = `        <StatusViewToggle viewMode={viewMode} onChange={setViewMode} />\n\n`;
          src = src.slice(0, start) + usage + src.slice(end);
          fs.writeFileSync(page, src);
          fs.mkdirSync(path.dirname(component), {recursive:true});
          fs.writeFileSync(component, `import { History as HistoryIcon, LayoutGrid } from "lucide-react";\n\ninterface StatusViewToggleProps {\n  viewMode: "sheet" | "history";\n  onChange: (mode: "sheet" | "history") => void;\n}\n\nexport function StatusViewToggle({ viewMode, onChange }: StatusViewToggleProps) {\n  return (\n    <div className="flex items-center gap-2 px-4 py-2 border-b bg-muted/20">\n      <div className="flex items-center rounded-md border overflow-hidden shrink-0">\n        <button\n          onClick={() => onChange("sheet")}\n          data-testid="sb-button-view-sheet"\n          className={\`flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium transition-colors \${\n            viewMode === "sheet" ? "bg-primary text-primary-foreground" : "text-muted-foreground hover:bg-muted"\n          }\`}\n        >\n          <LayoutGrid className="h-3.5 w-3.5" />\n          Sheet\n        </button>\n        <button\n          onClick={() => onChange("history")}\n          data-testid="sb-button-view-history"\n          className={\`flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium transition-colors \${\n            viewMode === "history" ? "bg-primary text-primary-foreground" : "text-muted-foreground hover:bg-muted"\n          }\`}\n        >\n          <HistoryIcon className="h-3.5 w-3.5" />\n          History\n        </button>\n      </div>\n    </div>\n  );\n}\n`);
          NODE
      - name: Format and fully certify Wave 2
        shell: bash
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/FactoryDispatchBatchDetail.tsx \
            client/src/pages/factory/factorydispatchbatchdetail/types.ts \
            client/src/pages/factory/FactoryShippingContainers.tsx \
            client/src/pages/factory/factoryshippingcontainers/hooks/useShippingColumnVisibility.ts \
            client/src/pages/factory/WipersReEntry.tsx \
            client/src/pages/factory/wipersreentry/printUtils.ts \
            client/src/pages/factory/FactoryStatusBuilder.tsx \
            client/src/pages/factory/factorystatusbuilder/types.ts \
            client/src/pages/factory/factorystatusbuilder/components/StatusHistoryPanel.tsx \
            client/src/pages/factory/factorystatusbuilder/components/DeleteConfirmationDialog.tsx \
            client/src/pages/factory/factorystatusbuilder/components/StatusViewToggle.tsx \
            config/god-file-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md
          for file in \
            client/src/pages/factory/FactoryDispatchBatchDetail.tsx \
            client/src/pages/factory/FactoryShippingContainers.tsx \
            client/src/pages/factory/WipersReEntry.tsx \
            client/src/pages/factory/FactoryStatusBuilder.tsx; do
            count=$(wc -l < "$file")
            echo "$file: $count lines"
            test "$count" -le 900
          done
          npm run audit:god-files
          npm run audit:doc-index
          npm run check
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/pages/factory/FactoryDispatchBatchDetail.tsx \
            client/src/pages/factory/FactoryShippingContainers.tsx \
            client/src/pages/factory/WipersReEntry.tsx \
            client/src/pages/factory/FactoryStatusBuilder.tsx \
            client/src/pages/factory/factorystatusbuilder/components/StatusViewToggle.tsx
      - name: Publish cumulative Wave 2 branch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/god-files-wave2-publisher.yml \
            .github/workflows/god-files-wave2-publisher-v2.yml \
            .github/workflows/god-files-wave2-publisher-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(god-files): complete cumulative Wave 2 factory UI splits'
          git push origin HEAD:agent/god-files-final-wave1-tests
          git push origin --delete tmp/god-files-wave2-trigger || true
