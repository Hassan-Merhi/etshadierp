name: Cleanup bandwidth phases 5-6

on:
  push:
    branches:
      - agent/bandwidth-phases-5-6

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bandwidth-phases-5-6
          fetch-depth: 0
      - name: Apply compatibility cleanup
        run: python scripts/cleanup-bandwidth-phases-5-6.py
      - name: Remove temporary cleanup files
        run: |
          rm -f scripts/cleanup-bandwidth-phases-5-6.py
          rm -f .github/workflows/cleanup-bandwidth-phases-5-6.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Phase 5-6 compatibility and cache behavior"
          git push origin HEAD:agent/bandwidth-phases-5-6
