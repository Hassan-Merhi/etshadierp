name: Phase 18 Small God-file Refactors

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  refactor:
    if: contains(github.event.head_commit.message, '[phase18-small-godfiles]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Extract Daybook ordering and Supplier Profit query policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > client/src/pages/daybook/constants.ts <<'TS'
          export const VOUCHER_TYPE_ORDER: Readonly<Record<string, number>> = {
            Purchase: 0,
            PurchaseOrder: 1,
            Sales: 2,
            POS: 3,
            Payment: 4,
            Receipt: 5,
            Journal: 6,
            Contra: 7,
            StockTransfer: 8,
            "Stock Transfer": 8,
            "Credit Note": 9,
            "Debit Note": 10,
          };
          TS
          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/Daybook.tsx')
          s=p.read_text()
          anchor='import { usePaginatedDaybookVouchers } from "./daybook/usePaginatedDaybookVouchers";\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'import { VOUCHER_TYPE_ORDER } from "./daybook/constants";\n')
          start=s.index('const VOUCHER_TYPE_ORDER: Record<string, number> = {')
          end=s.index('\n\nexport default function Daybook', start)
          s=s[:start]+s[end+2:]
          p.write_text(s)

          p=Path('client/src/pages/supplierprofitcheck/utils.ts')
          s=p.read_text()
          if 'export function isSupplierProfitQueryEnabled' not in s:
            s += '''\n\nexport function isSupplierProfitQueryEnabled(\n  supplierId: string,\n  sourceType: "all" | "proforma" | "otw_containers",\n  proformaId: string,\n  otwContainerIds: readonly number[]\n): boolean {\n  return (\n    Boolean(supplierId) &&\n    (sourceType === "all" ||\n      (sourceType === "proforma" && Boolean(proformaId)) ||\n      (sourceType === "otw_containers" && otwContainerIds.length > 0))\n  );\n}\n'''
          p.write_text(s)

          p=Path('client/src/pages/SupplierProfitCheck.tsx')
          s=p.read_text()
          anchor='  loadColVisibility,\n} from "./supplierprofitcheck/utils";'
          assert anchor in s
          s=s.replace(anchor, '  loadColVisibility,\n  isSupplierProfitQueryEnabled,\n} from "./supplierprofitcheck/utils";')
          old='''  const queryEnabled =\n    !!supplierId &&\n    (sourceType === "all" ||\n      (sourceType === "proforma" && !!proformaId) ||\n      (sourceType === "otw_containers" && otwContainerIds.length > 0));'''
          assert old in s
          s=s.replace(old, '  const queryEnabled = isSupplierProfitQueryEnabled(supplierId, sourceType, proformaId, otwContainerIds);')
          p.write_text(s)
          PY
          npx prettier --write client/src/pages/Daybook.tsx client/src/pages/daybook/constants.ts client/src/pages/SupplierProfitCheck.tsx client/src/pages/supplierprofitcheck/utils.ts
      - name: Verify compiler and relevant architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          npm run audit:god-files >/tmp/god.log 2>&1
          rc=$?
          set -e
          cat /tmp/god.log
          if grep -Eq 'client/src/pages/(Daybook|SupplierProfitCheck)\.tsx' /tmp/god.log; then
            echo 'A refactored file remains over its Phase 18 boundary.' >&2
            exit 1
          fi
          echo "OTHER_GOD_FILE_FAILURES_REMAIN=$rc"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add client/src/pages/Daybook.tsx client/src/pages/daybook/constants.ts client/src/pages/SupplierProfitCheck.tsx client/src/pages/supplierprofitcheck/utils.ts
          git commit -m 'refactor: split Daybook and supplier-profit page policies [phase18-godfiles] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
