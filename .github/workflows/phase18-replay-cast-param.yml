name: Phase 18 Replay Cast and Parameter Types
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  replay:
    if: contains(github.event.head_commit.message, '[phase18-replay-cast-param]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Capture strict baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-before.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-before.json
          set -e
      - name: Replay proven source commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/phase18-cast-granular-result agent/phase18-param-fast-v2-result
          apply_one() {
            sha="$1"
            echo "REPLAY=$sha"
            set +e
            git cherry-pick -X ours "$sha"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then return 0; fi
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            if [ -n "$conflicts" ]; then
              while IFS= read -r f; do [ -n "$f" ] || continue; git checkout --ours -- "$f"; git add "$f"; done <<< "$conflicts"
              if GIT_EDITOR=true git cherry-pick --continue; then return 0; fi
            fi
            if git diff --cached --quiet && git diff --quiet; then git cherry-pick --skip || true; return 0; fi
            git cherry-pick --abort || true
            echo "SKIPPED=$sha"
          }
          apply_one 670989c46a1e9feed94ade030f1438cbf419e1c3
          apply_one 97b605aa6cd1a422e052d6384a3565bbd3050199
      - name: Require compiler green and strict debt reduction
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-after.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-after.json
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const tb=JSON.parse(fs.readFileSync('/tmp/type-before.json','utf8'));
          const ta=JSON.parse(fs.readFileSync('/tmp/type-after.json','utf8'));
          const c=p=>{const r=JSON.parse(fs.readFileSync(p,'utf8'));let warnings=0,any=0,errors=0;for(const f of r)for(const m of f.messages){if(m.severity===2)errors++;if(m.severity===1)warnings++;if(m.ruleId==='@typescript-eslint/no-explicit-any')any++;}return{warnings,any,errors}};
          const b=c('/tmp/lint-before.json'),a=c('/tmp/lint-after.json');
          console.log(`TYPE ${tb.summary.typeEscapeTotal} -> ${ta.summary.typeEscapeTotal}`);
          console.log('LINT '+JSON.stringify(b)+' -> '+JSON.stringify(a));
          if(a.errors!==0) process.exit(1);
          if(ta.summary.typeEscapeTotal>=tb.summary.typeEscapeTotal) process.exit(2);
          if(a.any>=b.any || a.warnings>b.warnings) process.exit(3);
          NODE
      - name: Rebase current main and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
