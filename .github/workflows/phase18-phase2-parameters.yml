name: Phase 18 Wave 2 Phase 2 Parameters
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144
concurrency:
  group: phase18-phase2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  parameters:
    if: github.event.pull_request.head.ref == 'agent/phase18-wave2-phase2-parameters'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-wave2-phase2-parameters
          fetch-depth: 0
      - name: Guard certified result
        id: guard
        shell: bash
        run: |
          if git log --format=%B -n 20 | grep -Fq '[phase18-phase2-result]' || [ ! -f scripts/phase18-phase2-usage-infer.cjs ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Exhaust compiler-green function parameter inference
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/before.json; set -e
          before=$(node -e "const r=require('/tmp/before.json');process.stdout.write(String(r.summary.typeEscapeTotal))")
          base=$(git rev-parse HEAD)
          node scripts/phase18-phase2-usage-infer.cjs
          if [ ! -s .phase18-phase2.files ] || git diff --quiet -- client/src server shared; then
            rm -f .phase18-phase2.files
            git rm scripts/phase18-phase2-usage-infer.cjs
            git commit -m 'chore: certify Phase 2 parameter inference exhaustion [phase18-phase2-result]'
            git push origin HEAD:agent/phase18-wave2-phase2-parameters
            exit 0
          fi
          green=0
          for attempt in $(seq 1 32); do
            set +e; npm run check >/tmp/phase2-check.log 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then green=1; break; fi
            mapfile -t errs < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/phase2-check.log | sort -u)
            reverted=0
            for f in "${errs[@]}"; do
              if git diff --quiet "$base" -- "$f"; then continue; fi
              git checkout "$base" -- "$f"
              reverted=$((reverted+1))
            done
            if [ "$reverted" -gt 0 ]; then continue; fi
            mapfile -t modified < <(git diff --name-only "$base" -- client/src server shared)
            [ "${#modified[@]}" -gt 0 ] || break
            git checkout "$base" -- "${modified[0]}"
          done
          [ "$green" -eq 1 ] || { cat /tmp/phase2-check.log; exit 1; }
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/after.json; set -e
          after=$(node -e "const r=require('/tmp/after.json');process.stdout.write(String(r.summary.typeEscapeTotal))")
          if [ "$after" -ge "$before" ]; then
            git reset --hard "$base"
            rm -f .phase18-phase2.files
            git rm scripts/phase18-phase2-usage-infer.cjs
            git commit -m 'chore: certify Phase 2 parameter inference exhaustion [phase18-phase2-result]'
            git push origin HEAD:agent/phase18-wave2-phase2-parameters
            exit 0
          fi
          UPDATE_TYPE_ESCAPE_BASELINE=1 node scripts/audit-type-escapes.mjs
          AFTER="$after" node - <<'NODE'
          const fs=require('fs');
          const p='docs/system-quality-program.md';
          let s=fs.readFileSync(p,'utf8');
          const n=Number(process.env.AFTER).toLocaleString('en-US');
          s=s.replace(/\| Type escapes \(AST\) \| [0-9,]+ total \|/, `| Type escapes (AST) | ${n} total |`);
          fs.writeFileSync(p,s);
          NODE
          rm -f .phase18-phase2.files
          npm run check
          node scripts/audit-type-escapes.mjs
          git add client/src server shared config/type-escape-boundaries.json docs/system-quality-program.md
          git commit -m "refactor: Phase 2 compiler-safe function parameter inference ${before}->${after} [skip ci]"
          git push origin HEAD:agent/phase18-wave2-phase2-parameters
