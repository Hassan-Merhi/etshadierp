name: Phase 12 formatter cleanup

on:
  push:
    branches:
      - chatgpt/golden-coast-phase12-frontend-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/golden-coast-phase12-frontend-integration
          fetch-depth: 0

      - name: Apply repository formatting and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- scripts/run-lint.mjs
          npx --yes prettier@3.8.4 --write \
            client/src/app/authenticatedAppRouteGuard.ts \
            client/src/pages/sp/SpGoldenCoast.tsx
          git rm .github/workflows/phase12-format-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-lint.mjs client/src/app/authenticatedAppRouteGuard.ts client/src/pages/sp/SpGoldenCoast.tsx
          git commit -m "style(sp): format Phase 12 frontend"
          git push origin HEAD:chatgpt/golden-coast-phase12-frontend-integration
