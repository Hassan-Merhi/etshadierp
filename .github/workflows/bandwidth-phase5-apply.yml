name: Bandwidth Phase 5 Apply

on:
  push:
    branches: [agent/bandwidth-phase-1-waste-dispatch]
    paths: [.github/workflows/bandwidth-phase5-apply.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: bandwidth-phase5-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/bandwidth-phase-1-waste-dispatch
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx drizzle-kit push --force
      - name: Apply source repairs
        run: python3 scripts/phase5_bandwidth_repair.py
      - name: Format changed sources
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/pages/factory/WasteDispatchOptimized.tsx
          client/src/pages/factory/wastedispatch/optimizedData.ts
          client/src/pages/factory/wastedispatch/optimizedPrint.ts
          client/src/pages/factory/wastedispatch/optimizedTypes.ts
          client/src/i18n/sharedUiPhase3Translations.part6.ts
          client/src/i18n/backendMessagesPhase7Translations.part11.ts
          server/routes/factory/employee-pos/wasteDispatchBandwidthRoutes.ts
          server/routes/stats/salesReportBandwidthRoutes.ts
          client/src/pages/BaleProductsBilingual.tsx
          client/src/lib/bandwidthInvalidationPolicy.ts
          scripts/verify-bandwidth-phase-3-sales-report.mjs
          tests/trace-context-route-template.test.ts
          tests/ui/bandwidth-phase-1-invalidation-policy.test.ts
      - name: Regenerate route manifest
        env:
          UPDATE_ROUTE_MANIFEST: "1"
        run: node node_modules/vitest/vitest.mjs run tests/route-manifest.test.ts
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 5: repair cumulative bandwidth verification"
          git push origin HEAD:agent/bandwidth-phase-1-waste-dispatch
