name: Temporary POS Container Formatter

on:
  push:
    branches:
      - fix/pos-container-tracking-modern-ui-export

permissions:
  contents: read

jobs:
  format-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Stabilize derived container list
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("client/src/pages/pos/POSContainerTracking.tsx")
          text = path.read_text()
          old = "  const containers = data?.containers ?? [];"
          new = "  const containers = useMemo(() => data?.containers ?? [], [data?.containers]);"
          if old not in text:
              raise SystemExit("expected containers expression not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format changed client files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/pos/POSContainerTracking.tsx \
            client/src/pages/pos/POSContainerDetail.tsx

      - name: Audit changed files with ESLint
        run: |
          set +e
          node node_modules/eslint/bin/eslint.js \
            client/src/pages/pos/POSContainerTracking.tsx \
            client/src/pages/pos/POSContainerDetail.tsx \
            server/routes/pos/posContainerTrackingRoutes.ts \
            --format stylish > changed-eslint.txt 2>&1
          status=$?
          cat changed-eslint.txt
          echo "eslint_exit=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: pos-container-formatted
          path: |
            client/src/pages/pos/POSContainerTracking.tsx
            client/src/pages/pos/POSContainerDetail.tsx
            changed-eslint.txt
          if-no-files-found: error
          retention-days: 1
