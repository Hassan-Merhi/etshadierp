name: Temporary POS Container Formatter

on:
  push:
    branches:
      - fix/pos-container-tracking-modern-ui-export

permissions:
  contents: write

jobs:
  format-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Stabilize derived container list
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("client/src/pages/pos/POSContainerTracking.tsx")
          text = path.read_text()
          old = "  const containers = data?.containers ?? [];"
          new = "  const containers = useMemo(() => data?.containers ?? [], [data?.containers]);"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("expected containers expression not found")
          PY

      - name: Format changed client files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/pos/POSContainerTracking.tsx \
            client/src/pages/pos/POSContainerDetail.tsx

      - name: Audit changed files with ESLint
        run: |
          node node_modules/eslint/bin/eslint.js \
            client/src/pages/pos/POSContainerTracking.tsx \
            client/src/pages/pos/POSContainerDetail.tsx \
            server/routes/pos/posContainerTrackingRoutes.ts \
            --format stylish

      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/pos/POSContainerTracking.tsx \
            client/src/pages/pos/POSContainerDetail.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "fix(pos): format container tracking UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
