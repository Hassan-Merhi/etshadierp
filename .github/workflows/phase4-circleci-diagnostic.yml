name: Phase 4 Formatting Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase4-formatting-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply exact formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/ui/alert-dialog.tsx \
            client/src/components/ui/dialog.tsx \
            client/src/components/ui/form.tsx \
            client/src/components/ui/select.tsx \
            client/src/components/ui/sheet.tsx \
            client/src/components/ui/workflow-dialog.tsx

      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            client/src/components/ui/alert-dialog.tsx \
            client/src/components/ui/dialog.tsx \
            client/src/components/ui/form.tsx \
            client/src/components/ui/select.tsx \
            client/src/components/ui/sheet.tsx \
            client/src/components/ui/workflow-dialog.tsx; then
            echo "Source already matches the repository formatter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/ui/alert-dialog.tsx \
            client/src/components/ui/dialog.tsx \
            client/src/components/ui/form.tsx \
            client/src/components/ui/select.tsx \
            client/src/components/ui/sheet.tsx \
            client/src/components/ui/workflow-dialog.tsx
          git commit -m "style: apply exact Phase 4 formatting"
          git push origin "HEAD:${{ github.head_ref }}"
