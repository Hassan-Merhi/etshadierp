name: Maintenance - Repository Janitor

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write
  actions: write

jobs:
  janitor:
    name: Safe repository cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branches only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          gh api --paginate "repos/$REPO/pulls?state=closed&per_page=100" --jq '.[] | select(.merged_at != null) | select(.head.repo.full_name == .base.repo.full_name) | .head.ref' \
            | sort -u \
            | while IFS= read -r branch; do
                [ -z "$branch" ] && continue
                [ "$branch" = "$default_branch" ] && continue
                if gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then
                  open_count=$(gh api "repos/$REPO/pulls?state=open&head=${{ github.repository_owner }}:$branch&per_page=1" --jq 'length')
                  if [ "$open_count" = "0" ]; then
                    echo "Deleting merged branch: $branch"
                    gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
                  fi
                fi
              done

      - name: Report stale unmerged branches without deleting them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '60 days ago' +%s)
          stale_file="$RUNNER_TEMP/stale-branches.txt"
          : > "$stale_file"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "${{ github.event.repository.default_branch }}" ] && continue
            open_count=$(gh api "repos/$REPO/pulls?state=open&head=${{ github.repository_owner }}:$branch&per_page=1" --jq 'length')
            [ "$open_count" != "0" ] && continue
            commit_date=$(gh api "repos/$REPO/commits/$branch" --jq '.commit.committer.date')
            commit_epoch=$(date -u -d "$commit_date" +%s)
            if [ "$commit_epoch" -lt "$cutoff" ]; then
              printf '%s | last commit %s\n' "$branch" "$commit_date" >> "$stale_file"
            fi
          done
          if [ -s "$stale_file" ]; then
            echo "Stale unmerged branches (manual review only):"
            cat "$stale_file"
          else
            echo "No stale unmerged branches found."
          fi

      - name: Delete old completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '30 days ago' +%s)
          gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[] | [.id,.created_at] | @tsv' \
            | while IFS=$'\t' read -r run_id created_at; do
                created_epoch=$(date -u -d "$created_at" +%s)
                if [ "$created_epoch" -lt "$cutoff" ]; then
                  gh api -X DELETE "repos/$REPO/actions/runs/$run_id" || true
                fi
              done
