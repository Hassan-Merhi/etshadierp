name: Phase 18 Safe Unused Cleanup v2

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[phase18-unused-safe-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Remove dead non-parameter declarations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          set +e
          npx eslint . --format json --output-file .phase18-unused.json
          set -e
          cat > .phase18-unused.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path');
          const root=process.cwd(),report=JSON.parse(fs.readFileSync('.phase18-unused.json','utf8')),byFile=new Map();
          for(const r of report){const ms=r.messages.filter(m=>m.severity===1&&m.ruleId==='unused-imports/no-unused-vars');if(ms.length)byFile.set(path.relative(root,r.filePath).replaceAll('\\','/'),ms)}
          function loc(sf,n){const p=sf.getLineAndCharacterOfPosition(n.getStart(sf));return `${p.line+1}:${p.character+1}`}
          function listEdit(items,n){const i=items.indexOf(n);if(i<0)return null;if(items.length===1)return [n.getStart(),n.end,''];if(i<items.length-1)return [n.getStart(),items[i+1].getStart(),''];return [items[i-1].end,n.end,'']}
          let count=0,files=0;
          for(const [file,msgs] of byFile){if(!fs.existsSync(file))continue;const original=fs.readFileSync(file,'utf8'),sf=ts.createSourceFile(file,original,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),wanted=new Set(msgs.map(m=>`${m.line}:${m.column}`)),edits=[];
            function v(n){if(ts.isIdentifier(n)&&wanted.has(loc(sf,n))){const p=n.parent;let e=null;
              if(ts.isParameter(p)){}
              else if(ts.isVariableDeclaration(p)){const l=p.parent;if(ts.isVariableDeclarationList(l)){if(l.declarations.length>1)e=listEdit([...l.declarations],p);else if(ts.isVariableStatement(l.parent)){const st=l.parent;e=p.initializer?[st.getStart(sf),st.end,`void (${p.initializer.getText(sf)});`]:[st.getStart(sf),st.end,''];}}}
              else if(ts.isBindingElement(p)){const q=p.parent;if(ts.isArrayBindingPattern(q)||ts.isObjectBindingPattern(q))e=listEdit([...q.elements],p)}
              else if(ts.isVariableDeclaration(p.parent)&&p.parent.name===p&&ts.isCatchClause(p.parent.parent)){const cl=p.parent.parent;e=[cl.getStart(sf)+5,cl.block.getStart(sf),' ']}
              else if((ts.isFunctionDeclaration(p)||ts.isClassDeclaration(p)||ts.isInterfaceDeclaration(p)||ts.isTypeAliasDeclaration(p)||ts.isEnumDeclaration(p))&&p.parent===sf)e=[p.getFullStart(),p.end,''];
              if(e){edits.push(e);wanted.delete(loc(sf,n));count++}}
              ts.forEachChild(n,v)}v(sf);if(!edits.length)continue;edits.sort((a,b)=>b[0]-a[0]);let text=original,last=Infinity;for(const e of edits){if(e[1]>last)continue;text=text.slice(0,e[0])+e[2]+text.slice(e[1]);last=e[0]}fs.writeFileSync(file,text);files++}
          console.log(`UNUSED_CANDIDATES=${count} FILES=${files}`);
          NODE
          node .phase18-unused.cjs
          rm -f .phase18-unused.cjs .phase18-unused.json
          mapfile -t changed < <(git diff --name-only -- '*.ts' '*.tsx')
          if [ ${#changed[@]} -gt 0 ]; then npx prettier --write "${changed[@]}"; fi
      - name: Compiler gate with per-file rollback
        shell: bash
        run: |
          set -euo pipefail
          green=0
          for attempt in $(seq 1 12); do
            set +e; npm run check >/tmp/unused-check.log 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then green=1; echo "UNUSED_GREEN_ATTEMPT=$attempt"; break; fi
            mapfile -t errs < <(sed -nE 's#^(.+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/unused-check.log | sort -u)
            reverted=0
            for f in "${errs[@]}"; do if git diff --name-only | grep -Fxq "$f"; then git restore --source=HEAD --worktree -- "$f"; reverted=$((reverted+1)); fi; done
            echo "UNUSED_ROLLBACK attempt=$attempt errorFiles=${#errs[@]} reverted=$reverted"
            if [ "$reverted" -eq 0 ]; then cat /tmp/unused-check.log; git reset --hard HEAD; exit 0; fi
          done
          [ "$green" = 1 ] || { git reset --hard HEAD; exit 0; }
          set +e; npx eslint . --format json --output-file /tmp/eslint-after.json; set -e
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/eslint-after.json','utf8'));let n=0;for(const f of r)for(const m of f.messages)if(m.severity===1&&m.ruleId==='unused-imports/no-unused-vars')n++;console.log('UNUSED_REMAINING='+n)
          NODE
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add client server shared tests scripts drizzle migrations || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: remove compiler-safe unused declarations [phase18-unused] [skip ci]'
          for attempt in 1 2 3 4 5; do git fetch origin main; git rebase origin/main; npm run check; if git push origin HEAD:main; then exit 0; fi; done
          exit 1
