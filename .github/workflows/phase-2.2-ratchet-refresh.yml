name: Phase 2.2 Ratchet Refresh

on:
  push:
    branches:
      - phase-2.2-frontend-type-safety
    paths:
      - .github/workflows/phase-2.2-ratchet-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.2-frontend-type-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh type-escape baseline
        run: UPDATE_TYPE_ESCAPE_BASELINE=1 npm run audit:type-escapes
      - name: Commit ratchet
        shell: bash
        run: |
          if git diff --quiet -- config/type-escape-boundaries.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/type-escape-boundaries.json
          git commit -m "chore: lock final Phase 2.2 type-escape reduction"
          git push origin HEAD:phase-2.2-frontend-type-safety
