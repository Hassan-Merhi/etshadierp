name: CodeQL Phase 2 Live Diagnostic

on:
  push:
    branches:
      - security/codeql-phase2-parameter-tampering

permissions:
  contents: read
  security-events: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print live CodeQL alerts for Phase 2 files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --method GET \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            -f ref="refs/heads/${GITHUB_REF_NAME}" \
            -f state=open \
            -f tool_name=CodeQL \
            -f per_page=100 \
            --jq '.[] | select(
              .most_recent_instance.location.path == "server/routes/inventory-movement/movement.ts" or
              .most_recent_instance.location.path == "server/routes/sp/spExportRoutes.ts" or
              .most_recent_instance.location.path == "server/routes/accountStatementRoutes.ts"
            ) | {
              number,
              rule: .rule.id,
              severity: .rule.security_severity_level,
              path: .most_recent_instance.location.path,
              start_line: .most_recent_instance.location.start_line,
              end_line: .most_recent_instance.location.end_line,
              message: .most_recent_instance.message.text,
              created_at,
              updated_at
            }'
