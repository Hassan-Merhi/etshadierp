name: Bandwidth Phase 5 Final Verification

on:
  push:
    branches: [agent/bandwidth-phase-1-waste-dispatch]
    paths: [.github/workflows/bandwidth-phase5-final-verification.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandwidth-phase5-final-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  SESSION_SECRET: bandwidth-phase5-final-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  PORT: "5000"

jobs:
  full-ci:
    name: Full CI / Database / Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/bandwidth-phase-1-waste-dispatch
          fetch-depth: 0

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g; s#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Verify environment documentation
        run: npm run verify:env-docs

      - name: Type-escape ratchet
        run: npm run audit:type-escapes

      - name: Documentation state index
        run: npm run audit:doc-index

      - name: Write-route coverage ratchet
        run: npm run audit:write-routes

      - name: Toolchain coherence
        run: npm run audit:toolchain

      - name: Script inventory
        run: npm run audit:scripts

      - name: Readable logging contracts
        run: node scripts/verify-readable-logging-phase-10.mjs

      - name: Verify lockfile and production dependencies
        run: |
          npm run verify:lockfile
          npm run verify:production-dependencies

      - name: Check formatting for every changed source file
        run: |
          git fetch origin main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"
          fi

      - name: TypeScript
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify server bundle
        run: npm run verify:server-bundle

      - name: Repository safety contracts
        run: |
          npm run verify:observability
          npm run verify:final-production-readiness
          npm run verify:bandwidth

      - name: Verify PostgreSQL readiness
        run: |
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d heliumdb; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json

      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Verify disposable database schema
        run: node scripts/verify-ci-disposable-schema.mjs

      - name: Run application startup migrations
        run: |
          node dist/index.js > startup-migrations-phase5.txt 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error http://127.0.0.1:${PORT}/api/health/db > health-db-phase5.json; then
              cat health-db-phase5.json
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat startup-migrations-phase5.txt
              exit 1
            fi
            sleep 1
          done
          cat startup-migrations-phase5.txt
          exit 1

      - name: Backend tests
        run: npm run test:backend

      - name: API smoke sweep
        run: npm run test:smoke-sweep

      - name: Backend coverage thresholds
        run: npm run test:backend:coverage

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend coverage thresholds
        run: npm run test:frontend:coverage

      - name: Coverage ratchet audit
        run: npm run audit:coverage-ratchet

  responsive-rtl-i18n:
    name: Mobile / RTL / I18n
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/bandwidth-phase-1-waste-dispatch

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g; s#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Full responsive contract matrix
        run: node scripts/verify-mobile-responsive-phase11-regression.mjs

      - name: Focused responsive tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/mobile-responsive-*.test.ts

      - name: RTL/accessibility formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/app/ErpShell.tsx \
            client/src/app/FactoryShell.tsx \
            client/src/app/PosShell.tsx \
            client/src/app/PropertiesShell.tsx \
            client/src/components/AppTopBar.tsx \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/components/ui/dialog.tsx \
            client/src/components/ui/responsive-accessibility.tsx \
            client/src/components/ui/sheet.tsx \
            client/src/contexts/ApplicationLanguageContext.tsx \
            client/src/i18n/applicationDirection.test.ts \
            client/src/i18n/applicationDirection.ts \
            client/src/i18n/applicationTranslations.ts \
            client/src/styles/rtl-hardening.css \
            docs/archive/translation/phase-8-rtl-responsive-accessibility.md \
            scripts/audit-i18n-phase14.mjs \
            scripts/verify-program7d-accessibility-responsive.mjs \
            tests/phase14-i18n-release-gate.test.ts \
            tests/phase8-rtl-responsive-accessibility.test.ts \
            vitest.config.i18n-contracts.ts

      - name: Accessibility and RTL verifier
        run: node scripts/verify-program7d-accessibility-responsive.mjs

      - name: Trilingual release contracts
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.i18n-contracts.ts

      - name: Verify i18n classifier
        run: node scripts/verify-i18n-audit-classifier.mjs

      - name: Classified i18n audit
        run: node scripts/audit-i18n-phase14.mjs

  bandwidth-security:
    name: Bandwidth / Security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_OPTIONS: --max-old-space-size=2048
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/bandwidth-phase-1-waste-dispatch
          fetch-depth: 0

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g; s#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Historical bandwidth contract
        run: npm run verify:bandwidth

      - name: Sales report bandwidth contract
        run: node scripts/verify-bandwidth-phase-3-sales-report.mjs

      - name: Global request-pressure contract
        run: node scripts/verify-bandwidth-phase-4-global-pressure.mjs

      - name: Focused bandwidth regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts
          tests/ui/trace-context-route-template.test.ts
          tests/ui/bandwidth-phase-1-invalidation-policy.test.ts
          tests/ui/bandwidth-phase-2-payloads.test.ts
          tests/ui/bandwidth-phase-4-heavy-pages.test.ts

      - name: Production dependency audit
        run: npm run verify:dependency-audit

      - name: Production dependency verification
        run: npm run verify:production-dependencies

      - name: Program 6 security checks
        run: PROGRAM6_SKIP_TYPESCRIPT=1 npm run check:security

      - name: Final production readiness contract
        run: npm run verify:final-production-readiness

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.90.4
        with:
          extra_args: --results=verified,unknown
