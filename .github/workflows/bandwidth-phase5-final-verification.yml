# Final verification after backend ratchet repairs.
name: Bandwidth Phase 5 Final Verification

on:
  push:
    branches: [agent/bandwidth-phase-1-waste-dispatch]
    paths: [.github/workflows/bandwidth-phase5-final-verification.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandwidth-phase5-final-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  SESSION_SECRET: bandwidth-phase5-final-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  PORT: "5000"

jobs:
  full-ci:
    name: Full CI / Database / Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Normalize package registry URLs
        run: npm config set registry https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify environment documentation
        run: npm run verify:env-docs
      - name: Type-escape ratchet
        run: npm run audit:type-escapes
      - name: Documentation state index
        run: npm run verify:docs-state-index
      - name: Write-route coverage ratchet
        run: npm run audit:write-routes
      - name: Toolchain coherence
        run: npm run verify:toolchain
      - name: Script inventory
        run: npm run verify:script-inventory
      - name: Readable logging contracts
        run: npm run verify:readable-logging
      - name: Verify lockfile and production dependencies
        run: npm run verify:production-deps
      - name: Check formatting for every changed source file
        run: npx prettier --check $(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.md' '*.yml' '*.yaml')
      - name: TypeScript
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify server bundle
        run: npm run verify:server-bundle
      - name: Repository safety contracts
        run: npm run verify:repo-safety
      - name: Verify PostgreSQL readiness
        run: npm run db:verify-postgres
      - name: Verify migration registry
        run: npm run verify:migration-registry
      - name: Prepare disposable database schema
        run: npm run db:prepare-test-schema
      - name: Verify disposable database schema
        run: npm run db:verify-test-schema
      - name: Run application startup migrations
        run: npm run db:run-startup-migrations
      - name: Backend tests
        run: npm run test:backend
      - name: API smoke sweep
        run: npm run test:api-smoke
      - name: Backend coverage thresholds
        run: npm run test:coverage:backend
      - name: Frontend tests
        run: npm run test:frontend
      - name: Frontend coverage thresholds
        run: npm run test:coverage:frontend
      - name: Coverage ratchet audit
        run: npm run audit:coverage

  mobile-rtl-i18n:
    name: Mobile / RTL / I18n
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Normalize package registry URLs
        run: npm config set registry https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Full responsive contract matrix
        run: npm run verify:responsive-contracts
      - name: Focused responsive tests
        run: npm run test:responsive
      - name: RTL/accessibility formatting
        run: npm run verify:rtl-formatting
      - name: Accessibility and RTL verifier
        run: npm run verify:accessibility-rtl
      - name: Trilingual release contracts
        run: npm run verify:trilingual-release
      - name: Verify i18n classifier
        run: npm run verify:i18n-classifier
      - name: Classified i18n audit
        run: npm run audit:i18n:classified

  bandwidth-security:
    name: Bandwidth / Security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Normalize package registry URLs
        run: npm config set registry https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prepare disposable database schema
        run: npm run db:prepare-test-schema
      - name: Verify bandwidth Phase 1
        run: npm run verify:bandwidth-phase-1
      - name: Verify bandwidth Phase 2
        run: npm run verify:bandwidth-phase-2
      - name: Verify bandwidth Phase 3
        run: npm run verify:bandwidth-phase-3
      - name: Verify bandwidth Phase 4
        run: npm run verify:bandwidth-phase-4
      - name: Verify heavy-list pagination
        run: npm run verify:heavy-list-pagination
      - name: Audit heavy-list endpoints
        run: npm run audit:heavy-list-endpoints
      - name: API security contracts
        run: npm run test:security
      - name: Verify route manifest
        run: npm run verify:route-manifest
