# One-time mechanical doc-index synchronization before final Phase 5 rerun.
name: Bandwidth Phase 5 Final Verification

on:
  push:
    branches: [agent/bandwidth-phase-1-waste-dispatch]
    paths: [.github/workflows/bandwidth-phase5-final-verification.yml]

permissions:
  contents: write

concurrency:
  group: bandwidth-phase5-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-doc-index:
    name: Synchronize god-file documentation counters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/bandwidth-phase-1-waste-dispatch
          fetch-depth: 0

      - name: Update source-of-truth counters in bound docs
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("docs/god-file-split-program.md"),
              Path("docs/system-quality-program.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              updated = text.replace("63 files", "64 files").replace("33,982", "34,069")
              if updated == text:
                  raise SystemExit(f"Expected stale counters were not found in {path}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/god-file-split-program.md docs/system-quality-program.md
          git diff --cached --check
          git commit -m "Phase 5: synchronize god-file documentation counters"
          git push origin HEAD:agent/bandwidth-phase-1-waste-dispatch
