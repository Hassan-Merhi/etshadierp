name: Temporary stock transfer revision navigation repair

on:
  push:
    branches:
      - agent/fix-stock-transfer-revision-history

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stock-transfer-revision-history
          fetch-depth: 0
      - name: Repair edit-mode navigation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/vouchers/StockTransferForm.tsx')
          text = path.read_text()
          old = '''      if (isEditMode && !savingTransferRevisionRef.current) {
        setLocation(`${modePrefix}/daybook`);
      } else {
        stockTransferForm.reset({'''
          new = '''      if (isEditMode) {
        if (!savingTransferRevisionRef.current) {
          setLocation(`${modePrefix}/daybook`);
        }
      } else {
        stockTransferForm.reset({'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one navigation block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-fix-stock-transfer-revision-navigation.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/vouchers/StockTransferForm.tsx .github/workflows/temporary-fix-stock-transfer-revision-navigation.yml
          git commit -m "fix: preserve transfer form while saving revision"
          git push origin HEAD:agent/fix-stock-transfer-revision-history
