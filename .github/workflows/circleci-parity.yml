name: CircleCI Parity

on:
  pull_request:
    branches: [main]

concurrency:
  group: circleci-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  SESSION_SECRET: github-actions-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  PORT: "5000"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  wave-g-postgres-proof:
    name: Wave G PostgreSQL Proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable

    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Verify PostgreSQL readiness
        run: pg_isready -h 127.0.0.1 -p 5432 -U postgres -d heliumdb

      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json

      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Run Wave G RLS tests
        run: node node_modules/vitest/vitest.mjs run tests/company-scope-rls-runtime.test.ts tests/company-scope-rls-wiring.test.ts --maxWorkers=1 --no-file-parallelism
