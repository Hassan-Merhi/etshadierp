name: CircleCI Parity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  wave-g-format:
    if: github.head_ref == 'wave-g/rls-migration-wiring'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wave G head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Wave G files exactly
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/companyScopeRlsBridge.mjs \
            server/db.ts \
            server/supplierCompanyScopeBridge.mjs \
            tests/company-scope-rls-runtime.test.ts \
            tests/company-scope-rls-wiring.test.ts

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Wave G files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/companyScopeRlsBridge.mjs \
            server/db.ts \
            server/supplierCompanyScopeBridge.mjs \
            tests/company-scope-rls-runtime.test.ts \
            tests/company-scope-rls-wiring.test.ts
          git commit -m "wave-g: format changed source files"
          git push origin HEAD:${{ github.head_ref }}
