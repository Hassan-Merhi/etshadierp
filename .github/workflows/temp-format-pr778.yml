name: Temp Format PR 778

on:
  push:
    branches: [fix/account-statement-exports-20260819]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/account-statement-exports-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format export files and remove helper
        run: |
          node node_modules/prettier/bin/prettier.cjs --write server/lib/accountStatementExportSafety.ts server/routes/accountStatementRoutes.ts tests/account-statement-export-safety.test.ts
          rm -f .github/workflows/temp-format-pr778.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/lib/accountStatementExportSafety.ts server/routes/accountStatementRoutes.ts tests/account-statement-export-safety.test.ts .github/workflows/temp-format-pr778.yml
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "style(accounts): format statement export fix"
          git push origin HEAD:fix/account-statement-exports-20260819
