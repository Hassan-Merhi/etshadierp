name: Temporary PR 602 Formatter

on:
  push:
    branches:
      - fix/container-comparison-single-scrollbar

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Apply repository Prettier formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/ui/table.tsx \
            client/src/pages/POImport.tsx \
            client/src/pages/factory/factoryshippingcontainers/components/WhatsAppModal.tsx \
            client/src/pages/git-mockup/TabTruckLocation.tsx \
            server/routes/supplierRoutes.ts \
            server/routes/suppliers/supplierService.ts \
            tests/session-enforcement-adapter.test.ts \
            tests/session-security-policy.test.ts

      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/ui/table.tsx \
            client/src/pages/POImport.tsx \
            client/src/pages/factory/factoryshippingcontainers/components/WhatsAppModal.tsx \
            client/src/pages/git-mockup/TabTruckLocation.tsx \
            server/routes/supplierRoutes.ts \
            server/routes/suppliers/supplierService.ts \
            tests/session-enforcement-adapter.test.ts \
            tests/session-security-policy.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: apply CI formatting for PR 602"
          git push origin "HEAD:${GITHUB_REF_NAME}"
