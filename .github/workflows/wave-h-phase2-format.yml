name: Wave H Phase 2 Format

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - client/src/pages/vouchers/useVoucherHydration.ts
      - client/src/pages/vouchers/useVoucherQueries.ts
      - .github/workflows/wave-h-phase2-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wave-i/convergence-automation
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/vouchers/useVoucherHydration.ts client/src/pages/vouchers/useVoucherQueries.ts
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- client/src/pages/vouchers/useVoucherHydration.ts client/src/pages/vouchers/useVoucherQueries.ts; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- client/src/pages/vouchers/useVoucherHydration.ts client/src/pages/vouchers/useVoucherQueries.ts
          git commit -m "style: format voucher query helpers"
          git push origin HEAD:wave-i/convergence-automation
