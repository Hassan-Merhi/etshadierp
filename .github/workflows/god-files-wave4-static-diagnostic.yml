name: God Files Wave 4 Static Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: test
  SESSION_SECRET: diagnostic-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  NODE_OPTIONS: --max-old-space-size=6144
  PORT: "5000"

jobs:
  diagnose:
    if: github.event.pull_request.base.ref == 'agent/god-files-final-wave1-tests' && github.event.pull_request.head.ref == 'tmp/god-files-wave4-static-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Verify lockfile
        run: npm run verify:lockfile
      - name: Verify production dependencies
        run: npm run verify:production-dependencies
      - name: Check changed-file formatting
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          printf 'Changed source files: %s\n' "${#changed_files[@]}"
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"
          fi
      - name: Lint
        run: npm run lint
      - name: Lint warning ratchet
        if: always()
        run: npm run audit:lint-ratchet
      - name: TypeScript
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify server bundle
        run: npm run verify:server-bundle
      - name: Verify observability
        run: npm run verify:observability
      - name: Verify final production readiness
        run: npm run verify:final-production-readiness
      - name: Verify bandwidth
        run: npm run verify:bandwidth
