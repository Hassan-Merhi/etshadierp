name: Combo 1 temporary safe type batch 2

on:
  push:
    branches: [combo-1-ci-safe-types]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Combo 1 branch
        uses: actions/checkout@v4
        with:
          ref: combo-1-ci-safe-types
          fetch-depth: 0

      - name: Apply guarded safe type batch
        run: node scripts/combo1-safe-type-batch2.mjs

      - name: Commit safe type batch when needed
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No type update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "fix(types): allow one-sided audit changes and use supplier legal names"
          git push origin HEAD:combo-1-ci-safe-types
