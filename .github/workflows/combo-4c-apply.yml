name: Combo 4C Apply

on:
  push:
    branches:
      - agent/combo-4c-container-freight-typescript

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply audited Combo 4C patch
        run: node scripts/combo-4c-apply.mjs
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/containers/containerAccountingRoutes.ts \
                  server/routes/containers/containerFreightReadRoutes.ts \
                  server/routes/containers/containerFreightWriteRoutes.ts \
                  server/routes/factory/factoryContainersRoutes.ts
          git diff --cached --quiet && exit 1
          git commit -m "Apply Combo 4C container and freight TypeScript fixes"
          git push
