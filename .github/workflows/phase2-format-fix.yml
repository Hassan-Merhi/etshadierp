name: Phase 2 Format Fix

on:
  push:
    branches:
      - chat-a/phase2-stock-movement-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chat-a/phase2-stock-movement-evidence
          fetch-depth: 0
      - name: Set up canonical Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format Phase 2 source files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/containers/offload/create.ts \
            server/routes/containers/offload/recalc.ts \
            server/routes/containers/offload/update.ts \
            server/routes/creditSalesImportRoutes.ts \
            server/routes/factory/bales/balesReimportRoutes.ts \
            server/routes/factory/employee-pos/employeeLedgerWasteRoutes.ts \
            server/routes/factory/stock/stockRemovalRoutes.ts \
            server/routes/import/silent-production.ts \
            server/routes/inventory/inventoryQuickAdjustService.ts \
            server/routes/voucher-entries/delete.ts \
            server/routes/vouchers/sales-update/optionalInventoryEvidence.ts \
            server/routes/vouchers/transfer/salesLocationInventoryEvidence.ts \
            server/routes/vouchers/transfer/with-entries.ts \
            server/routes/vouchers/voucherPurchaseUpdateRoutes.ts \
            server/services/containers/offload-lifecycle/reverse.ts \
            server/services/sp/spInventoryIntegrity.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "style: format Phase 2 stock evidence changes"
          git push origin HEAD:chat-a/phase2-stock-movement-evidence
