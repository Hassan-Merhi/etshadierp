name: Phase 18 Corrected Page Splits
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  fix:
    if: contains(github.event.head_commit.message, '[phase18-page-fixes-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Correct Container Loading contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat >> client/src/pages/containerloadingscan/types.ts <<'TS'

          export interface CreateLoadingOrderInput {
            customerId: number;
            proformaIdUsed: number | null;
            locationId: number;
            orderDate: string;
            containerNotes?: string;
          }
          export interface CreateLoadingOrderResponse { id: number }
          export interface AddLoadingBaleInput {
            scanCode: string;
            locationId: number;
            allowBypassProforma?: boolean;
            allowBypassOverload?: boolean;
          }
          export type AddLoadingBaleResponse = OrderDetail;
          TS
          cat > client/src/pages/containerloadingscan/audio.ts <<'TS'
          function createAudioContext(): AudioContext {
            const WebkitAudioContext = (window as unknown as Window & typeof globalThis & {
              webkitAudioContext: typeof AudioContext;
            }).webkitAudioContext;
            return new (window.AudioContext || WebkitAudioContext)();
          }
          export function playLoadingScanSuccessTone(): void {
            try {
              const context = createAudioContext();
              const oscillator = context.createOscillator();
              oscillator.connect(context.destination);
              oscillator.frequency.value = 1000;
              void context.resume().then(() => {
                oscillator.start();
                setTimeout(() => { oscillator.stop(); void context.close(); }, 120);
              });
            } catch { /* optional feedback */ }
          }
          TS
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('client/src/pages/ContainerLoadingScan.tsx'); s=p.read_text()
          old='import type { Customer, Location, OrderBale, OrderDetail, Proforma } from "./containerloadingscan/types";'
          new='''import type { AddLoadingBaleInput, AddLoadingBaleResponse, CreateLoadingOrderInput, CreateLoadingOrderResponse, Customer, Location, OrderBale, OrderDetail, Proforma } from "./containerloadingscan/types";\nimport { playLoadingScanSuccessTone } from "./containerloadingscan/audio";'''
          if old in s: s=s.replace(old,new,1)
          s=re.sub(r'mutationFn: async \(data: \{\s*customerId: number;\s*proformaIdUsed: number \| null;\s*locationId: number;\s*orderDate: string;\s*containerNotes\?: string;\s*\}\) => \{','mutationFn: async (data: CreateLoadingOrderInput) => {',s,count=1)
          s=s.replace('onSuccess: (data: any) => {','onSuccess: (data: CreateLoadingOrderResponse) => {',1)
          s=re.sub(r'mutationFn: async \(data: \{\s*scanCode: string;\s*locationId: number;\s*allowBypassProforma\?: boolean;\s*allowBypassOverload\?: boolean;\s*\}\) => \{','mutationFn: async (data: AddLoadingBaleInput) => {',s,count=1)
          s=re.sub(r'onSuccess: \(\s*data: any,\s*variables: \{ scanCode: string; locationId: number; allowBypassProforma\?: boolean; allowBypassOverload\?: boolean \}\s*\) => \{','onSuccess: (data: AddLoadingBaleResponse, variables: AddLoadingBaleInput) => {',s,count=1)
          s=s.replace('onError: (error: Error, variables: any) => {','onError: (error: Error, variables: AddLoadingBaleInput) => {',1)
          s=s.replace('const _speechMsg = variables.allowBypassProforma ? "Bypass confirmed. Item added." : "Scanned successfully";\n','',1)
          pat=re.compile(r'\s*try \{\s*const ctx = new \(.*?\n\s*\} catch \{\s*/\* no audio support \*/\s*\}',re.S)
          s,n=pat.subn('\n      playLoadingScanSuccessTone();',s,count=1)
          if n!=1: raise SystemExit('Container audio block not found')
          s=s.replace('(a: any, b: any) => b.id - a.id','(a, b) => b.id - a.id')
          p.write_text(s)
          PY
      - name: Correct Bales History extraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/src/pages/factory/baleshistory
          cat > client/src/pages/factory/baleshistory/pagePolicies.ts <<'TS'
          import { useEffect, type Dispatch, type SetStateAction } from "react";
          import { addDays, format } from "date-fns";
          export const BALE_STATUS_COLORS: Readonly<Record<string, string>> = {
            PENDING_PRESSING: "outline", LABEL_PRINTED: "secondary", PRESSED: "default", FINALIZED: "default",
            IN_STOCK: "default", RESERVED: "outline", SOLD: "destructive", REPACKED: "secondary",
          };
          export function useBalesHistoryDateKeyboard(setDateFilter: Dispatch<SetStateAction<string>>): void {
            useEffect(() => {
              const onKeyDown = (event: KeyboardEvent) => {
                const tag=(event.target as HTMLElement|null)?.tagName?.toLowerCase();
                if(tag==="input"||tag==="textarea"||tag==="select") return;
                if(event.key==="-"){event.preventDefault();setDateFilter(v=>v?format(addDays(new Date(`${v}T00:00:00`),-1),"yyyy-MM-dd"):v);}
                else if(event.key==="+"||(event.key==="="&&event.shiftKey)){event.preventDefault();setDateFilter(v=>v?format(addDays(new Date(`${v}T00:00:00`),1),"yyyy-MM-dd"):v);}
              };
              window.addEventListener("keydown",onKeyDown);
              return()=>window.removeEventListener("keydown",onKeyDown);
            },[setDateFilter]);
          }
          TS
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('client/src/pages/factory/BalesHistory.tsx'); s=p.read_text()
          anchor='import { BaleWeightEditDialog, type WeightEditBale } from "@/components/BaleWeightEditDialog";\n'
          imp='import { BALE_STATUS_COLORS, useBalesHistoryDateKeyboard } from "./baleshistory/pagePolicies";\n'
          if imp not in s: s=s.replace(anchor,anchor+imp)
          s=re.sub(r'const STATUS_COLORS: Record<string, string> = \{.*?\};\n\n','',s,count=1,flags=re.S)
          if '  // Keyboard +/- date navigation' in s:
            a=s.index('  // Keyboard +/- date navigation'); b=s.index('  // Debounce search term',a); s=s[:a]+'  useBalesHistoryDateKeyboard(setDateFilter);\n\n'+s[b:]
          s=s.replace('STATUS_COLORS','BALE_STATUS_COLORS')
          s=s.replace('BALE_BALE_STATUS_COLORS','BALE_STATUS_COLORS')
          p.write_text(s)
          PY
          npx prettier --write client/src/pages/ContainerLoadingScan.tsx client/src/pages/containerloadingscan/types.ts client/src/pages/containerloadingscan/audio.ts client/src/pages/factory/BalesHistory.tsx client/src/pages/factory/baleshistory/pagePolicies.ts
      - name: Verify and land
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; npm run audit:god-files >/tmp/god.log 2>&1; rc=$?; set -e
          cat /tmp/god.log
          if grep -Eq 'client/src/pages/(ContainerLoadingScan|factory/BalesHistory)\.tsx has ' /tmp/god.log; then exit 1; fi
          git add client/src/pages/ContainerLoadingScan.tsx client/src/pages/containerloadingscan client/src/pages/factory/BalesHistory.tsx client/src/pages/factory/baleshistory
          git commit -m 'refactor: split loading and bale-history page concerns [phase18-pages] [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git rebase origin/main; npm run check
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
