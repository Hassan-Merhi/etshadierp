name: CI Repair Failure Trigger (ChatGPT-managed)

on:
  workflow_dispatch:

permissions: {}

jobs:
  notice:
    name: ChatGPT-managed repair notice
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain repair ownership
        run: |
          echo "Automatic GitHub wake-ups for the API-backed CI repair bot are disabled."
          echo "ChatGPT now checks and repairs eligible PRs on the configured hourly schedule."
          echo "Normal GitHub Actions and external required checks continue unchanged."
