name: Remote support Phase 2 formatter

on:
  push:
    branches:
      - agent/remote-support-phase-2-fast-viewing
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: remote-support-phase2-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-2-fast-viewing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-2-fast-viewing

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Phase 2 sources
        run: npx prettier --write client/src/hooks/use-screen-feed.ts client/src/pages/settings/WatchUserDialog.tsx

      - name: Commit formatted sources
        run: |
          if git diff --quiet -- client/src/hooks/use-screen-feed.ts client/src/pages/settings/WatchUserDialog.tsx; then
            echo "Sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/hooks/use-screen-feed.ts client/src/pages/settings/WatchUserDialog.tsx
          git commit -m "style(remote-support): format Phase 2 sources"
          git push origin HEAD:agent/remote-support-phase-2-fast-viewing
