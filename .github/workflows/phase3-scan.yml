name: Phase 3 Scan

on:
  push:
    branches:
      - codex/voucher-idempotency-phase3

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Scan infrastructure writer call sites
        shell: bash
        run: |
          set -o pipefail
          echo '=== insertVoucherWithEntries* ==='
          grep -RIn --exclude-dir=node_modules -E 'insertVoucherWithEntries(Tx)?\(' server tests || true
          echo '=== createVoucher( ==='
          grep -RIn --exclude-dir=node_modules -E '\bcreateVoucher\(' server tests || true
          echo '=== insertSaleVoucher( ==='
          grep -RIn --exclude-dir=node_modules -E '\binsertSaleVoucher\(' server tests || true
          echo '=== postChargeVouchers( ==='
          grep -RIn --exclude-dir=node_modules -E '\bpostChargeVouchers\(' server tests || true
          echo '=== postSupplierPartnerJournals( ==='
          grep -RIn --exclude-dir=node_modules -E '\bpostSupplierPartnerJournals\(' server tests || true
          echo '=== applyPostOffloadChargeMutation( ==='
          grep -RIn --exclude-dir=node_modules -E '\bapplyPostOffloadChargeMutation\(' server tests || true
          echo '=== createRentalPaymentGroup/postGroupCore ==='
          grep -RIn --exclude-dir=node_modules -E '\b(createRentalPaymentGroup|postGroupCore)\(' server tests || true
          echo '=== closeFiscalPeriod( ==='
          grep -RIn --exclude-dir=node_modules -E '\bcloseFiscalPeriod\(' server tests || true
          echo '=== offloadContainer( ==='
          grep -RIn --exclude-dir=node_modules -E '\boffloadContainer\(' server tests || true
          echo '=== createPurchaseOrder( ==='
          grep -RIn --exclude-dir=node_modules -E '\bcreatePurchaseOrder\(' server tests || true
