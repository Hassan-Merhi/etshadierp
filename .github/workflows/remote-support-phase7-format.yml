name: Remote support Phase 7 formatter

on:
  push:
    branches:
      - agent/remote-support-phase-7-audit-protection
  pull_request:
    branches:
      - agent/remote-support-phase-6-keyboard-control

permissions:
  contents: write

concurrency:
  group: remote-support-phase7-format
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-7-audit-protection'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-7-audit-protection
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format complete remote support stack
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/RemoteKeyboardControllerOverlay.tsx \
            client/src/components/RemoteKeyboardControlTarget.tsx \
            client/src/components/RemoteMouseControllerOverlay.tsx \
            client/src/components/RemoteMouseControlTarget.tsx \
            client/src/components/RemoteSupportIndicator.tsx \
            client/src/components/remote-support-indicator-policy.ts \
            client/src/components/remote-support-indicator-policy.test.ts \
            client/src/hooks/remote-keyboard-control-policy.test.ts \
            client/src/hooks/remote-keyboard-control-policy.ts \
            client/src/hooks/remote-mouse-control-policy.test.ts \
            client/src/hooks/remote-mouse-control-policy.ts \
            client/src/hooks/use-remote-control-session.ts \
            client/src/i18n/remoteSupportPhase5Translations.ts \
            client/src/i18n/remoteSupportPhase6Translations.ts \
            client/src/pages/settings/AuditLogUtils.tsx \
            server/routes/applicationRoutes.ts \
            server/routes/remoteControlSessionRoutes.ts \
            server/routes/remoteKeyboardControlRoutes.ts \
            server/routes/remoteSupportAuditRoutes.ts \
            server/routes/screenFeedRoutes.ts \
            server/services/remoteControlCommandService.ts \
            server/services/remoteControlSessionService.ts \
            server/services/remoteKeyboardCommandService.ts \
            server/services/remoteSupportAuditService.ts \
            server/services/remoteSupportSensitiveActionPolicy.ts \
            shared/permissionConfig.ts \
            tests/remote-control-command-service.test.ts \
            tests/remote-control-session-service.test.ts \
            tests/remote-keyboard-command-service.test.ts \
            tests/remote-support-audit-service.test.ts \
            tests/remote-support-permission-contract.test.ts \
            tests/remote-support-sensitive-action-policy.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client server shared tests
          git commit -m "style(remote-support): format Phase 6-7 stack"
          git push origin HEAD:agent/remote-support-phase-7-audit-protection
