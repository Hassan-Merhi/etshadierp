name: Remove final Phase 7-8 unused import

on:
  push:
    branches:
      - agent/bandwidth-phases-7-8

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bandwidth-phases-7-8
          fetch-depth: 0
      - run: python scripts/remove-phase7-8-unused-import.py
      - run: |
          rm -f scripts/remove-phase7-8-unused-import.py
          rm -f .github/workflows/remove-phase7-8-unused-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove final unused Phase 7-8 import"
          git push origin HEAD:agent/bandwidth-phases-7-8
