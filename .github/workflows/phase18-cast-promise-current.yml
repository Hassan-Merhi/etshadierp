name: Phase 18 Current Cast and Promise Harvest
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[phase18-cast-promise-current]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Harvest compiler-safe casts and Promise values
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-before.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-before.json
          set -e
          cat > .phase18-cast-promise.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path');
          const root=process.cwd(),cp=ts.findConfigFile(root,ts.sys.fileExists,'tsconfig.json'),cf=ts.readConfigFile(cp,ts.sys.readFile),parsed=ts.parseJsonConfigFileContent(cf.config,ts.sys,path.dirname(cp));
          const files=parsed.fileNames.filter(f=>{const r=path.relative(root,f).replaceAll('\\','/');return /^(client\/src|server|shared)\//.test(r)&&/\.(ts|tsx)$/.test(r)&&!r.endsWith('.d.ts')&&fs.existsSync(f)});
          const state=new Map(parsed.fileNames.filter(fs.existsSync).map(f=>[path.resolve(f),{text:fs.readFileSync(f,'utf8'),version:0}]));
          const host={getCompilationSettings:()=>parsed.options,getScriptFileNames:()=>parsed.fileNames,getScriptVersion:f=>String(state.get(path.resolve(f))?.version??0),getScriptSnapshot:f=>{const e=state.get(path.resolve(f));if(e)return ts.ScriptSnapshot.fromString(e.text);if(fs.existsSync(f))return ts.ScriptSnapshot.fromString(fs.readFileSync(f,'utf8'))},getCurrentDirectory:()=>root,getDefaultLibFileName:o=>ts.getDefaultLibFilePath(o),fileExists:ts.sys.fileExists,readFile:ts.sys.readFile,readDirectory:ts.sys.readDirectory,directoryExists:ts.sys.directoryExists,getDirectories:ts.sys.getDirectories,realpath:ts.sys.realpath};
          const ls=ts.createLanguageService(host,ts.createDocumentRegistry()),set=(f,t)=>{const k=path.resolve(f),e=state.get(k)||{text:fs.readFileSync(f,'utf8'),version:0};e.text=t;e.version++;state.set(k,e)},diags=f=>[...ls.getSyntacticDiagnostics(f),...ls.getSemanticDiagnostics(f)];
          let castCandidates=0,castAccepted=0,promiseCandidates=0,promiseAccepted=0,changed=0;
          for(const file of files){const original=fs.readFileSync(file,'utf8'),sf=ts.createSourceFile(file,original,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),edits=[];const v=n=>{if(ts.isAsExpression(n)&&n.type.kind===ts.SyntaxKind.AnyKeyword){edits.push({start:n.expression.end,end:n.end,repl:'',kind:'cast'});castCandidates++;}else if(n.kind===ts.SyntaxKind.AnyKeyword&&ts.isTypeReferenceNode(n.parent)&&n.parent.typeName.getText(sf)==='Promise'&&n.parent.typeArguments?.[0]===n){edits.push({start:n.getStart(sf),end:n.end,repl:'unknown',kind:'promise'});promiseCandidates++;}ts.forEachChild(n,v)};v(sf);if(!edits.length)continue;let text=original,accepted=[];for(const e of edits){const prior=text;const delta=e.repl.length-(e.end-e.start);text=text.slice(0,e.start)+e.repl+text.slice(e.end);for(const later of edits){if(later.start>e.start){later.start+=delta;later.end+=delta}}set(file,text);if(diags(file).length===0){accepted.push(e);if(e.kind==='cast')castAccepted++;else promiseAccepted++;}else{text=prior;for(const later of edits){if(later.start>e.start){later.start-=delta;later.end-=delta}}set(file,text);}}if(accepted.length){fs.writeFileSync(file,text);changed++;console.log(`ACCEPT ${path.relative(root,file).replaceAll('\\','/')} ${accepted.length}/${edits.length}`)}else set(file,original)}
          console.log(`CAST_PROMISE cast=${castAccepted}/${castCandidates} promise=${promiseAccepted}/${promiseCandidates} files=${changed}`);
          NODE
          node .phase18-cast-promise.cjs
          rm -f .phase18-cast-promise.cjs
          git diff --name-only -- '*.ts' '*.tsx' >/tmp/changed-files
          test -s /tmp/changed-files
      - name: Full compiler gate
        run: npm run check
      - name: Require strict improvement and publish result
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-after.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-after.json
          set -e
          node - <<'NODE'
          const fs=require('fs'),tb=JSON.parse(fs.readFileSync('/tmp/type-before.json')),ta=JSON.parse(fs.readFileSync('/tmp/type-after.json'));
          const c=p=>{const r=JSON.parse(fs.readFileSync(p));let errors=0,warnings=0,any=0;for(const f of r)for(const m of f.messages){if(m.severity===2)errors++;if(m.severity===1)warnings++;if(m.ruleId==='@typescript-eslint/no-explicit-any')any++;}return{errors,warnings,any}};const b=c('/tmp/lint-before.json'),a=c('/tmp/lint-after.json');console.log(`CAST_PROMISE_TYPE ${tb.summary.typeEscapeTotal} -> ${ta.summary.typeEscapeTotal}`);console.log('CAST_PROMISE_LINT '+JSON.stringify(b)+' -> '+JSON.stringify(a));if(a.errors||ta.summary.typeEscapeTotal>=tb.summary.typeEscapeTotal||a.any>=b.any||a.warnings>b.warnings)process.exit(1);
          NODE
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src server shared
          git commit -m 'refactor: remove compiler-safe any casts and promise values [phase18-cast-promise]'
          npm run check
          git push --force origin HEAD:agent/phase18-cast-promise-current
