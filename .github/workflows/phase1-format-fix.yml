name: Phase 1 Format Fix

on:
  push:
    branches:
      - agent/golden-coast-phase1-accounting
    paths:
      - .github/workflows/phase1-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 1 files
        run: >-
          npx prettier --write
          server/partnerAccountingPhase1.test.ts
          server/partnerAccountingPhase1.ts
          server/routes/core/permissionBoundaryRoutes.ts
          server/routes/goldenCoastAccountingRoutes.ts
          server/services/accounting/goldenCoastPhase1Posting.ts
          server/services/accounting/goldenCoastPhase1PostingBatch.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/partnerAccountingPhase1.test.ts \
            server/partnerAccountingPhase1.ts \
            server/routes/core/permissionBoundaryRoutes.ts \
            server/routes/goldenCoastAccountingRoutes.ts \
            server/services/accounting/goldenCoastPhase1Posting.ts \
            server/services/accounting/goldenCoastPhase1PostingBatch.test.ts
          git commit -m "chore: format Golden Coast Phase 1 files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
