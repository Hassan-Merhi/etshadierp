name: God Files Wave 5 Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  publish:
    if: github.event.pull_request.base.ref == 'agent/god-files-final-wave1-tests' && github.event.pull_request.head.ref == 'tmp/god-files-wave5-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0

      - name: Reconcile exact current main
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff -X ours origin/main
          git checkout origin/main -- \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Apply Wave 5 model splits
        run: node scripts/tmp-god-files-wave5.mjs split

      - name: Preserve render-local pending-proforma dialog
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/tmp-god-files-wave5-dialogs.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const needle = '    const usedModel = modelNames.filter((name) => referenced(text, name));';
          const replacement = `    if (\n      target.path.endsWith("FactoryPendingInvoiceVerify.tsx") &&\n      /\\b(?:activeProformaName|activeProformaId|proformaLines)\\b/.test(text)\n    ) {\n      console.log(\`WAVE5_DIALOG_SKIP ${target.path}: render-local proforma values\`);\n      continue;\n    }\n${needle}`;
          if (!source.includes(needle)) throw new Error('Wave 5 dialog insertion point not found');
          source = source.replace(needle, replacement);
          fs.writeFileSync(file, source);
          NODE

      - name: Extract Wave 5 dialog presentation blocks
        run: node scripts/tmp-god-files-wave5-dialogs.mjs

      - name: Extract Wave 5 tail presentation blocks
        run: node scripts/tmp-god-files-wave5-tail.mjs

      - name: Rebase relative imports moved into Wave 5 modules
        shell: bash
        run: |
          sed -i 's#"\./factoryinvoicedetail/#"./#g' client/src/pages/factory/factoryinvoicedetail/useFactoryInvoiceDetailModel.tsx
          sed -i 's#"\./baleshistory/#"./#g' client/src/pages/factory/baleshistory/useBalesHistoryModel.tsx
          sed -i 's#"\./factorypendinginvoiceverify/#"./#g' client/src/pages/factory/factorypendinginvoiceverify/useFactoryPendingInvoiceVerifyModel.tsx
          find client/src/pages/factory/factoryinvoicedetail/components -type f -name '*.tsx' -print0 | xargs -0 -r sed -i 's#"\./factoryinvoicedetail/#"../#g'
          find client/src/pages/factory/baleshistory/components -type f -name '*.tsx' -print0 | xargs -0 -r sed -i 's#"\./baleshistory/#"../#g'
          find client/src/pages/factory/factorypendinginvoiceverify/components -type f -name '*.tsx' -print0 | xargs -0 -r sed -i 's#"\./factorypendinginvoiceverify/#"../#g'

      - name: Format cumulative changed source
        shell: bash
        run: |
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|js|jsx|mjs|cjs)$' || true
          )
          printf 'Formatting %s cumulative changed source file(s).\n' "${#changed_files[@]}"
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi

      - name: Recalibrate live Wave 5 ratchets
        run: |
          node scripts/tmp-god-files-wave5.mjs finalize
          node scripts/tmp-god-files-wave5-doc-fix.mjs
          node scripts/tmp-god-files-wave5-type-fix.mjs
          node node_modules/prettier/bin/prettier.cjs --write \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md

      - name: Certify Wave 5 architecture and static contracts
        shell: bash
        run: |
          for file in \
            client/src/pages/factory/FactoryInvoiceDetail.tsx \
            client/src/pages/factory/factoryinvoicedetail/useFactoryInvoiceDetailModel.tsx \
            client/src/pages/factory/BalesHistory.tsx \
            client/src/pages/factory/baleshistory/useBalesHistoryModel.tsx \
            client/src/pages/factory/FactoryPendingInvoiceVerify.tsx \
            client/src/pages/factory/factorypendinginvoiceverify/useFactoryPendingInvoiceVerifyModel.tsx; do
            count=$(wc -l < "$file")
            echo "$file: $count lines"
            test "$count" -le 900
          done

          npm run audit:god-files
          npm run audit:doc-index
          npm run audit:source-text-assertions
          npm run audit:type-escapes
          npm run check

          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"
          fi

      - name: Run canonical static-build chain
        shell: bash
        run: |
          npm run verify:lockfile
          npm run verify:production-dependencies
          npm run lint
          npm run audit:lint-ratchet
          npm run check
          npm run build
          npm run verify:server-bundle
          npm run verify:observability
          npm run verify:final-production-readiness
          npm run verify:bandwidth

      - name: Publish cumulative Wave 5 and self-remove
        run: |
          rm -f \
            .github/workflows/god-files-wave4-static-diagnostic.yml \
            .github/workflows/god-files-wave5-publisher.yml \
            scripts/tmp-god-files-wave5.mjs \
            scripts/tmp-god-files-wave5-dialogs.mjs \
            scripts/tmp-god-files-wave5-tail.mjs \
            scripts/tmp-god-files-wave5-doc-fix.mjs \
            scripts/tmp-god-files-wave5-type-fix.mjs \
            .wave5-trigger \
            .wave5-trigger-2 \
            .wave5-trigger-3 \
            .wave5-trigger-4 \
            .wave5-trigger-5 \
            .wave5-trigger-6 \
            .wave5-trigger-7
          git add -A
          git commit -m "refactor(god-files): complete cumulative wave 5 on current main"
          git push origin HEAD:agent/god-files-final-wave1-tests
          git push origin --delete tmp/god-files-wave5-trigger || true
