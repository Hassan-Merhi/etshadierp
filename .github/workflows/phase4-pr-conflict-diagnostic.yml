name: Phase 4 PR Conflict Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 4 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Diagnose merge with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main --depth=200
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "MERGE_CLEAN"
            git merge --abort || true
            exit 0
          fi
          echo "CONFLICT_FILES_BEGIN"
          git diff --name-only --diff-filter=U
          echo "CONFLICT_FILES_END"
          echo "CONFLICT_MARKERS_BEGIN"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "===== $file ====="
            git checkout --conflict=merge -- "$file" || true
            grep -n -C 4 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
          done < <(git diff --name-only --diff-filter=U)
          echo "CONFLICT_MARKERS_END"
          git merge --abort || true
          exit 0
