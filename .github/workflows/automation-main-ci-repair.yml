name: Automation Main CI Repair

on:
  push:
    branches:
      - fix/main-ci-green-20260812

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm
      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Apply deterministic repairs
        shell: bash
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/rental/rentalPaymentAllocationService.ts \
            server/services/rental/rentalPeriodService.ts
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          path = root / 'server/routes/factory/employee-pos/netPositionHistoricalCorrection.ts'
          text = path.read_text()
          old = '        const companyId = Number((req.session as any).factoryCompanyId || (req.session as any).currentCompanyId || 0);'
          new = '''        const session = req.session as typeof req.session & {
            factoryCompanyId?: number;
            currentCompanyId?: number;
          };
          const companyId = Number(session.factoryCompanyId || session.currentCompanyId || 0);'''
          if old in text:
              path.write_text(text.replace(old, new, 1))

          path = root / 'config/type-escape-boundaries.json'
          data = json.loads(path.read_text())
          baseline = data['scan']['baseline']
          if baseline.get('client/src/pages/StockEntryHistory.tsx') == [21, 0, 0]:
              baseline['client/src/pages/StockEntryHistory.tsx'] = [19, 0, 0]
          if baseline.get('client/src/pages/StockInSalesReport.tsx') == [1, 0, 0]:
              baseline.pop('client/src/pages/StockInSalesReport.tsx')
          if baseline.get('client/src/pages/StockInSalesReportDetail.tsx') == [1, 0, 0]:
              baseline.pop('client/src/pages/StockInSalesReportDetail.tsx')
          if data['totals']['typeEscapeCeiling'] == 8836:
              data['totals']['typeEscapeCeiling'] = 8832
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          path = root / 'docs/god-file-split-program.md'
          text = path.read_text().replace('**Backlog: 49 files, 25,437 lines over the limit**', '**Backlog: 49 files, 25,419 lines over the limit**')
          path.write_text(text)

          path = root / 'docs/system-quality-program.md'
          text = path.read_text()
          text = text.replace('| Type escapes (AST) | 8,836 total |', '| Type escapes (AST) | 8,832 total |')
          text = text.replace('| God-file backlog | 49 files, 25,437 excess lines |', '| God-file backlog | 49 files, 25,419 excess lines |')
          path.write_text(text)
          PY
          rm .github/workflows/automation-main-ci-repair.yml
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore main CI formatting and ratchets"
          git push
