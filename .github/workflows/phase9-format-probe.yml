name: Phase 9 formatting probe

on:
  push:
    branches:
      - agent/phase-9-final-release
    paths:
      - "client/src/components/AppTopBar.tsx"
      - ".github/workflows/phase9-format-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Print exact formatted top bar
        run: |
          node node_modules/prettier/bin/prettier.cjs --write client/src/components/AppTopBar.tsx
          echo '---BEGIN_FORMATTED_APP_TOP_BAR---'
          cat client/src/components/AppTopBar.tsx
          echo '---END_FORMATTED_APP_TOP_BAR---'
