name: One-shot Phase 5 formatting repair

on:
  push:
    branches:
      - quality-audit-integration-20260808
    paths:
      - ".github/workflows/repair-phase5-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality-audit-integration-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - name: Format changed source files
        shell: bash
        run: |
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          fi
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- client/src server shared tests scripts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared tests scripts
          git commit -m "Format Phase 5 changed source"
          git push origin HEAD:quality-audit-integration-20260808
