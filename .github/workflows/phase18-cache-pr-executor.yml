name: Phase 18 Cache PR Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
jobs:
  execute:
    if: github.event.pull_request.head.ref == 'agent/phase18-cache-executor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {ref: agent/phase18-cache-executor, fetch-depth: 0}
      - name: Guard result
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[phase18-cache-result]'; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Recover and compiler-gate cached source results
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          git fetch origin '+refs/heads/agent/phase18-*:refs/remotes/origin/agent/phase18-*' || true
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          batch_base=$(git rev-parse HEAD); start=$(count); kept=0
          mapfile -t branches < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/agent/phase18-*result*' | sort -u)
          for branch in "${branches[@]}"; do
            checkpoint=$(git rev-parse HEAD); current=$(count); base=$(git merge-base HEAD "$branch" || true); [ -n "$base" ] || continue
            git diff --binary "$base" "$branch" -- client/src server shared >/tmp/candidate.patch
            [ -s /tmp/candidate.patch ] || continue
            set +e; git apply --3way /tmp/candidate.patch >/tmp/apply.log 2>&1; arc=$?; set -e
            if [ "$arc" -ne 0 ]; then git reset --hard "$checkpoint"; git clean -fd -- client/src server shared; continue; fi
            if git diff --quiet -- client/src server shared && git diff --cached --quiet -- client/src server shared; then git reset --hard "$checkpoint"; continue; fi
            after=$(count)
            if [ "$after" -ge "$current" ]; then git reset --hard "$checkpoint"; git clean -fd -- client/src server shared; continue; fi
            git add client/src server shared; git commit -m "refactor: recover ${branch#origin/} [phase18-cache-batch]"; kept=$((kept+1)); echo "KEPT $branch $current->$after"
          done
          echo "CACHE_BATCH kept=$kept $start->$(count)"
          green=0
          for attempt in $(seq 1 16); do
            set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then green=1; echo "CACHE_COMPILER_GREEN attempt=$attempt"; break; fi
            mapfile -t errs < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
            echo "CACHE_ROLLBACK attempt=$attempt error_files=${#errs[@]}"
            if [ "${#errs[@]}" -eq 0 ]; then git reset --hard "$batch_base"; break; fi
            changed=0
            for f in "${errs[@]}"; do
              if git diff --quiet "$batch_base" HEAD -- "$f"; then continue; fi
              git checkout "$batch_base" -- "$f"; changed=$((changed+1))
            done
            if [ "$changed" -eq 0 ]; then git reset --hard "$batch_base"; break; fi
            git add client/src server shared; git commit -m "refactor: rollback incompatible cached files pass $attempt"
          done
          [ "$green" -eq 1 ] || npm run check
          final=$(count); echo "CACHE_FINAL $start->$final"
          if [ "$final" -ge "$start" ]; then echo 'No strict improvement'; exit 1; fi
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/final.json; set -e
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/final.json','utf8'));
          fs.writeFileSync('phase18-cache-report.md',['# Phase 18 Cache Result','',`Type escapes: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,''].join('\n'));
          NODE
          git add phase18-cache-report.md
          git commit -m 'chore: publish compiler-green Phase 18 cache result [phase18-cache-result]'
          git push origin HEAD:agent/phase18-cache-executor
