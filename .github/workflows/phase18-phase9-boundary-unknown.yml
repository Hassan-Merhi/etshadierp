name: Phase 18 Wave 2 Phase 9 Boundary Unknown Typing
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  boundary-typing:
    if: github.event.pull_request.head.ref == 'agent/phase18-wave2-remaining-current'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/phase18-wave2-remaining-current
          fetch-depth: 0
      - name: Guard certified result
        id: guard
        shell: bash
        run: |
          if [ -f phase18-phase9-boundary-report.md ] && grep -Fq 'Certification: full TypeScript compiler green; selected difficult boundary typing exhausted.' phase18-phase9-boundary-report.md; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Narrow difficult client error boundaries safely
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          audit(){ set +e; node scripts/audit-type-escapes.mjs --json >"$1" 2>/dev/null; set -e; }
          audit /tmp/before.json
          before_total=$(node -e "const r=require('/tmp/before.json');process.stdout.write(String(r.summary.typeEscapeTotal))")
          before_any=$(node -e "const r=require('/tmp/before.json');process.stdout.write(String(r.summary.explicitAny))")
          base=$(git rev-parse HEAD)
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Phase 9 expected boundary not found: {label}')
              return text.replace(old, new, 1)

          p = Path('client/src/lib/factoryApi.ts')
          s = p.read_text()
          s = replace_required(
              s,
              '''    const error: any = new Error(payload?.message || "Failed to preview post-offload cost impact");
              error.status = previewResponse.status;''',
              '''    const error = Object.assign(new Error(payload?.message || "Failed to preview post-offload cost impact"), {
                status: previewResponse.status,
              });''',
              'factory preview error'
          )
          s = replace_required(
              s,
              '''    const cancelled: any = new Error("Post-offload charge save cancelled.");
              cancelled.name = "UserCancelled";
              cancelled._handledGlobally = true;''',
              '''    const cancelled = Object.assign(new Error("Post-offload charge save cancelled."), {
                name: "UserCancelled",
                _handledGlobally: true,
              });''',
              'factory cancellation error'
          )
          s = replace_required(s, 'const onlineOnlyError: any = new Error(', 'const onlineOnlyError = new Error(', 'factory online-only error')
          p.write_text(s)

          p = Path('client/src/lib/queryClient.ts')
          s = p.read_text()
          s = replace_required(
              s,
              '''    // Create error with structured data for proper handling
              const error: any = new Error(errorData.message || res.statusText);
              error.status = res.status;
              // Machine-readable failure reason. Several endpoints answer with a stable
              // `code` alongside the prose message and callers need to branch on it —
              // dropping it here forced them to match on message text instead.
              error.code = errorData.code;
              error.requiresConfirmation = errorData.requiresConfirmation;
              error.employeeBalance = errorData.employeeBalance;
              error.ledgerBalance = errorData.ledgerBalance;
              error.notInProforma = errorData.notInProforma;
              error.overloaded = errorData.overloaded;''',
              '''    // Preserve the structured API error fields without erasing the Error type.
              const error = Object.assign(new Error(errorData.message || res.statusText), {
                status: res.status,
                code: errorData.code,
                requiresConfirmation: errorData.requiresConfirmation,
                employeeBalance: errorData.employeeBalance,
                ledgerBalance: errorData.ledgerBalance,
                notInProforma: errorData.notInProforma,
                overloaded: errorData.overloaded,
              });''',
              'query structured API error'
          )
          s = replace_required(s, 'function isNetworkError(error: any): boolean {', 'function isNetworkError(error: unknown): boolean {', 'query network signature')
          s = replace_required(s, '  const msg: string = error?.message ?? "";', '  const msg = getErrorDetails(error).optionalMessage ?? "";', 'query network message')
          s = replace_required(
              s,
              'const offlineError: any = new Error(`Saved offline — will sync when connected`);',
              'const offlineError = Object.assign(new Error(`Saved offline — will sync when connected`), { description });',
              'query offline constructor'
          )
          s = replace_required(s, '      offlineError.description = description;\n', '', 'query offline description assignment')
          p.write_text(s)
          PY
          node node_modules/prettier/bin/prettier.cjs --write client/src/lib/factoryApi.ts client/src/lib/queryClient.ts
          set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
          if [ "$rc" -ne 0 ]; then
            cat /tmp/check.log
            git reset --hard "$base"
            echo 'Phase 9 candidate was compiler-breaking and was reverted.'
            exit 1
          fi
          audit /tmp/after.json
          after_total=$(node -e "const r=require('/tmp/after.json');process.stdout.write(String(r.summary.typeEscapeTotal))")
          after_any=$(node -e "const r=require('/tmp/after.json');process.stdout.write(String(r.summary.explicitAny))")
          if [ "$after_any" -ge "$before_any" ] || [ "$after_total" -ge "$before_total" ]; then
            git reset --hard "$base"
            echo "Phase 9 did not improve safely: explicit-any $before_any->$after_any total $before_total->$after_total"
            exit 1
          fi
          git add client/src/lib/factoryApi.ts client/src/lib/queryClient.ts
          git commit -m 'refactor: narrow Phase 9 client error boundaries [phase18-phase9] [skip ci]'
          git push origin HEAD:agent/phase18-wave2-remaining-current
          audit /tmp/final.json
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/final.json','utf8'));
          fs.writeFileSync('phase18-phase9-boundary-report.md',['# Phase 18 Wave 2 — Phase 9 Difficult Boundary Typing','',`Type escapes after Phase 9: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,`Files with escapes: ${r.summary.filesWithEscapes}`,'','Scope: compiler-safe narrowing of difficult client error/network boundaries to concrete Error shapes and unknown.','Certification: full TypeScript compiler green; selected difficult boundary typing exhausted.',''].join('\n'));
          NODE
          git add phase18-phase9-boundary-report.md
          git commit -m 'chore: certify Phase 9 difficult boundary typing [phase18-phase9-result]'
          git push origin HEAD:agent/phase18-wave2-remaining-current