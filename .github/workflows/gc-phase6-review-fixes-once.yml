name: GC Phase 6 Review Fixes Once

on:
  push:
    branches:
      - agent/golden-coast-special-location-deduction

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/golden-coast-special-location-deduction
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit
      - name: Apply exact reviewed fixes
        shell: python
        run: |
          from pathlib import Path

          route = Path("server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.ts")
          text = route.read_text()
          needle = '''  return matches[0];
          }

          async function activeSubTypeAccount'''
          replacement = '''  const account = matches[0];
          if (!definition.acceptedAccountTypes.includes(account.accountType)) {
            throw new GoldenCoastPhase6RouteError(
              `Golden Coast role ${role} must use account type ${definition.acceptedAccountTypes.join(" or ")}; account "${account.name}" is ${account.accountType}`,
              "GC_PHASE6_ROLES_INVALID",
              409
            );
          }
          return account;
          }

          async function activeSubTypeAccount'''
          if "definition.acceptedAccountTypes.includes(account.accountType)" not in text:
            if needle not in text:
              raise SystemExit("canonical role return anchor not found")
            text = text.replace(needle, replacement, 1)

          revenue_term = 'sum.plus(new Decimal(line.qty).times(new Decimal(line.unitPriceUsd)))'
          if "times(new Decimal(line.unitPriceUsd)).toDecimalPlaces(2)" not in text:
            if revenue_term not in text:
              raise SystemExit("preflight revenue expression not found")
            text = text.replace(
              revenue_term,
              'sum.plus(new Decimal(line.qty).times(new Decimal(line.unitPriceUsd)).toDecimalPlaces(2))',
              1,
            )
          route.write_text(text)

          fixture = Path("tests/helpers/goldenCoastPhase5Fixture.ts")
          text = fixture.read_text()
          old_url = 'export const GOLDEN_COAST_PHASE5_SALE_URL = "/api/sp/golden-coast/phase5/pos-sale";'
          new_url = 'export const GOLDEN_COAST_PHASE5_SALE_URL = "/api/sp/golden-coast/phase6/pos-sale";'
          if new_url not in text:
            if old_url not in text:
              raise SystemExit("Phase 5 fixture URL not found")
            text = text.replace(old_url, new_url, 1)

          if 'subType: "gc_hassan_savings"' not in text:
            stock_start = text.find("  const stockInHandAccountId = await insertLedgerAccount({")
            if stock_start < 0:
              raise SystemExit("Stock in Hand fixture start not found")
            stock_end = text.find("  });", stock_start)
            if stock_end < 0:
              raise SystemExit("Stock in Hand fixture end not found")
            stock_end += len("  });")
            hassan_block = '''
          await insertLedgerAccount({
            companyId: ctx.companyId,
            code: "GC-HSAV",
            name: "Hassan Savings",
            accountType: "Loans",
            subType: "gc_hassan_savings",
          });'''
            text = text[:stock_end] + hassan_block + text[stock_end:]
          fixture.write_text(text)
      - name: Format reviewed files and retire workflow
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.ts \
            tests/helpers/goldenCoastPhase5Fixture.ts
          rm .github/workflows/gc-phase6-review-fixes-once.yml
      - name: Commit reviewed fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.ts \
            tests/helpers/goldenCoastPhase5Fixture.ts \
            .github/workflows/gc-phase6-review-fixes-once.yml
          git commit -m "fix(gc): address Phase 6 review findings"
          git push origin HEAD:agent/golden-coast-special-location-deduction
