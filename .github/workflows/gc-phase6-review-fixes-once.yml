name: GC Phase 6 Review Fixes Once

on:
  push:
    branches:
      - agent/golden-coast-special-location-deduction

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/golden-coast-special-location-deduction
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit
      - name: Apply exact reviewed fixes
        shell: python
        run: |
          from pathlib import Path

          route = Path("server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.ts")
          text = route.read_text()

          needle = '''  return matches[0];
          }

          async function activeSubTypeAccount'''
          replacement = '''  const account = matches[0];
          if (!definition.acceptedAccountTypes.includes(account.accountType)) {
            throw new GoldenCoastPhase6RouteError(
              `Golden Coast role ${role} must use account type ${definition.acceptedAccountTypes.join(" or ")}; account "${account.name}" is ${account.accountType}`,
              "GC_PHASE6_ROLES_INVALID",
              409
            );
          }
          return account;
          }

          async function activeSubTypeAccount'''
          if needle not in text:
            raise SystemExit("canonical role return anchor not found")
          text = text.replace(needle, replacement, 1)

          revenue_term = 'sum.plus(new Decimal(line.qty).times(new Decimal(line.unitPriceUsd)))'
          if revenue_term not in text:
            raise SystemExit("preflight revenue expression not found")
          text = text.replace(
            revenue_term,
            'sum.plus(new Decimal(line.qty).times(new Decimal(line.unitPriceUsd)).toDecimalPlaces(2))',
            1,
          )
          route.write_text(text)

          fixture = Path("tests/helpers/goldenCoastPhase5Fixture.ts")
          text = fixture.read_text()
          old_url = 'export const GOLDEN_COAST_PHASE5_SALE_URL = "/api/sp/golden-coast/phase5/pos-sale";'
          if old_url not in text:
            raise SystemExit("Phase 5 fixture URL not found")
          text = text.replace(old_url, 'export const GOLDEN_COAST_PHASE5_SALE_URL = "/api/sp/golden-coast/phase6/pos-sale";', 1)

          stock_block = '''  const stockInHandAccountId = await insertLedgerAccount({
            companyId: ctx.companyId,
            code: "SP-STOCK",
            name: "Stock in Hand",
            accountType: "Asset",
            subType: "sp_stock",
          });
          '''
          hassan_block = '''  await insertLedgerAccount({
            companyId: ctx.companyId,
            code: "GC-HSAV",
            name: "Hassan Savings",
            accountType: "Loans",
            subType: "gc_hassan_savings",
          });
          '''
          if "subType: \"gc_hassan_savings\"" not in text:
            if stock_block not in text:
              raise SystemExit("Stock in Hand fixture anchor not found")
            text = text.replace(stock_block, stock_block + hassan_block, 1)
          fixture.write_text(text)

          test = Path("server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.test.ts")
          text = test.read_text()
          marker = '''  it("allows only one active positive-deduction location", () => {
            expect(routeSource).toContain("CAST(${locations.supplierPartnerPayableDeductionPerQty} AS numeric) > 0");
            expect(routeSource).toContain("Golden Coast allows exactly one special deduction location");
          });
          '''
          addition = marker + '''
          it("fails closed when a canonical account has an incompatible account type", () => {
            expect(routeSource).toContain("definition.acceptedAccountTypes.includes(account.accountType)");
            expect(routeSource).toContain("GC_PHASE6_ROLES_INVALID");
          });

          it("matches Phase 5 revenue by rounding each sale line to cents before summing", () => {
            expect(routeSource).toContain("times(new Decimal(line.unitPriceUsd)).toDecimalPlaces(2)");
          });
          '''
          if "matches Phase 5 revenue by rounding each sale line" not in text:
            if marker not in text:
              raise SystemExit("Phase 6 route test anchor not found")
            text = text.replace(marker, addition, 1)
          test.write_text(text)
      - name: Format and verify reviewed files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.ts \
            server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.test.ts \
            tests/helpers/goldenCoastPhase5Fixture.ts
          npx vitest run \
            server/services/accounting/goldenCoastPhase6SpecialLocationDeduction.test.ts \
            server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.test.ts
          rm .github/workflows/gc-phase6-review-fixes-once.yml
      - name: Commit reviewed fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.ts \
            server/routes/sp/spGoldenCoastPhase6PosSaleRoutes.test.ts \
            tests/helpers/goldenCoastPhase5Fixture.ts \
            .github/workflows/gc-phase6-review-fixes-once.yml
          git commit -m "fix(gc): address Phase 6 review findings"
          git push origin HEAD:agent/golden-coast-special-location-deduction
