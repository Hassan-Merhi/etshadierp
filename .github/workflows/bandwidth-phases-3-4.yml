name: Bandwidth phases 3-4

on:
  push:
    branches:
      - bandwidth-phases-1-2
  pull_request:
    branches:
      - main
    paths:
      - "client/src/components/PaginationBar.tsx"
      - "client/src/hooks/useDebouncedValue.ts"
      - "client/src/hooks/useStockItemSearch.ts"
      - "client/src/pages/LocationInventory.tsx"
      - "client/src/pages/location-inventory/**"
      - "client/src/pages/pos/POSPriceList.tsx"
      - "client/src/pages/pos/pospricelist/types.ts"
      - "client/src/pages/vouchers/StockTransferForm.tsx"
      - "server/lib/pagination.ts"
      - "server/routes/inventory/**"
      - "server/routes/location/locationInventoryRoutes.ts"
      - "server/routes/location/locationInventoryPaging.ts"
      - "server/routes/stock/stockLightRoutes.ts"
      - "server/routes/stock/transfer-adj/price-list.ts"
      - "server/routes/stock/transfer-adj/posPriceListPaging.ts"
      - "server/startup-schema/011-bandwidth-search-indexes.ts"
      - "shared/schema/inventory.ts"
      - "scripts/enforce-bandwidth-phases-3-4-backend.py"
      - "scripts/enforce-bandwidth-phases-3-4-frontend.py"
      - "scripts/update-startup-schema-integrity.mts"
      - "scripts/verify-bandwidth-phases-3-4.mjs"
      - "tests/bandwidth-phases-3-4.test.ts"
      - "tests/startup-schema-integrity.test.ts"
      - ".github/workflows/bandwidth-phases-3-4.yml"

permissions:
  contents: write

concurrency:
  group: bandwidth-phases-3-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'bandwidth-phases-1-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: bandwidth-phase-3-4-ci
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bandwidth-phases-1-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply Phase 3-4 backend implementation
        run: python scripts/enforce-bandwidth-phases-3-4-backend.py

      - name: Apply Phase 3-4 frontend implementation
        run: python scripts/enforce-bandwidth-phases-3-4-frontend.py

      - name: Update startup schema integrity pin
        run: node node_modules/tsx/dist/cli.mjs scripts/update-startup-schema-integrity.mts

      - name: Format changed files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/PaginationBar.tsx \
            client/src/hooks/useDebouncedValue.ts \
            client/src/hooks/useStockItemSearch.ts \
            client/src/pages/LocationInventory.tsx \
            client/src/pages/location-inventory/AllItemsView.tsx \
            client/src/pages/location-inventory/CombinedStockView.tsx \
            client/src/pages/location-inventory/StockGroupItemsView.tsx \
            client/src/pages/location-inventory/useCombinedStockRows.ts \
            client/src/pages/location-inventory/useLocationInventoryQueries.ts \
            client/src/pages/location-inventory/useStockGroupSummaries.ts \
            client/src/pages/pos/POSPriceList.tsx \
            client/src/pages/pos/pospricelist/types.ts \
            client/src/pages/vouchers/StockTransferForm.tsx \
            server/lib/pagination.ts \
            server/routes/inventory/inventoryQueryService.ts \
            server/routes/inventory/inventoryRequestContext.ts \
            server/routes/location/locationInventoryPaging.ts \
            server/routes/location/locationInventoryRoutes.ts \
            server/routes/stock/stockLightRoutes.ts \
            server/routes/stock/transfer-adj/posPriceListPaging.ts \
            server/routes/stock/transfer-adj/price-list.ts \
            server/startup-schema/011-bandwidth-search-indexes.ts \
            server/startup-schema/index.ts \
            shared/schema/inventory.ts \
            tests/bandwidth-phases-3-4.test.ts \
            tests/startup-schema-integrity.test.ts \
            scripts/verify-bandwidth-phases-3-4.mjs

      - name: Verify Phase 3-4 contracts
        run: node scripts/verify-bandwidth-phases-3-4.mjs

      - name: Focused regression tests
        run: node node_modules/vitest/vitest.mjs run tests/bandwidth-phases-3-4.test.ts tests/startup-schema-integrity.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Type-check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit completed Phase 3-4 implementation
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Phase 3-4 branch already contains the completed implementation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/PaginationBar.tsx \
            client/src/hooks/useDebouncedValue.ts \
            client/src/hooks/useStockItemSearch.ts \
            client/src/pages/LocationInventory.tsx \
            client/src/pages/location-inventory/AllItemsView.tsx \
            client/src/pages/location-inventory/CombinedStockView.tsx \
            client/src/pages/location-inventory/StockGroupItemsView.tsx \
            client/src/pages/location-inventory/useCombinedStockRows.ts \
            client/src/pages/location-inventory/useLocationInventoryQueries.ts \
            client/src/pages/location-inventory/useStockGroupSummaries.ts \
            client/src/pages/pos/POSPriceList.tsx \
            client/src/pages/pos/pospricelist/types.ts \
            client/src/pages/vouchers/StockTransferForm.tsx \
            server/routes/inventory/inventoryQueryService.ts \
            server/routes/inventory/inventoryRequestContext.ts \
            server/routes/location/locationInventoryRoutes.ts \
            server/routes/stock/transfer-adj/price-list.ts \
            server/startup-schema/index.ts \
            shared/schema/inventory.ts \
            tests/startup-schema-integrity.test.ts
          git commit -m "Complete bandwidth stock inventory and POS phases"
          git push origin HEAD:bandwidth-phases-1-2
