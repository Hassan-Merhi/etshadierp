name: Remote support Phase 7 audit UI wiring

on:
  push:
    branches:
      - agent/remote-support-phase-7-audit-protection
  pull_request:
    branches:
      - agent/remote-support-phase-6-keyboard-control

permissions:
  contents: write

concurrency:
  group: remote-support-phase7-audit-ui
  cancel-in-progress: false

jobs:
  wire:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-7-audit-protection'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-7-audit-protection
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Wire audit filter and stable watched-user identity
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("client/src/pages/settings/AuditLog.tsx")
          text = p.read_text()
          if '{ label: "Remote Support", value: "remote_support" }' not in text:
              anchor = '  { label: "Settings / Permissions", value: "settings_change,permission_change" },\n'
              if anchor not in text:
                  raise SystemExit("Audit action option anchor missing")
              text = text.replace(
                  anchor,
                  anchor + '  { label: "Remote Support", value: "remote_support" },\n',
                  1,
              )
          if 'const remoteSupportAudit = filterAction === "remote_support";' not in text:
              anchor = "  const { data, isLoading, error, refetch, isFetching } = useQuery({\n"
              if anchor not in text:
                  raise SystemExit("Audit useQuery anchor missing")
              text = text.replace(
                  anchor,
                  '  const remoteSupportAudit = filterAction === "remote_support";\n\n' + anchor,
                  1,
              )
          text = text.replace(
              '      "/api/audit-log",\n      activeCompanyId,',
              '      remoteSupportAudit ? "/api/screen-feed/control/audit" : "/api/audit-log",\n      activeCompanyId,',
              1,
          )
          old = '''      const params = new URLSearchParams({
              action: filterAction === "all" ? "all" : filterAction,
              module: filterModule,
              search: debouncedSearch,
              from: filterDateFrom,
              to: filterDateTo,
              page: page.toString(),
              limit: "50",
            });
            const res = await apiRequest("GET", `/api/audit-log?${params.toString()}`);
          '''
          new = '''      const params = new URLSearchParams({
              ...(remoteSupportAudit
                ? {}
                : {
                    action: filterAction === "all" ? "all" : filterAction,
                    module: filterModule,
                  }),
              search: debouncedSearch,
              from: filterDateFrom,
              to: filterDateTo,
              page: page.toString(),
              limit: "50",
            });
            const endpoint = remoteSupportAudit
              ? "/api/screen-feed/control/audit"
              : "/api/audit-log";
            const res = await apiRequest("GET", `${endpoint}?${params.toString()}`);
          '''
          if 'const endpoint = remoteSupportAudit' not in text:
              if old not in text:
                  raise SystemExit("Audit query block missing")
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path("client/src/pages/settings/WatchUserDialog.tsx")
          text = p.read_text()
          if 'data-watched-user-id={String(userId)}' not in text:
              anchor = '        data-testid="dialog-watch-user"\n'
              if anchor not in text:
                  raise SystemExit("Watch dialog anchor missing")
              text = text.replace(
                  anchor,
                  anchor + '        data-watched-user-id={String(userId)}\n',
                  1,
              )
          p.write_text(text)

          for path in [
              "client/src/components/RemoteMouseControllerOverlay.tsx",
              "client/src/components/RemoteKeyboardControllerOverlay.tsx",
          ]:
              p = Path(path)
              text = p.read_text()
              if "dataset.watchedUserId" in text:
                  continue
              start = text.index("function matchingSession(")
              end = text.index("\n}\n", start) + 3
              block = text[start:end]
              return_type = "ControllerSessionView" if "ControllerSessionView" in block else "RemoteControlSessionView"
              replacement = f'''function matchingSession(sessions: {return_type}[]): {return_type} | null {{
                const dialog = findWatchDialog();
                const watchedUserId = dialog?.dataset.watchedUserId;
                const dialogText = dialog?.textContent ?? "";
                return (
                  sessions.find((session) => watchedUserId && session.targetUserId === watchedUserId) ??
                  sessions.find((session) => dialogText.includes(session.targetUsername)) ??
                  sessions[0] ??
                  null
                );
              }}
          '''
              text = text[:start] + replacement + text[end:]
              p.write_text(text)
          PY
      - name: Format and type-check
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/settings/AuditLog.tsx \
            client/src/pages/settings/WatchUserDialog.tsx \
            client/src/components/RemoteMouseControllerOverlay.tsx \
            client/src/components/RemoteKeyboardControllerOverlay.tsx \
            server/routes/remoteSupportAuditRoutes.ts
          npm run check
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client server
          git commit -m "feat(remote-support): expose company-scoped support audit history"
          git push --no-verify origin HEAD:agent/remote-support-phase-7-audit-protection
