name: PR 780 format repair

on:
  push:
    branches:
      - agent/god-files-recovery-latest-main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Normalize registry and install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Format changed authored files with repository Prettier
        run: |
          git fetch origin main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi

      - name: Commit mechanical formatting and remove repair workflow
        run: |
          git rm .github/workflows/pr780-format-repair.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared tests scripts .github/workflows/pr780-format-repair.yml
          git commit -m "Format God Files recovery diff"
          git push origin HEAD:agent/god-files-recovery-latest-main
