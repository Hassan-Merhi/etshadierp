name: Phase 1 Circle static diagnostic

on:
  push:
    branches:
      - agent/phase-1-restore-green-main

permissions:
  contents: write

jobs:
  diagnose:
    if: "${{ !contains(github.event.head_commit.message, 'style: format stock transfer CI tests') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Apply exact Circle formatting fix
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/stock-transfer-lifecycle.test.ts \
            tests/stock-transfer-revision-lifecycle.test.ts
          if git diff --quiet -- \
            tests/stock-transfer-lifecycle.test.ts \
            tests/stock-transfer-revision-lifecycle.test.ts; then
            echo "The Circle-scoped test files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/stock-transfer-lifecycle.test.ts tests/stock-transfer-revision-lifecycle.test.ts
          git commit -m "style: format stock transfer CI tests"
          git push origin HEAD:agent/phase-1-restore-green-main
