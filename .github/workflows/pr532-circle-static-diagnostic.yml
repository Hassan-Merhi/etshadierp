name: PR 532 Circle static diagnostic

on:
  push:
    branches:
      - agent/audit-phase-1a-restore-green-main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Verify lockfile
        run: npm run verify:lockfile
      - name: Verify production dependencies
        run: npm run verify:production-dependencies
      - name: Verify server bundle
        run: |
          npm run build
          npm run verify:server-bundle
      - name: Program 1 observability
        run: npm run verify:program1-observability
      - name: Final production readiness
        run: npm run verify:final-production-readiness
      - name: Bandwidth contract
        run: npm run verify:bandwidth
