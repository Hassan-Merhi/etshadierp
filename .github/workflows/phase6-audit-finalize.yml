name: Phase 6 Audit Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Format Phase 6 audit files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/factory/postOffloadPhase6Audit.ts \
            server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts \
            tests/factory-post-offload-phase6-safety-repair.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/factory/postOffloadPhase6Audit.ts \
            server/routes/factory/raw-stock/postOffloadPhase6SafetyRoutes.ts \
            tests/factory-post-offload-phase6-safety-repair.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Phase 6: format lifecycle audit wiring"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Type-check
        run: npm run check
