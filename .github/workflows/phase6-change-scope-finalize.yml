name: Phase 6 Change Scope Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Separate protected scope from actual changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server/services/factory/postOffloadPhase6Safety.ts")
          text = path.read_text()
          text = text.replace(
              "  blockedBatches: number;\n  totalWritableRows: number;",
              "  blockedBatches: number;\n  supplierRateChanges: number;\n  actualChangeRows: number;\n  totalWritableRows: number;",
          )
          text = text.replace(
              "function scopeCounts(scope: ReplayWriteScope): PostOffloadPhase6ScopeCounts {\n  const totalWritableRows =",
              "function scopeCounts(\n  scope: ReplayWriteScope,\n  supplierRateChanges = 0\n): PostOffloadPhase6ScopeCounts {\n  const nonSupplierChangeRows =\n    scope.containerIdsToUpdate.length +\n    scope.rawStockIdsToUpdate.length +\n    scope.sourceIdsToUpdate.length +\n    scope.batchIdsToUpdate.length +\n    scope.availableBaleIdsToUpdate.length;\n  const totalWritableRows =",
          )
          text = text.replace(
              "    blockedBatches: scope.blockedBatches.length,\n    totalWritableRows,",
              "    blockedBatches: scope.blockedBatches.length,\n    supplierRateChanges,\n    actualChangeRows: nonSupplierChangeRows + supplierRateChanges,\n    totalWritableRows,",
          )
          text = text.replace(
              "    const selectedSupplierIds = scope.supplierIds;\n    const counts = scopeCounts(scope);",
              "    const selectedSupplierIds = scope.supplierIds;\n    const supplierRateChanges = preview\n      ? preview.supplierRows.filter(\n          (supplier) =>\n            selectedSupplierIds.includes(supplier.supplierId) &&\n            Math.abs(supplier.endingExpectedRate - supplier.currentStoredRate) > 0.00000001\n        ).length\n      : 0;\n    const counts = scopeCounts(scope, supplierRateChanges);",
          )
          text = text.replace(
              "      hasHistoricalRepairWork: counts.totalWritableRows > 0,",
              "      hasHistoricalRepairWork: counts.actualChangeRows > 0,",
          )
          text = text.replace(
              "      counts.totalWritableRows > 0;",
              "      counts.actualChangeRows > 0;",
          )
          text = text.replace(
              "  totalWritableRows: number;\n  blockers: string[];",
              "  actualChangeRows: number;\n  blockers: string[];",
          )
          text = text.replace(
              "  if (params.integrityIssueCount > 0 || params.totalWritableRows > 0) return \"repair_required\";",
              "  if (params.integrityIssueCount > 0 || params.actualChangeRows > 0) return \"repair_required\";",
          )
          text = text.replace(
              "      totalWritableRows: counts.totalWritableRows,\n      blockers,",
              "      actualChangeRows: counts.actualChangeRows,\n      blockers,",
          )
          path.write_text(text)

          test = Path("tests/factory-post-offload-phase6-safety-repair.test.ts")
          test_text = test.read_text()
          test_text = test_text.replace(
              '    expect(service).toContain(\'"ready" | "repair_required" | "blocked"\');',
              '    expect(service).toContain(\'"ready" | "repair_required" | "blocked"\');\n    expect(service).toContain("actualChangeRows");\n    expect(service).toContain("supplierRateChanges");',
          )
          test.write_text(test_text)
          PY

      - name: Format files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/factory/postOffloadPhase6Safety.ts \
            tests/factory-post-offload-phase6-safety-repair.test.ts

      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/factory/postOffloadPhase6Safety.ts tests/factory-post-offload-phase6-safety-repair.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Phase 6: distinguish exact scope from actual cost changes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Type-check
        run: npm run check
