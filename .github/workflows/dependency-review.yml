name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.actor != 'github-actions[bot]'
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply repository Prettier rules
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch origin "${base_sha}" --depth=1
          mapfile -t changed_files < <(
            git diff --name-only "${base_sha}...HEAD" -- \
              'client/src/**/*.ts' 'client/src/**/*.tsx' 'client/src/**/*.css' \
              'server/**/*.ts' 'server/**/*.tsx' 'server/**/*.css' \
              'shared/**/*.ts' 'shared/**/*.tsx' 'shared/**/*.css' \
              'tests/**/*.ts' 'tests/**/*.tsx' 'tests/**/*.css' \
              'scripts/**/*.mjs'
          )
          if (( ${#changed_files[@]} > 0 )); then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi

      - name: Commit formatting to the pull request branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared tests scripts
          git commit -m "chore: apply phase 14 prettier"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
