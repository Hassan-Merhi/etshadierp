name: Final i18n release closeout

on:
  push:
    branches:
      - agent/final-closeout-i18n-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/final-closeout-i18n-release
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final i18n closeout
        run: python scripts/final-closeout-i18n-runner.py
      - name: Format changed files
        shell: bash
        run: |
          if [ -f /tmp/final-closeout-i18n-files.txt ]; then
            mapfile -t files < /tmp/final-closeout-i18n-files.txt
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          fi
      - name: Validate release caps and typecheck
        shell: bash
        run: |
          node scripts/audit-i18n-phase14.mjs --json-out /tmp/i18n-after.json --markdown-out /tmp/i18n-after.md
          python - <<'PY'
          import json
          pre=json.load(open('/tmp/final-closeout-runner-post.json'))
          report=json.load(open('/tmp/i18n-after.json'))
          def key(f):
              return (f['file'], f['line'], f['kind'], f.get('name'), f['text'], f['module'])
          pre_inventory={key(f) for f in pre['findings'] if f['status']=='actionable' and f['module']=='inventory-logistics'}
          post_inventory={key(f) for f in report['findings'] if f['status']=='actionable' and f['module']=='inventory-logistics'}
          introduced=sorted(post_inventory-pre_inventory)
          removed=sorted(pre_inventory-post_inventory)
          if introduced or removed:
              print('Formatter inventory audit delta:')
              print('Introduced:', introduced)
              print('Removed:', removed)
          caps={'backend-messages':0,'inventory-logistics':1381,'sales-pos':776,'shared-ui':0,'supplier-partner':0}
          current={k:report['modules'][k]['actionable'] for k in caps}
          print('Release counts:', current)
          bad={k:(current[k],caps[k]) for k in caps if current[k] > caps[k]}
          if bad: raise SystemExit(f'Release caps not met: {bad}')
          PY
          npm run check
      - name: Commit closeout changes
        shell: bash
        run: |
          rm -f scripts/final-closeout-i18n-once.py scripts/final-closeout-i18n-runner.py .github/workflows/final-closeout-i18n.yml .github/workflows/final-closeout-i18n-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No closeout changes to commit"
            exit 0
          fi
          git commit -m "fix: complete final i18n release closeout"
          git push origin HEAD:agent/final-closeout-i18n-release
