name: Phase 6 Sync Stacked Base

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/mobile-responsive-phase-6-core-erp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 6 head
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phase-6-core-erp
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge Phase 5 ancestry and finalize metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/mobile-responsive-phase-5-tables-data-lists
          git merge --no-ff --no-edit origin/agent/mobile-responsive-phase-5-tables-data-lists \
            -m "Merge latest Phase 5 into Phase 6"
          rm -f .github/phase6-sync-trigger.txt
          rm -f .github/workflows/phase6-sync-stacked-base.yml
          python <<'PY'
          from pathlib import Path
          path = Path("docs/mobile-responsive-phase-status.md")
          text = path.read_text()
          text = text.replace(
              "`agent/mobile-responsive-phase-6-core-erp` / PR pending",
              "`agent/mobile-responsive-phase-6-core-erp` / PR #430",
          )
          path.write_text(text)
          PY
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Phase 6: finalize stacked branch metadata"
          fi
          git push origin HEAD:agent/mobile-responsive-phase-6-core-erp
