name: Wave H Backend Smoke Diagnostic

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-backend-smoke-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase2-backend-smoke-diagnostic
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "22.23.2", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Run API smoke sweep
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          node node_modules/vitest/vitest.mjs run tests/api-smoke-sweep.test.ts --maxWorkers=1 --no-file-parallelism 2>&1 | tee /tmp/backend-smoke.log
      - name: Record diagnostic and self-remove
        if: always()
        run: |
          tail -n 300 /tmp/backend-smoke.log > phase2-backend-smoke-diagnostic.txt || true
          printf '\nSmoke outcome: %s\n' '${{ steps.smoke.outcome }}' >> phase2-backend-smoke-diagnostic.txt
          rm -f .github/workflows/wave-h-backend-smoke-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-backend-smoke-diagnostic.txt .github/workflows/wave-h-backend-smoke-diagnostic.yml
          git commit -m "test: record Wave H backend smoke diagnostic"
          git push origin HEAD:wave-i/convergence-automation
