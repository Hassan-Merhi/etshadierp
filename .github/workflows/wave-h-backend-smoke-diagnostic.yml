name: Wave H Coverage Measurement

on:
  push:
    branches: [agent/wave-h-coverage-completion]
    paths:
      - .github/workflows/wave-h-backend-smoke-diagnostic.yml

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: wave-h-coverage-measurement
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/wave-h-coverage-completion
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Measure backend coverage with the sharded verifier
        id: backend
        continue-on-error: true
        run: npm run test:backend:verify:coverage
      - name: Measure frontend coverage
        id: frontend
        continue-on-error: true
        run: npm run test:frontend:coverage
      - name: Record exact measurement and self-remove
        if: always()
        env:
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const readPct = (file) => {
            if (!fs.existsSync(file)) return { pct: null, covered: null, total: null };
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const lines = report.total?.lines;
            return {
              pct: typeof lines?.pct === 'number' ? lines.pct : null,
              covered: typeof lines?.covered === 'number' ? lines.covered : null,
              total: typeof lines?.total === 'number' ? lines.total : null,
            };
          };

          const backend = readPct('coverage/backend/coverage-summary.json');
          const frontend = readPct('coverage/frontend/coverage-summary.json');
          const result = {
            measuredAtSha: process.env.GITHUB_SHA,
            backendLinesPct: backend.pct,
            backendCoveredLines: backend.covered,
            backendTotalLines: backend.total,
            backendTargetPct: 35,
            frontendLinesPct: frontend.pct,
            frontendCoveredLines: frontend.covered,
            frontendTotalLines: frontend.total,
            frontendTargetPct: 20,
            backendStep: process.env.BACKEND_OUTCOME,
            frontendStep: process.env.FRONTEND_OUTCOME,
            backendPassed: backend.pct !== null && backend.pct >= 35 && process.env.BACKEND_OUTCOME === 'success',
            frontendPassed: frontend.pct !== null && frontend.pct >= 20 && process.env.FRONTEND_OUTCOME === 'success',
          };
          result.passed = result.backendPassed && result.frontendPassed;
          fs.writeFileSync('wave-h-measurement-result.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(result);
          NODE

          rm -f .github/workflows/wave-h-backend-smoke-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wave-h-measurement-result.json .github/workflows/wave-h-backend-smoke-diagnostic.yml
          git commit -m "test(wave-h): record exact coverage measurement"
          git push origin HEAD:agent/wave-h-coverage-completion
