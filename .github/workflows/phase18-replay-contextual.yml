name: Phase 18 Replay Contextual Types
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  replay:
    if: contains(github.event.head_commit.message, '[phase18-replay-contextual]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-before.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-before.json
          set -e
      - name: Replay compiler-proven contextual-symbol commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/phase18-contextual-symbol-result
          set +e
          git cherry-pick -X ours e32556ec2e222fca5101c0a425f883edaa4cdf1c
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            if [ -n "$conflicts" ]; then
              while IFS= read -r f; do [ -n "$f" ] || continue; git checkout --ours -- "$f"; git add "$f"; done <<< "$conflicts"
              GIT_EDITOR=true git cherry-pick --continue || { git cherry-pick --abort || true; exit 0; }
            elif git diff --cached --quiet && git diff --quiet; then
              git cherry-pick --skip || true
              exit 0
            else
              git cherry-pick --abort || true
              exit 0
            fi
          fi
      - name: Require green compiler and strict improvement
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-after.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-after.json
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const tb=JSON.parse(fs.readFileSync('/tmp/type-before.json','utf8'));
          const ta=JSON.parse(fs.readFileSync('/tmp/type-after.json','utf8'));
          const count=p=>{const r=JSON.parse(fs.readFileSync(p,'utf8'));let w=0,a=0,e=0;for(const f of r)for(const m of f.messages){if(m.severity===2)e++;if(m.severity===1)w++;if(m.ruleId==='@typescript-eslint/no-explicit-any')a++;}return{w,a,e}};
          const lb=count('/tmp/lint-before.json'),la=count('/tmp/lint-after.json');
          console.log('TYPE '+tb.summary.typeEscapeTotal+' -> '+ta.summary.typeEscapeTotal);
          console.log('LINT '+JSON.stringify(lb)+' -> '+JSON.stringify(la));
          if(la.e!==0 || ta.summary.typeEscapeTotal>=tb.summary.typeEscapeTotal || la.a>=lb.a) process.exit(1);
          NODE
      - name: Rebase and push verified gain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
