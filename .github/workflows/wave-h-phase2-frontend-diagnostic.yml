name: Wave H Phase 2 Frontend Diagnostic

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-phase2-frontend-diagnostic.yml
      - tests/ui/wave-h-zero-coverage-surfaces.test.tsx

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wave-i/convergence-automation
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Run focused tests
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/wave-h-zero-coverage-surfaces.test.tsx --maxWorkers=1 --no-file-parallelism 2>&1 | tee phase2-frontend-diagnostic.txt
      - name: Commit diagnostic
        run: |
          printf '\nFocused outcome: %s\n' '${{ steps.focused.outcome }}' >> phase2-frontend-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- phase2-frontend-diagnostic.txt
          git commit -m "test: record Wave H frontend diagnostic"
          git push origin HEAD:wave-i/convergence-automation
      - name: Preserve failure signal
        if: steps.focused.outcome != 'success'
        run: exit 1
