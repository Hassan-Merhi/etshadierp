name: Phase 5 repair

on:
  push:
    branches:
      - agent/factory-production-bonus-payroll-phase4

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/factory-production-bonus-payroll-phase4
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts
      - name: Patch production dependency audit
        run: npm audit fix --omit=dev --package-lock-only || true
      - name: Format Phase 1-5 changed source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/BaleStockEntry.tsx \
            client/src/pages/factory/FactoryPayroll.tsx \
            client/src/pages/factory/ProductionPlannerDialog.tsx \
            client/src/pages/factory/bale-stock-entry/ProductionPositionsTab.tsx \
            client/src/pages/factory/bale-stock-entry/StockEntryProductionPositions.tsx \
            client/src/pages/factory/bale-stock-entry/StockEntryTab.tsx \
            client/src/pages/factory/factorypayroll/ProductionBonusDecisionPanel.tsx \
            client/src/pages/factory/factorypayrolltab/components/BatchRow.tsx \
            client/src/i18n/backendMessagesPhase7Translations.part10.ts \
            client/src/i18n/backendMessagesPhase7Translations.ts \
            server/routes/factory-payroll/exports.ts \
            server/routes/factory-payroll/production-bonuses.ts \
            server/routes/factory-payroll/reads.ts \
            server/routes/factory-payroll/update.ts \
            server/routes/factory/employee-pos/pos-financial/index.ts \
            server/routes/factory/employee-pos/pos-financial/production-positions.ts \
            server/routes/factory/productionPositionPlannerRoutes.ts \
            server/routes/factory/stock/stockEntryRoutes.ts \
            server/routes/factoryRoutes.ts \
            server/routes/payroll/core/mark-paid.ts \
            server/routes/payroll/core/payment-summary-pdf.ts \
            server/routes/payroll/core/reads.ts \
            server/services/factory/stockEntryProductionAttribution.ts \
            server/services/payroll/productionBonusPayrollService.ts \
            server/startup-schema/012-production-positions.ts \
            server/startup-schema/index.ts \
            shared/schema/factory/bale-production-attribution.ts \
            shared/schema/factory/index.ts \
            shared/schema/factory/production-positions.ts \
            scripts/audit-i18n-phase14.mjs \
            tests/phase7-backend-messages-translations.test.ts \
            tests/production-bonus-preview.test.ts
      - name: Verify repaired gates
        run: |
          npm run check
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/pages/factory/BaleStockEntry.tsx \
            client/src/pages/factory/FactoryPayroll.tsx \
            client/src/pages/factory/ProductionPlannerDialog.tsx \
            client/src/pages/factory/bale-stock-entry/ProductionPositionsTab.tsx \
            client/src/pages/factory/bale-stock-entry/StockEntryProductionPositions.tsx \
            client/src/pages/factory/bale-stock-entry/StockEntryTab.tsx \
            client/src/pages/factory/factorypayroll/ProductionBonusDecisionPanel.tsx \
            client/src/pages/factory/factorypayrolltab/components/BatchRow.tsx \
            client/src/i18n/backendMessagesPhase7Translations.part10.ts \
            client/src/i18n/backendMessagesPhase7Translations.ts \
            server/routes/factory-payroll/exports.ts \
            server/routes/factory-payroll/production-bonuses.ts \
            server/routes/factory-payroll/reads.ts \
            server/routes/factory-payroll/update.ts \
            server/routes/factory/employee-pos/pos-financial/index.ts \
            server/routes/factory/employee-pos/pos-financial/production-positions.ts \
            server/routes/factory/productionPositionPlannerRoutes.ts \
            server/routes/factory/stock/stockEntryRoutes.ts \
            server/routes/factoryRoutes.ts \
            server/routes/payroll/core/mark-paid.ts \
            server/routes/payroll/core/payment-summary-pdf.ts \
            server/routes/payroll/core/reads.ts \
            server/services/factory/stockEntryProductionAttribution.ts \
            server/services/payroll/productionBonusPayrollService.ts \
            server/startup-schema/012-production-positions.ts \
            server/startup-schema/index.ts \
            shared/schema/factory/bale-production-attribution.ts \
            shared/schema/factory/index.ts \
            shared/schema/factory/production-positions.ts \
            scripts/audit-i18n-phase14.mjs \
            tests/phase7-backend-messages-translations.test.ts \
            tests/production-bonus-preview.test.ts
          npm run verify:dependency-audit
          node scripts/audit-i18n-phase14.mjs
      - name: Commit generated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json client server shared scripts tests
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Phase 5: apply audit, formatting and dependency repairs"
          git push origin HEAD:agent/factory-production-bonus-payroll-phase4
