name: Temporary Voucher Prettier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Print Prettier diff
        run: |
          node node_modules/prettier/bin/prettier.cjs --write server/routes/voucher-entries/reads.ts
          git diff -- server/routes/voucher-entries/reads.ts
