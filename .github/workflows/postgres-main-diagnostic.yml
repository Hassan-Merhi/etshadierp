name: Postgres Main Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-regression:
    if: github.event.pull_request.head.ref == 'diagnostic/postgres-main-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      SESSION_SECRET: diagnostic-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify disposable database schema
        run: node scripts/verify-ci-disposable-schema.mjs
      - name: Prior failing backend suites
        shell: bash
        run: |
          set +e
          node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism \
            tests/rental-payment-accounting-reconciliation.test.ts \
            tests/reports.test.ts \
            tests/whatsapp-triggers.test.ts \
            tests/accounting.test.ts \
            tests/canonical-pos-sale-journal.test.ts \
            tests/factory-insurance-company-isolation.test.ts \
            tests/factory-post-offload-impact-preview.test.ts \
            tests/god-file-boundaries.test.ts \
            tests/insurance-write-routes.test.ts \
            tests/inventory.test.ts \
            tests/pdf-invoice.test.ts \
            tests/pos.test.ts \
            tests/post-offload-charge-mutation-positive-path.test.ts \
            tests/route-manifest.test.ts \
            tests/source-text-assertions.test.ts \
            tests/toolchain-and-script-inventory.test.ts \
            tests/toolchain-coherence-audit.test.ts \
            tests/type-escape-boundaries.test.ts \
            tests/vouchers.test.ts \
            tests/workflow.test.ts 2>&1 | tee backend-vitest.log
          status=${PIPESTATUS[0]}
          echo "backend_status=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload backend report
        uses: actions/upload-artifact@v6
        with:
          name: backend-vitest-report
          path: backend-vitest.log
      - name: Fail if backend tests failed
        run: test "${backend_status}" -eq 0
