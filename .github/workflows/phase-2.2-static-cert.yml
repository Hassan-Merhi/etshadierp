name: Phase 2.2 Static Certification

on:
  push:
    branches:
      - phase-2.2-frontend-type-safety
    paths:
      - .github/workflows/phase-2.2-static-cert.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.2-frontend-type-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture static diagnostics
        shell: bash
        run: |
          set +e
          npm run check > /tmp/typecheck.log 2>&1
          ts_status=$?
          npm run lint > /tmp/lint.log 2>&1
          lint_status=$?
          npm run audit:type-escapes > /tmp/ratchet.log 2>&1
          ratchet_status=$?
          npm run build > /tmp/build.log 2>&1
          build_status=$?
          set -e
          {
            echo "TypeScript status: ${ts_status}"
            echo "Lint status: ${lint_status}"
            echo "Ratchet status: ${ratchet_status}"
            echo "Build status: ${build_status}"
            echo
            echo "===== TYPESCRIPT ====="
            cat /tmp/typecheck.log
            echo
            echo "===== LINT ====="
            cat /tmp/lint.log
            echo
            echo "===== RATCHET ====="
            cat /tmp/ratchet.log
            echo
            echo "===== BUILD ====="
            cat /tmp/build.log
          } > phase-2.2-static-diagnostics.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase-2.2-static-diagnostics.txt
          git commit -m "chore: capture Phase 2.2 static diagnostics"
          git push origin HEAD:phase-2.2-frontend-type-safety
