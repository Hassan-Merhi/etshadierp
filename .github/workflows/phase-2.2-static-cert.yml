name: Phase 2.2 Static Certification

on:
  push:
    branches:
      - phase-2.2-frontend-type-safety
    paths:
      - .github/workflows/phase-2.2-static-cert.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.2-frontend-type-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Phase 2.2 changed source
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main HEAD -- client/src | grep -E '\.(ts|tsx)$' || true)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- client/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src
          git commit -m "style: format Phase 2.2 frontend changes"
          git push origin HEAD:phase-2.2-frontend-type-safety
      - name: TypeScript
        run: npm run check 2>&1 | tee /tmp/typecheck.log
      - name: ESLint
        run: npm run lint 2>&1 | tee /tmp/lint.log
      - name: Type escape ratchet
        run: npm run audit:type-escapes
      - name: Build
        run: npm run build 2>&1 | tee /tmp/build.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2.2-static-diagnostics
          path: |
            /tmp/typecheck.log
            /tmp/lint.log
            /tmp/build.log
          if-no-files-found: ignore
