name: Phase 3 Apply

on:
  push:
    branches:
      - codex/voucher-idempotency-phase3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/voucher-idempotency-phase3
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Apply Phase 3 infrastructure migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text()

          def write(path, text):
              (ROOT / path).write_text(text)

          def ensure_import(path, import_line):
              text = read(path)
              if import_line not in text:
                  text = import_line + "\n" + text
                  write(path, text)

          insert_re = re.compile(
              r'(?P<indent>^[ \t]*)const \[(?P<var>[A-Za-z_$][\w$]*)\] = await (?P<db>tx|db)\s*'
              r'\.insert\((?:schema\.)?vouchers\)\s*'
              r'\.values\((?P<values>.*?)\)\s*'
              r'\.returning\(\);',
              re.M | re.S,
          )

          def source_for(path, values):
              if path.endswith('_payrollAccountingHelper.ts'):
                  return ('infrastructurePostingIdentity("payroll-generation", `${companyId}:${periodStart}:${periodEnd}`, "rebuild")', '{ workerRows, totalNet, totalAdvances }')
              if path.endswith('charge-vouchers.ts'):
                  if 'DUTY-' in values:
                      return ('infrastructurePostingIdentity("container-offload-charge", `${companyId}:${container.id}`, "duties")', '{ amount: input.duties, accountId: input.dutiesAccountId }')
                  if 'OFFICE-' in values:
                      return ('infrastructurePostingIdentity("container-offload-charge", `${companyId}:${container.id}`, "office")', '{ amount: input.officeCharges, accountId: input.officeChargesAccountId, cashAccountId: input.officeChargesCashAccountId }')
                  if 'TRANS-' in values:
                      return ('infrastructurePostingIdentity("container-offload-charge", `${companyId}:${container.id}`, "transport")', '{ amount: input.transportFees, accountId: creditAccountId }')
                  if 'XFER-' in values:
                      return ('infrastructurePostingIdentity("container-offload-charge", `${companyId}:${container.id}`, "transfer")', '{ amount: input.transferCharges, accountId: payableId }')
                  if 'CHG-' in values:
                      return ('infrastructurePostingIdentity("container-offload-charge", `${companyId}:${container.id}:${chargeIndex}`, "additional")', '{ charge }')
              if path.endswith('sp-journals.ts'):
                  if 'SP-OTW-REV-' in values:
                      return ('infrastructurePostingIdentity("sp-container-offload", `${container.companyId}:${container.id}`, "otw-reversal")', '{ totalOtw, purchaseOrders }')
                  if 'SP-STOCK-' in values:
                      return ('infrastructurePostingIdentity("sp-container-offload", `${container.companyId}:${container.id}`, "stock-recognition")', '{ totalOtw }')
                  if 'SP-AGENT-SETTLE-' in values:
                      return ('infrastructurePostingIdentity("sp-container-offload", `${container.companyId}:${container.id}`, "agent-settlement")', '{ validAgentLines, totalAgentAmount }')
                  if 'SP-AGENT-ERP-' in values:
                      return ('infrastructurePostingIdentity("sp-container-offload", `${container.companyId}:${container.id}`, "parent-agent")', '{ validAgentLines, totalAgentAmount, parentCompanyId }')
              if path.endswith('post-offload-charge/apply.ts'):
                  if 'inserted.id' in values:
                      return ('infrastructurePostingIdentity("factory-post-offload-charge", `${companyId}:${containerId}:${inserted.id}`, "create")', '{ chargeData, accountingCtx }')
                  if 'chargeId' in values:
                      return ('infrastructurePostingIdentity("factory-post-offload-charge", `${companyId}:${containerId}:${chargeId}`, "edit")', '{ chargeData, accountingCtx }')
                  return ('infrastructurePostingIdentity("factory-post-offload-charge", `${companyId}:${containerId}`, "voucher")', 'params')
              if path.endswith('createSaleVoucher.ts'):
                  return ('infrastructurePostingIdentity("pos-sale", `${companyId}:${clientSaleId || voucherNumber}`, "sales-voucher")', 'params')
              if path.endswith('rentalPaymentPostingService.ts'):
                  phase = 'advance-recognition' if 'ADV-REC-' in values else 'payment'
                  source_expr = 'String(companyId) + ":" + String(groupId)'
                  return (f'infrastructurePostingIdentity("rental-payment", {source_expr}, "{phase}")', '{ allocs, totalAmountStr, cashAccountId, currency, exchangeRate }')
              if path.endswith('fiscal-periods.ts'):
                  return ('infrastructurePostingIdentity("fiscal-period", `${companyId}:${periodStartDate}:${periodEndDate}`, "close")', '{ retainedEarningsAccountId, accountBalances, netIncome }')
              if path.endswith('containers-store/offload.ts'):
                  if 'DUTY-' in values:
                      phase = 'duties'
                  elif 'OFFICE-' in values:
                      phase = 'office'
                  elif 'TRANS-' in values:
                      phase = 'transport'
                  elif 'XFER-' in values:
                      phase = 'transfer'
                  elif 'CHG-' in values:
                      phase = 'additional'
                  else:
                      phase = 'voucher'
                  source_expr = 'String(location.companyId) + ":" + String(containerId)'
                  if phase == 'additional':
                      source_expr += ' + ":" + String(chargeIndex)'
                  return (f'infrastructurePostingIdentity("container-offload", {source_expr}, "{phase}")', '{ duties, officeCharges, transferCharges, transportFees, additionalCharges }')
              if path.endswith('purchase-orders.ts'):
                  phase = 'parent-intercompany' if 'INTERCO-PARENT-' in values else 'purchase'
                  company_expr = 'parentCompany.id' if phase == 'parent-intercompany' else 'po.companyId'
                  source_expr = f'String({company_expr}) + ":" + String(created.poNumber)'
                  return (f'infrastructurePostingIdentity("purchase-order", {source_expr}, "{phase}")', 'po')
              if path.endswith('accounting/vouchers.ts'):
                  return ('infrastructurePostingIdentity("storage-voucher", `${voucher.companyId}:${voucher.voucherNumber}`, "create")', 'voucher')
              raise RuntimeError(f'No identity rule for {path}: {values[:120]}')

          def migrate_inserts(path):
              text = read(path)
              count = 0
              def repl(match):
                  nonlocal count
                  count += 1
                  indent = match.group('indent')
                  var = match.group('var')
                  db_name = match.group('db')
                  values = match.group('values').strip()
                  source, payload = source_for(path, values)
                  fn = 'insertInfrastructureVoucherTx' if db_name == 'tx' else 'insertInfrastructureVoucher'
                  return (
                      f'{indent}const {{ voucher: {var} }} = await {fn}(\n'
                      f'{indent}  {db_name},\n'
                      f'{indent}  {values},\n'
                      f'{indent}  {source},\n'
                      f'{indent}  {payload}\n'
                      f'{indent});'
                  )
              text2 = insert_re.sub(repl, text)
              if text2 != text:
                  write(path, text2)
              return count

          imports = {
              'server/routes/payroll/_payrollAccountingHelper.ts': 'import { deleteInfrastructurePostingIdentityForVoucherTx, infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../../services/accounting/infrastructureVoucherIdentity";',
              'server/services/containers/offload-lifecycle/charge-vouchers.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../../accounting/infrastructureVoucherIdentity";',
              'server/services/containers/offload-lifecycle/sp-journals.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../../accounting/infrastructureVoucherIdentity";',
              'server/services/factory/post-offload-charge/apply.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../../accounting/infrastructureVoucherIdentity";',
              'server/services/pos/createSaleVoucher.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../accounting/infrastructureVoucherIdentity";',
              'server/services/rental/rentalPaymentPostingService.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../accounting/infrastructureVoucherIdentity";',
              'server/storage/accounting/fiscal-periods.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../../services/accounting/infrastructureVoucherIdentity";',
              'server/storage/accounting/vouchers.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucher } from "../../services/accounting/infrastructureVoucherIdentity";',
              'server/storage/containers-store/offload.ts': 'import { infrastructurePostingIdentity, insertInfrastructureVoucherTx } from "../../services/accounting/infrastructureVoucherIdentity";',
              'server/storage/containers-store/purchase-orders.ts': 'import { deleteInfrastructurePostingIdentityForVoucher, infrastructurePostingIdentity, insertInfrastructureVoucher } from "../../services/accounting/infrastructureVoucherIdentity";',
          }

          for path, line in imports.items():
              ensure_import(path, line)

          for path, old, new in [
              ('server/services/containers/offload-lifecycle/charge-vouchers.ts', 'for (const charge of input.additionalCharges ?? []) {', 'for (const [chargeIndex, charge] of (input.additionalCharges ?? []).entries()) {'),
              ('server/storage/containers-store/offload.ts', 'for (const charge of additionalCharges) {', 'for (const [chargeIndex, charge] of additionalCharges.entries()) {'),
          ]:
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new, 1))

          totals = {}
          for path in imports:
              totals[path] = migrate_inserts(path)

          path = 'server/routes/payroll/_payrollAccountingHelper.ts'
          text = read(path)
          needle = '    const vIds = existingGenVouchers.map((v: any) => v.id);\n    await tx.delete(voucherEntries).where(inArray(voucherEntries.voucherId, vIds));'
          replacement = '    const vIds = existingGenVouchers.map((v: any) => v.id);\n    for (const voucherId of vIds) {\n      await deleteInfrastructurePostingIdentityForVoucherTx(tx, voucherId);\n    }\n    await tx.delete(voucherEntries).where(inArray(voucherEntries.voucherId, vIds));'
          if needle in text:
              text = text.replace(needle, replacement, 1)
              write(path, text)

          path = 'server/storage/containers-store/purchase-orders.ts'
          text = read(path)
          needle = '  if (po.voucherId) {\n    try {\n      await db.delete(schema.voucherEntries).where(eq(schema.voucherEntries.voucherId, po.voucherId));'
          replacement = '  if (po.voucherId) {\n    try {\n      await deleteInfrastructurePostingIdentityForVoucher(db, po.voucherId);\n      await db.delete(schema.voucherEntries).where(eq(schema.voucherEntries.voucherId, po.voucherId));'
          if needle in text:
              text = text.replace(needle, replacement, 1)
              write(path, text)

          print('Phase 3 insert migrations:', totals)
          PY
      - name: Format migrated files
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          server/services/accounting/infrastructureVoucherIdentity.ts
          server/routes/payroll/_payrollAccountingHelper.ts
          server/services/containers/offload-lifecycle/charge-vouchers.ts
          server/services/containers/offload-lifecycle/sp-journals.ts
          server/services/factory/post-offload-charge/apply.ts
          server/services/pos/createSaleVoucher.ts
          server/services/rental/rentalPaymentPostingService.ts
          server/storage/accounting/fiscal-periods.ts
          server/storage/accounting/vouchers.ts
          server/storage/containers-store/offload.ts
          server/storage/containers-store/purchase-orders.ts
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Phase 3 migration changes left"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/accounting/infrastructureVoucherIdentity.ts \
            server/routes/payroll/_payrollAccountingHelper.ts \
            server/services/containers/offload-lifecycle/charge-vouchers.ts \
            server/services/containers/offload-lifecycle/sp-journals.ts \
            server/services/factory/post-offload-charge/apply.ts \
            server/services/pos/createSaleVoucher.ts \
            server/services/rental/rentalPaymentPostingService.ts \
            server/storage/accounting/fiscal-periods.ts \
            server/storage/accounting/vouchers.ts \
            server/storage/containers-store/offload.ts \
            server/storage/containers-store/purchase-orders.ts
          git commit -m "harden infrastructure voucher writers"
          git -c core.hooksPath=/dev/null push origin HEAD:codex/voucher-idempotency-phase3
