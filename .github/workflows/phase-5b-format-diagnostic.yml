name: Phase 5B Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Generate canonical Prettier output
        run: node node_modules/prettier/bin/prettier.cjs --write server/lib/operationalEvents.ts server/middleware/bandwidthDebug.ts

      - name: Upload canonical files
        uses: actions/upload-artifact@v4
        with:
          name: phase-5b-canonical-format
          path: |
            server/lib/operationalEvents.ts
            server/middleware/bandwidthDebug.ts
          if-no-files-found: error
          retention-days: 1
