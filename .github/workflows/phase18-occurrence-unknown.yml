name: Phase 18 Occurrence-level Unknown Harvest

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[phase18-occurrence-unknown]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Harvest safe any-to-unknown occurrences with TypeScript language service
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          cat >.phase18-occurrence.cjs <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const configPath = ts.findConfigFile(root, ts.sys.fileExists, 'tsconfig.json');
          const configFile = ts.readConfigFile(configPath, ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(configFile.config, ts.sys, path.dirname(configPath));
          const sourceFiles = parsed.fileNames.filter((file) => {
            const rel = path.relative(root, file).replaceAll('\\', '/');
            return /^(client\/src|server|shared)\//.test(rel) && /\.(ts|tsx)$/.test(rel) && !rel.endsWith('.d.ts');
          });
          const state = new Map();
          for (const file of parsed.fileNames) {
            if (!fs.existsSync(file)) continue;
            state.set(path.resolve(file), { text: fs.readFileSync(file, 'utf8'), version: 0 });
          }
          const host = {
            getCompilationSettings: () => parsed.options,
            getScriptFileNames: () => parsed.fileNames,
            getScriptVersion: (file) => String(state.get(path.resolve(file))?.version ?? 0),
            getScriptSnapshot: (file) => {
              const entry = state.get(path.resolve(file));
              if (entry) return ts.ScriptSnapshot.fromString(entry.text);
              if (!fs.existsSync(file)) return undefined;
              return ts.ScriptSnapshot.fromString(fs.readFileSync(file, 'utf8'));
            },
            getCurrentDirectory: () => root,
            getDefaultLibFileName: (options) => ts.getDefaultLibFilePath(options),
            fileExists: ts.sys.fileExists,
            readFile: ts.sys.readFile,
            readDirectory: ts.sys.readDirectory,
            directoryExists: ts.sys.directoryExists,
            getDirectories: ts.sys.getDirectories,
            realpath: ts.sys.realpath,
          };
          const service = ts.createLanguageService(host, ts.createDocumentRegistry());
          function diagnostics(file) {
            const syntactic = service.getSyntacticDiagnostics(file);
            if (syntactic.length) return syntactic;
            return service.getSemanticDiagnostics(file);
          }
          function anyPositions(file, text) {
            const sf = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, file.endsWith('x') ? ts.ScriptKind.TSX : ts.ScriptKind.TS);
            const out = [];
            const visit = (node) => {
              if (node.kind === ts.SyntaxKind.AnyKeyword) out.push({ start: node.getStart(sf), end: node.end });
              ts.forEachChild(node, visit);
            };
            visit(sf);
            return out;
          }
          function apply(original, positions) {
            let text = original;
            const sorted = [...positions].sort((a,b) => b.start - a.start);
            for (const p of sorted) text = text.slice(0, p.start) + 'unknown' + text.slice(p.end);
            return text;
          }
          function setVirtual(file, text) {
            const key = path.resolve(file);
            const entry = state.get(key) ?? { text: fs.readFileSync(file, 'utf8'), version: 0 };
            entry.text = text;
            entry.version += 1;
            state.set(key, entry);
          }
          let totalCandidates = 0, totalAccepted = 0, filesChanged = 0, filesSeen = 0;
          for (const file of sourceFiles) {
            const original = fs.readFileSync(file, 'utf8');
            const positions = anyPositions(file, original);
            if (!positions.length) continue;
            filesSeen += 1;
            totalCandidates += positions.length;
            const accepted = [];
            const testSubset = (subset) => {
              if (!subset.length) return;
              const candidate = apply(original, [...accepted, ...subset]);
              setVirtual(file, candidate);
              const ds = diagnostics(file);
              if (ds.length === 0) {
                accepted.push(...subset);
                return;
              }
              if (subset.length === 1) return;
              const mid = Math.floor(subset.length / 2);
              testSubset(subset.slice(0, mid));
              testSubset(subset.slice(mid));
            };
            testSubset(positions);
            const finalText = apply(original, accepted);
            setVirtual(file, finalText);
            if (accepted.length && diagnostics(file).length === 0) {
              fs.writeFileSync(file, finalText);
              filesChanged += 1;
              totalAccepted += accepted.length;
              console.log(`ACCEPT ${path.relative(root,file).replaceAll('\\','/')} ${accepted.length}/${positions.length}`);
            } else {
              setVirtual(file, original);
            }
          }
          console.log(`OCCURRENCE_SUMMARY candidates=${totalCandidates} accepted=${totalAccepted} filesSeen=${filesSeen} filesChanged=${filesChanged}`);
          fs.writeFileSync('.phase18-occurrence-files', sourceFiles.filter(f => fs.existsSync(f) && fs.readFileSync(f,'utf8') !== state.get(path.resolve(f))?.text ? false : false).join('\n'));
          NODE
          node .phase18-occurrence.cjs
          rm -f .phase18-occurrence.cjs .phase18-occurrence-files
          git add client/src server shared
          git diff --cached --name-only > /tmp/phase18-occurrence-changed
          echo "CHANGED_FILES=$(wc -l < /tmp/phase18-occurrence-changed | tr -d ' ')"
          if git diff --cached --quiet; then exit 0; fi
      - name: Full compiler gate and cross-file rollback
        shell: bash
        run: |
          set -euo pipefail
          green=0
          for attempt in $(seq 1 20); do
            set +e
            npm run check > /tmp/phase18-occurrence-check 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then green=1; echo "FULL_GREEN_ATTEMPT=$attempt"; break; fi
            mapfile -t error_files < <(sed -nE 's#^(.+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/phase18-occurrence-check | sort -u)
            mapfile -t changed_files < <(git diff --cached --name-only)
            reverted=0
            for ef in "${error_files[@]}"; do
              for cf in "${changed_files[@]}"; do
                if [ "$ef" = "$cf" ]; then
                  git restore --source=HEAD --staged --worktree -- "$cf"
                  reverted=$((reverted+1))
                  continue 2
                fi
              done
              # If an unchanged dependent broke, roll back a changed direct relative import.
              if [ -f "$ef" ]; then
                while IFS= read -r spec; do
                  [ -n "$spec" ] || continue
                  case "$spec" in ./*|../*) ;; *) continue ;; esac
                  base="$(dirname "$ef")/$spec"
                  for cand in "$base.ts" "$base.tsx" "$base/index.ts" "$base/index.tsx"; do
                    cand="$(realpath -m --relative-to=. "$cand")"
                    if git diff --cached --name-only | grep -Fxq "$cand"; then
                      git restore --source=HEAD --staged --worktree -- "$cand"
                      reverted=$((reverted+1))
                      break 2
                    fi
                  done
                done < <(grep -oE 'from ["'"'][^"'"']+["'"']' "$ef" | sed -E 's/^from ["'"'](.*)["'"']$/\1/' || true)
              fi
            done
            echo "ROLLBACK_ATTEMPT=$attempt ERROR_FILES=${#error_files[@]} REVERTED=$reverted"
            if [ "$reverted" -eq 0 ]; then tail -n 160 /tmp/phase18-occurrence-check; git reset --hard HEAD; exit 0; fi
            if git diff --cached --quiet; then git reset --hard HEAD; exit 0; fi
          done
          if [ "$green" != 1 ]; then git reset --hard HEAD; exit 0; fi
          git commit -m 'refactor: replace compiler-proven any occurrences with unknown [phase18-occurrence-safe] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
