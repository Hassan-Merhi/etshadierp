name: Remote support Phase 6 repair

on:
  push:
    branches:
      - agent/remote-support-phase-6-keyboard-control
  pull_request:
    branches:
      - agent/remote-support-phase-5-mouse-control

permissions:
  contents: write

concurrency:
  group: remote-support-phase6-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-6-keyboard-control'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-6-keyboard-control
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Apply Phase 6 repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("client/src/hooks/remote-keyboard-control-policy.ts")
          text = p.read_text()
          text = text.replace(
              "function elementDescriptor(element: HTMLElement): string {",
              "function elementDescriptor(element: RemoteEditableElement): string {",
              1,
          )
          text = text.replace(
              "  if (element.disabled || element.readOnly || isProtectedContainer(element)) return false;",
              "  const readOnly =\n    (element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement) &&\n    element.readOnly;\n  if (element.disabled || readOnly || isProtectedContainer(element)) return false;",
              1,
          )
          p.write_text(text)

          p = Path("client/src/pages/settings/WatchUserDialog.tsx")
          text = p.read_text()
          if 'data-watched-user-id={String(userId)}' not in text:
              text = text.replace(
                  '        data-testid="dialog-watch-user"\n',
                  '        data-testid="dialog-watch-user"\n        data-watched-user-id={String(userId)}\n',
                  1,
              )
          p.write_text(text)

          for path in [
              "client/src/components/RemoteMouseControllerOverlay.tsx",
              "client/src/components/RemoteKeyboardControllerOverlay.tsx",
          ]:
              p = Path(path)
              text = p.read_text()
              if "dataset.watchedUserId" in text:
                  continue
              start = text.index("function matchingSession(")
              end = text.index("\n}\n", start) + 3
              block = text[start:end]
              return_type = "ControllerSessionView" if "ControllerSessionView" in block else "RemoteControlSessionView"
              replacement = f'''function matchingSession(sessions: {return_type}[]): {return_type} | null {{
                const dialog = findWatchDialog();
                const watchedUserId = dialog?.dataset.watchedUserId;
                const dialogText = dialog?.textContent ?? "";
                return (
                  sessions.find((session) => watchedUserId && session.targetUserId === watchedUserId) ??
                  sessions.find((session) => dialogText.includes(session.targetUsername)) ??
                  sessions[0] ??
                  null
                );
              }}
          '''
              text = text[:start] + replacement + text[end:]
              p.write_text(text)
          PY
      - name: Format and verify
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/hooks/remote-keyboard-control-policy.ts \
            client/src/pages/settings/WatchUserDialog.tsx \
            client/src/components/RemoteMouseControllerOverlay.tsx \
            client/src/components/RemoteKeyboardControllerOverlay.tsx
          npm run check
          node node_modules/vitest/vitest.mjs run \
            tests/remote-control-session-service.test.ts \
            tests/remote-keyboard-command-service.test.ts \
            --maxWorkers=1 --no-file-parallelism
          node node_modules/vitest/vitest.mjs run \
            --config vitest.config.frontend.ts \
            client/src/hooks/remote-keyboard-control-policy.test.ts \
            --maxWorkers=1 --no-file-parallelism
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client
          git commit -m "fix(remote-support): repair Phase 6 type safety and viewer binding"
          git push --no-verify origin HEAD:agent/remote-support-phase-6-keyboard-control
