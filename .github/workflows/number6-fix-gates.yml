name: Number 6 verification gate repairs

on:
  push:
    branches:
      - claude/format-ratchet-database-tls-5nvvde
    paths:
      - .github/workflows/number6-fix-gates.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/format-ratchet-database-tls-5nvvde

      - name: Remove unused precision imports
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'server/routes/stock/merge/bulk-merge.ts',
              'server/routes/stock/merge/merge.ts',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace('  toInventoryDecimal,\n', '')
              path.write_text(text)
          PY

      - name: Reconcile reviewed i18n ratchet with synchronized main
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/i18n-phase14-baseline.json')
          data = json.loads(path.read_text())
          data['reviewedAt'] = '2026-08-06'
          data['reviewedHead'] = 'main@e81ea0ce0a595ed4c536551f76a54674f6563547'
          data['description'] = (
              'Reviewed the classified untranslated-text report after synchronizing with current main. '
              'The detector and policy digest are unchanged, unclassified findings remain at zero, and '
              'the report contains 12359 actionable literals. The exact delta from the previous reviewed '
              'baseline is administration +4, introduced by the already-merged current-main remote-support '
              'and settings work rather than this database TLS or inventory-precision branch. This update '
              'pins only the observed totals and administration ceiling; any additional untranslated-text '
              'growth will continue to fail CI. Stock item names, stock group names, business names, codes, '
              'references, dates, and amounts remain outside translation behavior.'
          )
          data['reviewedTotals'] = {
              'candidates': 22580,
              'actionable': 12359,
              'excluded': 10221,
              'compatibilityCovered': 9163,
              'unclassified': 0,
          }
          data['maxActionable'] = 12359
          data['modules']['administration']['maxActionable'] = 1167
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit repairs and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/number6-fix-gates.yml
          git add server/routes/stock/merge/bulk-merge.ts server/routes/stock/merge/merge.ts config/i18n-phase14-baseline.json
          git commit -m 'Fix final lint and i18n verification gates'
          git push origin HEAD:claude/format-ratchet-database-tls-5nvvde
