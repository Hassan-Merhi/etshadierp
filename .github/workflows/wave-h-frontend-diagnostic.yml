name: Wave H Frontend Diagnostic

on:
  pull_request:
    branches:
      - main

jobs:
  wave-h-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Run Wave H frontend behavior tests
        run: |
          node node_modules/vitest/vitest.mjs run \
            tests/ui/wave-h-populated-core-pages.test.tsx \
            tests/ui/wave-h-production-bales-behavior.test.tsx \
            --config vitest.config.frontend.ts \
            --maxWorkers=1 \
            --no-file-parallelism
