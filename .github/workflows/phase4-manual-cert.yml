name: Phase 4 Manual Certification

on:
  push:
    branches: [phase-4-remaining-type-safety]

permissions:
  contents: read

concurrency:
  group: phase4-manual-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-4-remaining-type-safety
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:type-escapes
      - run: npm run lint
      - run: git diff --check
