name: Wave H Phase 2 Final Certification

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-phase2-final-certification.yml

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase2-final-coverage-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@v6
        with: { node-version: "22.14.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Backend coverage
        id: coverage
        continue-on-error: true
        run: npm run test:backend:coverage
      - name: Preserve backend result
        if: always()
        run: |
          mkdir -p phase2-backend-final
          cp coverage/backend/coverage-summary.json phase2-backend-final/coverage-summary.json 2>/dev/null || true
          printf '%s\n' '${{ steps.coverage.outcome }}' > phase2-backend-final/outcome.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase2-backend-final
          path: phase2-backend-final
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@v6
        with: { node-version: "22.14.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Frontend coverage
        id: coverage
        continue-on-error: true
        run: npm run test:frontend:coverage
      - name: Preserve frontend result
        if: always()
        run: |
          mkdir -p phase2-frontend-final
          cp coverage/frontend/coverage-summary.json phase2-frontend-final/coverage-summary.json 2>/dev/null || true
          printf '%s\n' '${{ steps.coverage.outcome }}' > phase2-frontend-final/outcome.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase2-frontend-final
          path: phase2-frontend-final
          retention-days: 7

  record:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/download-artifact@v8
        with: { name: phase2-backend-final, path: phase2-backend-final }
      - uses: actions/download-artifact@v8
        with: { name: phase2-frontend-final, path: phase2-frontend-final }
      - name: Build exact Phase 2 certification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const readJson = p => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : null;
          const readText = p => fs.existsSync(p) ? fs.readFileSync(p,'utf8').trim() : 'missing';
          const b = readJson('phase2-backend-final/coverage-summary.json');
          const f = readJson('phase2-frontend-final/coverage-summary.json');
          const result = {
            measuredAtSha: process.env.GITHUB_SHA,
            backendLinesPct: b?.total?.lines?.pct ?? null,
            backendCoveredLines: b?.total?.lines?.covered ?? null,
            backendTotalLines: b?.total?.lines?.total ?? null,
            backendTargetPct: 35,
            frontendLinesPct: f?.total?.lines?.pct ?? null,
            frontendCoveredLines: f?.total?.lines?.covered ?? null,
            frontendTotalLines: f?.total?.lines?.total ?? null,
            frontendTargetPct: 20,
            backendStep: readText('phase2-backend-final/outcome.txt'),
            frontendStep: readText('phase2-frontend-final/outcome.txt')
          };
          result.backendPassed = result.backendStep === 'success' && result.backendLinesPct !== null && result.backendLinesPct >= 35;
          result.frontendPassed = result.frontendStep === 'success' && result.frontendLinesPct !== null && result.frontendLinesPct >= 20;
          result.passed = result.backendPassed && result.frontendPassed;
          fs.writeFileSync('phase2-final-certification-result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Commit result and self-remove
        run: |
          rm -f .github/workflows/wave-h-phase2-final-certification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-final-certification-result.json .github/workflows/wave-h-phase2-final-certification.yml
          git commit -m "test: record final Wave H Phase 2 coverage"
          git push origin HEAD:wave-i/convergence-automation
