name: Phase 18 Current Variable Inference
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[phase18-variable-inference-current]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Infer initialized variable types
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-before.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-before.json
          set -e
          cat > .phase18-variable-infer.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path');
          const root=process.cwd(),cp=ts.findConfigFile(root,ts.sys.fileExists,'tsconfig.json'),cf=ts.readConfigFile(cp,ts.sys.readFile),parsed=ts.parseJsonConfigFileContent(cf.config,ts.sys,path.dirname(cp));
          const files=parsed.fileNames.filter(f=>{const r=path.relative(root,f).replaceAll('\\','/');return /^(client\/src|server|shared)\//.test(r)&&/\.(ts|tsx)$/.test(r)&&!r.endsWith('.d.ts')&&fs.existsSync(f)});
          const state=new Map(parsed.fileNames.filter(fs.existsSync).map(f=>[path.resolve(f),{text:fs.readFileSync(f,'utf8'),version:0}]));
          const host={getCompilationSettings:()=>parsed.options,getScriptFileNames:()=>parsed.fileNames,getScriptVersion:f=>String(state.get(path.resolve(f))?.version??0),getScriptSnapshot:f=>{const e=state.get(path.resolve(f));if(e)return ts.ScriptSnapshot.fromString(e.text);if(fs.existsSync(f))return ts.ScriptSnapshot.fromString(fs.readFileSync(f,'utf8'))},getCurrentDirectory:()=>root,getDefaultLibFileName:o=>ts.getDefaultLibFilePath(o),fileExists:ts.sys.fileExists,readFile:ts.sys.readFile,readDirectory:ts.sys.readDirectory,directoryExists:ts.sys.directoryExists,getDirectories:ts.sys.getDirectories,realpath:ts.sys.realpath};
          const ls=ts.createLanguageService(host,ts.createDocumentRegistry()),set=(f,t)=>{const k=path.resolve(f),e=state.get(k)||{text:fs.readFileSync(f,'utf8'),version:0};e.text=t;e.version++;state.set(k,e)},diags=f=>[...ls.getSyntacticDiagnostics(f),...ls.getSemanticDiagnostics(f)];
          const apply=(text,edits)=>{for(const e of [...edits].sort((a,b)=>b.start-a.start))text=text.slice(0,e.start)+text.slice(e.end);return text};
          let candidates=0,accepted=0,filesChanged=0;
          for(const file of files){const original=fs.readFileSync(file,'utf8'),sf=ts.createSourceFile(file,original,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),edits=[];const v=n=>{if(ts.isVariableDeclaration(n)&&n.type?.kind===ts.SyntaxKind.AnyKeyword&&n.initializer){edits.push({start:n.name.end,end:n.initializer.pos});}ts.forEachChild(n,v)};v(sf);if(!edits.length)continue;candidates+=edits.length;let keep=[];for(const e of edits){const trial=apply(original,[...keep,e]);set(file,trial);if(diags(file).length===0)keep.push(e);else set(file,apply(original,keep));}if(!keep.length){set(file,original);continue}const out=apply(original,keep);set(file,out);if(diags(file).length===0){fs.writeFileSync(file,out);accepted+=keep.length;filesChanged++;console.log(`ACCEPT ${path.relative(root,file).replaceAll('\\','/')} ${keep.length}/${edits.length}`)}else set(file,original)}
          console.log(`VARIABLE_INFERENCE candidates=${candidates} accepted=${accepted} files=${filesChanged}`);
          NODE
          node .phase18-variable-infer.cjs
          rm -f .phase18-variable-infer.cjs
          git diff --name-only -- '*.ts' '*.tsx' >/tmp/changed-files
          test -s /tmp/changed-files
      - name: Full compiler gate
        run: npm run check
      - name: Require strict improvement and publish result
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-after.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-after.json
          set -e
          node - <<'NODE'
          const fs=require('fs'),tb=JSON.parse(fs.readFileSync('/tmp/type-before.json')),ta=JSON.parse(fs.readFileSync('/tmp/type-after.json'));
          const c=p=>{const r=JSON.parse(fs.readFileSync(p));let errors=0,warnings=0,any=0;for(const f of r)for(const m of f.messages){if(m.severity===2)errors++;if(m.severity===1)warnings++;if(m.ruleId==='@typescript-eslint/no-explicit-any')any++;}return{errors,warnings,any}};const b=c('/tmp/lint-before.json'),a=c('/tmp/lint-after.json');
          console.log(`VARIABLE_TYPE ${tb.summary.typeEscapeTotal} -> ${ta.summary.typeEscapeTotal}`);console.log('VARIABLE_LINT '+JSON.stringify(b)+' -> '+JSON.stringify(a));if(a.errors||ta.summary.typeEscapeTotal>=tb.summary.typeEscapeTotal||a.any>=b.any||a.warnings>b.warnings)process.exit(1);
          NODE
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src server shared
          git commit -m 'refactor: infer initialized variable types instead of any [phase18-variable-inference]'
          npm run check
          git push --force origin HEAD:agent/phase18-variable-inference-current-v2
# retriggered 2026-08-18