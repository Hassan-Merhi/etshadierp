name: Phase 1 Pagination Validation

on:
  push:
    branches:
      - agent/phase1-sql-pagination

permissions:
  contents: write

concurrency:
  group: phase1-pagination-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase1-sql-pagination
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed application files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/lib/accountStatementPaginationClient.ts \
            client/src/lib/containerPaginationClient.ts \
            client/src/lib/daybookPaginationClient.ts \
            client/src/lib/erpDaybookPaginationClient.ts \
            client/src/lib/supplierPurchaseOrderPaginationClient.ts \
            client/src/main.tsx \
            server/routes/accountTransactionPaginationRoutes.ts \
            server/routes/containerRoutes.ts \
            server/routes/containers/containerListPaginationRoutes.ts \
            server/routes/daybookPaginationRoutes.ts \
            server/routes/ledgerAccountPaginationRoutes.ts \
            server/routes/ledgerRoutes.ts \
            server/routes/voucherRoutes.ts \
            server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts \
            server/routes/vouchers/voucherPaginationRoutes.ts

      - name: Run validation and record output
        shell: bash
        run: |
          set +e
          mkdir -p docs
          {
            echo "PHASE 1 VALIDATION REPORT"
            echo "commit=$(git rev-parse HEAD)"
            echo
            echo "=== TYPESCRIPT ==="
            npm run check
            CHECK_STATUS=$?
            echo "typescript_status=$CHECK_STATUS"
            echo
            echo "=== STATIC VERIFIER ==="
            node scripts/verify-phase1-sql-pagination.mjs
            VERIFY_STATUS=$?
            echo "verifier_status=$VERIFY_STATUS"
            echo
            echo "=== PRODUCTION BUILD ==="
            npm run build
            BUILD_STATUS=$?
            echo "build_status=$BUILD_STATUS"
            echo
            echo "SUMMARY typescript=$CHECK_STATUS verifier=$VERIFY_STATUS build=$BUILD_STATUS"
          } > docs/phase1-validation-report.txt 2>&1
          cat docs/phase1-validation-report.txt

      - name: Commit formatting, report, and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase1-pagination-validate.yml
          git add client/src server/routes docs/phase1-validation-report.txt
          git commit -m "chore: format and validate Phase 1 pagination"
          git push origin HEAD:agent/phase1-sql-pagination
