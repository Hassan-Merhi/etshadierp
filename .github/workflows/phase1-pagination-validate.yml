name: Phase 1 Pagination Formatter

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: phase1-pagination-formatter-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-and-clean:
    if: github.head_ref == 'agent/phase1-sql-pagination'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry and install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Format Phase 1 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            build/vitePhase1PaginationPlugin.ts \
            client/src/lib/accountStatementPaginationClient.ts \
            client/src/lib/containerPaginationClient.ts \
            client/src/lib/daybookPaginationClient.ts \
            client/src/lib/erpDaybookPaginationClient.ts \
            client/src/lib/supplierPurchaseOrderPaginationClient.ts \
            client/src/main.tsx \
            scripts/verify-phase1-sql-pagination.mjs \
            server/routes/accountTransactionPaginationRoutes.ts \
            server/routes/containerRoutes.ts \
            server/routes/containers/containerListPaginationRoutes.ts \
            server/routes/daybookPaginationRoutes.ts \
            server/routes/ledgerAccountPaginationRoutes.ts \
            server/routes/ledgerRoutes.ts \
            server/routes/voucherRoutes.ts \
            server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts \
            server/routes/vouchers/voucherPaginationRoutes.ts \
            vite.config.ts

      - name: Restore normal CI and remove formatter
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .circleci/config.yml
          git rm .github/workflows/phase1-pagination-validate.yml

      - name: Commit formatted Phase 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build client/src scripts server/routes vite.config.ts .circleci/config.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "chore: format and clean Phase 1 pagination"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
