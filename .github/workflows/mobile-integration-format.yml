name: Format mobile phases 5-10 integration

on:
  push:
    branches:
      - agent/mobile-responsive-phases-5-10-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phases-5-10-integration
          fetch-depth: 0

      - name: Install pinned dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Format changed text files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          mapfile -t files < <(
            git diff --name-only origin/main...HEAD | \
              grep -E '\.(css|js|json|md|mjs|ts|tsx|ya?ml)$' | \
              grep -v '^\.github/workflows/mobile-integration-format.yml$' | \
              grep -v '^\.github/mobile-integration-format-trigger.txt$' || true
          )
          if [ "${#files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          fi
          rm -f .github/workflows/mobile-integration-format.yml
          rm -f .github/mobile-integration-format-trigger.txt
          git add -A
          git commit -m "Format mobile phases 5-10 integration"
          git push origin HEAD:agent/mobile-responsive-phases-5-10-integration
