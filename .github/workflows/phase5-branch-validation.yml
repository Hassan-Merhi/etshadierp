name: Phase 5 Branch Validation

on:
  push:
    branches:
      - agent/mobile-responsive-phase-5-tables-data-lists

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Phase 5 formatting
        run: >-
          node node_modules/prettier/bin/prettier.cjs --check
          client/src/components/ui/table.tsx
          client/src/components/ui/pagination.tsx
          client/src/components/ui/responsive-accessibility.tsx
          client/src/components/ui/responsive-data-list.tsx
          tests/ui/mobile-responsive-phase5-tables-data-lists.test.ts
          scripts/verify-mobile-responsive-phase5-tables.mjs

      - name: Type-check
        run: npm run check

      - name: Verify Phase 5 contracts
        run: node scripts/verify-mobile-responsive-phase5-tables.mjs

      - name: Run focused Phase 5 test
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/ui/mobile-responsive-phase5-tables-data-lists.test.ts
          --maxWorkers=1 --no-file-parallelism
