name: Phase 2.3 Boundary Refactor

on:
  push:
    branches:
      - phase-2-3-api-service-boundary-typing

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[phase23-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply boundary typing batch
        run: node scripts/phase23-boundary-autofix.mjs
      - name: Format touched code
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          "server/routes/factory-intelligence/**/*.ts"
          "server/routes/factory-payroll/**/*.ts"
          "server/routes/factory-workers/**/*.ts"
          "server/routes/factory-reports/**/*.ts"
          "server/routes/container-loaded-items/**/*.ts"
          "server/routes/supplier-profit-check/**/*.ts"
          "server/routes/routeBoundaryTypes.ts"
          "scripts/phase23-boundary-autofix.mjs"
      - name: Ratchet improved type-escape baselines
        run: UPDATE_TYPE_ESCAPE_BASELINE=1 npm run audit:type-escapes
      - name: Refresh boundary inventory
        run: node scripts/phase23-boundary-inventory.mjs --write
      - name: Commit batch for PR certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/factory-intelligence server/routes/factory-payroll server/routes/factory-workers server/routes/factory-reports server/routes/container-loaded-items server/routes/supplier-profit-check server/routes/routeBoundaryTypes.ts scripts/phase23-boundary-autofix.mjs config/type-escape-boundaries.json artifacts/phase23-boundary-inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(types): type route service boundaries [phase23-autofix]"
          git push
      - name: TypeScript certification
        run: npm run check
      - name: ESLint certification
        run: npm run lint
      - name: Verify exact type-escape audit
        run: npm run audit:type-escapes
