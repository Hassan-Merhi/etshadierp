name: Phase 2.3 Boundary Inventory

on:
  push:
    branches:
      - phase-2-3-api-service-boundary-typing

permissions:
  contents: write

jobs:
  inventory:
    if: ${{ !contains(github.event.head_commit.message, '[phase23-report]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/phase23-boundary-inventory.mjs --write
      - name: Commit inventory report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phase23-boundary-inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(types): refresh Phase 2.3 boundary inventory [phase23-report]"
          git push
