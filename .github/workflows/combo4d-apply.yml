name: Combo 4D Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: combo4d-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/combo-4d-stock-pos-vouchers-typescript'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Combo 4D branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply audited safe slice
        run: node scripts/combo-4d-safe-slice.mjs
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/pos/hooks/usePosHandlers.ts \
                  client/src/pages/pos/hooks/usePosInvoiceActions.ts \
                  client/src/pages/pos/hooks/usePosRowCalculations.ts \
                  client/src/pages/pos/hooks/usePosCheckout.ts \
                  client/src/pages/pos/pos-components/SaleGrid.tsx \
                  client/src/pages/pos/pos-components/InvoiceTemplate.tsx \
                  server/routes/factory/factoryStockAllocationV2Routes.ts \
                  server/routes/factory/factoryStockAllocationV3Routes.ts \
                  server/routes/factory/factoryStockAllocationV5Routes.ts
          if git diff --cached --quiet; then
            echo "Combo 4D safe slice already applied."
          else
            git commit -m "Apply Combo 4D safe POS and allocation typing fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
