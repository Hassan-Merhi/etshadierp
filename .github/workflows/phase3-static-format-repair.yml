name: Phase 3 Static Format Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase3-static-format-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'phase3-translation-ui-polish' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase3-translation-ui-polish
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true

      - name: Apply exact CircleCI source formatting
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            printf 'Formatting %s changed source file(s):\n' "${#changed_files[@]}"
            printf ' - %s\n' "${changed_files[@]}"
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi

      - name: Commit exact formatting repair
        run: |
          rm -f .github/workflows/phase3-static-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(phase3): satisfy CircleCI static formatting"
          git push origin HEAD:phase3-translation-ui-polish
