name: PR1160 Formatter

on:
  push:
    branches:
      - fix/mali-po-hadi-lshi-credit-routing

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            | tar --extract --gzip --strip-components=1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format PO import files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/import/po-import.ts \
            server/services/accounting/poImportAccounting.ts \
            server/services/accounting/poImportAccounting.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1160-formatted-files
          path: |
            server/routes/import/po-import.ts
            server/services/accounting/poImportAccounting.ts
            server/services/accounting/poImportAccounting.test.ts
          retention-days: 1
