name: PR1160 Formatter

on:
  push:
    branches:
      - fix/mali-po-hadi-lshi-credit-routing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format and commit PO import files
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/import/po-import.ts \
            server/services/accounting/poImportAccounting.ts \
            server/services/accounting/poImportAccounting.test.ts
          git add \
            server/routes/import/po-import.ts \
            server/services/accounting/poImportAccounting.ts \
            server/services/accounting/poImportAccounting.test.ts
          if git diff --cached --quiet; then
            echo "PO import files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format PO import routing changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
