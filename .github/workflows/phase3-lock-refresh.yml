name: Phase 3 Lock Refresh

on:
  push:
    branches:
      - agent/phase3-release-verification-20260810

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only || true

      - name: Verify refreshed dependency tree
        run: |
          npm ci --no-audit --bin-links=true
          npm run verify:dependency-audit -- --include-dev

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh audited transitive dependencies"
          git push
