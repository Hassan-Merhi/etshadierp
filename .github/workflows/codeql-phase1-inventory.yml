name: CodeQL Phase 1 Inventory

on:
  push:
    branches: ["security/codeql-phase1-inventory"]
    paths:
      - ".github/workflows/codeql-phase1-inventory.yml"
      - "scripts/codeql-phase1-inventory.mjs"

permissions:
  contents: write
  security-events: read

concurrency:
  group: codeql-phase1-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory open main code-scanning alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout inventory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Collect and group live alerts
        run: node scripts/codeql-phase1-inventory.mjs

      - name: Commit immutable phase 1 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- artifacts/security/codeql-phase1-open-alerts.json artifacts/security/codeql-phase1-inventory.md)" ]]; then
            echo "Inventory artifacts already match the live main snapshot."
            exit 0
          fi

          git config user.name "ets-ci-inventory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/security/codeql-phase1-open-alerts.json artifacts/security/codeql-phase1-inventory.md
          git commit -m "security: record CodeQL phase 1 inventory [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
