name: Number 5 sync with main

on:
  push:
    branches:
      - claude/format-ratchet-database-tls-5nvvde
    paths:
      - .github/workflows/number5-sync-main.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/format-ratchet-database-tls-5nvvde

      - name: Merge latest main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff origin/main -m 'Merge latest main into formatting and TLS branch'

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          git rm .github/workflows/number5-sync-main.yml
          git commit --amend --no-edit
          git push origin HEAD:claude/format-ratchet-database-tls-5nvvde
