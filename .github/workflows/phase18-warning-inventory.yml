name: Phase 18 Warning Inventory

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  inventory:
    if: contains(github.event.head_commit.message, '[phase18-warning-inventory]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Emit actionable warning inventory
        shell: bash
        run: |
          set +e
          npx eslint . --format json --output-file /tmp/eslint.json
          set -e
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const rows=JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8'));
          const grouped=new Map();
          for(const file of rows){
            for(const m of file.messages){
              if(m.severity!==1) continue;
              const key=m.ruleId||'unknown';
              if(!grouped.has(key))grouped.set(key,[]);
              grouped.get(key).push({file:path.relative(process.cwd(),file.filePath),line:m.line,column:m.column,message:m.message,nodeType:m.nodeType});
            }
          }
          for(const [rule,items] of [...grouped.entries()].sort((a,b)=>b[1].length-a[1].length)){
            console.log(`RULE ${rule} COUNT ${items.length}`);
            if(rule==='@typescript-eslint/no-explicit-any') continue;
            for(const x of items) console.log(`${x.file}:${x.line}:${x.column} [${x.nodeType}] ${x.message}`);
          }
          NODE
