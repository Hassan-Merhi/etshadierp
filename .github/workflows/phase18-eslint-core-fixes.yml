name: Phase 18 ESLint Core Fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[phase18-eslint-core-fixes]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Apply ESLint safe autofixes repository-wide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          set +e
          npx eslint . --fix
          eslint_rc=$?
          set -e
          echo "ESLINT_FIX_EXIT=$eslint_rc"
          npm run check
          git add -A
          git reset -- .github/workflows/phase18-eslint-core-fixes.yml || true
          if git diff --cached --quiet; then echo NO_AUTOFIX_CHANGES; exit 0; fi
          git commit -m 'refactor: apply compiler-safe ESLint core fixes [phase18-core-lint] [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            npm run check
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
