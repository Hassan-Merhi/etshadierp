name: Lint Phase 3 Workflow Fix

on:
  push:
    branches:
      - agent/lint-phase-3-catch-any
    paths:
      - .github/workflows/lint-phase3-workflow-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/lint-phase-3-catch-any
      - name: Correct catch annotation edit span
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/lint-phase3-catch-any-repair.yml')
          text = path.read_text()
          old = 'edits.push({ start: type.getFullStart(), end: type.getEnd(), text: "" });'
          new = 'edits.push({ start: node.variableDeclaration.name.getEnd(), end: type.getEnd(), text: "" });'
          if old not in text:
              raise SystemExit('Expected transformer span not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lint-phase3-catch-any-repair.yml
          git commit --no-verify -m "correct phase 3 catch annotation span"
          git push --no-verify origin HEAD:agent/lint-phase-3-catch-any
