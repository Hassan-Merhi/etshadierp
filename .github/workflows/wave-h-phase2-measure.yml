name: Wave H Phase 2 Measurement

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-phase2-measure.yml
      - vitest.config.ts
      - tests/api-smoke-sweep.test.ts
      - tests/ui/wave-h-zero-coverage-surfaces.test.tsx
      - client/src/pages/ContainerDetail.tsx
      - client/src/pages/factory/FactoryInvoiceDetail.tsx
      - client/src/pages/factory/FactoryOtwTrackingTab.tsx
      - client/src/pages/factory/FactoryStockAllocationV5.tsx
      - client/src/pages/factory/CreateProformaV5Drawer.tsx

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase2-measurement-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wave-i/convergence-automation
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Prepare database
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Measure backend coverage
        id: backend
        continue-on-error: true
        run: npm run test:backend:coverage
      - name: Measure frontend coverage
        id: frontend
        continue-on-error: true
        run: npm run test:frontend:coverage
      - name: Record exact Phase 2 result
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null;
          const backend = read('coverage/backend/coverage-summary.json');
          const frontend = read('coverage/frontend/coverage-summary.json');
          const result = {
            measuredAtSha: process.env.GITHUB_SHA,
            backendStep: '${{ steps.backend.outcome }}',
            frontendStep: '${{ steps.frontend.outcome }}',
            backend: backend?.total ?? null,
            frontend: frontend?.total ?? null,
            targets: { backendLines: 35, frontendLines: 20 },
            passed: Boolean(backend && frontend && backend.total.lines.pct >= 35 && frontend.total.lines.pct >= 20 && '${{ steps.backend.outcome }}' === 'success' && '${{ steps.frontend.outcome }}' === 'success')
          };
          fs.writeFileSync('phase2-measurement-result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Commit measurement result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- phase2-measurement-result.json
          git commit -m "test: record Wave H Phase 2 coverage measurement"
          git push origin HEAD:wave-i/convergence-automation
      - name: Enforce Phase 2 target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('phase2-measurement-result.json', 'utf8'));
          if (!r.passed) {
            console.error(`Phase 2 target not met: backend=${r.backend?.lines?.pct ?? 'no summary'}%, frontend=${r.frontend?.lines?.pct ?? 'no summary'}%, backendStep=${r.backendStep}, frontendStep=${r.frontendStep}`);
            process.exit(1);
          }
          console.log(`Phase 2 target met: backend=${r.backend.lines.pct}%, frontend=${r.frontend.lines.pct}%`);
          NODE
