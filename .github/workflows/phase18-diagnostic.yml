name: Phase 18 Recovery

on:
  push:
    branches: [agent/lint-phase-4-fast]

permissions:
  contents: write

jobs:
  recover:
    if: contains(github.event.head_commit.message, '[phase18-recover]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/lint-phase-4-fast
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Revert unsafe mechanical exhaustion passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          revert_one() {
            commit="$1"; parent="$2"; label="$3"
            echo "=== reverting $label ==="
            set +e
            git revert --no-commit "$commit"
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              printf '%s\n' "${conflicts[@]}"
              for f in "${conflicts[@]}"; do
                if git cat-file -e "$parent:$f" 2>/dev/null; then
                  git show "$parent:$f" > "$f"
                  git add -- "$f"
                else
                  git rm -f -- "$f" || true
                fi
              done
            fi
            git add -A
            git commit -m "revert: remove unsafe $label mechanical typing pass [skip ci]" || true
          }
          revert_one a4ec34ab3b22cfd9dc6aae8e1be7f0c0e9fc42f2 567e8d9143f5496591f30390e7ec67ff90b98736 phase12-15
          revert_one 2c7a00a96c72524e3a9c559664729e1de002e772 a04cb7a9d37cd6ef18687c5a38a0cf9a232ff0fc phase8-11
          revert_one 55b1a292a7d0b7b44e3583d53656d182997b25c0 f9c8e96b325f870c0f2a624ef02a364467fca9a8 phase5-7
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf '%s\n' "${conflicts[@]}"
            for f in "${conflicts[@]}"; do
              case "$f" in
                config/lint-warning-ratchet.json|config/type-escape-boundaries.json) git checkout --ours -- "$f" ;;
                *) echo "Unhandled main conflict: $f"; exit 2 ;;
              esac
              git add -- "$f"
            done
            git commit --no-edit
          fi
      - name: Repair recovered compiler edge cases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/LocationSummary.tsx')
          s=p.read_text().replace('}, [expandedGroups, hiddenRows, summaryData.stockGroups]);','}, [expandedGroups, hiddenRows, summaryData?.stockGroups]);')
          p.write_text(s)

          p=Path('server/routes/factory/suppliers/balance/with-balances.ts')
          s=p.read_text().replace('let _fxNetUsd = 0;', 'let fxNetUsd = 0;').replace('_fxNetUsd +=', 'fxNetUsd +=')
          p.write_text(s)

          p=Path('server/routes/factory/suppliers/fx/transfers.ts')
          s=p.read_text().replace('let _available: number;', 'let available: number;').replace('_available = commAvail;', 'available = commAvail;').replace('_available = supplierAvail + commAvail;', 'available = supplierAvail + commAvail;')
          p.write_text(s)

          p=Path('client/src/app/PropertiesRoutes.tsx')
          s=p.read_text()
          if 'sessionContracts' not in s:
              s=s.replace('import PropertiesRentalsHub from "@/pages/properties/PropertiesRentalsHub";','import PropertiesRentalsHub from "@/pages/properties/PropertiesRentalsHub";\nimport type { AuthenticatedUser } from "@/contracts/sessionContracts";')
          s=s.replace('user: any;', 'user: Pick<AuthenticatedUser, "role">;')
          s=s.replace('user?.role === "Admin" || user?.role === "Developer"','user.role === "Admin" || user.role === "Developer"')
          p.write_text(s)
          PY
          git add -A
      - run: npm ci
      - name: Require green TypeScript before writing recovery
        run: npm run check
      - name: Commit and push recovered baseline
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "repair: restore type-safe lint baseline and merge current main [phase18-recovery] [skip ci]" || true
          git push origin HEAD:agent/lint-phase-4-fast
