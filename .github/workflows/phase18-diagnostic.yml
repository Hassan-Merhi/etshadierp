name: Phase 18 Client Error Typing

on:
  push:
    branches: [agent/lint-phase-4-fast]

permissions:
  contents: write

jobs:
  client-errors:
    if: contains(github.event.head_commit.message, '[phase18-safe2]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/lint-phase-4-fast
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Confirm type-green baseline
        run: npm run check
      - name: Replace mutation/query onError any parameters with a real error contract
        shell: bash
        run: |
          set -euo pipefail
          cat > client/src/lib/clientError.ts <<'EOF'
          /** Shared client-side error surface used by query/mutation callbacks. */
          export interface ClientErrorLike {
            message?: string;
            name?: string;
            _handledGlobally?: boolean;
            description?: string;
            code?: string | number;
          }
          EOF
          node <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.cwd(), 'client/src');
          const changed = [];
          let editsCount = 0;

          function files(dir) {
            let out = [];
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) out = out.concat(files(p));
              else if (/\.tsx?$/.test(e.name) && !e.name.endsWith('.d.ts')) out.push(p);
            }
            return out;
          }
          function hasAny(n) {
            let found = false;
            function walk(x) {
              if (x.kind === ts.SyntaxKind.AnyKeyword) found = true;
              if (!found) ts.forEachChild(x, walk);
            }
            walk(n);
            return found;
          }
          function typeRange(param, sf) {
            const typeStart = param.type.getStart(sf);
            const anchor = param.questionToken ? param.questionToken.end : param.name.end;
            const between = sf.text.slice(anchor, typeStart);
            const colon = between.lastIndexOf(':');
            if (colon < 0) return null;
            return {start: anchor + colon + 1, end: param.type.end};
          }

          for (const f of files(root)) {
            if (f.endsWith('/clientError.ts')) continue;
            const text = fs.readFileSync(f,'utf8');
            const sf = ts.createSourceFile(f, text, ts.ScriptTarget.Latest, true, f.endsWith('x') ? ts.ScriptKind.TSX : ts.ScriptKind.TS);
            const edits = [];
            function visit(n) {
              if (ts.isPropertyAssignment(n) && n.name.getText(sf) === 'onError' && (ts.isArrowFunction(n.initializer) || ts.isFunctionExpression(n.initializer))) {
                const p = n.initializer.parameters[0];
                if (p && p.type && hasAny(p.type)) {
                  const r = typeRange(p, sf);
                  if (r) { edits.push({...r, replacement:' ClientErrorLike'}); editsCount++; }
                }
              }
              ts.forEachChild(n, visit);
            }
            visit(sf);
            if (!edits.length) continue;
            edits.sort((a,b)=>b.start-a.start);
            let next = text;
            for (const e of edits) next = next.slice(0,e.start) + e.replacement + next.slice(e.end);
            if (!/from ["']@\/lib\/clientError["']/.test(next)) {
              next = 'import type { ClientErrorLike } from "@/lib/clientError";\n' + next;
            }
            fs.writeFileSync(f,next);
            changed.push(path.relative(process.cwd(),f).replaceAll('\\','/'));
          }
          fs.writeFileSync('/tmp/safe2-files.txt', changed.join('\n') + (changed.length?'\n':''));
          console.log(`SAFE2_CALLBACKS_TYPED=${editsCount}`);
          console.log(`SAFE2_CHANGED_FILES=${changed.length}`);
          NODE
          git diff --stat
      - name: Compiler-gate and retain only compatible callback files
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            npm run check > /tmp/safe2-check.log 2>&1
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              echo "SAFE2_TYPESCRIPT_GREEN_AT_ATTEMPT=$attempt"
              break
            fi
            python - <<'PY'
          import re, pathlib, subprocess
          log=pathlib.Path('/tmp/safe2-check.log').read_text(errors='replace')
          changed=set(pathlib.Path('/tmp/safe2-files.txt').read_text().splitlines())
          errs=set()
          for line in log.splitlines():
              m=re.match(r'(.+?\.(?:ts|tsx))\(\d+,\d+\):\s+error\s+TS\d+:', line)
              if m: errs.add(m.group(1).replace('\\','/'))
          revert=sorted(errs & changed)
          print('SAFE2_ERROR_FILES='+str(len(errs)))
          print('SAFE2_REVERTING_FILES='+str(len(revert)))
          for f in revert: subprocess.run(['git','checkout','HEAD','--',f],check=True)
          pathlib.Path('/tmp/safe2-files.txt').write_text('\n'.join(sorted(changed-set(revert))) + ('\n' if changed-set(revert) else ''))
          if not revert: pathlib.Path('/tmp/safe2-stuck').write_text('1')
          PY
            if [ -f /tmp/safe2-stuck ]; then cat /tmp/safe2-check.log; exit 2; fi
            if [ "$attempt" = 4 ]; then cat /tmp/safe2-check.log; exit 2; fi
          done
          npm run check
      - name: Measure type-escape reduction
        shell: bash
        run: |
          set +e
          npm run audit:type-escapes > /tmp/safe2-escapes.log 2>&1
          rc=$?
          set -e
          tail -n 40 /tmp/safe2-escapes.log
          echo "TYPE_ESCAPE_AUDIT_EXPECTED_NONZERO_EXIT=$rc"
          echo "SAFE2_RETAINED_FILES=$(git diff --name-only | grep -E '\.(ts|tsx)$' | wc -l)"
      - name: Commit and push green client-error typing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: type client query and mutation errors [phase18-safe2-result] [skip ci]" || true
          git push origin HEAD:agent/lint-phase-4-fast
