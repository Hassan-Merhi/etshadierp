name: Phase 18 Main Sync and Safe Harvest
on:
  push:
    branches: [agent/lint-phase-4-fast]
permissions:
  contents: write
jobs:
  sync-harvest:
    if: contains(github.event.head_commit.message, '[phase18-safe4]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: agent/lint-phase-4-fast}
      - uses: actions/setup-node@v4
        with: {node-version: '22.14', cache: npm}
      - name: Merge latest main preserving runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          echo "MAIN=$(git rev-parse origin/main)"
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'CONFLICT %s\n' "${conflicts[@]}"
            for f in "${conflicts[@]}"; do
              case "$f" in
                config/lint-warning-ratchet.json|config/type-escape-boundaries.json|.github/workflows/phase18-diagnostic.yml)
                  git checkout --ours -- "$f" ;;
                *)
                  # Runtime changes on newer main win conflicts; typing is re-cleaned below.
                  git checkout --theirs -- "$f" ;;
              esac
              git add -- "$f"
            done
            git commit --no-edit
          fi
      - run: npm ci
      - name: Require type-green merged baseline
        run: npm run check
      - name: Measure post-main escape debt
        shell: bash
        run: |
          set +e; npm run audit:type-escapes >/tmp/pre.log 2>&1; rc=$?; set -e
          tail -n 20 /tmp/pre.log; echo "PRE_ESCAPE_EXIT=$rc"
      - name: Install compiler-gated harvest driver
        shell: bash
        run: |
          cat >/tmp/gate.py <<'PY'
          import re, pathlib, subprocess, sys, os
          changed_file=pathlib.Path(sys.argv[1]); log_file=pathlib.Path(sys.argv[2])
          changed=set(changed_file.read_text().splitlines()) if changed_file.exists() else set()
          log=log_file.read_text(errors='replace')
          errs=set()
          for line in log.splitlines():
              m=re.match(r'(.+?\.(?:ts|tsx))\(\d+,\d+\):\s+error\s+TS\d+:', line)
              if m: errs.add(m.group(1).replace('\\','/'))
          rev=set(errs & changed)
          if not rev and errs and changed:
              exts=['.ts','.tsx','/index.ts','/index.tsx']
              for ef in errs:
                  p=pathlib.Path(ef)
                  if not p.exists(): continue
                  text=p.read_text(errors='replace')
                  for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\']([^"\']+)["\']', text):
                      if not spec.startswith('.'): continue
                      base=(p.parent/spec).resolve()
                      try: relbase=pathlib.Path(os.path.relpath(base, pathlib.Path.cwd())).as_posix()
                      except: continue
                      for suffix in exts:
                          cand=relbase+suffix
                          if cand in changed: rev.add(cand)
          print(f'ERROR_FILES={len(errs)} REVERT_FILES={len(rev)} CHANGED={len(changed)}')
          for f in sorted(rev):
              subprocess.run(['git','restore','--staged','--worktree','--source=HEAD','--',f],check=False)
              changed.discard(f)
          changed_file.write_text('\n'.join(sorted(changed))+('\n' if changed else ''))
          if errs and not rev: pathlib.Path('/tmp/crossfile').write_text('1')
          PY
      - name: Harvest compiler-green subsets of prior bulk passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          harvest(){
            label="$1"; parent="$2"; commit="$3"
            echo "=== HARVEST $label ==="
            : > "/tmp/${label}.files"
            mapfile -t files < <(git diff --name-only "$parent" "$commit" -- '*.ts' '*.tsx')
            applied=0; skipped=0
            for f in "${files[@]}"; do
              [ -e "$f" ] || { skipped=$((skipped+1)); continue; }
              git diff --binary "$parent" "$commit" -- "$f" > /tmp/one.patch
              [ -s /tmp/one.patch ] || continue
              if git apply --check /tmp/one.patch >/dev/null 2>&1; then
                git apply /tmp/one.patch
                echo "$f" >> "/tmp/${label}.files"
                applied=$((applied+1))
              else
                skipped=$((skipped+1))
              fi
            done
            sort -u -o "/tmp/${label}.files" "/tmp/${label}.files"
            echo "${label}_PATCH_FILES_APPLIED=$applied SKIPPED=$skipped"
            if [ ! -s "/tmp/${label}.files" ]; then return 0; fi
            green=0
            for attempt in 1 2 3 4 5 6; do
              set +e; npm run check > "/tmp/${label}.check" 2>&1; rc=$?; set -e
              if [ $rc -eq 0 ]; then green=1; echo "${label}_GREEN_ATTEMPT=$attempt"; break; fi
              rm -f /tmp/crossfile
              python /tmp/gate.py "/tmp/${label}.files" "/tmp/${label}.check"
              if [ -f /tmp/crossfile ]; then
                echo "${label}: unresolved cross-file fallout; abandoning remaining uncommitted subset"
                git reset --hard HEAD
                return 0
              fi
              [ -s "/tmp/${label}.files" ] || { git reset --hard HEAD; return 0; }
            done
            if [ "$green" != 1 ]; then
              echo "${label}: did not converge; abandoning subset"
              git reset --hard HEAD
              return 0
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "refactor: harvest compiler-green ${label} typing subset [phase18-safe4-${label}] [skip ci]"
            fi
          }
          harvest phase5-7 f9c8e96b325f870c0f2a624ef02a364467fca9a8 55b1a292a7d0b7b44e3583d53656d182997b25c0
          harvest phase8-11 a04cb7a9d37cd6ef18687c5a38a0cf9a232ff0fc 2c7a00a96c72524e3a9c559664729e1de002e772
          harvest phase12-15 567e8d9143f5496591f30390e7ec67ff90b98736 a4ec34ab3b22cfd9dc6aae8e1be7f0c0e9fc42f2
          npm run check
      - name: Measure and push type-green synced harvest
        shell: bash
        run: |
          set +e; npm run audit:type-escapes >/tmp/post.log 2>&1; rc=$?; set -e
          tail -n 60 /tmp/post.log; echo "POST_ESCAPE_EXIT=$rc"
          git push origin HEAD:agent/lint-phase-4-fast
