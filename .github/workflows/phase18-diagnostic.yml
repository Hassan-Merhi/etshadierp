name: Phase 18 Isolated Inference Cleanup
on:
  push:
    branches: [agent/lint-phase-4-fast]
permissions:
  contents: write
jobs:
  isolated-inference:
    if: contains(github.event.head_commit.message, '[phase18-safe3]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: agent/lint-phase-4-fast}
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - run: npm run check
        name: Confirm type-green baseline
      - name: Install transform driver
        shell: bash
        run: |
          cat >/tmp/safe3.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path'); const mode=process.argv[2];
          const cp=ts.findConfigFile(process.cwd(),ts.sys.fileExists,'tsconfig.json'); const cf=ts.readConfigFile(cp,ts.sys.readFile);
          const pc=ts.parseJsonConfigFileContent(cf.config,ts.sys,path.dirname(cp)); const program=ts.createProgram(pc.fileNames,pc.options); const checker=program.getTypeChecker();
          let total=0; const changed=[];
          const hasAny=n=>{let f=false; const w=x=>{if(x.kind===ts.SyntaxKind.AnyKeyword)f=true;else if(!f)ts.forEachChild(x,w)}; if(n)w(n); return f};
          function typeAny(t,seen=new Set()){if(!t||seen.has(t.id))return false;if(t.flags&ts.TypeFlags.Any)return true;seen.add(t.id);if(t.isUnionOrIntersection?.()&&t.types.some(x=>typeAny(x,seen)))return true;if(t.typeArguments?.some(x=>typeAny(x,seen)))return true;if(t.aliasTypeArguments?.some(x=>typeAny(x,seen)))return true;return /(^|\W)any(\W|$)/.test(checker.typeToString(t))}
          function ann(n,sf,anchor){if(!n.type)return null;const ts0=n.type.getStart(sf),c=sf.text.lastIndexOf(':',ts0);return c>=anchor?{start:c,end:n.type.end,replacement:''}:null}
          for(const sf of program.getSourceFiles()){
            const fn=path.relative(process.cwd(),sf.fileName).replaceAll('\\','/'); if(sf.isDeclarationFile||fn.startsWith('node_modules/')||fn.startsWith('.github/')||!/\.(ts|tsx)$/.test(fn))continue;
            const edits=[]; const add=e=>{if(e){edits.push(e);total++}};
            function v(n){
              if(mode==='contextual-params'&&ts.isParameter(n)&&n.type&&hasAny(n.type)){const p=n.parent;if(ts.isArrowFunction(p)||ts.isFunctionExpression(p)){const sig=checker.getContextualType(p)?.getCallSignatures()?.[0],idx=p.parameters.indexOf(n),ps=sig?.getParameters()||[],sym=ps[Math.min(idx,ps.length-1)],ct=sym&&checker.getTypeOfSymbolAtLocation(sym,n),bad=ts.TypeFlags.Any|ts.TypeFlags.Unknown|ts.TypeFlags.Never;if(ct&&!(ct.flags&bad)&&!typeAny(ct))add(ann(n,sf,n.questionToken?n.questionToken.end:n.name.end));}}
              if(mode==='default-params'&&ts.isParameter(n)&&n.type&&n.initializer&&hasAny(n.type)){const t=checker.getTypeAtLocation(n.initializer),bad=ts.TypeFlags.Any|ts.TypeFlags.Unknown|ts.TypeFlags.Never|ts.TypeFlags.Null|ts.TypeFlags.Undefined;if(t&&!(t.flags&bad)&&!typeAny(t))add(ann(n,sf,n.name.end));}
              if(mode==='variables'&&ts.isVariableDeclaration(n)&&n.type&&n.initializer&&hasAny(n.type)){const t=checker.getTypeAtLocation(n.initializer),bad=ts.TypeFlags.Any|ts.TypeFlags.Unknown|ts.TypeFlags.Never|ts.TypeFlags.Null|ts.TypeFlags.Undefined,init=n.initializer;if(t&&!(t.flags&bad)&&!typeAny(t)&&(!ts.isArrayLiteralExpression(init)||init.elements.length)&&(!ts.isObjectLiteralExpression(init)||init.properties.length))add(ann(n,sf,n.name.end));}
              if(mode==='returns'&&n.type&&hasAny(n.type)&&n.body&&(ts.isFunctionDeclaration(n)||ts.isFunctionExpression(n)||ts.isArrowFunction(n)||ts.isMethodDeclaration(n)))add(ann(n,sf,n.parameters?.end??n.name?.end??n.getStart(sf)));
              if(mode==='properties'&&ts.isPropertyDeclaration(n)&&n.type&&n.initializer&&hasAny(n.type)){const t=checker.getTypeAtLocation(n.initializer),bad=ts.TypeFlags.Any|ts.TypeFlags.Unknown|ts.TypeFlags.Never|ts.TypeFlags.Null|ts.TypeFlags.Undefined;if(t&&!(t.flags&bad)&&!typeAny(t))add(ann(n,sf,n.name.end));}
              if(mode==='casts'&&ts.isAsExpression(n)&&hasAny(n.type)){const t=checker.getTypeAtLocation(n.expression);if(t&&!(t.flags&ts.TypeFlags.Any)&&!typeAny(t)){edits.push({start:n.getStart(sf),end:n.end,replacement:`(${n.expression.getText(sf)})`});total++;return;}}
              if(mode==='call-typeargs'&&ts.isCallExpression(n)&&n.typeArguments?.length&&n.typeArguments.some(hasAny)){const a=n.typeArguments,f=a[0].getStart(sf),l=a[a.length-1].end,lt=sf.text.lastIndexOf('<',f),gt=sf.text.indexOf('>',l);if(lt>=n.expression.end&&gt>=l){edits.push({start:lt,end:gt+1,replacement:''});total++;}}
              ts.forEachChild(n,v);
            } v(sf);
            if(edits.length){edits.sort((a,b)=>b.start-a.start);let text=sf.text;for(const e of edits)text=text.slice(0,e.start)+e.replacement+text.slice(e.end);fs.writeFileSync(sf.fileName,text);changed.push(fn)}
          }
          fs.writeFileSync(`/tmp/safe3-${mode}.files`,changed.join('\n')+(changed.length?'\n':'')); console.log(`MODE=${mode} EDITS=${total} FILES=${changed.length}`);
          NODE
      - name: Apply and compiler-gate categories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gate(){
            mode="$1"; NODE_PATH="$PWD/node_modules" node /tmp/safe3.cjs "$mode"; list="/tmp/safe3-${mode}.files"; green=0
            for attempt in 1 2 3 4; do
              set +e; npm run check >"/tmp/${mode}.log" 2>&1; rc=$?; set -e
              if [ $rc -eq 0 ]; then green=1; echo "${mode} GREEN attempt $attempt"; break; fi
              python - "$mode" "$list" <<'PY'
          import re,pathlib,subprocess,sys
          mode,lst=sys.argv[1:]; log=pathlib.Path('/tmp/'+mode+'.log').read_text(errors='replace'); changed=set(pathlib.Path(lst).read_text().splitlines()); errs=set()
          for line in log.splitlines():
              m=re.match(r'(.+?\.(?:ts|tsx))\(\d+,\d+\):\s+error\s+TS\d+:',line)
              if m: errs.add(m.group(1).replace('\\','/'))
          rev=sorted(errs&changed); print(mode,'errors',len(errs),'reverting',len(rev))
          for f in rev: subprocess.run(['git','checkout','HEAD','--',f],check=True)
          pathlib.Path(lst).write_text('\n'.join(sorted(changed-set(rev)))+('\n' if changed-set(rev) else ''))
          if not rev: pathlib.Path('/tmp/'+mode+'.crossfile').write_text('1')
          PY
              if [ -f "/tmp/${mode}.crossfile" ]; then echo "${mode}: abandoning category due cross-file fallout"; git reset --hard HEAD; rm -f "/tmp/${mode}.crossfile"; return 0; fi
            done
            if [ "$green" != 1 ]; then echo "${mode}: abandoning category after retries"; git reset --hard HEAD; return 0; fi
            git add -A; git diff --cached --quiet || git commit -m "refactor: compiler-gated ${mode} cleanup [phase18-safe3-${mode}] [skip ci]"
          }
          gate contextual-params
          gate default-params
          gate variables
          gate returns
          gate properties
          gate casts
          gate call-typeargs
          npm run check
      - name: Measure and push
        shell: bash
        run: |
          set +e; npm run audit:type-escapes >/tmp/escapes.log 2>&1; rc=$?; set -e; tail -n 50 /tmp/escapes.log; echo "TYPE_ESCAPE_EXIT=$rc"
          git push origin HEAD:agent/lint-phase-4-fast
