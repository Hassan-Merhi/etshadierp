name: Phase 18 Diagnostic

on:
  push:
    branches: [agent/lint-phase-4-fast]

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[phase18-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Roll back unsafe mechanical exhaustion passes in probe workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > /tmp/revert-conflicts.txt
          revert_one() {
            commit="$1"; parent="$2"; label="$3"
            echo "=== REVERT $label $commit ==="
            set +e
            git revert --no-commit "$commit"
            rc=$?
            set -e
            echo "$label REVERT_EXIT=$rc"
            if [ $rc -ne 0 ]; then
              git diff --name-only --diff-filter=U | sed "s#^#$label #" >> /tmp/revert-conflicts.txt
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                if git cat-file -e "$parent:$f" 2>/dev/null; then
                  git show "$parent:$f" > "$f"
                  git add -- "$f"
                else
                  git rm -f -- "$f" || true
                fi
              done < <(git diff --name-only --diff-filter=U)
            fi
            git add -A
            git commit -m "probe: roll back $label" || true
          }
          revert_one a4ec34ab3b22cfd9dc6aae8e1be7f0c0e9fc42f2 567e8d9143f5496591f30390e7ec67ff90b98736 phase12-15
          revert_one 2c7a00a96c72524e3a9c559664729e1de002e772 a04cb7a9d37cd6ef18687c5a38a0cf9a232ff0fc phase8-11
          revert_one 55b1a292a7d0b7b44e3583d53656d182997b25c0 f9c8e96b325f870c0f2a624ef02a364467fca9a8 phase5-7
          echo "POST_REVERT_HEAD=$(git rev-parse HEAD)"
          cat /tmp/revert-conflicts.txt
      - name: Merge current main in probe workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          : > /tmp/merge-conflicts.txt
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            git diff --name-only --diff-filter=U | tee /tmp/merge-conflicts.txt
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                config/*lint*|config/*type-escape*|*lint*ratchet*|*type-escape*) git checkout --ours -- "$f" ;;
                server/*) git checkout --theirs -- "$f" ;;
                *) git checkout --ours -- "$f" ;;
              esac
              git add -- "$f"
            done < /tmp/merge-conflicts.txt
            git commit --no-edit
          fi
          echo "PROBE_HEAD=$(git rev-parse HEAD)"
      - run: npm ci
      - name: TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run check > /tmp/ts.log 2>&1
          rc=$?
          echo "TSC_EXIT=$rc"
          printf 'TSC_ERROR_LINES='; grep -c 'error TS' /tmp/ts.log || true
          tail -n 120 /tmp/ts.log
          exit 0
      - name: ESLint exact diagnostics
        shell: bash
        run: |
          set +e
          npx eslint . -f json -o /tmp/eslint.json
          rc=$?
          node - <<'NODE' | tee /tmp/eslint.txt
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8'));
          let e=0,w=0; const rules={};
          for(const f of r){ for(const m of f.messages){ if(m.severity===2)e++; else if(m.severity===1)w++; if(m.severity){const k=m.ruleId||'<parser>';rules[k]=(rules[k]||0)+1;} }}
          console.log(`ESLINT_ERRORS=${e}`); console.log(`ESLINT_WARNINGS=${w}`); console.log(JSON.stringify(rules,null,2));
          NODE
          echo "ESLINT_EXIT=$rc"
          exit 0
      - name: Type escape audit diagnostics
        shell: bash
        run: |
          set +e
          npm run audit:type-escapes > /tmp/type-escapes.log 2>&1
          rc=$?
          tail -n 80 /tmp/type-escapes.log
          echo "TYPE_ESCAPE_EXIT=$rc"
          exit 0
      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase18-three-pass-rollback-probe
          path: |
            /tmp/ts.log
            /tmp/eslint.json
            /tmp/eslint.txt
            /tmp/type-escapes.log
            /tmp/revert-conflicts.txt
            /tmp/merge-conflicts.txt
          if-no-files-found: warn
          retention-days: 1
