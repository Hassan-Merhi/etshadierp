name: Phase 8 Focused Verification

on:
  push:
    branches:
      - agent/phase-8-rtl-responsive-accessibility

permissions:
  contents: write

concurrency:
  group: phase8-focused-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout Phase 8 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-8-rtl-responsive-accessibility
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --no-audit --bin-links=true

      - name: Type-check
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run check

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Pinned Phase 8 formatting
        id: format
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/app/ErpShell.tsx \
            client/src/app/FactoryShell.tsx \
            client/src/app/PosShell.tsx \
            client/src/app/PropertiesShell.tsx \
            client/src/components/AppTopBar.tsx \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/components/ui/dialog.tsx \
            client/src/components/ui/responsive-accessibility.tsx \
            client/src/components/ui/sheet.tsx \
            client/src/contexts/ApplicationLanguageContext.tsx \
            client/src/i18n/applicationDirection.test.ts \
            client/src/i18n/applicationDirection.ts \
            client/src/i18n/applicationTranslations.ts \
            client/src/styles/rtl-hardening.css

      - name: Program 7D accessibility verifier
        id: program7d
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-program7d-accessibility-responsive.mjs

      - name: Phase 8 backend release contracts
        id: backend
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node node_modules/vitest/vitest.mjs run \
            tests/phase8-rtl-responsive-accessibility.test.ts \
            tests/phase14-i18n-release-gate.test.ts

      - name: Phase 8 frontend behavior
        id: frontend
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts \
            client/src/i18n/applicationDirection.test.ts \
            client/src/components/ui/responsive-accessibility.test.tsx

      - name: Classified I18n Audit
        id: audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/audit-i18n-phase14.mjs

      - name: Record focused verification result
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          PROGRAM7D: ${{ steps.program7d.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          result=success
          for outcome in "$INSTALL" "$TYPECHECK" "$BUILD" "$LINT" "$FORMAT" "$PROGRAM7D" "$BACKEND" "$FRONTEND" "$AUDIT"; do
            if [ "$outcome" != "success" ]; then result=failure; fi
          done

          mkdir -p artifacts/phase8
          cat > artifacts/phase8/verification-status.md <<EOF
          # Phase 8 focused verification: $result

          Verified source head: $VERIFIED_SHA

          - Dependency install: $INSTALL
          - TypeScript: $TYPECHECK
          - Production build: $BUILD
          - Lint: $LINT
          - Phase 8 pinned formatting: $FORMAT
          - Program 7D accessibility verifier: $PROGRAM7D
          - Phase 8 backend release contracts: $BACKEND
          - Phase 8 frontend behavior: $FRONTEND
          - Classified I18n Audit: $AUDIT
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phase8/verification-status.md
          git diff --cached --quiet || git commit -m "Record Phase 8 focused verification: $result"
          git push origin HEAD:agent/phase-8-rtl-responsive-accessibility

          if [ "$result" != "success" ]; then exit 1; fi
