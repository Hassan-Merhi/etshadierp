name: Phase 4 as-any worker

on:
  push:
    branches:
      - agent/lint-phase-4-as-any

permissions:
  contents: write

jobs:
  mechanical-pass:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-worker]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Run conservative as-any removal
        run: node scripts/phase4-as-any-worker.mjs
      - name: Commit mechanical progress
        run: |
          if git diff --quiet; then
            echo "No mechanically safe changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared
          git commit -m "refactor: remove mechanically safe as-any casts [phase4-worker]"
          git push origin HEAD:${GITHUB_REF_NAME}
