name: Remove Net Position realized profit card

on:
  push:
    branches:
      - fix/supplier-partner-customer-legacy-zero-net-position
    paths:
      - .github/workflows/remove-net-position-realized-profit.yml

permissions:
  contents: write

jobs:
  remove-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-partner-customer-legacy-zero-net-position
          fetch-depth: 0
      - name: Remove realized POS profit from Net Position UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/NetProfitDetails.tsx')
          source = path.read_text()

          source = source.replace('  spPosProfit?: number;\n', '')

          marker = '      {/* SP Partner: Realized POS Profit */}'
          start = source.find(marker)
          if start == -1:
              raise SystemExit('Realized POS profit card marker not found')

          end_marker = '      )}\n'
          end = source.find(end_marker, start)
          if end == -1:
              raise SystemExit('Realized POS profit card closing marker not found')
          end += len(end_marker)

          source = source[:start] + source[end:]
          path.write_text(source)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/remove-net-position-realized-profit.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/NetProfitDetails.tsx .github/workflows/remove-net-position-realized-profit.yml
          git commit -m "ui: remove realized POS profit from Net Position"
          git push origin HEAD:fix/supplier-partner-customer-legacy-zero-net-position
