name: Run4 Lint Diagnostic

on:
  push:
    branches:
      - "agent/main-ci-green-20260812-run4"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "agent/main-ci-green-20260812-run4"
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Capture lint ratchet
        run: |
          npm run lint
          node scripts/audit-lint-warnings.mjs --json > ci-lint-audit.json || true
      - name: Publish diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run4-lint-diagnostic.yml
          git add -A
          git commit -m "ci: capture run4 lint ratchet diagnostic"
          git push origin HEAD:agent/main-ci-green-20260812-run4
