name: Phase 4 Type Safety Workbench

on:
  push:
    branches: [phase-4-remaining-type-safety]

permissions:
  contents: write

concurrency:
  group: phase4-type-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infer:
    name: Compiler-safe type inference
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-4-remaining-type-safety
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compiler-safe inference pass
        run: node scripts/phase4-remaining-type-safety.mjs

      - name: Verify TypeScript after inference
        run: npm run check

      - name: Refresh exact type-escape ratchet and documentation
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_TYPE_ESCAPE_BASELINE=1 node scripts/audit-type-escapes.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("config/type-escape-boundaries.json", "utf8"));
          const total = Number(config.totals.typeEscapeCeiling).toLocaleString("en-US");
          const path = "docs/system-quality-program.md";
          let text = fs.readFileSync(path, "utf8");
          text = text.replace(
            /\| Type escapes \(AST\) \| [^|]+ total \| `npm run audit:type-escapes` \|/,
            `| Type escapes (AST) | ${total} total | \`npm run audit:type-escapes\` |`,
          );
          fs.writeFileSync(path, text);
          NODE

      - name: Report remaining type escapes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-type-escapes.mjs --json > /tmp/phase4-type-escapes.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/phase4-type-escapes.json", "utf8"));
          const top = report.files
            .filter((file) => file.total > 0)
            .sort((a, b) => b.total - a.total || a.path.localeCompare(b.path))
            .slice(0, 40);
          console.log("PHASE4_SUMMARY", JSON.stringify(report.summary));
          console.log("PHASE4_TOP_REMAINING");
          for (const file of top) {
            console.log(`${file.total}\t${file.explicitAny}\t${file.asAny}\t${file.suppressions}\t${file.path}`);
          }
          NODE

      - name: Verify ratchets and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:type-escapes
          npm run audit:doc-index
          npm run lint
          git diff --check

      - name: Commit earned Phase 4 reductions
        shell: bash
        run: |
          set -euo pipefail
          git add server client/src shared config/type-escape-boundaries.json docs/system-quality-program.md
          if git diff --cached --quiet; then
            echo "No additional compiler-safe reductions on this head."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: apply Phase 4 compiler-safe type inference"
          git push origin HEAD:phase-4-remaining-type-safety
