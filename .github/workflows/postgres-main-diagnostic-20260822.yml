name: Postgres Main Diagnostic 20260822
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-shard:
    if: github.event.pull_request.head.ref == 'diagnostic/postgres-main-20260822'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      SESSION_SECRET: diagnostic-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify disposable database schema
        run: node scripts/verify-ci-disposable-schema.mjs
      - name: Integration backend shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          mapfile -t all_test_files < <(
            find tests -type f -name '*.test.ts' \
              ! -path 'tests/ui/*' \
              ! -path 'tests/api-smoke-sweep.test.ts' \
              | sort
          )
          shard_files=()
          for i in "${!all_test_files[@]}"; do
            if (( i % 4 == SHARD )); then
              shard_files+=("${all_test_files[$i]}")
            fi
          done
          printf 'Shard %s running %s files\n' "$SHARD" "${#shard_files[@]}"
          node node_modules/vitest/vitest.mjs run \
            "${shard_files[@]}" \
            --maxWorkers=1 \
            --no-file-parallelism 2>&1 | tee "backend-vitest-shard-${SHARD}.log"
          status=${PIPESTATUS[0]}
          echo "backend_status=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload backend report
        uses: actions/upload-artifact@v6
        with:
          name: backend-vitest-report-${{ matrix.shard }}
          path: backend-vitest-shard-${{ matrix.shard }}.log
      - name: Fail if backend tests failed
        run: test "${backend_status}" -eq 0
