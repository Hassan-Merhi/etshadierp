name: Phase 18 Toolchain Audit Only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - name: Report exact toolchain mismatches
        run: node scripts/audit-toolchain-coherence.mjs --json
