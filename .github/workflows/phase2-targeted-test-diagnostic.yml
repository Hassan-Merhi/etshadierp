name: Phase 2 Targeted Test Diagnostic

on:
  push:
    branches: [program/erp-90-phase-2]
    paths:
      - ".github/workflows/phase2-targeted-test-diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/pos-create-sale-service-validation.test.ts
          - tests/stats-net-position-excel-behavior.test.ts
          - tests/production-bale-routes-behavior.test.ts
          - tests/account-statement-routes-behavior.test.ts
          - tests/bank-asset-routes-behavior.test.ts
          - tests/voucher-journal-routes-behavior.test.ts
          - tests/factory-bale-ledger-routes-behavior.test.ts
          - tests/factory-weekly-report-export-behavior.test.ts
          - tests/supplier-proforma-routes-behavior.test.ts
          - tests/customer-order-excel-export-behavior.test.ts
          - tests/bale-product-routes-behavior.test.ts
          - tests/immutable-stock-transfer-revision-lifecycle-behavior.test.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Run ${{ matrix.test }}
        run: node node_modules/vitest/vitest.mjs run "${{ matrix.test }}"
