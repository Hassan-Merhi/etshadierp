name: Wave H Backend Shard Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wave-h-ratchet-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: wave-h-backend-shard-diagnostic
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      BACKEND_TEST_SHARDS: "8"
      BACKEND_TEST_SHARD_INDEX: "0"
      BACKEND_TEST_SHARD_BUDGET_SECONDS: "300"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Prepare database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Reproduce backend shard 0
        id: shard
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/run-backend-verification.mjs 2>&1 | tee wave-h-backend-shard-0.log
      - name: Upload shard diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wave-h-backend-shard-0
          path: |
            .artifacts/backend-verification/shard-0.json
            wave-h-backend-shard-0.log
          if-no-files-found: warn
          retention-days: 2
      - name: Report shard outcome
        if: always()
        run: echo "backend shard outcome=${{ steps.shard.outcome }}"
