name: God Files Wave 6 Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/god-files-final-wave1-tests

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'tmp/god-files-wave6-trigger'
    runs-on: ubuntu-24.04
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0
      - name: Reconcile exact current main while preserving earned cumulative ratchets
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff -X ours origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Apply Wave 6 client splits
        run: node scripts/tmp-god-files-wave6.mjs
      - name: Harden Wave 6 generated boundaries
        run: node scripts/tmp-god-files-wave6-fix.mjs
      - name: Finish Wave 6 page extraction
        run: node scripts/tmp-god-files-wave6-final-fix.mjs
      - name: Repair final Wave 6 generated wiring
        run: node scripts/tmp-god-files-wave6-ts-fix.mjs
      - name: Clean extraction-created lint noise
        run: node scripts/tmp-god-files-wave6-lint-fix.mjs
      - name: Finalize Wave 6 one-way ratchets
        run: node scripts/tmp-god-files-wave6-finalize.mjs
      - name: Format Wave 6 source and ratchet references
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/BaleProducts.tsx \
            client/src/pages/baleproducts \
            client/src/pages/ContainerDetail.tsx \
            client/src/pages/containerdetail \
            client/src/pages/factory/FactoryStockAllocationV5.tsx \
            client/src/pages/factory/factorystockallocationv5 \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md
      - name: Certify Wave 6 architecture and static contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            client/src/pages/BaleProducts.tsx \
            client/src/pages/baleproducts/useBaleProductsModel.tsx \
            client/src/pages/ContainerDetail.tsx \
            client/src/pages/containerdetail/useContainerDetailModel.tsx \
            client/src/pages/factory/FactoryStockAllocationV5.tsx \
            client/src/pages/factory/factorystockallocationv5/useFactoryStockAllocationV5Model.tsx; do
            count=$(wc -l < "$file")
            echo "$file: $count lines"
            test "$count" -le 900
          done
          find client/src/pages/baleproducts/components client/src/pages/containerdetail/components client/src/pages/factory/factorystockallocationv5/components -type f -name '*.tsx' -print0 | while IFS= read -r -d '' file; do
            count=$(wc -l < "$file")
            echo "$file: $count lines"
            test "$count" -le 900
          done
          npm run audit:god-files
          npm run audit:doc-index
          npm run audit:source-text-assertions
          npm run audit:type-escapes
          npm run check
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/pages/BaleProducts.tsx \
            client/src/pages/baleproducts \
            client/src/pages/ContainerDetail.tsx \
            client/src/pages/containerdetail \
            client/src/pages/factory/FactoryStockAllocationV5.tsx \
            client/src/pages/factory/factorystockallocationv5 \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md
      - name: Run canonical static-build chain
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:lockfile
          npm run verify:production-dependencies
          npm run lint
          npm run audit:lint-ratchet
          npm run check
          npm run build
          npm run verify:server-bundle
          npm run verify:observability
          npm run verify:final-production-readiness
          npm run verify:bandwidth
      - name: Publish cumulative Wave 6 and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- package-lock.json
          rm -f \
            .github/workflows/god-files-wave6-publisher.yml \
            scripts/tmp-god-files-wave6.mjs \
            scripts/tmp-god-files-wave6-fix.mjs \
            scripts/tmp-god-files-wave6-final-fix.mjs \
            scripts/tmp-god-files-wave6-ts-fix.mjs \
            scripts/tmp-god-files-wave6-lint-fix.mjs \
            scripts/tmp-god-files-wave6-finalize.mjs
          git add -- \
            client/src/pages/BaleProducts.tsx \
            client/src/pages/baleproducts \
            client/src/pages/ContainerDetail.tsx \
            client/src/pages/containerdetail \
            client/src/pages/factory/FactoryStockAllocationV5.tsx \
            client/src/pages/factory/factorystockallocationv5 \
            config/god-file-boundaries.json \
            config/type-escape-boundaries.json \
            tests/god-file-boundaries.test.ts \
            docs/god-file-split-program.md \
            docs/system-quality-program.md \
            .github/workflows/god-files-wave6-publisher.yml \
            scripts/tmp-god-files-wave6.mjs \
            scripts/tmp-god-files-wave6-fix.mjs \
            scripts/tmp-god-files-wave6-final-fix.mjs \
            scripts/tmp-god-files-wave6-ts-fix.mjs \
            scripts/tmp-god-files-wave6-lint-fix.mjs \
            scripts/tmp-god-files-wave6-finalize.mjs
          git status --short
          git commit -m "refactor(god-files): complete cumulative wave 6 on current main"
          git push origin HEAD:agent/god-files-final-wave1-tests
          git push origin --delete tmp/god-files-wave6-trigger || true
