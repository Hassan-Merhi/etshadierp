name: I18n Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Classified untranslated-text audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify audit classifier contract
        run: node scripts/verify-i18n-audit-classifier.mjs

      - name: Enforce reviewed untranslated-text ratchet
        run: |
          node scripts/audit-i18n-phase14.mjs \
            --json-out artifacts/i18n-audit/report.json \
            --markdown-out artifacts/i18n-audit/report.md
          cat artifacts/i18n-audit/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classified audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classified-i18n-audit
          path: artifacts/i18n-audit
          if-no-files-found: warn
          retention-days: 7

  phase5-format:
    name: Apply Phase 5 pinned formatter
    if: github.head_ref == 'agent/phase-5-properties-rentals-conversion' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-5-properties-rentals-conversion
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply repository-pinned Prettier
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/i18n/propertiesRentalsPhase5TranslationTypes.ts \
            client/src/i18n/propertiesRentalsPhase5Translations.ts \
            client/src/i18n/propertiesRentalsPhase5Translations.part1.ts \
            client/src/i18n/propertiesRentalsPhase5Translations.part2.ts \
            client/src/i18n/propertiesRentalsPhase5Translations.part3.ts \
            scripts/audit-i18n-phase14.mjs \
            tests/phase14-i18n-release-gate.test.ts \
            tests/phase5-properties-rentals-translations.test.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "Phase 5 files already match the pinned formatter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/ApplicationInterfaceTranslator.tsx client/src/i18n scripts/audit-i18n-phase14.mjs tests/phase14-i18n-release-gate.test.ts tests/phase5-properties-rentals-translations.test.ts
          git commit -m "Phase 5: apply pinned formatter output"
          git push origin HEAD:agent/phase-5-properties-rentals-conversion
