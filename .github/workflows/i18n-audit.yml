name: I18n Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: One-time PR 778 formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up canonical Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format PR 778 and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node node_modules/prettier/bin/prettier.cjs --write server/lib/accountStatementExportSafety.ts server/routes/accountStatementRoutes.ts tests/account-statement-export-safety.test.ts
          git fetch origin main
          git checkout origin/main -- .github/workflows/i18n-audit.yml
          git checkout origin/main -- .github/workflows/phase18-eslint-autofix.yml
          git add -A -- server/lib/accountStatementExportSafety.ts server/routes/accountStatementRoutes.ts tests/account-statement-export-safety.test.ts .github/workflows/i18n-audit.yml .github/workflows/phase18-eslint-autofix.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes needed'
            exit 0
          fi
          git commit -m 'style(accounts): format statement export fix'
          git push origin HEAD:fix/account-statement-exports-20260819
