name: I18n Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Classified untranslated-text audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify audit classifier contract
        run: node scripts/verify-i18n-audit-classifier.mjs

      - name: Enforce reviewed untranslated-text ratchet
        run: |
          node scripts/audit-i18n-phase14.mjs \
            --json-out artifacts/i18n-audit/report.json \
            --markdown-out artifacts/i18n-audit/report.md
          cat artifacts/i18n-audit/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classified audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classified-i18n-audit
          path: artifacts/i18n-audit
          if-no-files-found: warn
          retention-days: 7

  phase3-circle-static-diagnostic:
    name: Diagnose CircleCI static build
    if: github.head_ref == 'agent/phase-3-shared-interface-conversion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Verify lockfile and production dependencies
        run: |
          npm run verify:lockfile
          npm run verify:production-dependencies

      - name: Check CircleCI changed-source formatting
        run: |
          git fetch origin main --depth=1
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed source files require formatting checks."
            exit 0
          fi
          printf 'Checking formatting for %s changed source file(s):\n' "${#changed_files[@]}"
          printf ' - %s\n' "${changed_files[@]}"
          node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify server bundle
        run: npm run verify:server-bundle

      - name: Program 1 observability contract
        run: npm run verify:program1-observability

      - name: Final production readiness contract
        run: npm run verify:final-production-readiness

      - name: Bandwidth contract
        run: npm run verify:bandwidth
