name: I18n Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Untranslated text ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run untranslated-text audit
        run: node scripts/audit-i18n-phase14.mjs
