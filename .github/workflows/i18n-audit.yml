name: I18n Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: One-time PR 778 main sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up canonical Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Sync current main and mirror CircleCI formatting selection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git merge --no-edit origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            printf 'Formatting %s CircleCI-visible source file(s):\n' "${#changed_files[@]}"
            printf ' - %s\n' "${changed_files[@]}"
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi
          git checkout origin/main -- .github/workflows/i18n-audit.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(accounts): sync main and satisfy static formatting gate'
          fi
          git push origin HEAD:fix/account-statement-exports-20260819
