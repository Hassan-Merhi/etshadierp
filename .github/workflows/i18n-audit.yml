name: I18n Audit

on:
  push:
    branches:
      - main
      - agent/phase-7-backend-message-conversion
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Classified untranslated-text audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify audit classifier contract
        run: node scripts/verify-i18n-audit-classifier.mjs

      - name: Enforce reviewed untranslated-text ratchet
        run: |
          node scripts/audit-i18n-phase14.mjs \
            --json-out artifacts/i18n-audit/report.json \
            --markdown-out artifacts/i18n-audit/report.md
          cat artifacts/i18n-audit/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classified audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classified-i18n-audit
          path: artifacts/i18n-audit
          if-no-files-found: warn
          retention-days: 7

  phase7-verify:
    name: Focused Phase 7 verification
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.ref == 'refs/heads/agent/phase-7-backend-message-conversion' ||
       github.head_ref == 'agent/phase-7-backend-verification-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase7-ci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout verification source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: TypeScript
        id: typecheck
        run: npm run check

      - name: Check Phase 7 formatting
        id: formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/i18n/backendMessagesPhase7TranslationTypes.ts \
            client/src/i18n/backendMessagesPhase7Translations.part1.ts \
            client/src/i18n/backendMessagesPhase7Translations.part2.ts \
            client/src/i18n/backendMessagesPhase7Translations.part3.ts \
            client/src/i18n/backendMessagesPhase7Translations.part4.ts \
            client/src/i18n/backendMessagesPhase7Translations.part5.ts \
            client/src/i18n/backendMessagesPhase7Translations.part6.ts \
            client/src/i18n/backendMessagesPhase7Translations.part7.ts \
            client/src/i18n/backendMessagesPhase7Translations.part8.ts \
            client/src/i18n/backendMessagesPhase7Translations.ts

      - name: Prepare disposable schema
        id: schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Phase 7 backend behavior and release gate
        id: backend
        run: |
          node node_modules/vitest/vitest.mjs run \
            tests/phase7-backend-messages-translations.test.ts \
            tests/phase14-i18n-release-gate.test.ts \
            --maxWorkers=1 --no-file-parallelism

      - name: Phase 7 runtime bridge behavior
        id: runtime
        run: |
          node node_modules/vitest/vitest.mjs run \
            --config vitest.config.frontend.ts \
            tests/ui/application-interface-translator-runtime.test.ts \
            --maxWorkers=1 --no-file-parallelism

      - name: Enforce classified audit
        id: audit
        run: node scripts/audit-i18n-phase14.mjs

      - name: Record branch-push verification result
        if: always() && github.ref == 'refs/heads/agent/phase-7-backend-message-conversion'
        run: |
          result=success
          for outcome in \
            "${{ steps.typecheck.outcome }}" \
            "${{ steps.formatting.outcome }}" \
            "${{ steps.schema.outcome }}" \
            "${{ steps.backend.outcome }}" \
            "${{ steps.runtime.outcome }}" \
            "${{ steps.audit.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              result=failure
            fi
          done

          mkdir -p artifacts/phase7
          cat > artifacts/phase7/verification-status.md <<EOF
          # Phase 7 focused verification: $result

          Verified source head: $GITHUB_SHA

          - TypeScript: ${{ steps.typecheck.outcome }}
          - Phase 7 pinned formatting: ${{ steps.formatting.outcome }}
          - Disposable PostgreSQL schema: ${{ steps.schema.outcome }}
          - Phase 7 backend behavior and release gate: ${{ steps.backend.outcome }}
          - Runtime bridge regression: ${{ steps.runtime.outcome }}
          - Classified I18n Audit: ${{ steps.audit.outcome }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phase7/verification-status.md
          git commit -m "Phase 7: record focused verification $result"
          git push origin HEAD:agent/phase-7-backend-message-conversion
