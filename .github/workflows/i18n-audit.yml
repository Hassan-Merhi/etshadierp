name: I18n Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: One-time PR 778 current-main sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Sync current main and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git checkout origin/main -- .github/workflows/i18n-audit.yml
          if ! git diff --quiet -- .github/workflows/i18n-audit.yml; then
            git add .github/workflows/i18n-audit.yml
            git commit -m 'chore(ci): restore i18n audit after PR 778 sync'
          fi
          SKIP_TSC_CHECK=1 git push origin HEAD:fix/account-statement-exports-20260819
