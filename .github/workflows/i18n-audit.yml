name: I18n Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, temp/pr-377-format-base]

concurrency:
  group: i18n-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-pr-377:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/phases-1-4-global-trilingual-foundation'
    name: Format PR 377 files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format reported files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/app/FactoryShell.tsx \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/components/FactoryBilingualDocumentActions.tsx \
            client/src/components/FactoryFrenchCatalogManager.tsx \
            client/src/contexts/ApplicationLanguageContext.tsx \
            client/src/i18n/accountingDocumentTranslations.ts \
            client/src/i18n/applicationTranslations.ts \
            client/src/pages/BaleProductsBilingual.tsx \
            server/lib/workerBalesBilingualPdfGenerator.ts \
            server/routes/factory/factoryBilingualSnapshotRoutes.ts \
            server/routes/factory/factoryFrenchCatalogReadRoutes.ts \
            server/routes/factory/factoryFrenchTranslationRoutes.ts \
            server/routes/factoryRoutes.ts \
            server/services/factoryBilingualSurfaceResolver.ts \
            shared/factoryBilingualContract.ts \
            shared/schema/factoryTrilingualCatalogTables.ts
      - name: Stage formatted artifact
        run: |
          mkdir -p formatted-pr-377
          cp --parents \
            client/src/app/FactoryShell.tsx \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/components/FactoryBilingualDocumentActions.tsx \
            client/src/components/FactoryFrenchCatalogManager.tsx \
            client/src/contexts/ApplicationLanguageContext.tsx \
            client/src/i18n/accountingDocumentTranslations.ts \
            client/src/i18n/applicationTranslations.ts \
            client/src/pages/BaleProductsBilingual.tsx \
            server/lib/workerBalesBilingualPdfGenerator.ts \
            server/routes/factory/factoryBilingualSnapshotRoutes.ts \
            server/routes/factory/factoryFrenchCatalogReadRoutes.ts \
            server/routes/factory/factoryFrenchTranslationRoutes.ts \
            server/routes/factoryRoutes.ts \
            server/services/factoryBilingualSurfaceResolver.ts \
            shared/factoryBilingualContract.ts \
            shared/schema/factoryTrilingualCatalogTables.ts \
            formatted-pr-377/
      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: formatted-pr-377
          path: formatted-pr-377
          if-no-files-found: error
          retention-days: 1

  audit:
    name: Untranslated text ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run untranslated-text audit
        run: node scripts/audit-i18n-phase14.mjs
