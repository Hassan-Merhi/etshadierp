name: Phase 18 Doc Index Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[phase18-doc-index-repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Synchronize live quality figures in docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements={
            'docs/god-file-split-program.md': [('25,437 lines over the limit','25,299 lines over the limit')],
            'docs/system-quality-program.md': [
              ('25,437','25,299'),
              ('8,646','0'),
              ('9,270','33'),
            ],
          }
          for name,pairs in replacements.items():
              p=Path(name); s=p.read_text()
              for old,new in pairs:
                  if old in s:
                      s=s.replace(old,new)
                  elif new not in s:
                      raise SystemExit(f'neither stale nor corrected literal found for {old!r} in {name}')
              p.write_text(s)
          PY
          npm run audit:doc-index
      - name: Commit and robustly push verified doc sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/god-file-split-program.md docs/system-quality-program.md
          if git diff --cached --quiet; then
            npm run audit:doc-index
            exit 0
          fi
          git commit -m 'docs: sync Phase 18 quality figures with live audits [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && npm run audit:doc-index && git push --no-verify origin HEAD:main; then
              echo "DOC_INDEX_PUSHED=$(git rev-parse HEAD)"
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
