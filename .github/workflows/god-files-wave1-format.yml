name: God Files Wave 1 Format

on:
  pull_request:
    branches:
      - agent/god-files-final-wave1-tests
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
      - name: Format Wave 1 test files
        shell: bash
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/xlsx-export.test.ts \
            tests/xlsx-export.zz-sp-sales-form.test.ts \
            tests/workflow.test.ts \
            tests/workflow.zz-daybook-isolation.test.ts \
            tests/inventory.test.ts \
            tests/inventory.zz-reconciliation.test.ts \
            tests/excel-export-v2.test.ts \
            tests/excel-export-v2.zz1-totals-cash.test.ts \
            tests/excel-export-v2.zz2-historical-cash.test.ts \
            tests/god-file-boundaries.test.ts
          node node_modules/prettier/bin/prettier.cjs --check \
            tests/xlsx-export.test.ts \
            tests/xlsx-export.zz-sp-sales-form.test.ts \
            tests/workflow.test.ts \
            tests/workflow.zz-daybook-isolation.test.ts \
            tests/inventory.test.ts \
            tests/inventory.zz-reconciliation.test.ts \
            tests/excel-export-v2.test.ts \
            tests/excel-export-v2.zz1-totals-cash.test.ts \
            tests/excel-export-v2.zz2-historical-cash.test.ts \
            tests/god-file-boundaries.test.ts
          npm run audit:god-files
          npm run audit:doc-index
          npm run check
          git diff --check
      - name: Publish formatted branch and self-remove
        shell: bash
        run: |
          trigger_branch="${GITHUB_HEAD_REF}"
          rm -f .github/workflows/god-files-wave1-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(god-files): format Wave 1 split tests"
            git push origin HEAD:agent/god-files-final-wave1-tests
          fi
          if [ -n "${trigger_branch}" ]; then
            git push origin --delete "${trigger_branch}" || true
          fi
