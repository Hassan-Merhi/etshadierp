name: CI Repair Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-repair-bot
  cancel-in-progress: false

jobs:
  inspect:
    name: Find trusted PR needing repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      eligible: ${{ steps.select.outputs.eligible }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      head_branch: ${{ steps.select.outputs.head_branch }}
      reason: ${{ steps.select.outputs.reason }}
      failed_check_name: ${{ steps.select.outputs.failed_check_name }}
      failed_conclusion: ${{ steps.select.outputs.failed_conclusion }}
      failed_run_id: ${{ steps.select.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.select.outputs.failed_run_attempt }}
      failed_status_context: ${{ steps.select.outputs.failed_status_context }}
    steps:
      - name: Select one current trusted PR
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'eligible=false' >> "$GITHUB_OUTPUT"

          while IFS= read -r encoded_pr; do
            [[ -n "$encoded_pr" ]] || continue
            pr_json="$(printf '%s' "$encoded_pr" | base64 --decode)"
            pr_number="$(jq -r '.number' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            head_branch="$(jq -r '.head.ref' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            author_login="$(jq -r '.user.login' <<<"$pr_json")"
            author_association="$(jq -r '.author_association // ""' <<<"$pr_json")"
            blocked="$(jq -r '[.labels[].name] | any(. == "ci-repair-blocked")' <<<"$pr_json")"

            [[ "$draft" == false && "$base_ref" == main ]] || continue
            [[ "$head_repo" == "$GITHUB_REPOSITORY" && "$blocked" == false ]] || continue
            [[ "$author_login" != 'dependabot[bot]' && "$author_login" != 'renovate[bot]' ]] || continue
            case "$author_association" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) continue ;;
            esac

            compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$head_sha")"
            behind_by="$(jq -r '.behind_by // 0' <<<"$compare_json")"

            checks_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100")"
            statuses_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/status")"
            failed_check="$(
              jq -c '
                .check_runs
                | map(select(
                    .name != "Watch trusted PR checks for repair" and
                    .status == "completed" and
                    (.conclusion == "failure" or
                     .conclusion == "timed_out" or
                     .conclusion == "cancelled" or
                     .conclusion == "action_required" or
                     .conclusion == "startup_failure")))
                | sort_by(.completed_at // "")
                | .[0] // empty
              ' <<<"$checks_json"
            )"
            failed_status="$(
              jq -c '
                .statuses
                | map(select(.state == "failure" or .state == "error"))
                | sort_by(.updated_at // .created_at // "")
                | .[0] // empty
              ' <<<"$statuses_json"
            )"

            if (( behind_by == 0 )) && [[ -z "$failed_check" && -z "$failed_status" ]]; then
              continue
            fi

            reason='branch_behind'
            failed_check_name=''
            failed_conclusion=''
            failed_run_id=''
            failed_run_attempt='0'
            failed_status_context=''

            if [[ -n "$failed_check" ]]; then
              reason='failed_ci'
              failed_check_name="$(jq -r '.name' <<<"$failed_check")"
              failed_conclusion="$(jq -r '.conclusion // "failure"' <<<"$failed_check")"
              details_url="$(jq -r '.details_url // ""' <<<"$failed_check")"
              failed_run_id="$(sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' <<<"$details_url" | head -n1)"
              if [[ -n "$failed_run_id" ]]; then
                run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id" 2>/dev/null || true)"
                if [[ -n "$run_json" ]]; then
                  failed_run_attempt="$(jq -r '.run_attempt // 0' <<<"$run_json")"
                fi
              fi
            elif [[ -n "$failed_status" ]]; then
              reason='failed_external_status'
              failed_status_context="$(jq -r '.context // "External commit status"' <<<"$failed_status")"
              failed_check_name="$failed_status_context"
              failed_conclusion='failure'
            fi

            {
              echo 'eligible=true'
              echo "pr_number=$pr_number"
              echo "head_sha=$head_sha"
              echo "head_branch=$head_branch"
              echo "reason=$reason"
              echo "failed_check_name=$failed_check_name"
              echo "failed_conclusion=$failed_conclusion"
              echo "failed_run_id=$failed_run_id"
              echo "failed_run_attempt=$failed_run_attempt"
              echo "failed_status_context=$failed_status_context"
            } >> "$GITHUB_OUTPUT"
            exit 0
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&sort=updated&direction=asc&per_page=100" \
              --jq '.[] | @base64'
          )

  enable-automerge:
    name: Keep safe current PRs on protected auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge only when branch is current and review threads are resolved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          while IFS= read -r encoded_pr; do
            [[ -n "$encoded_pr" ]] || continue
            pr_json="$(printf '%s' "$encoded_pr" | base64 --decode)"
            pr_number="$(jq -r '.number' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            author_login="$(jq -r '.user.login' <<<"$pr_json")"
            author_association="$(jq -r '.author_association // ""' <<<"$pr_json")"
            blocked="$(jq -r '[.labels[].name] | any(. == "ci-repair-blocked")' <<<"$pr_json")"

            [[ "$base_ref" == main && "$head_repo" == "$GITHUB_REPOSITORY" ]] || continue
            [[ "$author_login" != 'dependabot[bot]' && "$author_login" != 'renovate[bot]' ]] || continue
            case "$author_association" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) continue ;;
            esac

            if [[ "$blocked" == true || "$draft" == true ]]; then
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
              continue
            fi

            behind_by="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$head_sha" --jq '.behind_by // 0')"
            if (( behind_by > 0 )); then
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
              continue
            fi

            thread_json="$(
              gh api graphql \
                -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved} pageInfo{hasNextPage}}}}}' \
                -F owner="$owner" -F repo="$repo" -F number="$pr_number"
            )"
            unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false)] | length' <<<"$thread_json")"
            more_threads="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage // false' <<<"$thread_json")"
            if (( unresolved > 0 )) || [[ "$more_threads" == true ]]; then
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
              continue
            fi

            # GitHub auto-merge remains the final authority: required checks,
            # required reviews, rulesets and branch protection must still pass.
            gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash >/dev/null 2>&1 || true
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" --jq '.[] | @base64'
          )

  handoff-to-copilot:
    name: Ask GitHub Copilot to repair exact PR head
    needs: inspect
    if: needs.inspect.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
      HEAD_BRANCH: ${{ needs.inspect.outputs.head_branch }}
      REASON: ${{ needs.inspect.outputs.reason }}
      FAILED_CHECK_NAME: ${{ needs.inspect.outputs.failed_check_name }}
      FAILED_CONCLUSION: ${{ needs.inspect.outputs.failed_conclusion }}
      FAILED_RUN_ID: ${{ needs.inspect.outputs.failed_run_id }}
      FAILED_RUN_ATTEMPT: ${{ needs.inspect.outputs.failed_run_attempt }}
      FAILED_STATUS_CONTEXT: ${{ needs.inspect.outputs.failed_status_context }}
    steps:
      - name: Retry transient GitHub Actions failure once
        id: retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'reran=false' >> "$GITHUB_OUTPUT"
          if [[ "$REASON" == 'failed_ci' && -n "$FAILED_RUN_ID" ]]; then
            case "$FAILED_CONCLUSION" in
              timed_out|cancelled|startup_failure)
                if (( FAILED_RUN_ATTEMPT < 2 )); then
                  gh run rerun "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
                  echo 'reran=true' >> "$GITHUB_OUTPUT"
                fi
                ;;
            esac
          fi

      - name: Dispatch trusted repair request to GitHub Copilot
        if: steps.retry.outputs.reran != 'true'
        shell: bash
        env:
          CI_REPAIR_BOT_TOKEN: ${{ secrets.CI_REPAIR_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_REPAIR_BOT_TOKEN" ]]; then
            echo '::warning::CI_REPAIR_BOT_TOKEN is unavailable; cannot create a user-authored @copilot handoff.'
            exit 0
          fi

          export GH_TOKEN="$CI_REPAIR_BOT_TOKEN"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          [[ "$current_head" == "$EXPECTED_HEAD_SHA" ]] || exit 0

          marker="<!-- copilot-ci-repair head:$EXPECTED_HEAD_SHA -->"
          exact_attempts="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
              | wc -l | tr -d ' '
          )"
          total_attempts="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | select(.body | contains("<!-- copilot-ci-repair head:")) | .id' \
              | wc -l | tr -d ' '
          )"

          if (( exact_attempts >= 3 || total_attempts >= 6 )); then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label ci-repair-blocked >/dev/null 2>&1 || true
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
            echo "Copilot repair attempt safety limit reached for PR #$PR_NUMBER; marked ci-repair-blocked."
            exit 0
          fi

          last_created="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .created_at" \
              | tail -n1
          )"
          if [[ -n "$last_created" ]]; then
            last_epoch="$(date -u -d "$last_created" +%s)"
            now_epoch="$(date -u +%s)"
            if (( now_epoch - last_epoch < 1200 )); then
              echo "A Copilot repair request for this exact head was posted less than 20 minutes ago; skipping duplicate handoff."
              exit 0
            fi
          fi

          if [[ "$REASON" == 'branch_behind' ]]; then
            problem="This PR is behind the latest main branch."
          elif [[ "$REASON" == 'failed_external_status' ]]; then
            problem="The current PR head has a failing external status: ${FAILED_STATUS_CONTEXT:-$FAILED_CHECK_NAME}."
          else
            problem="The current PR head has a failing GitHub Actions check: ${FAILED_CHECK_NAME:-unknown check}."
          fi

          cat > /tmp/copilot-repair-comment.md <<EOF
          $marker
          @copilot Please take over repair of this existing PR on branch \`$HEAD_BRANCH\` at exact head \`$EXPECTED_HEAD_SHA\`.

          $problem

          Work on this same PR branch only. First bring it up to date with \`main\` if needed and resolve conflicts without changing intended behavior. Inspect the currently failing check/status and its logs, reproduce or localize the root cause, then make the smallest correct fix. Follow \`.github/copilot-instructions.md\` and \`.github/agents/bug-repair.agent.md\`.

          Do not weaken, skip, suppress, delete, or mark any required CI, security, coverage, type, lint, i18n, company-scope, migration, or test check as allowed to fail. Do not change branch protection or repository rules. Do not create a second PR. Do not merge.

          Run the smallest focused verification first, then the relevant lint/type/tests. If no code change is justified, report the concrete blocker instead of making a speculative edit. Continue repairing this PR until its current head is green and current with \`main\`, or until you have a specific blocker that requires human input.
          EOF

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/copilot-repair-comment.md
