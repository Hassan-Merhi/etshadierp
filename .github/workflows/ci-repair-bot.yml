name: CI Repair Bot (ChatGPT-managed)

on:
  workflow_dispatch:

permissions: {}

jobs:
  notice:
    name: ChatGPT-managed repair notice
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain repair ownership
        run: |
          echo "Autonomous PR repair is now handled by the ChatGPT scheduled task."
          echo "This workflow no longer calls the OpenAI API and does not use OPENAI_API_KEY."
          echo "GitHub CI remains authoritative; required checks are not bypassed."
