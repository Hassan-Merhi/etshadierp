name: CI Repair Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-repair-bot
  cancel-in-progress: false

jobs:
  inspect:
    name: Find trusted PR failure or stale branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      eligible: ${{ steps.select.outputs.eligible }}
      limit_exhausted: ${{ steps.select.outputs.limit_exhausted }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      head_branch: ${{ steps.select.outputs.head_branch }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      failure_kind: ${{ steps.select.outputs.failure_kind }}
      failed_check_id: ${{ steps.select.outputs.failed_check_id }}
      failed_check_name: ${{ steps.select.outputs.failed_check_name }}
      failed_run_id: ${{ steps.select.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.select.outputs.failed_run_attempt }}
      failed_workflow: ${{ steps.select.outputs.failed_workflow }}
      failed_status_context: ${{ steps.select.outputs.failed_status_context }}
      failed_status_target_url: ${{ steps.select.outputs.failed_status_target_url }}
      failed_status_description: ${{ steps.select.outputs.failed_status_description }}
    steps:
      - name: Select one current trusted PR
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'eligible=false'
            echo 'limit_exhausted=false'
          } >> "$GITHUB_OUTPUT"

          pr_list="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&sort=updated&direction=asc&per_page=100" \
            --jq '.[] | @base64')"

          while IFS= read -r encoded_pr; do
            [[ -n "$encoded_pr" ]] || continue
            pr_json="$(printf '%s' "$encoded_pr" | base64 --decode)"
            pr_number="$(jq -r '.number' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            head_branch="$(jq -r '.head.ref' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            author_login="$(jq -r '.user.login' <<<"$pr_json")"
            author_association="$(jq -r '.author_association // ""' <<<"$pr_json")"
            blocked="$(jq -r '[.labels[].name] | any(. == "ci-repair-blocked")' <<<"$pr_json")"

            [[ "$draft" == false && "$base_ref" == main && "$head_repo" == "$GITHUB_REPOSITORY" ]] || continue
            [[ "$blocked" == false ]] || continue
            [[ "$author_login" != 'dependabot[bot]' && "$author_login" != 'renovate[bot]' ]] || continue
            case "$author_association" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) continue ;;
            esac

            compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$head_sha" 2>/dev/null || printf '{"behind_by":0}')"
            behind_by="$(jq -r '.behind_by // 0' <<<"$compare_json")"

            checks_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100")"
            failed_check="$(
              jq -c '
                .check_runs
                | map(select(.status == "completed" and
                    (.conclusion == "failure" or
                     .conclusion == "timed_out" or
                     .conclusion == "cancelled" or
                     .conclusion == "action_required" or
                     .conclusion == "startup_failure")))
                | sort_by(.completed_at // "")
                | .[0] // empty
              ' <<<"$checks_json"
            )"

            statuses_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/status")"
            failed_status="$(
              jq -c '
                .statuses
                | map(select(.state == "failure" or .state == "error"))
                | sort_by(.updated_at // .created_at // "")
                | .[0] // empty
              ' <<<"$statuses_json"
            )"

            [[ -n "$failed_check" || -n "$failed_status" || "$behind_by" -gt 0 ]] || continue

            repair_count="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/commits?per_page=100" \
                --jq '.[] | select(.commit.message | startswith("fix(ci-repair):")) | .sha' \
                | wc -l | tr -d ' '
            )"

            failure_kind='none'
            failed_check_id=''
            failed_check_name='Branch behind main'
            failed_run_id=''
            failed_run_attempt='0'
            failed_workflow=''
            failed_status_context=''
            failed_status_target_url=''
            failed_status_description=''

            if [[ -n "$failed_check" ]]; then
              failure_kind='check_run'
              failed_check_id="$(jq -r '.id' <<<"$failed_check")"
              failed_check_name="$(jq -r '.name' <<<"$failed_check")"
              details_url="$(jq -r '.details_url // ""' <<<"$failed_check")"
              failed_run_id="$(sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' <<<"$details_url" | head -n1)"
              failed_workflow="$failed_check_name"
              if [[ -n "$failed_run_id" ]]; then
                run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id")"
                failed_run_attempt="$(jq -r '.run_attempt // 0' <<<"$run_json")"
                failed_workflow="$(jq -r '.name // empty' <<<"$run_json")"
                [[ -n "$failed_workflow" ]] || failed_workflow="$failed_check_name"
              fi
            elif [[ -n "$failed_status" ]]; then
              failure_kind='commit_status'
              failed_status_context="$(jq -r '.context // "External commit status"' <<<"$failed_status")"
              failed_status_target_url="$(jq -r '.target_url // ""' <<<"$failed_status")"
              failed_status_description="$(jq -r '.description // ""' <<<"$failed_status")"
              failed_check_name="$failed_status_context"
              failed_workflow="$failed_status_context"
            fi

            {
              echo 'eligible=true'
              echo "pr_number=$pr_number"
              echo "head_branch=$head_branch"
              echo "head_sha=$head_sha"
              echo "failure_kind=$failure_kind"
              echo "failed_check_id=$failed_check_id"
              echo "failed_check_name=$failed_check_name"
              echo "failed_run_id=$failed_run_id"
              echo "failed_run_attempt=$failed_run_attempt"
              echo "failed_workflow=$failed_workflow"
              echo "failed_status_context=$failed_status_context"
              echo "failed_status_target_url=$failed_status_target_url"
              echo "failed_status_description=$failed_status_description"
            } >> "$GITHUB_OUTPUT"

            if (( repair_count >= 3 )) && [[ "$failure_kind" != none ]]; then
              echo 'limit_exhausted=true' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          done <<<"$pr_list"

  enable-automerge:
    name: Keep trusted PRs on auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable protected auto-merge for trusted PRs
        shell: bash
        env:
          CI_REPAIR_BOT_TOKEN: ${{ secrets.CI_REPAIR_BOT_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "${CI_REPAIR_BOT_TOKEN:-}" ]]; then
            if GH_TOKEN="$CI_REPAIR_BOT_TOKEN" \
              gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=1" >/dev/null 2>&1; then
              export GH_TOKEN="$CI_REPAIR_BOT_TOKEN"
            else
              echo "::error title=CI_REPAIR_BOT_TOKEN is unusable::The secret is set but cannot read pull requests on $GITHUB_REPOSITORY."
              exit 1
            fi
          else
            export GH_TOKEN="$WORKFLOW_TOKEN"
            echo "::warning title=Dedicated bot token missing::Auto-merge can be enabled, but a merge made as GITHUB_TOKEN may not wake downstream workflows."
          fi

          pr_list="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | @base64')"

          merge_failures=0
          while IFS= read -r encoded_pr; do
            [[ -n "$encoded_pr" ]] || continue
            pr_json="$(printf '%s' "$encoded_pr" | base64 --decode)"
            pr_number="$(jq -r '.number' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            author_login="$(jq -r '.user.login' <<<"$pr_json")"
            author_association="$(jq -r '.author_association // ""' <<<"$pr_json")"
            blocked="$(jq -r '[.labels[].name] | any(. == "ci-repair-blocked")' <<<"$pr_json")"

            if [[ "$blocked" == true ]]; then
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
              continue
            fi

            [[ "$draft" == false && "$head_repo" == "$GITHUB_REPOSITORY" ]] || continue
            [[ "$author_login" != 'dependabot[bot]' && "$author_login" != 'renovate[bot]' ]] || continue
            case "$author_association" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) continue ;;
            esac

            gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash >/dev/null 2>&1 ||
              merge_failures=$((merge_failures + 1))
          done <<<"$pr_list"

          if (( merge_failures > 0 )); then
            echo "::warning title=Auto-merge upkeep incomplete::${merge_failures} auto-merge call(s) failed."
          fi

  sync-main:
    name: Sync latest main before repair
    needs: inspect
    if: needs.inspect.outputs.eligible == 'true' && needs.inspect.outputs.limit_exhausted != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      blocked: ${{ steps.finalize.outputs.blocked }}
      needs_push: ${{ steps.merge.outputs.needs_push }}
    env:
      PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
      HEAD_BRANCH: ${{ needs.inspect.outputs.head_branch }}
      EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare main merge if needed
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'blocked=false' >> "$GITHUB_OUTPUT"
          echo 'needs_push=false' >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin main
          behind="$(git rev-list --count HEAD..origin/main)"
          (( behind > 0 )) || exit 0

          git config user.name 'ets-ci-repair[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [[ "$remote_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            git reset --hard "$EXPECTED_HEAD_SHA"
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'needs_push=true' >> "$GITHUB_OUTPUT"

      - name: Push main sync with dedicated token
        id: push
        if: steps.merge.outputs.needs_push == 'true' && steps.merge.outputs.blocked != 'true'
        shell: bash
        env:
          CI_REPAIR_BOT_TOKEN: ${{ secrets.CI_REPAIR_BOT_TOKEN }}
        run: |
          set -euo pipefail
          echo 'pushed=false' >> "$GITHUB_OUTPUT"
          [[ -n "$CI_REPAIR_BOT_TOKEN" ]] || exit 0

          export GH_TOKEN="$CI_REPAIR_BOT_TOKEN"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          git config --global --unset-all credential.https://github.com.helper >/dev/null 2>&1 || true
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

      - name: Finalize sync state
        id: finalize
        if: always()
        shell: bash
        env:
          MERGE_BLOCKED: ${{ steps.merge.outputs.blocked }}
          NEEDS_PUSH: ${{ steps.merge.outputs.needs_push }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -euo pipefail
          blocked=false
          if [[ "$MERGE_BLOCKED" == true ]]; then
            blocked=true
          elif [[ "$NEEDS_PUSH" == true && "$PUSHED" != true ]]; then
            blocked=true
          fi
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"

  diagnose:
    name: Run zero-cost deterministic repair
    needs: [inspect, sync-main]
    if: >-
      needs.inspect.outputs.eligible == 'true' &&
      needs.inspect.outputs.limit_exhausted != 'true' &&
      needs.sync-main.outputs.blocked != 'true' &&
      needs.sync-main.outputs.needs_push != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      ready: ${{ steps.result.outputs.ready }}
      status: ${{ steps.result.outputs.status }}
      changed: ${{ steps.result.outputs.changed }}
      patch_b64: ${{ steps.result.outputs.patch_b64 }}
      summary: ${{ steps.result.outputs.summary }}
      tests: ${{ steps.result.outputs.tests }}
    env:
      PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
      FAILURE_KIND: ${{ needs.inspect.outputs.failure_kind }}
      FAILED_CHECK_ID: ${{ needs.inspect.outputs.failed_check_id }}
      FAILED_CHECK_NAME: ${{ needs.inspect.outputs.failed_check_name }}
      FAILED_RUN_ID: ${{ needs.inspect.outputs.failed_run_id }}
      FAILED_RUN_ATTEMPT: ${{ needs.inspect.outputs.failed_run_attempt }}
      FAILED_WORKFLOW: ${{ needs.inspect.outputs.failed_workflow }}
      FAILED_STATUS_CONTEXT: ${{ needs.inspect.outputs.failed_status_context }}
      FAILED_STATUS_TARGET_URL: ${{ needs.inspect.outputs.failed_status_target_url }}
      FAILED_STATUS_DESCRIPTION: ${{ needs.inspect.outputs.failed_status_description }}
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect failed-check evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ci-repair
          printf '%s\n' '.ci-repair/' >> .git/info/exclude
          git fetch --no-tags origin main
          git diff --name-only -z origin/main...HEAD > .ci-repair/changed.z

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "PR: #$PR_NUMBER"
            echo "Head: $EXPECTED_HEAD_SHA"
            echo "Failure kind: $FAILURE_KIND"
            echo "Check: $FAILED_CHECK_NAME"
            echo "Workflow: $FAILED_WORKFLOW"
            echo "Run: $FAILED_RUN_ID"
            echo "Run attempt: $FAILED_RUN_ATTEMPT"
            echo
            if [[ "$FAILURE_KIND" == 'check_run' && -n "$FAILED_CHECK_ID" ]]; then
              echo '===== CHECK ANNOTATIONS ====='
              gh api "repos/$GITHUB_REPOSITORY/check-runs/$FAILED_CHECK_ID/annotations" 2>/dev/null || true
              if [[ -n "$FAILED_RUN_ID" ]]; then
                echo
                echo '===== FAILED JOB LOGS ====='
                gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
              fi
            elif [[ "$FAILURE_KIND" == 'commit_status' ]]; then
              echo '===== FAILED COMMIT STATUS ====='
              echo "Context: $FAILED_STATUS_CONTEXT"
              echo "Description: $FAILED_STATUS_DESCRIPTION"
              echo "Target URL: $FAILED_STATUS_TARGET_URL"
            else
              echo 'No failed check remains after confirming the branch is current with main.'
            fi
          } > .ci-repair/failed.log

          tail -c 300000 .ci-repair/failed.log > .ci-repair/failed.log.tmp
          mv .ci-repair/failed.log.tmp .ci-repair/failed.log

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'

      - name: Apply guarded deterministic fixes
        id: deterministic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-repair
          install_ok=false
          lock_repaired=false
          format_attempted=false

          if npm ci --ignore-scripts --no-audit --no-fund >.ci-repair/npm-ci.log 2>&1; then
            install_ok=true
          else
            manifests_changed=false
            while IFS= read -r -d '' file; do
              case "$file" in
                package.json|package-lock.json) manifests_changed=true ;;
              esac
            done < .ci-repair/changed.z

            if [[ "$manifests_changed" == true ]]; then
              if npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
                   >.ci-repair/lock-repair.log 2>&1 &&
                 npm ci --ignore-scripts --no-audit --no-fund \
                   >.ci-repair/npm-ci-after-lock.log 2>&1; then
                install_ok=true
                lock_repaired=true
              fi
            fi
          fi

          if [[ "$install_ok" == true ]] &&
             grep -Eiq '(eslint|prettier|(^|[^a-z])lint([^a-z]|$)|format(ting)?|style check)' .ci-repair/failed.log; then
            format_attempted=true
            format_files=()
            lint_files=()

            while IFS= read -r -d '' file; do
              [[ -f "$file" ]] || continue

              case "$file" in
                package-lock.json) ;;
                *.ts|*.tsx|*.js|*.jsx|*.css|*.json|*.md|*.yml|*.yaml)
                  format_files+=("$file")
                  ;;
              esac

              case "$file" in
                client/src/*.ts|client/src/*.tsx|server/*.ts|shared/*.ts)
                  lint_files+=("$file")
                  ;;
              esac
            done < .ci-repair/changed.z

            if (( ${#format_files[@]} > 0 )); then
              node node_modules/prettier/bin/prettier.cjs --write -- "${format_files[@]}" \
                >.ci-repair/prettier.log 2>&1 || true
            fi

            if (( ${#lint_files[@]} > 0 )); then
              node node_modules/eslint/bin/eslint.js --fix -- "${lint_files[@]}" \
                >.ci-repair/eslint.log 2>&1 || true
            fi
          fi

          {
            echo "install_ok=$install_ok"
            echo "lock_repaired=$lock_repaired"
            echo "format_attempted=$format_attempted"
          } >> "$GITHUB_OUTPUT"

      - name: Classify and package deterministic repair
        id: result
        shell: bash
        env:
          INSTALL_OK: ${{ steps.deterministic.outputs.install_ok }}
          LOCK_REPAIRED: ${{ steps.deterministic.outputs.lock_repaired }}
          FORMAT_ATTEMPTED: ${{ steps.deterministic.outputs.format_attempted }}
        run: |
          set -euo pipefail
          echo 'ready=true' >> "$GITHUB_OUTPUT"

          git add -A -- . ':(exclude).ci-repair'
          git diff --cached --binary -- . ':(exclude).ci-repair' > .ci-repair/repair.patch

          changed=false
          [[ ! -s .ci-repair/repair.patch ]] || changed=true

          status=blocked
          summary='No safe deterministic repair matched this failure.'
          tests='No repair verification was run.'
          patch_b64=''

          if [[ "$changed" == true ]]; then
            if [[ "$INSTALL_OK" != true ]]; then
              summary='A deterministic change was produced, but locked dependencies could not be installed safely.'
              tests='npm ci did not complete successfully; no patch will be pushed.'
            else
              verify_ok=true
              verify_notes=()

              if npm run format:check:changed >.ci-repair/verify-format.log 2>&1; then
                verify_notes+=('changed-file formatting passed')
              else
                verify_ok=false
                verify_notes+=('changed-file formatting failed')
              fi

              if npm run lint >.ci-repair/verify-lint.log 2>&1; then
                verify_notes+=('lint passed')
              else
                verify_ok=false
                verify_notes+=('lint failed')
              fi

              if npm run check >.ci-repair/verify-types.log 2>&1; then
                verify_notes+=('typecheck passed')
              else
                verify_ok=false
                verify_notes+=('typecheck failed')
              fi

              tests="$(IFS='; '; echo "${verify_notes[*]}")"

              if [[ "$verify_ok" == true ]]; then
                status=fixed
                if [[ "$LOCK_REPAIRED" == true && "$FORMAT_ATTEMPTED" == true ]]; then
                  summary='Reconciled the dependency lockfile and applied scoped formatting/lint autofixes to files changed by this PR.'
                elif [[ "$LOCK_REPAIRED" == true ]]; then
                  summary='Reconciled package-lock.json with the dependency manifest and reinstalled locked dependencies successfully.'
                else
                  summary='Applied scoped formatting/lint autofixes only to files changed by this PR.'
                fi

                gzip -c .ci-repair/repair.patch > .ci-repair/repair.patch.gz
                patch_size="$(wc -c < .ci-repair/repair.patch.gz | tr -d ' ')"
                if (( patch_size > 500000 )); then
                  status=blocked
                  summary='The deterministic repair patch exceeded the guarded transport limit.'
                else
                  patch_b64="$(base64 -w0 .ci-repair/repair.patch.gz)"
                fi
              else
                summary='Deterministic fixes were attempted, but repository verification did not pass cleanly.'
              fi
            fi
          elif [[ "$FAILURE_KIND" == check_run && -n "$FAILED_RUN_ID" && "$FAILED_RUN_ATTEMPT" == 1 ]]; then
            status=retry
            summary='No deterministic code change was justified; one failed-job-only retry is allowed for a possible transient CI failure.'
            tests='No source files were changed.'
          elif [[ "$FAILURE_KIND" == commit_status ]]; then
            summary='The failure is an external commit status; this zero-cost bot has no external provider credential to rerun or edit it safely.'
          elif [[ "$FAILURE_KIND" == none ]]; then
            status=retry
            summary='The branch is current with main and no failed check remains; another sweep can re-evaluate the PR state.'
            tests='No source files were changed.'
          else
            summary='The failure remained after the single guarded retry and no deterministic repair was available.'
          fi

          {
            echo "status=$status"
            echo "changed=$changed"
            echo "patch_b64=$patch_b64"
            echo 'summary<<EOF'
            echo "$summary"
            echo 'EOF'
            echo 'tests<<EOF'
            echo "$tests"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  retry-failed:
    name: Rerun failed jobs only
    needs: [inspect, sync-main, diagnose]
    if: >-
      needs.diagnose.outputs.status == 'retry' &&
      needs.diagnose.outputs.changed == 'false' &&
      needs.inspect.outputs.failed_run_id != '' &&
      needs.inspect.outputs.failed_run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      reran: ${{ steps.rerun.outputs.reran }}
    steps:
      - name: Rerun only failed jobs
        id: rerun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ needs.inspect.outputs.failed_run_id }}
        run: |
          set -euo pipefail
          gh run rerun "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
          echo 'reran=true' >> "$GITHUB_OUTPUT"

  push-repair:
    name: Push proven deterministic patch
    needs: [inspect, diagnose]
    if: >-
      needs.diagnose.outputs.status == 'fixed' &&
      needs.diagnose.outputs.changed == 'true' &&
      needs.diagnose.outputs.patch_b64 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      stale: ${{ steps.verify.outputs.stale }}
    env:
      PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
      HEAD_BRANCH: ${{ needs.inspect.outputs.head_branch }}
      EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
      FAILED_CHECK_NAME: ${{ needs.inspect.outputs.failed_check_name }}
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-verify exact remote head
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'stale=false' >> "$GITHUB_OUTPUT"
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          remote_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          blocked="$(jq -r '[.labels[].name] | any(. == "ci-repair-blocked")' <<<"$pr_json")"
          if [[ "$remote_sha" != "$EXPECTED_HEAD_SHA" || "$blocked" == true ]]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply and commit proven patch
        if: steps.verify.outputs.stale != 'true'
        shell: bash
        env:
          PATCH_B64: ${{ needs.diagnose.outputs.patch_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/ci-repair.patch
          git apply --check /tmp/ci-repair.patch
          git apply --index /tmp/ci-repair.patch
          git diff --cached --check
          git config user.name 'ets-ci-repair[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci-repair): repair ${FAILED_CHECK_NAME} failure"

      - name: Push with dedicated repository token
        id: push
        if: steps.verify.outputs.stale != 'true'
        shell: bash
        env:
          CI_REPAIR_BOT_TOKEN: ${{ secrets.CI_REPAIR_BOT_TOKEN }}
        run: |
          set -euo pipefail
          echo 'pushed=false' >> "$GITHUB_OUTPUT"
          [[ -n "$CI_REPAIR_BOT_TOKEN" ]] || exit 0

          export GH_TOKEN="$CI_REPAIR_BOT_TOKEN"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          git config --global --unset-all credential.https://github.com.helper >/dev/null 2>&1 || true
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

  report:
    name: Report meaningful repair state
    needs: [inspect, sync-main, diagnose, retry-failed, push-repair]
    if: always() && needs.inspect.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
      FAILED_CHECK_NAME: ${{ needs.inspect.outputs.failed_check_name }}
      LIMIT_EXHAUSTED: ${{ needs.inspect.outputs.limit_exhausted }}
      SYNC_PUSHED: ${{ needs.sync-main.outputs.pushed }}
      SYNC_BLOCKED: ${{ needs.sync-main.outputs.blocked }}
      DIAG_STATUS: ${{ needs.diagnose.outputs.status }}
      DIAG_CHANGED: ${{ needs.diagnose.outputs.changed }}
      DIAG_SUMMARY: ${{ needs.diagnose.outputs.summary }}
      DIAG_TESTS: ${{ needs.diagnose.outputs.tests }}
      RETRIED: ${{ needs.retry-failed.outputs.reran }}
      REPAIR_PUSHED: ${{ needs.push-repair.outputs.pushed }}
      REPAIR_STALE: ${{ needs.push-repair.outputs.stale }}
    steps:
      - name: Comment only on material state changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          block_pr() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
              -f name='ci-repair-blocked' -f color='b60205' \
              -f description='Autonomous CI repair needs human attention' >/dev/null 2>&1 || true
            gh issue edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --add-label ci-repair-blocked >/dev/null 2>&1 || true
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
          }

          if [[ "$LIMIT_EXHAUSTED" == true ]]; then
            block_pr
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              'CI Repair Bot stopped after 3 autonomous repair commits. No required check or guardrail was bypassed.'
          elif [[ "$SYNC_BLOCKED" == true ]]; then
            block_pr
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              'CI Repair Bot could not safely bring this PR up to current main. The branch was left unmerged.'
          elif [[ "$SYNC_PUSHED" == true ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              'CI Repair Bot synced current main into this PR. Required checks must certify the exact new head before merge.'
          elif [[ "$RETRIED" == true ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "CI Repair Bot made no speculative change for **${FAILED_CHECK_NAME}** and reran only the failed jobs once."
          elif [[ "$REPAIR_PUSHED" == true ]]; then
            gh issue edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label ci-repair-blocked >/dev/null 2>&1 || true
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "CI Repair Bot pushed a zero-cost deterministic fix for **${FAILED_CHECK_NAME}**. Diagnosis: ${DIAG_SUMMARY}. Verification: ${DIAG_TESTS}. Required checks must certify the exact new head before merge."
          elif [[ "$REPAIR_STALE" == true ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              'CI Repair Bot discarded a stale repair because the PR head moved during diagnosis.'
          elif [[ "$DIAG_STATUS" == blocked || ( "$DIAG_CHANGED" == true && "$DIAG_STATUS" != fixed ) ]]; then
            block_pr
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "CI Repair Bot stopped without a speculative change. Diagnosis: ${DIAG_SUMMARY}. Verification: ${DIAG_TESTS}."
          fi

  continue-sweep:
    name: Re-sweep for remaining red or stale PRs
    needs: [inspect, sync-main, diagnose, retry-failed, push-repair, report]
    if: always() && needs.inspect.outputs.eligible == 'true'
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/ci-repair-sweep.yml
    with:
      reason: continuing after a zero-cost repair run
      ignore_run_id: ${{ github.run_id }}
