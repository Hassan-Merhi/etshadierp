name: Phase 18 Contract Audit Only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: '22.23.2', cache: npm}
      - run: npm ci
      - name: Documentation state index
        shell: bash
        run: |
          set +e
          npm run audit:doc-index
          echo DOC_INDEX_EXIT=$?
          exit 0
      - name: Script inventory
        shell: bash
        run: |
          set +e
          npm run audit:scripts
          echo SCRIPT_INVENTORY_EXIT=$?
          exit 0
