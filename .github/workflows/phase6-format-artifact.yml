name: Phase 6 Exact Formatting Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pinned Prettier output
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/components/ui/pagination.tsx
          client/src/components/ui/responsive-accessibility.tsx
          client/src/components/ui/responsive-data-list.tsx
          client/src/components/ui/core-erp-mobile.tsx
          client/src/components/ui/period-filter.tsx
          client/src/components/ui/tabs.tsx
          client/src/pages/daybook/DaybookFilters.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase6-formatted-files
          path: |
            client/src/components/ui/pagination.tsx
            client/src/components/ui/responsive-accessibility.tsx
            client/src/components/ui/responsive-data-list.tsx
            client/src/components/ui/core-erp-mobile.tsx
            client/src/components/ui/period-filter.tsx
            client/src/components/ui/tabs.tsx
            client/src/pages/daybook/DaybookFilters.tsx
          if-no-files-found: error
