name: Number 4 formatting and ratchet

on:
  push:
    branches:
      - claude/format-ratchet-database-tls-5nvvde
    paths:
      - .github/workflows/number4-format.yml

permissions:
  contents: write

jobs:
  format-and-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/format-ratchet-database-tls-5nvvde

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Format branch source changes
        shell: bash
        run: |
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '^(client/src|server|shared|scripts|tests)/.*\.(ts|tsx|js|jsx|mjs|cjs|css)$' || true)
          if ((${#files[@]})); then
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          fi

      - name: Recut measured god-file boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const configPath = 'config/god-file-boundaries.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const scan = config.repositoryScan;
          const bucket = scan.ratchetBucketLines;
          const files = [];

          function walk(root) {
            if (!fs.existsSync(root)) return;
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (entry.isDirectory() && scan.excludeDirectories.includes(entry.name)) continue;
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) walk(full);
              else {
                const relative = full.split(path.sep).join('/');
                if (scan.extensions.includes(path.extname(entry.name)) && !scan.excludeFiles.includes(relative)) {
                  files.push(relative);
                }
              }
            }
          }

          for (const root of scan.roots) walk(root);
          let touched = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const lines = source.length === 0 ? 0 : source.split(/\r?\n/).length;
            const oldCap = scan.grandfathered[file];
            if (lines > scan.softMaxLines) {
              const nextCap = Math.ceil(lines / bucket) * bucket;
              if (oldCap === undefined || lines > oldCap || lines <= oldCap - bucket) {
                scan.grandfathered[file] = nextCap;
                touched = true;
                console.log(`${file}: ${oldCap ?? 'new'} -> ${nextCap} (${lines} lines)`);
              }
            } else if (oldCap !== undefined) {
              delete scan.grandfathered[file];
              touched = true;
              console.log(`${file}: removed baseline (${lines} lines)`);
            }
          }

          if (touched) {
            config.version += 1;
            const ordered = Object.fromEntries(Object.entries(scan.grandfathered).sort(([a], [b]) => a.localeCompare(b)));
            scan.grandfathered = ordered;
            fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          }
          NODE

      - name: Verify formatting and ratchet
        shell: bash
        run: |
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '^(client/src|server|shared|scripts|tests)/.*\.(ts|tsx|js|jsx|mjs|cjs|css)$' || true)
          if ((${#files[@]})); then
            node node_modules/prettier/bin/prettier.cjs --check "${files[@]}"
          fi
          npm run audit:god-files

      - name: Commit normalized Number 4 result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/number4-format.yml
          git add -A
          git commit -m 'Complete formatting and god-file ratchet pass'
          git push origin HEAD:claude/format-ratchet-database-tls-5nvvde
