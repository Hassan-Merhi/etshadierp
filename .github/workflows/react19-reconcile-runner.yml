name: React 19 Reconcile Runner

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/multi-67377640c8
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Merge current main and regenerate dependency locks
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          git checkout --theirs package.json package-lock.json pnpm-lock.yaml
          npm pkg set dependencies.react='^19.2.8'
          npm pkg set dependencies.react-dom='^19.2.8'
          npm pkg set devDependencies.'@types/react'='^19.2.18'
          npm install --package-lock-only --ignore-scripts
          corepack enable
          pnpm install --lockfile-only --ignore-scripts

          rm -f .github/workflows/react19-reconcile-main.yml
          rm -f .github/workflows/react19-reconcile-runner.yml

          if git diff --name-only --diff-filter=U | grep .; then
            echo 'Unexpected unresolved conflicts remain'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git add -A
          git commit -m 'Merge current main into React 19 upgrade'
          git push origin HEAD:dependabot/npm_and_yarn/multi-67377640c8
