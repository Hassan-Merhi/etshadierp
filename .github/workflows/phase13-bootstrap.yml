name: Phase 13 Modernization Bootstrap

on:
  push:
    branches:
      - phase-13-dependency-platform-modernization

permissions:
  contents: write

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply controlled dependency modernization
        shell: python
        run: |
          import json
          from pathlib import Path

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())

          for name, version in {
              '@capacitor/android': '^8.5.0',
              '@capacitor/cli': '^8.5.0',
              '@capacitor/core': '^8.5.0',
              '@capacitor/ios': '^8.5.0',
              'nodemailer': '^9.0.5',
              'react-day-picker': '^8.10.2',
          }.items():
              pkg['dependencies'][name] = version

          pkg['devDependencies']['@types/node'] = '^24.13.3'
          pkg['devDependencies'].pop('@types/pdf-parse', None)
          pkg['devDependencies'].pop('@types/bcryptjs', None)
          pkg['devDependencies'].pop('@tailwindcss/vite', None)
          pkg['scripts']['audit:platform'] = 'node scripts/audit-platform-modernization.mjs'
          pkg['scripts']['test:platform'] = 'node --test tests/platform-modernization-contract.node.test.mjs'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          route_path = Path('server/routes/chatbotPoImportRoutes.ts')
          route = route_path.read_text()
          old = '''        try {
                    const pdfParseModule: any = await import("pdf-parse");
                    const pdfParse = (pdfParseModule.default ?? pdfParseModule) as (buf: Buffer) => Promise<{ text: string }>;
                    const parsed = await pdfParse(req.file.buffer);
                    pdfText = parsed.text;
                  } catch (pdfErr: unknown) {'''
          new = '''        try {
                    const { PDFParse } = await import("pdf-parse");
                    const parser = new PDFParse({ data: new Uint8Array(req.file.buffer) });
                    try {
                      const parsed = await parser.getText();
                      pdfText = parsed.text;
                    } finally {
                      await parser.destroy();
                    }
                  } catch (pdfErr: unknown) {'''
          if old not in route:
              raise SystemExit('Expected legacy pdf-parse v1 compatibility block was not found')
          route_path.write_text(route.replace(old, new, 1))

      - name: Align Android project with Capacitor 8
        shell: bash
        run: |
          cat > android/variables.gradle <<'EOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.11.0'
              androidxAppCompatVersion = '1.7.1'
              androidxCoordinatorLayoutVersion = '1.3.0'
              androidxCoreVersion = '1.17.0'
              androidxFragmentVersion = '1.8.9'
              coreSplashScreenVersion = '1.2.0'
              androidxWebkitVersion = '1.14.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.3.0'
              androidxEspressoCoreVersion = '3.7.0'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/build.gradle')
          text = build.read_text()
          text = text.replace("classpath 'com.android.tools.build:gradle:9.3.1'", "classpath 'com.android.tools.build:gradle:8.13.0'")
          text = text.replace("classpath 'com.google.gms:google-services:4.5.0'", "classpath 'com.google.gms:google-services:4.4.4'")
          build.write_text(text)

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          text = wrapper.read_text().replace('gradle-9.7.1-all.zip', 'gradle-8.14.3-all.zip')
          wrapper.write_text(text)

          app = Path('android/app/build.gradle')
          text = app.read_text()
          text = text.replace('namespace "com.erp.warehouse"', 'namespace = "com.erp.warehouse"')
          text = text.replace('compileSdk rootProject.ext.compileSdkVersion', 'compileSdk = rootProject.ext.compileSdkVersion')
          text = text.replace("ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'", "ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'")
          text = text.replace("getDefaultProguardFile('proguard-android.txt')", "getDefaultProguardFile('proguard-android-optimize.txt')")
          app.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = 'orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation'
          if marker in text and marker + '|density' not in text:
              text = text.replace(marker, marker + '|density')
          manifest.write_text(text)
          PY

      - name: Add permanent Phase 13 guardrail
        shell: bash
        run: |
          cat > scripts/audit-platform-modernization.mjs <<'EOF'
          #!/usr/bin/env node
          import fs from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");
          const readJson = (file) => JSON.parse(read(file));
          const major = (spec) => Number(String(spec ?? "").match(/\d+/)?.[0] ?? NaN);
          const capture = (text, pattern) => text.match(pattern)?.[1] ?? null;

          export function auditPlatformModernization() {
            const failures = [];
            const checks = [];
            const check = (name, ok, detail) => {
              checks.push({ name, ok, detail });
              if (!ok) failures.push(`${name}: ${detail}`);
            };

            const pkg = readJson("package.json");
            const canonicalNode = read(".node-version").trim();
            const canonicalNodeMajor = Number(canonicalNode.split(".")[0]);
            const deps = pkg.dependencies ?? {};
            const dev = pkg.devDependencies ?? {};

            check(
              "Node runtime types",
              major(dev["@types/node"]) === canonicalNodeMajor,
              `@types/node ${dev["@types/node"] ?? "missing"} must stay on canonical Node major ${canonicalNodeMajor}`
            );
            check(
              "bcryptjs bundled types",
              !Object.hasOwn(dev, "@types/bcryptjs"),
              "bcryptjs ships its own declarations; the deprecated stub @types/bcryptjs must not return"
            );

            const pdfMajor = major(deps["pdf-parse"]);
            check(
              "pdf-parse bundled types",
              !(pdfMajor >= 2 && Object.hasOwn(dev, "@types/pdf-parse")),
              "pdf-parse v2+ ships its own declarations; legacy @types/pdf-parse must not return"
            );

            const route = read("server/routes/chatbotPoImportRoutes.ts");
            check(
              "pdf-parse v2 API",
              route.includes("const { PDFParse } = await import(\"pdf-parse\")") &&
                route.includes("new PDFParse({ data: new Uint8Array(req.file.buffer) })") &&
                route.includes("await parser.destroy()") &&
                !route.includes("pdfParseModule.default ?? pdfParseModule"),
              "PO PDF import must use PDFParse#getText and destroy the parser"
            );

            const tailwindMajor = major(deps.tailwindcss);
            check(
              "Tailwind/Vite pairing",
              tailwindMajor >= 4 || !Object.hasOwn(dev, "@tailwindcss/vite"),
              "Tailwind 3 must not carry the Tailwind 4 Vite plugin in the production root"
            );

            const capacitorFamily = ["@capacitor/android", "@capacitor/cli", "@capacitor/core", "@capacitor/ios"];
            const capacitorSpecs = capacitorFamily.map((name) => deps[name]);
            const normalizedCapacitorSpecs = capacitorSpecs.map((spec) => String(spec ?? "").replace(/^[~^]/, ""));
            check(
              "Capacitor JS family",
              normalizedCapacitorSpecs.every((spec) => spec === normalizedCapacitorSpecs[0]) && major(capacitorSpecs[0]) === 8,
              `${capacitorFamily.map((name, index) => `${name}=${capacitorSpecs[index]}`).join(", ")} must stay aligned on Capacitor 8`
            );

            const vars = read("android/variables.gradle");
            const androidExpected = {
              minSdkVersion: "24",
              compileSdkVersion: "36",
              targetSdkVersion: "36",
              androidxActivityVersion: "1.11.0",
              androidxAppCompatVersion: "1.7.1",
              androidxCoordinatorLayoutVersion: "1.3.0",
              androidxCoreVersion: "1.17.0",
              androidxFragmentVersion: "1.8.9",
              coreSplashScreenVersion: "1.2.0",
              androidxWebkitVersion: "1.14.0",
              androidxJunitVersion: "1.3.0",
              androidxEspressoCoreVersion: "3.7.0",
              cordovaAndroidVersion: "14.0.1",
            };
            const androidMismatches = Object.entries(androidExpected).filter(([key, expected]) => {
              const actual = capture(vars, new RegExp(`${key}\\s*=\\s*['\"]?([^'\"\\s]+)`));
              return actual !== expected;
            });
            check(
              "Capacitor Android variables",
              androidMismatches.length === 0,
              androidMismatches.length
                ? androidMismatches.map(([key, expected]) => `${key} must be ${expected}`).join("; ")
                : "Capacitor 8 Android SDK and AndroidX baseline is aligned"
            );

            const androidBuild = read("android/build.gradle");
            check(
              "Android Gradle Plugin",
              androidBuild.includes("com.android.tools.build:gradle:8.13.0"),
              "Capacitor 8 baseline requires AGP 8.13.0"
            );
            check(
              "Google services plugin",
              androidBuild.includes("com.google.gms:google-services:4.4.4"),
              "Android project must use the Capacitor 8 template google-services baseline 4.4.4"
            );

            const wrapper = read("android/gradle/wrapper/gradle-wrapper.properties");
            check(
              "Gradle wrapper",
              wrapper.includes("gradle-8.14.3-all.zip"),
              "Capacitor 8 baseline requires Gradle 8.14.3"
            );

            const manifest = read("android/app/src/main/AndroidManifest.xml");
            check(
              "Android density config change",
              /android:configChanges="[^"]*\bdensity\b[^"]*"/.test(manifest),
              "Capacitor 8 activity configChanges must include density"
            );

            const podfile = read("ios/App/Podfile");
            const iosTarget = Number(capture(podfile, /platform\s+:ios,\s*['\"]([0-9.]+)['\"]/));
            check(
              "iOS deployment target",
              Number.isFinite(iosTarget) && iosTarget >= 15,
              `Capacitor 8 requires iOS 15+; found ${Number.isFinite(iosTarget) ? iosTarget : "none"}`
            );

            const desktop = readJson("desktop/package.json");
            check(
              "Desktop runtime present",
              major(desktop.devDependencies?.electron) >= 43 && major(desktop.devDependencies?.["electron-builder"]) === 26,
              `desktop electron=${desktop.devDependencies?.electron ?? "missing"}, electron-builder=${desktop.devDependencies?.["electron-builder"] ?? "missing"}`
            );

            return { failures, checks, summary: { checked: checks.length, failing: failures.length } };
          }

          if (process.argv[1] === fileURLToPath(import.meta.url)) {
            const report = auditPlatformModernization();
            if (report.failures.length) {
              console.error(report.failures.join("\n"));
              process.exitCode = 1;
            } else {
              console.log(`Platform modernization coherent: ${report.summary.checked} checks passed.`);
            }
          }
          EOF

          cat > tests/platform-modernization-contract.node.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import { auditPlatformModernization } from "../scripts/audit-platform-modernization.mjs";

          test("Phase 13 dependency/platform modernization contract", () => {
            const report = auditPlatformModernization();
            assert.deepEqual(report.failures, []);
            assert.equal(report.summary.failing, 0);
            assert.ok(report.summary.checked >= 11);
            assert.ok(report.checks.every((check) => check.ok));
          });
          EOF

          cat > docs/phase13-dependency-platform-modernization.md <<'EOF'
          # Phase 13 — Dependency / Platform Modernization

          Phase 13 closes compatibility debt without using a blanket major-version sweep.

          ## Changes landed

          - Keep the production Tailwind stack on the supported v3 LTS line and remove the unused Tailwind v4 Vite plugin from the root dependency graph.
          - Align `@types/node` to the production Node 24 runtime.
          - Remove deprecated or obsolete stub type packages for `bcryptjs` and `pdf-parse`; both runtimes ship their own declarations.
          - Migrate PO PDF extraction to the typed `pdf-parse` v2 API with deterministic parser cleanup.
          - Apply same-major maintenance updates for Capacitor 8, Nodemailer 9, and React Day Picker 8.
          - Realign Android to the Capacitor 8 native baseline: API 24 minimum, compile/target API 36, AGP 8.13.0, Gradle 8.14.3, current AndroidX values, and the `density` activity configuration change.
          - Retain the existing iOS 16 deployment target, which is above Capacitor 8's iOS 15 minimum.
          - Keep the desktop stack on Electron 43 / electron-builder 26 and the repository's canonical Node 24 toolchain.
          - Add `npm run audit:platform` plus an isolated Node test contract so these compatibility boundaries fail closed without booting application/database startup hooks.

          ## Intentionally deferred breaking migrations

          Vite 7/8, Tailwind 4, Recharts 3, and React Day Picker 9/10 require dedicated UI/build migrations and are intentionally excluded from this maintenance batch.

          `@types/express` 5 was trialed against the existing Express 5 runtime and rejected by the Phase 13 TypeScript gate because its route-parameter typing change (`string` to `string | string[]`) creates a broad backend migration across hundreds of handlers. The repository therefore retains the currently green Express 4 type surface until that source migration is handled as a dedicated change rather than hidden inside dependency maintenance.
          EOF

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 13 changes
        run: npx prettier --write package.json package-lock.json server/routes/chatbotPoImportRoutes.ts scripts/audit-platform-modernization.mjs tests/platform-modernization-contract.node.test.mjs docs/phase13-dependency-platform-modernization.md

      - name: Run platform coherence audit
        run: npm run audit:platform

      - name: TypeScript
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Phase 13 contract test
        run: npm run test:platform

      - name: Production build
        run: npm run build

      - name: Sync Android native project
        run: |
          npm run build:cap
          npx cap sync android

      - name: Re-check platform coherence after Capacitor sync
        run: npm run audit:platform

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Commit validated modernization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/routes/chatbotPoImportRoutes.ts \
            scripts/audit-platform-modernization.mjs tests/platform-modernization-contract.node.test.mjs \
            docs/phase13-dependency-platform-modernization.md android ios desktop
          if git diff --cached --quiet; then
            echo "No Phase 13 changes to commit"
            exit 1
          fi
          git commit -m "chore: complete phase 13 platform modernization"
          git push origin HEAD:phase-13-dependency-platform-modernization
