name: Maintenance - Weekly Report

on:
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build maintenance summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.md"
          {
            echo "# Automated maintenance report"
            echo
            echo "Generated: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "## Open pull requests"
            gh pr list --repo "$REPO" --state open --limit 100 --json number,title,isDraft,updatedAt --jq '.[] | "- #\(.number) \(.title) | draft=\(.isDraft) | updated=\(.updatedAt)"' || true
            echo
            echo "## Failed workflow runs"
            gh run list --repo "$REPO" --status failure --limit 20 --json databaseId,name,conclusion,createdAt --jq '.[] | "- run \(.databaseId): \(.name) | \(.conclusion) | \(.createdAt)"' || true
          } > "$report"
          cat "$report"
