name: Phase 18 Phase 1 Landing Repair
on:
  push:
    branches: [agent/phase18-phase1-safe-macos-result]
permissions:
  contents: write
env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-phase1-safe-macos-result
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Repair truthful ratchet and landing regressions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-escapes.json
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/type-escapes.json','utf8'));
          const s=r.summary;
          if (s.typeEscapeTotal!==3297 || s.explicitAny!==3207 || s.asAny!==88 || s.suppressions!==2 || s.filesWithEscapes!==790) {
            throw new Error(`Certified Phase 1 totals drifted: ${JSON.stringify(s)}`);
          }
          NODE
          UPDATE_TYPE_ESCAPE_BASELINE=1 node scripts/audit-type-escapes.mjs
          node - <<'NODE'
          const fs=require('fs');
          function patch(path, from, to) {
            const src=fs.readFileSync(path,'utf8');
            if (!src.includes(from)) {
              if (src.includes(to)) return;
              throw new Error(`Patch anchor not found in ${path}`);
            }
            fs.writeFileSync(path, src.replace(from,to));
          }
          patch('client/src/pages/factory/FactoryDaybook.tsx', 'currentUser?.role, currentUser.id,', 'currentUser?.role, currentUser?.id,');
          patch('tests/ui/data-tools-page-behavior.test.tsx', 'vi.mock("@/contexts/AppModeContext", () => ({ useAppMode: () => "erp" }));', 'vi.mock("@/contexts/AppModeContext", () => ({ useAppMode: () => "erp" }));\nvi.mock("@/contexts/ApplicationLanguageContext", () => ({\n  useApplicationLanguage: () => ({ t: (key: string) => key, language: "en", direction: "ltr" }),\n}));');
          patch('tests/ui/supplier-profit-check-page-behavior.test.tsx', '  STORAGE_KEY_COLS: "supplier-profit-columns",', '  STORAGE_KEY_COLS: "supplier-profit-columns",\n  isSupplierProfitQueryEnabled: (supplierId: string, sourceType: string, proformaId: string, otwContainerIds: readonly number[]) =>\n    Boolean(supplierId) && (sourceType === "all" || (sourceType === "proforma" && Boolean(proformaId)) || (sourceType === "otw_containers" && otwContainerIds.length > 0)),');
          let w=fs.readFileSync('tests/workflow.test.ts','utf8');
          const needle='    await db.delete(schema.salesItems).where(eq(schema.salesItems.voucherId, v.id));\n    await db.delete(schema.voucherEntries).where(eq(schema.voucherEntries.voucherId, v.id));';
          const replacement='    await db.delete(schema.accountingPostingRequests).where(eq(schema.accountingPostingRequests.voucherId, v.id));\n    await db.delete(schema.salesItems).where(eq(schema.salesItems.voucherId, v.id));\n    await db.delete(schema.voucherEntries).where(eq(schema.voucherEntries.voucherId, v.id));';
          const occurrences=w.split(needle).length-1;
          if (occurrences===0 && !w.includes('schema.accountingPostingRequests')) throw new Error('workflow cleanup anchor missing');
          w=w.split(needle).join(replacement);
          fs.writeFileSync('tests/workflow.test.ts',w);
          NODE
          npm run check
          node scripts/audit-type-escapes.mjs
          npx vitest run tests/ui/data-tools-page-behavior.test.tsx tests/ui/supplier-profit-check-page-behavior.test.tsx tests/ui/renders.test.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/type-escape-boundaries.json client/src/pages/factory/FactoryDaybook.tsx tests/ui/data-tools-page-behavior.test.tsx tests/ui/supplier-profit-check-page-behavior.test.tsx tests/workflow.test.ts
          git commit -m 'test: repair Phase 1 landing gates [skip ci]'
          git push origin HEAD:agent/phase18-phase1-safe-macos-result
