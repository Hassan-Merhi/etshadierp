name: Phase 18 One-Shot Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144
concurrency:
  group: phase18-oneshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  execute:
    if: github.event.pull_request.head.ref == 'agent/phase18-wave2-oneshot'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-wave2-oneshot
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Bulk transform and compiler harvest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >.phase18-count.json 2>/dev/null; set -e; node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.phase18-count.json','utf8'));process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          base=$(git rev-parse HEAD)
          start=$(count)
          echo "BULK_START=$start"
          for mode in safe param array generic property union cast unknown; do
            echo "BULK_PROPOSE mode=$mode before=$(count)"
            PHASE18_MODE="$mode" node scripts/phase18-wave2-propose.cjs
            echo "BULK_PROPOSE_DONE mode=$mode after=$(count)"
          done
          candidate=$(count)
          echo "BULK_CANDIDATE=$start->$candidate"
          [ "$candidate" -lt "$start" ] || { echo 'No strict improvement'; exit 1; }
          for attempt in $(seq 1 24); do
            set +e; npm run check >.phase18-check.log 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then echo "BULK_COMPILER_GREEN attempt=$attempt"; break; fi
            node -e "const fs=require('fs');const s=fs.readFileSync('.phase18-check.log','utf8');const a=[...new Set([...s.matchAll(/^([^ (]+\\.(?:ts|tsx))\\([0-9]+,[0-9]+\\): error TS[0-9]+:/gm)].map(m=>m[1]))];fs.writeFileSync('.phase18-error-files.txt',a.join('\\n'));"
            reverted=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if git diff --quiet "$base" -- "$f"; then continue; fi
              git checkout "$base" -- "$f"
              reverted=$((reverted+1))
            done < .phase18-error-files.txt
            echo "BULK_ROLLBACK attempt=$attempt direct_files=$reverted"
            if [ "$reverted" -eq 0 ]; then
              mapfile -t modified < <(git diff --name-only "$base" -- client/src server shared | head -25)
              [ "${#modified[@]}" -gt 0 ] || break
              git checkout "$base" -- "${modified[@]}"
              echo "BULK_DEPENDENCY_ROLLBACK attempt=$attempt files=${#modified[@]}"
            fi
          done
          npm run check
          final=$(count)
          echo "BULK_FINAL=$start->$final"
          [ "$final" -lt "$start" ] || exit 1
          git add client/src server shared
          git commit -m 'refactor: Phase 18 bulk full-tree type reduction [phase18-oneshot-source] [skip ci]'
          set +e; node scripts/audit-type-escapes.mjs --json >.phase18-after.json; set -e
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.phase18-after.json','utf8'));const top=(r.files||[]).filter(f=>f.total).sort((a,b)=>b.total-a.total).slice(0,500);fs.writeFileSync('phase18-oneshot-report.md',['# Phase 18 One-Shot Result','', 'Type escapes: '+r.summary.typeEscapeTotal,'Explicit any: '+r.summary.explicitAny,'as any: '+r.summary.asAny,'Suppressions: '+r.summary.suppressions,'Files with escapes: '+r.summary.filesWithEscapes,'','## Top files','',...top.map(f=>'- '+f.total+' — '+f.path),''].join('\\n'));"
          rm -f .phase18-count.json .phase18-check.log .phase18-error-files.txt .phase18-after.json
          git add phase18-oneshot-report.md
          git commit -m 'chore: publish Phase 18 one-shot result [phase18-oneshot-result] [skip ci]'
          git push --force origin HEAD:agent/phase18-wave2-oneshot-result
