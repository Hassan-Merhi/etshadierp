name: Phase 2 WhatsApp Type Fix

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Configure Git identity
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge current main
        run: git fetch origin main && git -c core.hooksPath=/dev/null merge --no-edit origin/main
      - name: Fix WhatsApp user id type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/routes/whatsappFastSendRoutes.ts')
          text = path.read_text()
          old = '  const userId = Number(req.session.userId);\n'
          new = '  const userId = req.session.userId;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one WhatsApp userId conversion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify TypeScript
        run: npm run check
      - name: Commit verified fix
        run: |
          git rm .github/workflows/_phase2-whatsapp-type-fix.yml
          git add server/routes/whatsappFastSendRoutes.ts
          git -c core.hooksPath=/dev/null commit -m 'fix: preserve string user id in WhatsApp fast send'
          git -c core.hooksPath=/dev/null push origin HEAD:program/erp-90-phase-2
