name: Phase 7 sync latest main

on:
  push:
    branches:
      - chatgpt/golden-coast-phase7-hadi-transfers

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/golden-coast-phase7-hadi-transfers
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          cp config/ci-ratchet-allowances.json /tmp/phase7-ratchet.json
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "config/ci-ratchet-allowances.json" ]; then
              echo "Unexpected merge conflicts: $conflicts"
              exit 1
            fi
            git checkout --theirs config/ci-ratchet-allowances.json
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/ci-ratchet-allowances.json')
          data = json.loads(p.read_text())
          vals = data.setdefault('routeManifestRouteAdditions', [])
          for item in [
            'GET /api/sp/golden-coast/phase7/sales-cash-transfer/readiness [<anonymous> > requireAuth > requireNonPOS > <anonymous>]',
            'POST /api/sp/golden-coast/phase7/sales-cash-transfer [<anonymous> > <anonymous> > requireAuth > requireNonPOS > <anonymous>]',
          ]:
            if item not in vals:
              vals.append(item)
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
            git add config/ci-ratchet-allowances.json
            git commit --no-edit
          fi
          rm -f .github/workflows/phase7-sync-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot Phase 7 sync workflow"
          fi
          git push origin HEAD:chatgpt/golden-coast-phase7-hadi-transfers
