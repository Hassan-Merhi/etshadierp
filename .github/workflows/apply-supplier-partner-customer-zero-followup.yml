name: Apply supplier partner customer balance follow-up

on:
  push:
    branches:
      - fix/supplier-partner-customer-legacy-zero-net-position

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-partner-customer-legacy-zero-net-position
          fetch-depth: 0

      - name: Apply Net Position follow-up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          live = "server/routes/stats/statsNetProfitRoutes.ts"
          asof = "server/helpers/calculateNetPositionAsOf.ts"
          excel = "server/routes/stats/statsNetPositionRoutes.ts"
          multi = "server/routes/stats/statsMultiCurrencyRoutes.ts"

          replace_once(
              live,
              'import { getNetPositionCurrencySummary } from "../../services/accounting/netPositionCurrency";\n',
              'import { getNetPositionCurrencySummary } from "../../services/accounting/netPositionCurrency";\n'
              'import { getSupplierPartnerCustomerNetPosition } from "../../helpers/supplierPartnerCustomerNetPosition";\n',
          )
          replace_once(
              live,
              '      const equityIncludedInNetPosition = isSupplierPartner;\n',
              '      const equityIncludedInNetPosition = isSupplierPartner;\n'
              '      const supplierPartnerCustomerPosition = isSupplierPartner\n'
              '        ? await getSupplierPartnerCustomerNetPosition(companyId, toDate)\n'
              '        : null;\n',
          )

          replace_once(
              asof,
              'import { calculateHistoricalLocationInventory } from "../routes/_helpers";\n',
              'import { calculateHistoricalLocationInventory } from "../routes/_helpers";\n'
              'import { getSupplierPartnerCustomerNetPosition } from "./supplierPartnerCustomerNetPosition";\n',
          )
          replace_once(
              asof,
              '  const shouldIncludeSuppliers = parentCompanyId === null || companyId === parentCompanyId;\n',
              '  const shouldIncludeSuppliers = parentCompanyId === null || companyId === parentCompanyId;\n'
              '  const supplierPartnerCustomerPosition = isSupplierPartner\n'
              '    ? await getSupplierPartnerCustomerNetPosition(companyId, toDate)\n'
              '    : null;\n',
          )

          replace_once(
              excel,
              'import { classifyEquityAccounts, classifyNetPositionAccounts, round2 } from "../../netPositionHelper";\n',
              'import { classifyEquityAccounts, classifyNetPositionAccounts, round2 } from "../../netPositionHelper";\n'
              'import { getSupplierPartnerCustomerNetPosition } from "../../helpers/supplierPartnerCustomerNetPosition";\n',
          )
          replace_once(
              excel,
              '      const isSupplierPartner = company?.companyType === "supplier_partner";\n',
              '      const isSupplierPartner = company?.companyType === "supplier_partner";\n'
              '      const supplierPartnerCustomerPosition = isSupplierPartner\n'
              '        ? await getSupplierPartnerCustomerNetPosition(companyId, toDate)\n'
              '        : null;\n',
          )

          customer_expr = (
              '((a.accountType === "Customer" ||\n'
              '{child}a.subType === "Accounts Receivable" ||\n'
              '{child}(a.code || "").toUpperCase().startsWith("CUST-") ||\n'
              '{child}(a.name || "").toLowerCase().includes("customer account")) &&\n'
              '{child}!supplierPartnerCustomerPosition?.ledgerAccountIds.has(a.id)) ||\n'
          )
          for path, indent in ((live, '              '), (asof, '          '), (excel, '              ')):
              old = indent + 'a.subType === "Accounts Receivable" ||\n'
              new = indent + customer_expr.format(child=indent + '  ')
              replace_once(path, old, new)

          replace_once(
              live,
              '      const categoryTotals = classified.categoryTotals;\n\n      // Exclude ledger-based "Accrued Rent Payable"',
              '''      const categoryTotals = classified.categoryTotals;

      // Linked customer ledgers are replaced by the authoritative customer balance below,
      // which also includes direct customer-targeted journal/receipt entries.
      if (supplierPartnerCustomerPosition) {
        for (const customer of supplierPartnerCustomerPosition.items) {
          const value = round2(Math.abs(customer.signedBalance));
          if (customer.signedBalance > 0) {
            forUsTotal = round2(forUsTotal + value);
            categoryTotals["asset_Asset"] = round2((categoryTotals["asset_Asset"] || 0) + value);
            forUsAccounts.push({
              id: customer.ledgerAccountId ?? undefined,
              name: customer.name,
              code: customer.code,
              value,
              category: "Asset",
            });
          } else {
            onUsTotal = round2(onUsTotal + value);
            categoryTotals["liability_Liability"] = round2(
              (categoryTotals["liability_Liability"] || 0) + value
            );
            onUsAccounts.push({
              id: customer.ledgerAccountId ?? undefined,
              name: customer.name,
              code: customer.code,
              value,
              category: "Liability",
            });
          }
        }
        forUsAccounts.sort((a, b) => b.value - a.value);
        onUsAccounts.sort((a, b) => b.value - a.value);
      }

      // Exclude ledger-based "Accrued Rent Payable"''',
          )

          replace_once(
              asof,
              '''  const onUsLines: NetPositionLineItem[] = classified.onUsAccounts.map((a) => ({
    label: a.name,
    value: round2(a.value),
    category: a.category,
    side: "onUs",
  }));

  // ── Stock on floor''',
              '''  const onUsLines: NetPositionLineItem[] = classified.onUsAccounts.map((a) => ({
    label: a.name,
    value: round2(a.value),
    category: a.category,
    side: "onUs",
  }));

  if (supplierPartnerCustomerPosition) {
    for (const customer of supplierPartnerCustomerPosition.items) {
      const value = round2(Math.abs(customer.signedBalance));
      if (customer.signedBalance > 0) {
        forUsTotal = round2(forUsTotal + value);
        forUsLines.push({ label: customer.name, value, category: "Asset", side: "forUs" });
      } else {
        onUsTotal = round2(onUsTotal + value);
        onUsLines.push({ label: customer.name, value, category: "Liability", side: "onUs" });
      }
    }
  }

  // ── Stock on floor''',
          )

          replace_once(
              excel,
              '''      const forUsAccounts = [...classified.forUsAccounts];
      const onUsAccounts = [...classified.onUsAccounts];

      // ── 3. Stock In Hand''',
              '''      const forUsAccounts = [...classified.forUsAccounts];
      const onUsAccounts = [...classified.onUsAccounts];

      if (supplierPartnerCustomerPosition) {
        for (const customer of supplierPartnerCustomerPosition.items) {
          const value = round2(Math.abs(customer.signedBalance));
          if (customer.signedBalance > 0) {
            forUsTotal = round2(forUsTotal + value);
            forUsAccounts.push({
              id: customer.ledgerAccountId ?? undefined,
              name: customer.name,
              code: customer.code,
              value,
              category: "Asset",
            });
          } else {
            onUsTotal = round2(onUsTotal + value);
            onUsAccounts.push({
              id: customer.ledgerAccountId ?? undefined,
              name: customer.name,
              code: customer.code,
              value,
              category: "Liability",
            });
          }
        }
        forUsAccounts.sort((a, b) => b.value - a.value);
        onUsAccounts.sort((a, b) => b.value - a.value);
      }

      // ── 3. Stock In Hand''',
          )

          replace_once(
              multi,
              '  payload.forUs.accounts = forUsAccounts.sort((a, b) => Number(b.value || 0) - Number(a.value || 0));\n'
              '  payload.onUs.accounts = onUsAccounts.sort((a, b) => Number(b.value || 0) - Number(a.value || 0));\n',
              '''  payload.forUs.accounts = forUsAccounts
    .filter((row) => Math.abs(Number(row.value || 0)) >= 0.005)
    .sort((a, b) => Number(b.value || 0) - Number(a.value || 0));
  payload.onUs.accounts = onUsAccounts
    .filter((row) => Math.abs(Number(row.value || 0)) >= 0.005)
    .sort((a, b) => Number(b.value || 0) - Number(a.value || 0));
''',
          )
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-supplier-partner-customer-zero-followup.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/stats/statsNetProfitRoutes.ts \
                  server/helpers/calculateNetPositionAsOf.ts \
                  server/routes/stats/statsNetPositionRoutes.ts \
                  server/routes/stats/statsMultiCurrencyRoutes.ts \
                  .github/workflows/apply-supplier-partner-customer-zero-followup.yml
          git commit -m "fix: include authoritative customer balances and hide zero accounts"
          git push origin HEAD:fix/supplier-partner-customer-legacy-zero-net-position
