name: Apply supplier partner customer balance follow-up

on:
  push:
    branches:
      - fix/supplier-partner-customer-legacy-zero-net-position

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-partner-customer-legacy-zero-net-position
          fetch-depth: 0

      - name: Apply Net Position follow-up
        run: python .github/scripts/apply_supplier_partner_customer_zero_followup.py

      - name: Remove one-time patch files
        run: |
          rm .github/workflows/apply-supplier-partner-customer-zero-followup.yml
          rm .github/scripts/apply_supplier_partner_customer_zero_followup.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: include authoritative customer balances and hide zero accounts"
          git push origin HEAD:fix/supplier-partner-customer-legacy-zero-net-position
