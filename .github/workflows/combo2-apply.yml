name: Combo 2 guarded test cleanup

on:
  push:
    branches: [combo-2-logging-skipped-tests]

permissions:
  contents: write

jobs:
  apply-reviewed-test-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: combo-2-logging-skipped-tests
          fetch-depth: 0

      - name: Apply guarded export-test fixes
        run: node scripts/combo2-apply-safe-test-fixes.mjs

      - name: Validate patch
        run: |
          git diff --check
          git diff -- tests/excel-export.test.ts tests/xlsx-export.test.ts

      - name: Commit reviewed changes
        run: |
          if git diff --quiet; then
            echo "No guarded test changes remain to apply."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/excel-export.test.ts tests/xlsx-export.test.ts
          git commit -m "Combo 2: restore isolated export tests"
          git push origin HEAD:combo-2-logging-skipped-tests
