name: Temporary Voucher Regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_ENV: test
  SESSION_SECRET: github-actions-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
  PGSSLMODE: disable

jobs:
  voucher-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Run Voucher Details Hassan price regression
        run: node node_modules/vitest/vitest.mjs run tests/voucher-details-hassan-price.test.ts --maxWorkers=1 --no-file-parallelism
