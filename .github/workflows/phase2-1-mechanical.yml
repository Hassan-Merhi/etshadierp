name: Phase 2.1 Mechanical Type Cleanup

on:
  push:
    branches:
      - phase-2-1-mechanical-type-escapes-clean
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase-2-1-mechanical-clean-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  mechanical-cleanup:
    if: github.event_name == 'push' || github.head_ref == 'phase-2-1-mechanical-type-escapes-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: phase-2-1-mechanical-type-escapes-clean
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Measure starting scanner state
        run: npm run audit:type-escapes
      - name: Verify backend test baseline
        shell: bash
        run: |
          set +e
          npm run test:backend 2>&1 | tee phase2-1-backend-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload backend baseline failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-1-backend-baseline-failure
          path: phase2-1-backend-baseline.log
      - name: Apply surgical mechanical codemod
        run: node scripts/phase2-1-mechanical-codemod.mjs | tee phase2-1-codemod-report.json
      - name: Filter compiler-unsafe files
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee phase2-1-initial-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "All generated mechanical files compile cleanly."
            exit 0
          fi

          grep -oE '^(server|shared|client/src/lib)/[^(:]+\.(ts|tsx)' phase2-1-initial-tsc.log | sort -u > phase2-1-failing-files.txt || true
          if [ ! -s phase2-1-failing-files.txt ]; then
            echo "TypeScript failed, but no attributable target file was found."
            exit "$status"
          fi

          echo "Reverting generated edits in compiler-unsafe files:"
          cat phase2-1-failing-files.txt
          while IFS= read -r file; do
            if ! git diff --quiet -- "$file"; then
              git checkout -- "$file"
            fi
          done < phase2-1-failing-files.txt

          echo "Rechecking after conservative file-level reverts..."
          npm run check
      - name: Snapshot compiler-safe mechanical batch
        shell: bash
        run: |
          git diff --name-only -- server shared client/src/lib | sort -u > phase2-1-compiler-safe-files.txt
          git diff -- server shared client/src/lib > phase2-1-compiler-safe.patch
          cat phase2-1-compiler-safe-files.txt
      - name: Lock exact lowered baseline
        env:
          UPDATE_TYPE_ESCAPE_BASELINE: "1"
        run: node scripts/audit-type-escapes.mjs
      - name: Reject whitespace damage
        run: git diff --check
      - name: TypeScript final
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Type-escape ratchet
        run: npm run audit:type-escapes
      - name: Changed-file formatting
        run: npm run format:check:changed
      - name: Backend tests
        shell: bash
        run: |
          set +e
          npm run test:backend 2>&1 | tee phase2-1-backend-candidate.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-1-candidate-diagnostics
          path: |
            phase2-1-backend-candidate.log
            phase2-1-codemod-report.json
            phase2-1-compiler-safe-files.txt
            phase2-1-compiler-safe.patch
            phase2-1-failing-files.txt
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Persist green mechanical batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No additional compiler-safe mechanical edits generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server shared client/src/lib config/type-escape-boundaries.json
          git commit -m "refactor(types): remove compiler-safe mechanical type escapes"
          git pull --rebase origin phase-2-1-mechanical-type-escapes-clean
          git push origin HEAD:phase-2-1-mechanical-type-escapes-clean
