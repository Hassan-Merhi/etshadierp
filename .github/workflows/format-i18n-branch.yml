name: Format translation branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: format-translation-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/phases-1-4-global-trilingual-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Normalize registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format source files
        run: npm run format

      - name: Create formatted commit through Git Data API
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD)
          base_tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${parent}" --jq .tree.sha)
          files=(
            client/src/app/FactoryShell.tsx
            client/src/components/ApplicationInterfaceTranslator.tsx
            client/src/components/FactoryBilingualDocumentActions.tsx
            client/src/components/FactoryFrenchCatalogManager.tsx
            client/src/contexts/ApplicationLanguageContext.tsx
            client/src/i18n/accountingDocumentTranslations.ts
            client/src/i18n/applicationTranslations.ts
            client/src/pages/BaleProductsBilingual.tsx
            server/lib/workerBalesBilingualPdfGenerator.ts
            server/routes/factory/factoryBilingualSnapshotRoutes.ts
            server/routes/factory/factoryFrenchCatalogReadRoutes.ts
            server/routes/factory/factoryFrenchTranslationRoutes.ts
            server/routes/factoryRoutes.ts
            server/services/factoryBilingualSurfaceResolver.ts
            shared/factoryBilingualContract.ts
            shared/schema/factoryTrilingualCatalogTables.ts
          )

          printf '{"base_tree":"%s","tree":[' "$base_tree" > tree.json
          first=1
          for file in "${files[@]}"; do
            encoded=$(base64 -w0 "$file")
            blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f content="$encoded" -f encoding=base64 --jq .sha)
            if [ "$first" -eq 0 ]; then printf ',' >> tree.json; fi
            first=0
            jq -n --arg path "$file" --arg sha "$blob" \
              '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> tree.json
          done
          printf ']}' >> tree.json

          tree=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input tree.json --jq .sha)
          jq -n --arg message "Format translation implementation" --arg tree "$tree" --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' > commit.json
          commit=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input commit.json --jq .sha)

          ref="heads/agent/formatted-translation-staging"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/${ref}" -f sha="$commit" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/${ref}" -f sha="$commit" >/dev/null
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      - name: Publish formatted commit SHA
        run: echo "FORMATTED_COMMIT=${{ steps.publish.outputs.sha }}"
