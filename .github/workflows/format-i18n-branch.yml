name: Format translation branch

on:
  push:
    branches:
      - agent/phases-1-4-global-trilingual-foundation

permissions:
  contents: write

concurrency:
  group: format-translation-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/phases-1-4-global-trilingual-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Normalize registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format source files
        run: npm run format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared
          git commit -m "Format translation implementation"
          git push origin HEAD:agent/phases-1-4-global-trilingual-foundation
