name: PR 780 Prettier Repair

on:
  push:
    branches:
      - agent/god-files-recovery-latest-main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/god-files-recovery-latest-main

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format changed source files and remove recovery workflow
        run: |
          git fetch origin main
          base_sha="$(git merge-base HEAD origin/main)"
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi
          rm -f .github/workflows/pr780-prettier-repair.yml

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git commit -m 'Format PR 780 recovery changes'
          git push origin HEAD:agent/god-files-recovery-latest-main
