name: Sync PR 834 Current Main
on:
  push:
    branches: [wave-i/convergence-automation]
    paths: [.github/workflows/sync-pr834-current-main.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wave-i/convergence-automation
          fetch-depth: 0
      - name: Merge exact current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "Merge exact current main into PR 834" || {
            echo "Conflicts detected; resolving with current main for overlapping files while preserving PR-only files"
            conflicts=$(git diff --name-only --diff-filter=U)
            for f in $conflicts; do
              git checkout --theirs -- "$f"
              git add -- "$f"
            done
            git commit -m "Merge exact current main into PR 834"
          }
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/sync-pr834-current-main.yml
          git commit -m "chore: remove PR 834 sync workflow"
      - name: Push synchronized branch
        run: git push origin HEAD:wave-i/convergence-automation
