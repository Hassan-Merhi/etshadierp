name: Phase 18 Safe CI Repair
on:
  push:
    branches: [agent/phase18-phase1-safe-macos-result]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-phase1-safe-macos-result
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit
      - name: Apply mechanical CI repairs
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write tests/workflow.test.ts
          python - <<'PY'
          from pathlib import Path
          for name in ['docs/god-file-split-program.md', 'docs/system-quality-program.md']:
              p = Path(name)
              s = p.read_text()
              if '25,056' in s:
                  s = s.replace('25,056', '25,059')
              elif '25,059' not in s:
                  raise SystemExit(f'expected god-file backlog literal not found in {name}')
              p.write_text(s)
          PY
          UPDATE_ROUTE_MANIFEST=1 npm run test:backend -- route-manifest
          npm run audit:doc-index
      - name: Commit verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/workflow.test.ts docs/god-file-split-program.md docs/system-quality-program.md config/route-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: apply safe Phase 18 mechanical repairs'
          git push origin HEAD:agent/phase18-phase1-safe-macos-result
