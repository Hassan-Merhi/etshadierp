name: Final closeout ratchet fix

on:
  push:
    branches:
      - agent/final-closeout-i18n-release

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/final-closeout-i18n-release
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Repair ratchet regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('server/routes/auth/auditLogRoutes.ts')
          text = audit.read_text(encoding='utf-8')
          text = text.replace('\x08', r'\b')
          audit.write_text(text, encoding='utf-8')

          for raw in [
              'server/routes/sp/spLifecycleRoutes.ts',
              'server/routes/sp/spPermissionRoutes.ts',
          ]:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'import type { Express } from "express";',
                  'import type { Express, Request, Response } from "express";',
              )
              text = text.replace(
                  'async (req: any, res: any)',
                  'async (req: Request, res: Response)',
              )
              path.write_text(text, encoding='utf-8')
          PY
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/auth/auditLogRoutes.ts \
            server/routes/sp/spLifecycleRoutes.ts \
            server/routes/sp/spPermissionRoutes.ts
      - name: Verify ratchets and release checks
        shell: bash
        run: |
          npm run audit:type-escapes
          npm run audit:scripts
          npm run check
          node scripts/audit-i18n-phase14.mjs
          npm run lint
      - name: Commit repairs and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/final-closeout-ratchet-diagnostics.yml
          rm -f .github/workflows/final-closeout-ratchet-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: satisfy final closeout static ratchets"
          git pull --rebase origin agent/final-closeout-i18n-release
          git push origin HEAD:agent/final-closeout-i18n-release
