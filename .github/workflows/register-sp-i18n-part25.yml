name: Register SP i18n part25

on:
  push:
    branches:
      - fix/supplier-partner-customer-legacy-zero-net-position

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-partner-customer-legacy-zero-net-position
          fetch-depth: 0

      - name: Register translation part
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/i18n/sharedUiPhase3Translations.ts')
          text = path.read_text()
          old_import = 'import { phase3RemainingTranslationsPart24 } from "./phase3RemainingTranslations.part24";\n'
          new_import = old_import + 'import { phase3RemainingTranslationsPart25 } from "./phase3RemainingTranslations.part25";\n'
          old_spread = '  ...phase3RemainingTranslationsPart24,\n'
          new_spread = old_spread + '  ...phase3RemainingTranslationsPart25,\n'
          if old_import not in text or old_spread not in text:
              raise SystemExit('phase3 translation registry anchors not found')
          text = text.replace(old_import, new_import, 1).replace(old_spread, new_spread, 1)
          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/register-sp-i18n-part25.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: register SP cash account labels"
          git push origin HEAD:fix/supplier-partner-customer-legacy-zero-net-position
