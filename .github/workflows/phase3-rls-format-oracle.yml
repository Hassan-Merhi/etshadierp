name: Phase 3 RLS Diagnostic Oracle

on:
  push:
    branches:
      - phase-3-rls-fail-closed

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up canonical Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Capture script inventory
        run: |
          set +e
          node scripts/audit-script-inventory.mjs --json > phase3-script-inventory.json 2>&1
          status=$?
          echo "$status" > phase3-script-inventory.exit
          exit 0

      - name: Upload script inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase3-script-inventory
          path: |
            phase3-script-inventory.json
            phase3-script-inventory.exit
          if-no-files-found: error
          retention-days: 1
