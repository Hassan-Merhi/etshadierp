name: Phase 3 RLS Format Oracle

on:
  push:
    branches:
      - phase-3-rls-fail-closed

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up canonical Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Phase 3 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/scheduler/daily-export.ts \
            server/startupMigrationCoordinator.ts \
            tests/company-scope-rls-migration.test.ts \
            tests/company-scope-rls-runtime.test.ts \
            tests/phase3-rls-fail-closed-contract.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase3-prettier-output
          path: |
            server/services/scheduler/daily-export.ts
            server/startupMigrationCoordinator.ts
            tests/company-scope-rls-migration.test.ts
            tests/company-scope-rls-runtime.test.ts
            tests/phase3-rls-fail-closed-contract.test.ts
          if-no-files-found: error
          retention-days: 1
