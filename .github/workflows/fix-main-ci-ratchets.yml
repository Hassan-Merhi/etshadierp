name: Stop temporary remote-support reconciliation

on:
  push:
    branches:
      - agent/fix-core-entry-bandwidth-budget

permissions:
  contents: read

concurrency:
  group: reconcile-remote-support-ci
  cancel-in-progress: true

jobs:
  stop-writer:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Temporary reconciliation writer stopped; permanent fixes are committed directly."
