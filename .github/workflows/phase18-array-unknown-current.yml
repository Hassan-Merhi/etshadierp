name: Phase 18 Current Array Unknown Harvest
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[phase18-array-unknown-current]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Capture baseline and harvest compiler-safe any arrays
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-before.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-before.json
          set -e
          cat > .phase18-array-unknown.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path');
          const root=process.cwd();
          const cp=ts.findConfigFile(root,ts.sys.fileExists,'tsconfig.json');
          const cf=ts.readConfigFile(cp,ts.sys.readFile);
          const parsed=ts.parseJsonConfigFileContent(cf.config,ts.sys,path.dirname(cp));
          const files=parsed.fileNames.filter(f=>{const r=path.relative(root,f).replaceAll('\\','/');return /^(client\/src|server|shared)\//.test(r)&&/\.(ts|tsx)$/.test(r)&&!r.endsWith('.d.ts')&&fs.existsSync(f)});
          const state=new Map(parsed.fileNames.filter(fs.existsSync).map(f=>[path.resolve(f),{text:fs.readFileSync(f,'utf8'),version:0}]));
          const host={getCompilationSettings:()=>parsed.options,getScriptFileNames:()=>parsed.fileNames,getScriptVersion:f=>String(state.get(path.resolve(f))?.version??0),getScriptSnapshot:f=>{const e=state.get(path.resolve(f));if(e)return ts.ScriptSnapshot.fromString(e.text);if(fs.existsSync(f))return ts.ScriptSnapshot.fromString(fs.readFileSync(f,'utf8'))},getCurrentDirectory:()=>root,getDefaultLibFileName:o=>ts.getDefaultLibFilePath(o),fileExists:ts.sys.fileExists,readFile:ts.sys.readFile,readDirectory:ts.sys.readDirectory,directoryExists:ts.sys.directoryExists,getDirectories:ts.sys.getDirectories,realpath:ts.sys.realpath};
          const ls=ts.createLanguageService(host,ts.createDocumentRegistry());
          const set=(f,t)=>{const k=path.resolve(f),e=state.get(k)||{text:fs.readFileSync(f,'utf8'),version:0};e.text=t;e.version++;state.set(k,e)};
          const diags=f=>[...ls.getSyntacticDiagnostics(f),...ls.getSemanticDiagnostics(f)];
          const apply=(text,ps)=>{for(const p of [...ps].sort((a,b)=>b.start-a.start))text=text.slice(0,p.start)+'unknown'+text.slice(p.end);return text};
          let candidates=0,accepted=0,changed=0;
          for(const file of files){const original=fs.readFileSync(file,'utf8'),sf=ts.createSourceFile(file,original,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),pos=[];const v=n=>{if(n.kind===ts.SyntaxKind.AnyKeyword&&ts.isArrayTypeNode(n.parent))pos.push({start:n.getStart(sf),end:n.end});ts.forEachChild(n,v)};v(sf);if(!pos.length)continue;candidates+=pos.length;let keep=[];for(const p of pos){const trial=apply(original,[...keep,p]);set(file,trial);if(diags(file).length===0)keep.push(p);else set(file,apply(original,keep));}if(!keep.length){set(file,original);continue}const out=apply(original,keep);set(file,out);if(diags(file).length===0){fs.writeFileSync(file,out);accepted+=keep.length;changed++;console.log(`ACCEPT ${path.relative(root,file).replaceAll('\\','/')} ${keep.length}/${pos.length}`)}else set(file,original)}
          console.log(`ARRAY_SUMMARY candidates=${candidates} accepted=${accepted} files=${changed}`);
          NODE
          node .phase18-array-unknown.cjs
          rm -f .phase18-array-unknown.cjs
          git diff --name-only -- '*.ts' '*.tsx' >/tmp/changed-files
          echo "ARRAY_CHANGED_FILES=$(wc -l </tmp/changed-files | tr -d ' ')"
          test -s /tmp/changed-files
      - name: Full-program compiler gate with rollback
        shell: bash
        run: |
          set -euo pipefail
          green=0
          for attempt in $(seq 1 14); do
            set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then green=1; echo "ARRAY_FULL_GREEN_ATTEMPT=$attempt"; break; fi
            mapfile -t errs < <(sed -nE 's#^(.+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
            reverted=0
            for f in "${errs[@]}"; do
              if git diff --name-only | grep -Fxq "$f"; then git restore --source=HEAD --worktree -- "$f"; reverted=$((reverted+1)); fi
            done
            echo "ARRAY_ROLLBACK attempt=$attempt errorFiles=${#errs[@]} reverted=$reverted"
            if [ "$reverted" -eq 0 ]; then tail -n 120 /tmp/check.log; git reset --hard HEAD; exit 1; fi
            git diff --name-only -- '*.ts' '*.tsx' >/tmp/changed-files
            test -s /tmp/changed-files || { git reset --hard HEAD; exit 1; }
          done
          test "$green" = 1
      - name: Require strict debt reduction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/audit-type-escapes.mjs --json >/tmp/type-after.json
          npx eslint "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts" -f json -o /tmp/lint-after.json
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const tb=JSON.parse(fs.readFileSync('/tmp/type-before.json','utf8')),ta=JSON.parse(fs.readFileSync('/tmp/type-after.json','utf8'));
          const c=p=>{const r=JSON.parse(fs.readFileSync(p,'utf8'));let errors=0,warnings=0,any=0;for(const f of r)for(const m of f.messages){if(m.severity===2)errors++;if(m.severity===1)warnings++;if(m.ruleId==='@typescript-eslint/no-explicit-any')any++;}return{errors,warnings,any}};
          const b=c('/tmp/lint-before.json'),a=c('/tmp/lint-after.json');
          console.log(`ARRAY_TYPE ${tb.summary.typeEscapeTotal} -> ${ta.summary.typeEscapeTotal}`);console.log('ARRAY_LINT '+JSON.stringify(b)+' -> '+JSON.stringify(a));
          if(a.errors!==0||ta.summary.typeEscapeTotal>=tb.summary.typeEscapeTotal||a.any>=b.any||a.warnings>b.warnings)process.exit(1);
          NODE
      - name: Publish verified result branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src server shared
          git commit -m 'refactor: replace compiler-safe any arrays with unknown arrays [phase18-array-unknown]'
          npm run check
          git push --force origin HEAD:agent/phase18-array-unknown-current-v2
