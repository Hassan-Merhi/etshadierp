name: Combo 4D Regression Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: combo4d-regression-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/combo-4d-stock-pos-vouchers-typescript'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Combo 4D branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply validation regression corrections
        run: node scripts/combo-4d-regression-fix.mjs
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/stock/stockMergeRoutes.ts \
                  server/routes/location/locationCrudRoutes.ts
          if git diff --cached --quiet; then
            echo "Combo 4D regression corrections already applied."
          else
            git commit -m "Correct Combo 4D validation regressions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
