name: Cleanup bandwidth phases 7-8

on:
  push:
    branches:
      - agent/bandwidth-phases-7-8

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bandwidth-phases-7-8
          fetch-depth: 0
      - run: python scripts/cleanup-bandwidth-phases-7-8.py
      - run: |
          rm -f scripts/cleanup-bandwidth-phases-7-8.py
          rm -f .github/workflows/cleanup-bandwidth-phases-7-8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize cross-company details and Phase 7-8 source cleanup"
          git push origin HEAD:agent/bandwidth-phases-7-8
