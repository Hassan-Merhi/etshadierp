name: Phase 2 Puppeteer Security Repair

on:
  push:
    branches:
      - program/erp-90-phase-2
    paths:
      - .github/workflows/phase2-puppeteer-security-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Normalize registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Upgrade vulnerable Puppeteer chain
        env:
          PUPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm install --ignore-scripts --save-exact puppeteer@25.6.0
          npm ci --ignore-scripts --no-audit
      - name: Verify dependency gate
        run: npm run verify:dependency-audit
      - name: Verify TypeScript
        run: npm run check
      - name: Commit generated dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes produced"
            exit 1
          fi
          git commit -m "fix(security): upgrade Puppeteer dependency chain"
          git push origin HEAD:program/erp-90-phase-2
