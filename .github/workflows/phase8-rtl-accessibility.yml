name: Phase 8 RTL and accessibility

on:
  pull_request:
    paths:
      - "client/src/app/**"
      - "client/src/components/**"
      - "client/src/contexts/ApplicationLanguageContext.tsx"
      - "client/src/i18n/**"
      - "client/src/styles/**"
      - "config/i18n-phase14-baseline.json"
      - "scripts/audit-i18n-phase14.mjs"
      - "scripts/verify-program7d-accessibility-responsive.mjs"
      - "tests/phase14-i18n-release-gate.test.ts"
      - "tests/phase8-rtl-responsive-accessibility.test.ts"
      - "vitest.config.i18n-contracts.ts"
      - ".github/workflows/phase8-rtl-accessibility.yml"
  push:
    branches:
      - agent/phase-8-rtl-responsive-accessibility

permissions:
  contents: read

concurrency:
  group: phase8-rtl-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Capture full frontend regression output
        id: frontend
        shell: bash
        run: |
          set +e
          npm run test:frontend > frontend-output.txt 2>&1
          code=$?
          cat frontend-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-frontend-output
          path: frontend-output.txt
          if-no-files-found: error

      - name: Preserve frontend regression result
        if: always()
        run: test "${{ steps.frontend.outputs.code }}" = "0"
