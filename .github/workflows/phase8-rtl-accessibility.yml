name: Phase 8 RTL and accessibility

on:
  pull_request:
    paths:
      - "client/src/app/**"
      - "client/src/components/**"
      - "client/src/contexts/ApplicationLanguageContext.tsx"
      - "client/src/i18n/**"
      - "client/src/styles/**"
      - "config/i18n-phase14-baseline.json"
      - "scripts/audit-i18n-phase14.mjs"
      - "scripts/verify-program7d-accessibility-responsive.mjs"
      - "tests/phase14-i18n-release-gate.test.ts"
      - "tests/phase8-rtl-responsive-accessibility.test.ts"
      - "vitest.config.i18n-contracts.ts"
      - ".github/workflows/phase8-rtl-accessibility.yml"
  push:
    branches:
      - agent/phase-8-rtl-responsive-accessibility

permissions:
  contents: write

concurrency:
  group: phase8-rtl-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/remote-support-phase-4-current-main
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply exact ESLint import fix
        run: |
          node node_modules/eslint/bin/eslint.js --fix server/routes/sp/spOffloadLifecycleRoutes.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/sp/spOffloadLifecycleRoutes.ts
          if git diff --cached --quiet; then
            echo "No lint fix required."
          else
            git commit -m "Remove unused SP lifecycle imports"
            SKIP_TSC_CHECK=1 git push origin HEAD:agent/remote-support-phase-4-current-main
          fi
