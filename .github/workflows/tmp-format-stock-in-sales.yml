name: Temporary Stock In Sales Formatter

on:
  push:
    branches:
      - fix/stock-in-sales-exclude-internal-transfers

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/stock-in-sales-exclude-internal-transfers
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format report files
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/StockInSalesReport.tsx client/src/pages/StockInSalesReportDetail.tsx server/services/reports/stockInSalesReportService.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/StockInSalesReport.tsx client/src/pages/StockInSalesReportDetail.tsx server/services/reports/stockInSalesReportService.ts
          git commit -m "chore: format stock in sales report changes"
          git push origin HEAD:fix/stock-in-sales-exclude-internal-transfers
