name: One-off responsive smoke fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/multi-dd1c4363d0

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/npm_and_yarn/multi-dd1c4363d0
          fetch-depth: 0

      - name: Make responsive smoke wait for routed UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-phase9-language-browser-smoke.mjs')
          text = path.read_text()
          old = '''async function openRoute(page, route) {
            const response = await page.goto(`${BASE_URL}${route}`, {
              waitUntil: "domcontentloaded",
              timeout: TIMEOUT_MS,
            });
            await waitForSettledUi(page);
            return response?.status() ?? null;
          }
          '''
          new = '''async function waitForRouteUi(page) {
            await page.waitForFunction(
              () => {
                if (window.location.pathname === "/login") {
                  return Boolean(
                    document.querySelector('[data-testid="input-username"]') &&
                      document.querySelector('[data-testid="input-password"]') &&
                      document.querySelector('[data-testid="button-login"]'),
                  );
                }

                return Boolean(
                  document.getElementById("main-content") && document.querySelector('[data-slot="sidebar-wrapper"]'),
                );
              },
              { timeout: TIMEOUT_MS },
            );
          }

          async function openRoute(page, route) {
            const response = await page.goto(`${BASE_URL}${route}`, {
              waitUntil: "domcontentloaded",
              timeout: TIMEOUT_MS,
            });
            await waitForRouteUi(page);
            await waitForSettledUi(page);
            return response?.status() ?? null;
          }
          '''
          if old not in text:
              raise SystemExit('Expected openRoute block was not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/one-off-responsive-smoke-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-phase9-language-browser-smoke.mjs
          git commit -m 'fix(ci): wait for routed UI before responsive assertions'
          git push origin HEAD:dependabot/npm_and_yarn/multi-dd1c4363d0
