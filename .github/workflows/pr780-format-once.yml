name: PR 780 one-shot format repair

on:
  push:
    branches:
      - agent/god-files-recovery-latest-main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format exact CI-reported files
        run: |
          npx prettier --write -- \
            client/src/i18n/sharedUiPhase3Translations.part7.ts \
            client/src/pages/TransactionJournal.tsx \
            client/src/pages/accountslegacy/useAccountsLegacyModel.ts \
            client/src/pages/barcodelookup/BarcodeAdminDialogs.tsx \
            client/src/pages/barcodelookup/BarcodeArticleResults.tsx \
            client/src/pages/barcodelookup/BarcodeReferenceResults.tsx \
            client/src/pages/barcodelookup/useBarcodeLookupModel.tsx \
            client/src/pages/factory/daybook/useFactoryDaybookModel.ts \
            client/src/pages/factory/factory-suppliers/FactorySupplierStatementBranch.tsx \
            client/src/pages/factory/factory-suppliers/FactorySuppliersBrokerBranch.tsx \
