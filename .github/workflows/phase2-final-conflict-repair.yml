name: Phase 2 Final Conflict Repair

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Merge current main and resolve report-only drift
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts: %s\n' "${conflicts[*]}"
            expected_a="client/src/pages/StockInSalesReport.tsx"
            expected_b="client/src/pages/StockInSalesReportDetail.tsx"
            for conflict in "${conflicts[@]}"; do
              if [ "$conflict" != "$expected_a" ] && [ "$conflict" != "$expected_b" ]; then
                echo "Unexpected merge conflict: $conflict"
                exit 1
              fi
            done
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "Merge failed without merge conflicts"
              exit 1
            fi
            git checkout --theirs -- "$expected_a" "$expected_b"
            git add "$expected_a" "$expected_b"
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi
      - run: npm ci --ignore-scripts
      - name: Targeted Phase 2 frontend repairs
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts --maxWorkers=1 \
            tests/ui/journal-form-page-behavior.test.tsx \
            tests/ui/stock-entry-history-page-behavior.test.tsx
      - name: Quality verification
        run: |
          npm run check
          npm run audit:type-escapes
          npm run audit:doc-index
          npm run audit:scripts
          node node_modules/prettier/bin/prettier.cjs --check \
            tests/ui/journal-form-page-behavior.test.tsx \
            tests/ui/stock-entry-history-page-behavior.test.tsx \
            .github/workflows/mobile-responsive.yml
      - name: Full frontend regression with bounded memory
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test:frontend -- --maxWorkers=1
      - name: Commit resolved main and remove temporary workflow
        run: |
          git rm .github/workflows/phase2-final-conflict-repair.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize Phase 2 against latest main"
          SKIP_TSC_CHECK=1 git push origin HEAD:program/erp-90-phase-2
