name: Reconcile Mobile Phases 4-6

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 4
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phase-4-forms-dialogs
          path: phase4
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Check out Phase 5
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phase-5-tables-data-lists
          path: phase5
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Check out Phase 6
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phase-6-core-erp
          path: phase6
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Reconcile and propagate stack
        shell: bash
        run: |
          set -euo pipefail
          configure_git() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }

          cd phase4
          configure_git
          git fetch --no-tags origin main:refs/remotes/origin/main --depth=600
          git merge --no-ff origin/main -m "Merge current main into Phase 4"
          rm -f .github/phase4-main-conflicts.txt
          rm -f .github/phase4-pr-conflict-trigger.txt
          rm -f .github/workflows/phase4-main-conflict-diagnostic.yml
          rm -f .github/workflows/reconcile-mobile-phases-4-6.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Phase 4: finalize main reconciliation"
          fi
          git push origin HEAD:agent/mobile-responsive-phase-4-forms-dialogs

          cd ../phase5
          configure_git
          git fetch --no-tags origin agent/mobile-responsive-phase-4-forms-dialogs:refs/remotes/origin/phase4 --depth=600
          git merge --no-ff origin/phase4 -m "Merge reconciled Phase 4 into Phase 5"
          git push origin HEAD:agent/mobile-responsive-phase-5-tables-data-lists

          cd ../phase6
          configure_git
          git fetch --no-tags origin agent/mobile-responsive-phase-5-tables-data-lists:refs/remotes/origin/phase5 --depth=600
          git merge --no-ff origin/phase5 -m "Merge reconciled Phase 5 into Phase 6"
          git push origin HEAD:agent/mobile-responsive-phase-6-core-erp
