name: God Files Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: god-files-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'agent/god-files-recovery-main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-main
          fetch-depth: 0

      - name: Recover completed God Files work without overwriting newer main edits
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[god-files-recovery-safe]'; then
            echo 'Safe transplant already completed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git fetch origin agent/god-files-waves-05-19:refs/remotes/origin/god-files-old

          MERGE_BASE=4e2eb176ddfb141c3d1407e0a61cd6cdf3823da4
          OLD=origin/god-files-old
          MAIN=origin/main

          npm ci
          set +e
          npm run check >/tmp/baseline-check.log 2>&1
          set -e
          sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/baseline-check.log | sort -u >/tmp/baseline-error-files.txt

          roots=(
            'client/src/components/StockItemDetailsDialog.tsx'
            'client/src/components/stockitemdetailsdialog'
            'client/src/pages/factory/FactoryLocationInventory.tsx'
            'client/src/pages/factory/FactoryLocationInventoryLocationView.tsx'
            'client/src/pages/factory/FactoryLocationInventoryModel.tsx'
            'client/src/pages/factory/FactoryLocationInventoryProductRenderers.tsx'
            'client/src/pages/factory/FactoryLocationInventoryProductView.tsx'
            'client/src/pages/factory/factorylocationinventory'
            'client/src/pages/StockItems.tsx'
            'client/src/pages/stockitems'
            'client/src/pages/StockEntryHistory.tsx'
            'client/src/pages/stockentryhistory'
            'client/src/pages/vouchers/StockAdjustmentForm.tsx'
            'client/src/pages/vouchers/stock-adjustment-form'
            'client/src/pages/vouchers/StockTransferForm.tsx'
            'client/src/pages/vouchers/stock-transfer-form'
            'client/src/pages/StockTransferOrder.tsx'
            'client/src/pages/stock-transfer-order'
            'client/src/pages/stocktransferorder'
            'client/src/pages/vouchers/JournalForm.tsx'
            'client/src/pages/vouchers/journalform'
            'client/src/pages/BarcodeLookup.tsx'
            'client/src/pages/barcodelookup'
            'client/src/pages/factory/FactorySuppliers.tsx'
            'client/src/pages/factory/factory-suppliers'
            'client/src/pages/SupplierProfitCheck.tsx'
            'client/src/pages/supplierprofitcheck'
            'client/src/pages/sp/GcLshiMigration.tsx'
            'client/src/pages/sp/gclshimigration'
            'client/src/pages/factory/FactorySettings.tsx'
            'client/src/pages/factory/factorysettings'
            'client/src/pages/settings/DataToolsTab.tsx'
            'client/src/pages/settings/datatoolstab'
            'server/services/factory/postOffloadPhase6Safety.ts'
            'server/services/factory/postOffloadPhase6SafetyImpl.ts'
            'config/god-file-boundaries.json'
            'tests/god-file-boundaries.test.ts'
            'tests/ui/god-files-wave6-import-contract.test.ts'
            'tests/ui/god-files-wave13-import-contract.test.ts'
            'tests/ui/god-files-wave14-import-contract.test.ts'
          )

          : >/tmp/selected.txt
          for root in "${roots[@]}"; do
            if git cat-file -e "$OLD:$root" 2>/dev/null; then
              type=$(git cat-file -t "$OLD:$root")
              if [ "$type" = tree ]; then
                git ls-tree -r --name-only "$OLD" -- "$root" >>/tmp/selected.txt
              else
                echo "$root" >>/tmp/selected.txt
              fi
            elif git cat-file -e "$MERGE_BASE:$root" 2>/dev/null; then
              echo "$root" >>/tmp/selected.txt
            fi
          done
          sort -u /tmp/selected.txt -o /tmp/selected.txt

          : >/tmp/overlaps.txt
          : >/tmp/copied.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! git diff --quiet "$MERGE_BASE" "$MAIN" -- "$f"; then
              echo "$f" >>/tmp/overlaps.txt
              continue
            fi
            if git cat-file -e "$OLD:$f" 2>/dev/null; then
              git checkout "$OLD" -- "$f"
            else
              git rm -f --ignore-unmatch -- "$f"
            fi
            echo "$f" >>/tmp/copied.txt
          done </tmp/selected.txt

          for attempt in 1 2 3 4 5; do
            set +e
            npm run check >/tmp/after-check.log 2>&1
            set -e
            sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/after-check.log | sort -u >/tmp/after-error-files.txt
            comm -13 /tmp/baseline-error-files.txt /tmp/after-error-files.txt >/tmp/new-error-files.txt || true
            [ -s /tmp/new-error-files.txt ] || break

            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if [[ "$f" == client/src/pages/barcodelookup/* ]]; then
                prefix='client/src/pages/barcodelookup'
              elif [[ "$f" == client/src/pages/factory/factory-suppliers/* ]]; then
                prefix='client/src/pages/factory/factory-suppliers'
              else
                prefix="$f"
              fi
              while IFS= read -r changed; do
                [ -n "$changed" ] || continue
                if [[ "$changed" == "$prefix" || "$changed" == "$prefix"/* ]]; then
                  if git cat-file -e "HEAD:$changed" 2>/dev/null; then
                    git checkout HEAD -- "$changed"
                  else
                    git rm -f --ignore-unmatch -- "$changed"
                  fi
                fi
              done < <(git diff --cached --name-only)
            done </tmp/new-error-files.txt
          done

          set +e
          npm run check >/tmp/final-check.log 2>&1
          set -e
          sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/final-check.log | sort -u >/tmp/final-error-files.txt
          comm -13 /tmp/baseline-error-files.txt /tmp/final-error-files.txt >/tmp/final-new-error-files.txt || true
          if [ -s /tmp/final-new-error-files.txt ]; then
            echo 'Recovery still introduces new TypeScript error files:'
            cat /tmp/final-new-error-files.txt
            cat /tmp/final-check.log
            exit 1
          fi

          echo "Safe candidates: $(wc -l </tmp/copied.txt)"
          echo "Main-overlap files: $(wc -l </tmp/overlaps.txt)"
          echo 'Overlaps requiring reconciliation:'
          cat /tmp/overlaps.txt
          echo 'Files retained in compiler-neutral transplant:'
          git diff --cached --name-only

          if git diff --cached --quiet && git diff --quiet; then
            echo 'No compiler-neutral transplant changes remained.'
            exit 1
          fi

          git add -A
          git commit -m 'refactor: transplant compiler-neutral God Files recovery subset [god-files-recovery-safe]'
          git push origin HEAD:agent/god-files-recovery-main
