name: Phase 4 contextual reduction

on:
  push:
    branches:
      - agent/lint-phase-4-fast

permissions:
  contents: write

concurrency:
  group: phase4-contextual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contextual-reduction:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-contextual]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Retype compiler-required casts from contextual contracts
        run: node scripts/phase4-contextual-worker.mjs
      - name: Format changed sources
        run: |
          FILES=$(git diff --name-only -- client/src server shared | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            node node_modules/prettier/bin/prettier.cjs --write $FILES
          fi
      - name: Verify TypeScript after formatting
        run: npm run check
      - name: Report remaining cast count
        run: node scripts/audit-type-escapes.mjs --json | tee phase4-contextual-audit.json || true
      - name: Persist contextual retyping
        run: |
          if git diff --quiet -- client/src server shared; then
            echo "No contextual Phase 4 changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared
          git commit -m "refactor: replace compiler-required any casts with concrete contracts [phase4-contextual]"
          git push origin HEAD:${GITHUB_REF_NAME}
