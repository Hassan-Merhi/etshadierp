name: Phase 4 family reduction

on:
  push:
    branches:
      - agent/lint-phase-4-fast

permissions:
  contents: write

concurrency:
  group: phase4-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  family:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-family]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Remove typed session and handled-error casts
        run: node scripts/phase4-family-worker.mjs
      - name: Persist family reduction
        run: |
          if git diff --quiet -- client/src server shared; then
            echo "No family reduction to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared
          git commit -m "refactor: remove typed Phase 4 cast families [phase4-family]"
          git push origin HEAD:${GITHUB_REF_NAME}
