name: Phase 4 precision probe

on:
  push:
    branches:
      - agent/lint-phase-4-fast

permissions:
  contents: read

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Test casts individually
        run: node scripts/phase4-precision-worker.mjs
