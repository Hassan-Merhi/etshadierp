name: Phase 4 concrete bridge reduction

on:
  push:
    branches:
      - agent/lint-phase-4-fast

permissions:
  contents: write

concurrency:
  group: phase4-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-reduction:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-bridge]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Replace remaining inferable any casts with concrete bridges
        run: node scripts/phase4-bridge-worker.mjs
      - name: Format changed sources
        run: |
          FILES=$(git diff --name-only -- client/src server shared | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            node node_modules/prettier/bin/prettier.cjs --write $FILES
          fi
      - name: Verify TypeScript after formatting
        run: npm run check
      - name: Report remaining cast count
        run: node scripts/audit-type-escapes.mjs --json | tee phase4-bridge-audit.json || true
      - name: Persist concrete bridge retyping
        run: |
          if git diff --quiet -- client/src server shared; then
            echo "No concrete Phase 4 bridge changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared
          git commit -m "refactor: replace remaining inferable any casts with concrete bridges [phase4-bridge]"
          git push origin HEAD:${GITHUB_REF_NAME}
