name: Phase 3 Formatting Diagnostic

on:
  pull_request:
    branches: [main]

concurrency:
  group: phase3-formatting-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply exact formatting
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/components/ui/workspace-layout.tsx tests/ui/phase10-ui-consistency.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: phase3-formatted-source
          path: |
            client/src/components/ui/workspace-layout.tsx
            tests/ui/phase10-ui-consistency.test.ts
          retention-days: 1
