name: Phase 18 Toolchain Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[phase18-toolchain-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: npm
      - name: Normalize every GitHub Actions Node pin to the canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          canonical=Path('.node-version').read_text().strip()
          changed=[]
          for p in sorted(Path('.github/workflows').glob('*.y*ml')):
              s=p.read_text()
              out=re.sub(r"(?m)^(\s*node-version:\s*).*$", lambda m: f"{m.group(1)}'{canonical}'", s)
              if out != s:
                  p.write_text(out)
                  changed.append(str(p))
          print('NORMALIZED_WORKFLOWS='+str(len(changed)))
          for p in changed: print(p)
          PY
      - name: Verify canonical toolchain coherence
        run: node scripts/audit-toolchain-coherence.mjs
      - name: Commit and push verified normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'NO_TOOLCHAIN_CHANGES=1'
            exit 0
          fi
          git commit -m 'ci: normalize workflow Node pins to canonical runtime [phase18-toolchain-fixed] [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && node scripts/audit-toolchain-coherence.mjs && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
# trigger 2026-08-17
