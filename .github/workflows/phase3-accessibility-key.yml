name: Align Phase 3 accessibility key

on:
  push:
    branches:
      - agent/audit-phase-3-runtime-recovery

permissions:
  contents: write

jobs:
  align-key:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-phase-3-runtime-recovery
          fetch-depth: 0

      - name: Rename accessibility key
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              "client/src/app/ErpShell.tsx",
              "client/src/i18n/applicationTranslations.ts",
          ]:
              path = Path(name)
              content = path.read_text()
              content = content.replace("accessibility.erpWorkspace", "accessibility.erpMainWorkspace")
              path.write_text(content)
          PY

      - name: Commit key alignment
        run: |
          if git diff --quiet; then
            echo "Accessibility key already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/app/ErpShell.tsx client/src/i18n/applicationTranslations.ts
          git commit -m "fix: align ERP workspace accessibility key"
          SKIP_TSC_CHECK=1 git push origin HEAD:agent/audit-phase-3-runtime-recovery
