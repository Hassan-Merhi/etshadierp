name: TEMP CI Repair 758

on:
  push:
    branches:
      - fix/ci-postgres-suite-cleanup-20260818

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-postgres-suite-cleanup-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Apply exact test-harness repairs
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/post-offload-charge-mutation-positive-path.test.ts")
          text = path.read_text()
          old_tx = """  const tx = {\n    select: vi.fn(() => {"""
          new_tx = """  const tx = {\n    execute: vi.fn(async () => []),\n    select: vi.fn(() => {"""
          if old_tx not in text:
              raise SystemExit("post-offload tx marker not found")
          text = text.replace(old_tx, new_tx, 1)

          old_mock = """vi.mock(\"drizzle-orm\", () => ({\n  and: (...conditions: unknown[]) => conditions,\n  eq: (column: unknown, value: unknown) => ({ column, value }),\n  isNull: (column: unknown) => ({ column, value: null }),\n}));"""
          new_mock = """vi.mock(\"drizzle-orm\", async (importOriginal) => {\n  const actual = await importOriginal<typeof import(\"drizzle-orm\")>();\n  return {\n    ...actual,\n    and: (...conditions: unknown[]) => conditions,\n    eq: (column: unknown, value: unknown) => ({ column, value }),\n    isNull: (column: unknown) => ({ column, value: null }),\n  };\n});"""
          if old_mock not in text:
              raise SystemExit("post-offload drizzle mock marker not found")
          path.write_text(text.replace(old_mock, new_mock, 1))
      - name: Format repaired files
        run: >-
          npx prettier --write
          tests/post-offload-charge-mutation-positive-path.test.ts
          tests/vouchers.test.ts
          tests/whatsapp-triggers.test.ts
          tests/ui/helpers.tsx
          tests/voucherRequestIdentityTestBridge.mjs
      - name: Targeted backend test
        run: node node_modules/vitest/vitest.mjs run tests/post-offload-charge-mutation-positive-path.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Targeted frontend test
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/renders-uncovered-pages.test.tsx --maxWorkers=1 --no-file-parallelism
      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/post-offload-charge-mutation-positive-path.test.ts tests/vouchers.test.ts tests/whatsapp-triggers.test.ts tests/ui/helpers.tsx tests/voucherRequestIdentityTestBridge.mjs
          git commit -m "test: repair remaining CI harness regressions"
          git push origin HEAD:fix/ci-postgres-suite-cleanup-20260818
