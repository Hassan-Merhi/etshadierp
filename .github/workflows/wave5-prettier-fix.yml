name: Wave 5 Prettier Fix

on:
  push:
    branches:
      - agent/god-files-wave-05-rental-payment-service

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/god-files-wave-05-rental-payment-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply repository Prettier
        run: npx prettier --write server/services/rental/rentalPaymentPostingService.ts
      - name: Remove temporary workflow and commit exact formatting
        run: |
          git rm .github/workflows/wave5-prettier-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/rental/rentalPaymentPostingService.ts
          git diff --cached --quiet && exit 1
          git commit -m "style: apply exact prettier output for Wave 5"
          git push origin HEAD:agent/god-files-wave-05-rental-payment-service
