name: Phase 18 Container Loading Split

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  refactor:
    if: contains(github.event.head_commit.message, '[phase18-container-loading-split]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Extract feedback helper and mutation contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat >> client/src/pages/containerloadingscan/types.ts <<'TS'

          export interface CreateLoadingOrderInput {
            customerId: number;
            proformaIdUsed: number | null;
            locationId: number;
            orderDate: string;
            containerNotes?: string;
          }

          export interface CreateLoadingOrderResponse {
            id: number;
          }

          export interface AddLoadingBaleInput {
            scanCode: string;
            locationId: number;
            allowBypassProforma?: boolean;
            allowBypassOverload?: boolean;
          }

          export interface AddLoadingBaleResponse {
            bales?: OrderBale[];
          }
          TS
          cat > client/src/pages/containerloadingscan/utils.ts <<'TS'
          import type { OrderBale } from "./types";

          export function playScanSuccessTone(): void {
            try {
              const AudioContextConstructor =
                window.AudioContext ||
                (
                  window as unknown as Window &
                    typeof globalThis & {
                      webkitAudioContext: typeof AudioContext;
                    }
                ).webkitAudioContext;
              const context = new AudioContextConstructor();
              const oscillator = context.createOscillator();
              oscillator.connect(context.destination);
              oscillator.frequency.value = 1000;
              void context.resume().then(() => {
                oscillator.start();
                setTimeout(() => {
                  oscillator.stop();
                  void context.close();
                }, 120);
              });
            } catch {
              // Audio feedback is optional; scanning remains functional without browser audio support.
            }
          }

          export function newestOrderBale(bales: readonly OrderBale[] | undefined): OrderBale | undefined {
            return bales ? [...bales].sort((left, right) => right.id - left.id)[0] : undefined;
          }
          TS
          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/ContainerLoadingScan.tsx'); s=p.read_text()
          old='import type { Customer, Location, OrderBale, OrderDetail, Proforma } from "./containerloadingscan/types";'
          new='''import type {
            AddLoadingBaleInput,
            AddLoadingBaleResponse,
            CreateLoadingOrderInput,
            CreateLoadingOrderResponse,
            Customer,
            Location,
            OrderBale,
            OrderDetail,
            Proforma,
          } from "./containerloadingscan/types";
          import { newestOrderBale, playScanSuccessTone } from "./containerloadingscan/utils";'''
          assert old in s; s=s.replace(old,new)
          old='''    mutationFn: async (data: {
              customerId: number;
              proformaIdUsed: number | null;
              locationId: number;
              orderDate: string;
              containerNotes?: string;
            }) => {'''
          assert old in s; s=s.replace(old,'    mutationFn: async (data: CreateLoadingOrderInput) => {')
          s=s.replace('    onSuccess: (data: any) => {','    onSuccess: (data: CreateLoadingOrderResponse) => {',1)
          old='''    mutationFn: async (data: {
              scanCode: string;
              locationId: number;
              allowBypassProforma?: boolean;
              allowBypassOverload?: boolean;
            }) => {'''
          assert old in s; s=s.replace(old,'    mutationFn: async (data: AddLoadingBaleInput) => {')
          old='''    onSuccess: (
              data: any,
              variables: { scanCode: string; locationId: number; allowBypassProforma?: boolean; allowBypassOverload?: boolean }
            ) => {'''
          assert old in s; s=s.replace(old,'    onSuccess: (data: AddLoadingBaleResponse, variables: AddLoadingBaleInput) => {')
          speech='      const _speechMsg = variables.allowBypassProforma ? "Bypass confirmed. Item added." : "Scanned successfully";\n'
          s=s.replace(speech,'')
          start=s.index('      try {\n        const ctx = new (')
          end=s.index('      setTimeout(() => {',start)
          s=s[:start]+'      playScanSuccessTone();\n'+s[end:]
          s=s.replace('const newestForRef = [...(data?.bales || [])].sort((a: any, b: any) => b.id - a.id)[0];','const newestForRef = newestOrderBale(data.bales);')
          s=s.replace('const newest = [...(data?.bales || [])].sort((a: any, b: any) => b.id - a.id)[0];','const newest = newestOrderBale(data.bales);')
          p.write_text(s)
          PY
          npx prettier --write client/src/pages/ContainerLoadingScan.tsx client/src/pages/containerloadingscan/types.ts client/src/pages/containerloadingscan/utils.ts
      - name: Verify compiler and targeted architecture
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; npm run audit:god-files >/tmp/god.log 2>&1; rc=$?; set -e
          cat /tmp/god.log
          if grep -Fq 'client/src/pages/ContainerLoadingScan.tsx has ' /tmp/god.log; then exit 1; fi
          echo "OTHER_GOD_FILE_FAILURES_REMAIN=$rc"
      - name: Commit and robustly push
        shell: bash
        run: |
          set -euo pipefail
          git add client/src/pages/ContainerLoadingScan.tsx client/src/pages/containerloadingscan/types.ts client/src/pages/containerloadingscan/utils.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: split Container Loading feedback and contracts [phase18-container-loading] [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git rebase origin/main; npm run check
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
