name: Remote support Phase 5 formatter

on:
  push:
    branches:
      - agent/remote-support-phase-5-mouse-control

permissions:
  contents: write

concurrency:
  group: remote-support-phase5-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-5-mouse-control

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Phase 5 source
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/components/RemoteMouseControllerOverlay.tsx
          client/src/hooks/remote-mouse-control-policy.test.ts
          client/src/hooks/remote-mouse-control-policy.ts
          server/routes/remoteControlSessionRoutes.ts
          server/services/remoteControlCommandService.ts
          server/services/remoteControlSessionService.ts
          tests/remote-control-command-service.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Phase 5 source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/RemoteMouseControllerOverlay.tsx \
            client/src/hooks/remote-mouse-control-policy.test.ts \
            client/src/hooks/remote-mouse-control-policy.ts \
            server/routes/remoteControlSessionRoutes.ts \
            server/services/remoteControlCommandService.ts \
            server/services/remoteControlSessionService.ts \
            tests/remote-control-command-service.test.ts
          git commit -m "style(remote-support): format Phase 5 source"
          git push origin HEAD:agent/remote-support-phase-5-mouse-control
