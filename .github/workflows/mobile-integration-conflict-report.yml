name: Resolve mobile phases 5-10 integration

on:
  push:
    branches:
      - agent/mobile-responsive-phases-5-10-integration

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phases-5-10-integration
          fetch-depth: 0

      - name: Merge current main and resolve reviewed overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="client/src/app/PosShell.tsx
client/src/components/ui/dialog.tsx
client/src/components/ui/sheet.tsx
client/src/pages/pos/PosTransferOrders.tsx
docs/mobile-responsive-phase-status.md
scripts/verify-phase10-dialog-form-consistency.mjs
tests/ui/mobile-responsive-phase4-forms-dialogs.test.ts"
            if [ "$conflicts" != "$expected" ]; then
              printf 'Unexpected conflict set:\n%s\n' "$conflicts"
              exit 1
            fi
          fi

          # Phase 4 was rebuilt and merged directly on current main; retain those exact contracts.
          git checkout --theirs -- \
            client/src/components/ui/dialog.tsx \
            client/src/components/ui/sheet.tsx \
            scripts/verify-phase10-dialog-form-consistency.mjs \
            tests/ui/mobile-responsive-phase4-forms-dialogs.test.ts

          # The cumulative stack owns the Phase 8 transfer-order redesign and Phase 5-10 tracker.
          git checkout --ours -- \
            client/src/pages/pos/PosTransferOrders.tsx \
            docs/mobile-responsive-phase-status.md

          # Start from the modern translated POS shell on main, then add Phase 8 mobile behavior.
          git checkout --theirs -- client/src/app/PosShell.tsx
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("client/src/app/PosShell.tsx")
          text = path.read_text()

          workspace = '''const posWorkspaceClasses = [
            "[&_button]:touch-manipulation",
            "max-sm:[&_button]:min-h-11",
            "max-sm:[&_input]:min-h-11",
            "max-sm:[&_input]:text-base",
            "max-sm:[&_select]:min-h-11",
            "max-sm:[&_textarea]:min-h-24",
            "[&_form]:min-w-0",
            "[&_form]:max-w-full",
            "[&_fieldset]:min-w-0",
            "[&_img]:max-w-full",
            "[&_table]:min-w-max",
            "[&_th]:whitespace-nowrap",
            "[&_td]:align-middle",
            "[&_[role=dialog]]:max-w-[calc(100vw-1rem)]",
            "[&_[role=listbox]]:max-h-[min(24rem,70dvh)]",
            "[&_[data-pos-mobile-page]]:max-w-full",
            "[&_[data-table-scroll-region]]:max-w-full",
            "[&_.tabular-nums]:font-variant-numeric-tabular-nums",
          ].join(" ");'''
          text, count = re.subn(
              r'const posWorkspaceClasses = \[\n.*?\n\]\.join\(" "\);',
              workspace,
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1

          old_route = '''  const posStyle = { "--sidebar-width": "14rem", "--sidebar-width-icon": "3.5rem" };
            const isPosRoute = currentLocation === "/pos" || currentLocation.startsWith("/pos/");
            const isFullHeightRoute = isPosRoute;'''
          new_route = '''  const posStyle = { "--sidebar-width": "14rem", "--sidebar-width-icon": "3.5rem" };
            const isFullHeightRoute =
              currentLocation === "/" ||
              currentLocation === "/pos" ||
              currentLocation === "/pos/" ||
              currentLocation.startsWith("/pos/edit/");'''
          assert old_route in text
          text = text.replace(old_route, new_route, 1)

          old_container = '''        <div ref={posContainerRef} className="flex h-full w-full min-w-0 overflow-hidden bg-background">'''
          new_container = '''        <div
                    ref={posContainerRef}
                    data-pos-shell="true"
                    className="flex h-full w-full min-w-0 overflow-hidden bg-background"
                  >'''
          assert old_container in text
          text = text.replace(old_container, new_container, 1)

          old_footer = '<SidebarFooter data-pos-sidebar-footer-card>'
          new_footer = '<SidebarFooter data-pos-sidebar-footer-card className="pb-[max(0.5rem,env(safe-area-inset-bottom))]">'
          assert old_footer in text
          text = text.replace(old_footer, new_footer, 1)

          old_header = '''            <header className="no-print flex h-12 items-center justify-between gap-2 border-b p-2">
                      <SidebarTrigger aria-label="Toggle point of sale navigation" data-testid="button-sidebar-toggle" />
                      <div data-slot="pos-top-bar-actions" className="ml-auto flex min-w-0 items-center gap-2">'''
          new_header = '''            <header className="no-print flex min-h-14 items-center gap-2 border-b px-2 py-2 pt-[max(0.5rem,env(safe-area-inset-top))] sm:min-h-12 sm:pt-2">
                      <SidebarTrigger
                        className="h-11 w-11 sm:h-9 sm:w-9"
                        aria-label="Toggle point of sale navigation"
                        data-testid="button-sidebar-toggle"
                      />
                      <div className="min-w-0 flex-1 lg:hidden">
                        <p className="truncate text-sm font-semibold">
                          {user.posStation ? `POS ${user.posStation}` : "Point of Sale"}
                        </p>
                        <p className="truncate text-xs text-muted-foreground">{selectedCompany?.name}</p>
                      </div>
                      <div data-slot="pos-top-bar-actions" className="ml-auto flex min-w-0 items-center gap-1 sm:gap-2">'''
          assert old_header in text
          text = text.replace(old_header, new_header, 1)

          old_search = 'className="flex items-center gap-1.5 text-muted-foreground"'
          new_search = 'className="flex min-h-11 items-center gap-1.5 px-2 text-muted-foreground sm:min-h-9"'
          assert old_search in text
          text = text.replace(old_search, new_search, 1)
          text = text.replace('sm:inline-flex', 'lg:inline-flex', 1)

          old_scroll = '"flex-1 min-w-0 overflow-x-hidden overflow-y-auto overscroll-contain p-3 sm:p-6"'
          new_scroll = '"flex-1 min-w-0 overflow-x-hidden overflow-y-auto overscroll-contain p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:p-6"'
          assert old_scroll in text
          text = text.replace(old_scroll, new_scroll, 1)

          old_inner = 'isFullHeightRoute ? "h-full min-w-0" : "w-full min-w-0"'
          new_inner = 'isFullHeightRoute ? "h-full min-w-0" : "w-full min-w-0 max-w-full"'
          assert old_inner in text
          text = text.replace(old_inner, new_inner, 1)

          path.write_text(text)
          PY

          rm -f .github/workflows/mobile-integration-conflict-report.yml
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved conflicts remain:\n%s\n' "$unresolved"
            exit 1
          fi
          git commit -m "Reconcile mobile phases 5-10 with current main"
          git push origin HEAD:agent/mobile-responsive-phases-5-10-integration
