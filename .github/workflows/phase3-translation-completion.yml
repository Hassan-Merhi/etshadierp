name: Phase 3 Translation Completion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase3-translation-completion
  cancel-in-progress: true

jobs:
  complete:
    if: github.head_ref == 'phase3-translation-ui-polish' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase3-ci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
    steps:
      - name: Checkout current PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Start offline French and Arabic translation engine
        run: |
          python3 -m venv "$RUNNER_TEMP/phase3-argos"
          "$RUNNER_TEMP/phase3-argos/bin/python" -m pip install --disable-pip-version-check --quiet argostranslate
          "$RUNNER_TEMP/phase3-argos/bin/python" scripts/phase3-argos-server.py > "$RUNNER_TEMP/phase3-argos.log" 2>&1 &
          echo "PHASE3_ARGOS_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              echo "Offline translation engine is ready."
              exit 0
            fi
            if ! kill -0 "$!" 2>/dev/null; then
              echo "Offline translation engine exited before readiness."
              cat "$RUNNER_TEMP/phase3-argos.log"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out starting the offline translation engine."
          cat "$RUNNER_TEMP/phase3-argos.log"
          exit 1

      - name: Verify generator bootstrap syntax
        run: node --check scripts/complete-phase3-translations-v3.mjs

      - name: Generate complete French and Arabic coverage
        run: node scripts/complete-phase3-translations-v3.mjs

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true

      - name: Format generated Phase 3 work
        run: |
          npx prettier --write \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/i18n/sharedUiPhase3Translations.ts \
            client/src/i18n/phase3TemplateTranslationRuntime.ts \
            'client/src/i18n/phase3RemainingTranslations.part*.ts' \
            server/factoryTrilingualSchemaBridge.mjs \
            scripts/audit-i18n-phase14.mjs \
            config/i18n-phase14-baseline.json \
            tests/phase3-translation-completion.test.ts

      - name: Prepare test database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Certify translation contracts
        run: |
          node scripts/verify-i18n-audit-classifier.mjs
          node scripts/audit-i18n-phase14.mjs
          npx vitest run \
            tests/phase3-translation-completion.test.ts \
            tests/phase3-shared-interface-translations.test.ts \
            tests/sidebar-stock-label-i18n.test.ts \
            --maxWorkers=1 \
            --no-file-parallelism
          npm run check
          npm run lint
          node scripts/verify-program7d-accessibility-responsive.mjs

      - name: Stop offline translation engine
        if: always()
        run: |
          if [ -n "${PHASE3_ARGOS_PID:-}" ]; then
            kill "$PHASE3_ARGOS_PID" 2>/dev/null || true
            wait "$PHASE3_ARGOS_PID" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/phase3-argos.log" ]; then
            tail -n 80 "$RUNNER_TEMP/phase3-argos.log" || true
          fi

      - name: Remove one-time generation machinery
        if: success()
        run: |
          rm -f scripts/complete-phase3-translations.mjs
          rm -f scripts/complete-phase3-translations-v2.mjs
          rm -f scripts/complete-phase3-translations-v3.mjs
          rm -f scripts/phase3-argos-server.py
          rm -f .github/workflows/phase3-translation-completion.yml
          rm -f .github/workflows/phase3-postgres-diagnose.yml
          rm -f docs/phase3-translation-completion.md
          rm -f artifacts/phase3-translation-source.json
          rm -f artifacts/phase3-translation-final.json
          rm -f artifacts/phase3-translation-baseline.json

      - name: Commit completed Phase 3
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Phase 3 translation and UI polish"
          git push origin HEAD:phase3-translation-ui-polish
