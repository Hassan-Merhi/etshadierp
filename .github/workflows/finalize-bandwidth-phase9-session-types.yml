name: Finalize bandwidth Phase 9 session declarations

on:
  push:
    branches:
      - agent/bandwidth-phases-9-10

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bandwidth-phases-9-10
          fetch-depth: 0
      - run: python scripts/finalize-bandwidth-phase9-session-types.py
      - run: |
          rm -f scripts/finalize-bandwidth-phase9-session-types.py
          rm -f .github/workflows/finalize-bandwidth-phase9-session-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize typed Phase 9 session permission declarations"
          git push origin HEAD:agent/bandwidth-phases-9-10
