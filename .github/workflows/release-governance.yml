name: Release Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-governance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: Protect main and release path
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Verify live main governance
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const repo = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const eventName = process.env.EVENT_NAME;
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "etshadierp-release-governance",
          };

          async function github(path) {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { headers });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`GitHub API ${response.status} for ${path}: ${body}`);
            }
            return response.json();
          }

          const main = await github("/branches/main");
          if (main.protected !== true || main.protection?.enabled !== true) {
            throw new Error(
              "main is not protected. Enable a main ruleset/branch protection before this repository can be release-governed.",
            );
          }

          if (eventName === "pull_request") {
            const pr = event.pull_request;
            if (!pr || pr.base?.ref !== "main") {
              throw new Error("Release Governance expected a pull request targeting main.");
            }

            const latestMainSha = main.commit?.sha;
            const headSha = pr.head?.sha;
            if (!latestMainSha || !headSha) {
              throw new Error("Unable to resolve the latest main SHA or pull-request head SHA.");
            }

            const compare = await github(`/compare/${latestMainSha}...${headSha}`);
            if (compare.behind_by !== 0) {
              throw new Error(
                `Pull request head is ${compare.behind_by} commit(s) behind current main. Sync main before merge.`,
              );
            }
          }

          if (eventName === "push") {
            if (event.forced === true) {
              throw new Error("Force pushes to main are forbidden by the release-governance contract.");
            }

            const pushedSha = event.after || process.env.HEAD_SHA;
            if (!pushedSha || /^0+$/.test(pushedSha)) {
              throw new Error("main deletion or an empty main push is forbidden.");
            }

            const pulls = await github(`/commits/${pushedSha}/pulls`);
            const mergedMainPr = pulls.some(
              (pr) => pr.merged_at && pr.base?.ref === "main" && pr.merge_commit_sha === pushedSha,
            );
            const associatedMergedMainPr = pulls.some(
              (pr) => pr.merged_at && pr.base?.ref === "main",
            );

            if (!mergedMainPr && !associatedMergedMainPr) {
              throw new Error(
                "The new main SHA is not associated with a merged pull request targeting main. Direct pushes are forbidden.",
              );
            }
          }

          console.log(`Release governance passed for ${eventName}; main=${main.commit.sha}`);
          NODE
