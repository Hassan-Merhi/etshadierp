name: Phase 2 Main Reconcile V2

on:
  push:
    branches: [program/erp-90-phase-2]
    paths:
      - ".github/workflows/phase2-main-reconcile-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge latest main conservatively
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            for file in \
              server/services/reports/stockInSalesComparisonService.ts \
              server/services/reports/stockInSalesReportService.ts
            do
              if git diff --name-only --diff-filter=U -- "$file" | grep -q .; then
                echo "Resolving formatting-only conflict from current main: $file"
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done
            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              echo "Unresolved merge conflicts remain:"
              printf '%s\n' "$remaining"
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin HEAD:program/erp-90-phase-2
