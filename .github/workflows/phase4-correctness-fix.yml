name: Phase 4 Correctness Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase4-correctness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/phase-4-post-offload-impact-preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Normalize registry and install
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Apply preview correctness hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          service_path = Path("server/services/factory/postOffloadImpactPreview.ts")
          text = service_path.read_text()

          text = text.replace(
              'import { getAuthoritativeSupplierRemainingKg } from "./rawStockLockedRate";',
              '''import {
            getAuthoritativeSupplierRemainingKg,
            getLockedSupplierRateReadOnly,
          } from "./rawStockLockedRate";''',
          )

          if "const supplierLockedRate = container.supplierId" not in text:
              quantity_pattern = re.compile(
                  r'  const supplierRemainingKg = container\.supplierId\s*'
                  r'\? await getAuthoritativeSupplierRemainingKg\(db, companyId, container\.supplierId\)\s*'
                  r': 0;',
              )
              quantity_replacement = '''  const supplierRemainingKg = container.supplierId
            ? await getAuthoritativeSupplierRemainingKg(db, companyId, container.supplierId)
            : 0;
          const supplierLockedRate = container.supplierId
            ? (await getLockedSupplierRateReadOnly(db, companyId, container.supplierId)).rate
            : null;'''
              text, count = quantity_pattern.subn(quantity_replacement, text, count=1)
              if count != 1:
                  raise SystemExit("supplier quantity block not found")

          if re.search(r'\n\s+supplierLockedRate,\n\s+receivedKg,', text) is None:
              return_pattern = re.compile(
                  r'(\n\s+supplier,\n\s+supplierRemainingKg,)(\n\s+receivedKg,)',
              )
              text, count = return_pattern.subn(
                  lambda match: match.group(1) + "\n    supplierLockedRate," + match.group(2),
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("preview state return block not found")

          if "state.supplierLockedRate === null" not in text:
              fingerprint_pattern = re.compile(
                  r'(\s+supplier: state\.supplier,\n\s+supplierRemainingKg: formatFactoryQuantity\(state\.supplierRemainingKg\),)',
              )
              text, count = fingerprint_pattern.subn(
                  lambda match: match.group(1)
                  + '''
            supplierLockedRate:
              state.supplierLockedRate === null
                ? null
                : formatFactoryLockedRate(state.supplierLockedRate),''',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("fingerprint supplier block not found")

          text = text.replace(
              "const currentSupplierRate = state.supplier?.rate ?? null;",
              "const currentSupplierRate = state.supplierLockedRate;",
          )

          if "const recomputed = await preparePostOffloadImpactPreview" not in text:
              verification_pattern = re.compile(
                  r'(  const stateFingerprint = await computePostOffloadImpactStateFingerprint\('
                  r'input\.companyId, input\.containerId\);\n'
                  r'  if \(stateFingerprint !== payload\.stateFingerprint\) \{\n'
                  r'    throw new StalePostOffloadImpactPreviewError\(\);\n'
                  r'  \}\n)\n'
                  r'  return payload\.preview;',
              )
              text, count = verification_pattern.subn(
                  lambda match: match.group(1)
                  + '''
          const recomputed = await preparePostOffloadImpactPreview({
            companyId: input.companyId,
            userId: input.userId,
            containerId: input.containerId,
            transactionDate,
            charges: input.charges,
          });
          if (stableHash(recomputed.preview) !== stableHash(payload.preview)) {
            throw new StalePostOffloadImpactPreviewError(
              "Post-offload cost impact changed after preview. Review the updated impact before saving.",
            );
          }

          return payload.preview;''',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("verification tail not found")

          service_path.write_text(text)

          test_path = Path("tests/factory-post-offload-impact-preview.test.ts")
          tests = test_path.read_text()
          if 'expect(service).toContain("getLockedSupplierRateReadOnly");' not in tests:
              tests = tests.replace(
                  'expect(service).toContain("calculateRateAfterInventoryValueDelta");',
                  'expect(service).toContain("calculateRateAfterInventoryValueDelta");\n    expect(service).toContain("getLockedSupplierRateReadOnly");',
              )
          if 'expect(service).toContain("stableHash(recomputed.preview)");' not in tests:
              tests = tests.replace(
                  'expect(service).toContain("StalePostOffloadImpactPreviewError");',
                  'expect(service).toContain("StalePostOffloadImpactPreviewError");\n    expect(service).toContain("const recomputed = await preparePostOffloadImpactPreview");\n    expect(service).toContain("stableHash(recomputed.preview)");',
              )
          test_path.write_text(tests)
          PY

      - name: Format changed files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/factory/postOffloadImpactPreview.ts \
            tests/factory-post-offload-impact-preview.test.ts

      - name: Verify TypeScript
        run: npm run check

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/factory/postOffloadImpactPreview.ts tests/factory-post-offload-impact-preview.test.ts
          if git diff --cached --quiet; then
            echo "No correctness changes required"
            exit 0
          fi
          git commit -m "fix: bind preview to derived rate and recomputed impact"
          git pull --rebase origin fix/phase-4-post-offload-impact-preview
          git push origin HEAD:fix/phase-4-post-offload-impact-preview
