name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan:
    name: Semgrep CE security scan
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan pull request for new findings
        if: github.event_name == 'pull_request'
        env:
          SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: semgrep scan --config auto --error --baseline-commit "$SEMGREP_BASELINE_COMMIT"

      - name: Scan main push for new findings
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          SEMGREP_BASELINE_COMMIT: ${{ github.event.before }}
        run: semgrep scan --config auto --error --baseline-commit "$SEMGREP_BASELINE_COMMIT"

      - name: Full baseline visibility scan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: semgrep scan --config auto
