name: Phase 18 macOS Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
concurrency:
  group: phase18-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  execute:
    if: github.event.pull_request.head.ref == 'agent/phase18-wave2-macos'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-wave2-macos
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Baseline compiler
        shell: bash
        run: npm run check
      - name: Fast staged type reductions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          phase_check(){ rm -f /tmp/phase18-macos.tsbuildinfo; node node_modules/typescript/bin/tsc --noEmit --incremental --tsBuildInfoFile /tmp/phase18-macos.tsbuildinfo; }
          start=$(count)
          echo "MACOS_WAVE_START=$start"
          for mode in safe param array generic property union cast unknown; do
            mode_base=$(git rev-parse HEAD)
            mode_start=$(count)
            : > /tmp/phase18-blocked.txt
            echo "MACOS_MODE_START mode=$mode count=$mode_start"
            PHASE18_MODE="$mode" PHASE18_BLOCKLIST=/tmp/phase18-blocked.txt node scripts/phase18-wave2-propose.cjs
            if git diff --quiet -- client/src server shared; then echo "MACOS_MODE_NO_CHANGES mode=$mode"; continue; fi
            green=0
            for attempt in $(seq 1 24); do
              set +e; phase_check >/tmp/check.log 2>&1; rc=$?; set -e
              if [ "$rc" -eq 0 ]; then green=1; echo "MACOS_COMPILER_GREEN mode=$mode attempt=$attempt"; break; fi
              node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/check.log','utf8');const a=[...s.matchAll(/^([^ (]+\\.(?:ts|tsx))\\([0-9]+,[0-9]+\\): error TS[0-9]+:/gm)].map(m=>m[1]);fs.writeFileSync('/tmp/error-files.txt',[...new Set(a)].sort().join('\\n'));"
              reverted=0
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                if git diff --quiet "$mode_base" -- "$f"; then continue; fi
                git checkout "$mode_base" -- "$f"
                echo "$f" >> /tmp/phase18-blocked.txt
                reverted=$((reverted+1))
              done < /tmp/error-files.txt
              echo "MACOS_ROLLBACK mode=$mode attempt=$attempt reverted=$reverted"
              if [ "$reverted" -gt 0 ]; then continue; fi
              f=$(git diff --name-only "$mode_base" -- client/src server shared | head -1 || true)
              [ -n "$f" ] || break
              git checkout "$mode_base" -- "$f"
              echo "$f" >> /tmp/phase18-blocked.txt
              echo "MACOS_DEPENDENCY_ROLLBACK mode=$mode file=$f"
            done
            if [ "$green" -ne 1 ]; then git reset --hard "$mode_base"; echo "MACOS_MODE_REJECTED mode=$mode"; continue; fi
            mode_end=$(count)
            if [ "$mode_end" -ge "$mode_start" ]; then git reset --hard "$mode_base"; echo "MACOS_NO_STRICT_IMPROVEMENT mode=$mode $mode_start->$mode_end"; continue; fi
            git add client/src server shared
            git commit -m "refactor: Phase 18 ${mode} macOS type reduction [phase18-wave2-macos] [skip ci]"
            echo "MACOS_MODE_ACCEPTED mode=$mode $mode_start->$mode_end"
            [ "$mode_end" -eq 0 ] && break
          done
          npm run check
          final=$(count)
          echo "MACOS_WAVE_FINAL=$start->$final"
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/after.json; set -e
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));const top=(r.files||[]).filter(f=>f.total).sort((a,b)=>b.total-a.total).slice(0,300);fs.writeFileSync('phase18-macos-report.md',['# Phase 18 macOS Result','', 'Type escapes: '+r.summary.typeEscapeTotal,'Explicit any: '+r.summary.explicitAny,'as any: '+r.summary.asAny,'Suppressions: '+r.summary.suppressions,'Files with escapes: '+r.summary.filesWithEscapes,'','## Top files','',...top.map(f=>'- '+f.total+' — '+f.path),''].join('\\n'));"
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git checkout origin/main -- .phase18-occurrence-trigger || true
          git add .phase18-occurrence-trigger client/src server shared phase18-macos-report.md
          if ! git diff --cached --quiet; then git commit -m 'chore: publish compiler-green Wave 2 macOS result [phase18-macos-result] [skip ci]'; fi
          git push --force origin HEAD:agent/phase18-wave2-macos-result
