name: Phase 18 macOS Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: phase18-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  execute:
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - run: echo 'Serial macOS Wave 2 executor disabled in favor of the sharded lane.'
