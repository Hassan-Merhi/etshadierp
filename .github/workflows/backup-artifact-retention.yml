name: Maintenance - Artifact Retention Guard

on:
  schedule:
    - cron: '31 5 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report large/old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.name) | size=\(.size_in_bytes) | expires=\(.expires_at)"' || true
