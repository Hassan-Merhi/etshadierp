name: Phase 18 Phase 1 Safe Sharded
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144
concurrency:
  group: phase18-phase1-safe-sharded-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  shard:
    if: github.event.pull_request.head.ref == 'agent/phase18-wave2-phase1-safe'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-wave2-phase1-safe
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Solve safe shard
        shell: bash
        env:
          PHASE1_SHARD_INDEX: ${{ matrix.shard }}
          PHASE1_SHARD_TOTAL: 4
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          node scripts/phase18-phase1-safe-shard-solver.cjs
          if git diff --quiet -- client/src server shared; then
            git commit --allow-empty -m "chore: Phase 1 safe shard ${{ matrix.shard }} empty [skip ci]"
          else
            git add client/src server shared
            git commit -m "refactor: Phase 1 safe shard ${{ matrix.shard }} [skip ci]"
          fi
          git push --force origin HEAD:agent/phase18-phase1-safe-shard-${{ matrix.shard }}
  integrate:
    needs: shard
    if: github.event.pull_request.head.ref == 'agent/phase18-wave2-phase1-safe'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-wave2-phase1-safe
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Integrate and certify safe inference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          base=$(git rev-parse HEAD)
          start=$(count)
          echo "PHASE1_SHARDED_START=$start"
          for n in 0 1 2 3; do
            git fetch origin agent/phase18-phase1-safe-shard-$n
            git diff --binary "$base" FETCH_HEAD -- client/src server shared >/tmp/shard-$n.patch
            if [ -s /tmp/shard-$n.patch ]; then git apply --3way /tmp/shard-$n.patch; fi
          done
          changed=$(git diff --name-only "$base" -- client/src server shared | wc -l | tr -d ' ')
          echo "PHASE1_SHARDED_CHANGED_FILES=$changed"
          if [ "$changed" -gt 0 ]; then
            green=0
            for attempt in $(seq 1 20); do
              set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
              if [ "$rc" -eq 0 ]; then green=1; break; fi
              mapfile -t errs < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
              reverted=0
              for f in "${errs[@]}"; do
                if git diff --quiet "$base" -- "$f"; then continue; fi
                git checkout "$base" -- "$f"
                reverted=$((reverted+1))
              done
              [ "$reverted" -gt 0 ] || break
            done
            [ "$green" -eq 1 ] || npm run check
          else
            npm run check
          fi
          final=$(count)
          echo "PHASE1_SHARDED_FINAL=$start->$final"
          if [ "$changed" -gt 0 ] && [ "$final" -ge "$start" ]; then echo 'No strict reduction'; exit 1; fi
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/final.json; set -e
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/final.json','utf8'));
          fs.writeFileSync('phase18-phase1-safe-report.md',['# Phase 18 Wave 2 — Phase 1 Safe Inference','',`Type escapes after Phase 1: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,`Files with escapes: ${r.summary.filesWithEscapes}`,'','Phase 1 criterion: all compiler-green safe-inference reductions are exhausted on the current synchronized branch.'].join('\n'));
          NODE
          git add client/src server shared phase18-phase1-safe-report.md
          if ! git diff --cached --quiet; then git commit -m 'chore: certify Phase 1 safe inference exhaustion [phase18-phase1-safe-result] [skip ci]'; fi
          git push origin HEAD:agent/phase18-wave2-phase1-safe
