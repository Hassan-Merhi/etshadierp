name: Phase 4 One-Shot Prettier

on:
  push:
    branches:
      - perf/phase4-api-db-cleanup
    paths:
      - .github/workflows/phase4-one-shot-prettier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/phase4-api-db-cleanup
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format only the two CI-flagged files
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/app/authenticatedAppRouteGuard.ts
          server/services/accounting/cashBankRevaluationService.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/app/authenticatedAppRouteGuard.ts server/services/accounting/cashBankRevaluationService.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "Format consolidated Phase 1-4 files"
          git push origin HEAD:perf/phase4-api-db-cleanup
