name: Phase 18 Phase 1 Safe macOS Sharded
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144
concurrency:
  group: phase18-phase1-safe-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  shard:
    if: github.event.pull_request.head.ref == 'agent/phase18-phase1-safe-macos'
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-phase1-safe-macos
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Solve and compiler-gate safe shard
        shell: bash
        env:
          PHASE1_SHARD_INDEX: ${{ matrix.shard }}
          PHASE1_SHARD_TOTAL: 4
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          node scripts/phase18-phase1-safe-shard-solver.cjs

          if ! git diff --quiet -- client/src server shared; then
            green=0
            for attempt in $(seq 1 80); do
              set +e
              npm run check >/tmp/check.log 2>&1
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                green=1
                echo "PHASE1_SHARD_COMPILER_GREEN shard=${{ matrix.shard }} attempt=$attempt"
                break
              fi

              reverted=0
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                if git diff --quiet "$base" -- "$f"; then continue; fi
                git checkout "$base" -- "$f"
                reverted=$((reverted+1))
                echo "PHASE1_SHARD_DIRECT_ROLLBACK shard=${{ matrix.shard }} file=$f"
              done < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
              if [ "$reverted" -gt 0 ]; then continue; fi

              culprit=$(git diff --name-only "$base" -- client/src server shared | head -1 || true)
              if [ -z "$culprit" ]; then break; fi
              git checkout "$base" -- "$culprit"
              echo "PHASE1_SHARD_DEPENDENCY_ROLLBACK shard=${{ matrix.shard }} file=$culprit"
            done
            if [ "$green" -ne 1 ]; then
              echo 'Shard could not reach compiler green after rollback:'
              cat /tmp/check.log
              exit 1
            fi
          else
            npm run check
          fi

          if git diff --quiet -- client/src server shared; then
            git commit --allow-empty -m "chore: Phase 1 macOS safe shard ${{ matrix.shard }} empty [skip ci]"
          else
            git add client/src server shared
            git commit -m "refactor: Phase 1 macOS safe shard ${{ matrix.shard }} [skip ci]"
          fi
          git push --force origin HEAD:agent/phase18-phase1-safe-macos-shard-${{ matrix.shard }}
  integrate:
    needs: shard
    if: github.event.pull_request.head.ref == 'agent/phase18-phase1-safe-macos'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase18-phase1-safe-macos
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Integrate and certify safe inference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          base=$(git rev-parse HEAD)
          start=$(count)
          for n in 0 1 2 3; do
            git fetch origin agent/phase18-phase1-safe-macos-shard-$n
            git diff --binary "$base" FETCH_HEAD -- client/src server shared >/tmp/shard-$n.patch
            if [ -s /tmp/shard-$n.patch ]; then git apply --3way /tmp/shard-$n.patch; fi
          done
          changed=$(git diff --name-only "$base" -- client/src server shared | wc -l | tr -d ' ')
          if [ "$changed" -gt 0 ]; then
            green=0
            for attempt in $(seq 1 120); do
              set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
              if [ "$rc" -eq 0 ]; then
                green=1
                echo "PHASE1_INTEGRATION_COMPILER_GREEN attempt=$attempt"
                break
              fi
              reverted=0
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                if git diff --quiet "$base" -- "$f"; then continue; fi
                git checkout "$base" -- "$f"
                reverted=$((reverted+1))
                echo "PHASE1_INTEGRATION_DIRECT_ROLLBACK file=$f"
              done < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
              if [ "$reverted" -gt 0 ]; then continue; fi
              culprit=$(git diff --name-only "$base" -- client/src server shared | head -1 || true)
              [ -n "$culprit" ] || break
              git checkout "$base" -- "$culprit"
              echo "PHASE1_INTEGRATION_DEPENDENCY_ROLLBACK file=$culprit"
            done
            if [ "$green" -ne 1 ]; then cat /tmp/check.log; exit 1; fi
          else
            npm run check
          fi
          final=$(count)
          remaining=$(git diff --name-only "$base" -- client/src server shared | wc -l | tr -d ' ')
          if [ "$remaining" -gt 0 ] && [ "$final" -ge "$start" ]; then echo 'No strict reduction'; exit 1; fi
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/final.json; set -e
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/final.json','utf8'));
          fs.writeFileSync('phase18-phase1-safe-macos-report.md',['# Phase 18 Wave 2 — Phase 1 Safe Inference macOS','',`Type escapes after Phase 1: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,`Files with escapes: ${r.summary.filesWithEscapes}`,'','Phase 1 criterion: all accepted safe-inference reductions are full-compiler green on current main.'].join('\n'));
          NODE
          git add client/src server shared phase18-phase1-safe-macos-report.md
          if ! git diff --cached --quiet; then git commit -m 'chore: certify Phase 1 safe inference macOS [phase18-phase1-safe-result] [skip ci]'; fi
          git push --force origin HEAD:agent/phase18-phase1-safe-macos-result
