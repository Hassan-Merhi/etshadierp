name: Diagnose Program 7D verifier

on:
  push:
    branches:
      - agent/fix-core-entry-bandwidth-budget
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-program7d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'push' || github.head_ref == 'agent/fix-core-entry-bandwidth-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-core-entry-bandwidth-budget

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Capture verifier output
        id: verifier
        shell: bash
        run: |
          set +e
          node scripts/verify-program7d-accessibility-responsive.mjs > program7d-verifier.log 2>&1
          status=$?
          cat program7d-verifier.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verifier diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: program7d-verifier-diagnostics
          path: program7d-verifier.log
          if-no-files-found: error

      - name: Fail after artifact upload
        if: steps.verifier.outputs.exit_code != '0'
        run: exit 1
