name: Branch Prettier Fix

on:
  push:
    branches:
      - fix/golden-coast-payable-equity-model

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Format flagged files
        working-directory: repo
        run: |
          npm ci --no-audit --bin-links=true
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/accounting/goldenCoastPhase14FinalCertification.test.ts \
            tests/supplier-partner-customer-authoritative-net-position.test.ts \
            tests/write-route-guard-sweep.test.ts
      - name: Commit formatting
        working-directory: repo
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/accounting/goldenCoastPhase14FinalCertification.test.ts \
            tests/supplier-partner-customer-authoritative-net-position.test.ts \
            tests/write-route-guard-sweep.test.ts
          git commit -m "Format Golden Coast CI fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
