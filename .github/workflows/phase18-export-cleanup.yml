name: Phase 18 Export Type Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[phase18-export-cleanup]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Apply previously compiler-proven export boundary typing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick 2c61c713999b3556ba12bece1df5226e9f204a9b
      - run: npm ci
      - name: Verify and push
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node scripts/audit-type-escapes.mjs --json >/tmp/type-after.json || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
