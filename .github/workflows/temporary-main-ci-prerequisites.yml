name: Temporary main CI prerequisite repair

on:
  push:
    branches:
      - agent/main-ci-prerequisites-20260804

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/main-ci-prerequisites-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Apply safe dependency fix
        run: npm audit fix --omit=dev
      - name: Format current-main files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/app/PosShell.tsx \
            client/src/i18n/applicationTranslations.ts \
            client/src/styles/rtl-hardening.css
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-main-ci-prerequisites.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json client/src/app/PosShell.tsx client/src/i18n/applicationTranslations.ts client/src/styles/rtl-hardening.css .github/workflows/temporary-main-ci-prerequisites.yml
          git commit -m "Fix current main formatting and dependency audit"
          git push origin HEAD:agent/main-ci-prerequisites-20260804
