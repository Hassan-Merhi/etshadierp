name: Temporary company access format

on:
  push:
    branches:
      - agent/fix-route-aware-company-context-rebased

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'Trigger company access formatting')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-route-aware-company-context-rebased
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format company access changes
        run: npx prettier --write server/services/security/companyContextEnforcementAdapter.ts tests/active-company-permission-context.test.ts tests/company-context-enforcement.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/security/companyContextEnforcementAdapter.ts tests/active-company-permission-context.test.ts tests/company-context-enforcement.test.ts
          git commit -m "Format route-aware company access changes"
          git push origin HEAD:agent/fix-route-aware-company-context-rebased
