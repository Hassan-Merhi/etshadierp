name: Phase 4 Excel Contracts

on:
  push:
    branches: [phase4-excel-contracts]

permissions:
  contents: write

concurrency:
  group: phase4-excel-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase4-excel-contracts
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - name: Certify Excel contracts
        run: |
          npm run check
          npm run audit:type-escapes
          npm run lint
          git diff --check
      - name: Retire lane workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase4-excel-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "refactor: certify Excel import contracts"
          git push origin HEAD:phase4-excel-contracts
