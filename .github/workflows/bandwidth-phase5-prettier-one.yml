name: Bandwidth Phase 5 Prettier One

on:
  push:
    branches: [agent/bandwidth-phase-1-waste-dispatch]
    paths: [.github/workflows/bandwidth-phase5-prettier-one.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/bandwidth-phase-1-waste-dispatch
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --ignore-scripts
      - name: Format final regression test
        run: node node_modules/prettier/bin/prettier.cjs --write tests/ui/bandwidth-phase-4-heavy-pages.test.ts
      - name: Verify exact formatting
        run: node node_modules/prettier/bin/prettier.cjs --check tests/ui/bandwidth-phase-4-heavy-pages.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/bandwidth-phase-4-heavy-pages.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 5: apply repo Prettier to final regression"
          git push origin HEAD:agent/bandwidth-phase-1-waste-dispatch
