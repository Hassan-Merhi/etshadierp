name: One-time bale id link hardening

on:
  push:
    branches:
      - fix/location-weight-and-bale-reference-link

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/location-weight-and-bale-reference-link
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prefer stable production bale id
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('server/routes/baleLookupRoutes.ts')
          source = path.read_text()
          old = '''      // ── Enrich with factory_bales data (matched by referenceNumber) ──
      let baleInfo: any = null;
      let locationInfo = null;
      let pressingBatch = null;
      let mixBatch = null;
      let containers_used: unknown[] = [];

      const [factoryBale] = await db
        .select()
        .from(factoryBales)
        .where(
          and(
            sql`LOWER(TRIM(${factoryBales.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`,
            eq(factoryBales.companyId, companyId)
          )
        )
        .limit(1);
'''
          new = '''      // ── Enrich with factory_bales data ──
      // productionBaleId is the durable relationship written when a label is printed.
      // Prefer it when present, then fall back to normalized reference matching for
      // older/imported label records that predate the explicit link.
      let baleInfo: any = null;
      let locationInfo = null;
      let pressingBatch = null;
      let mixBatch = null;
      let containers_used: unknown[] = [];

      const normalizedBaleReferenceMatch =
        sql`LOWER(TRIM(${factoryBales.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`;
      const factoryBaleMatch = labelPrint.productionBaleId
        ? or(eq(factoryBales.id, labelPrint.productionBaleId), normalizedBaleReferenceMatch)
        : normalizedBaleReferenceMatch;

      const [factoryBale] = await db
        .select()
        .from(factoryBales)
        .where(and(eq(factoryBales.companyId, companyId), factoryBaleMatch))
        .limit(1);
'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one reference enrichment block, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed file
        run: node node_modules/prettier/bin/prettier.cjs --write server/routes/baleLookupRoutes.ts

      - name: Typecheck
        run: npm run check

      - name: Verify changed-file formatting
        run: npm run format:check:changed

      - name: Commit verified hardening and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-bale-id-link-fix.yml
          git add server/routes/baleLookupRoutes.ts
          git diff --cached --check
          git commit -m "fix: prefer production bale id during reference lookup"
          git push origin HEAD:fix/location-weight-and-bale-reference-link
