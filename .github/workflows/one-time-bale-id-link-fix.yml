name: One-time bale id link hardening

on:
  push:
    branches:
      - fix/location-weight-and-bale-reference-link

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/location-weight-and-bale-reference-link
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prefer stable production bale id
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('server/routes/baleLookupRoutes.ts')
          source = path.read_text()
          marker = '      const [factoryBale] = await db\n'
          if source.count(marker) != 1:
              raise SystemExit(f'Expected one reference enrichment query, found {source.count(marker)}')
          prefix = "      const normalizedBaleReferenceMatch = sql`LOWER(TRIM(${factoryBales.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`;\n      const factoryBaleMatch = labelPrint.productionBaleId\n        ? or(eq(factoryBales.id, labelPrint.productionBaleId), normalizedBaleReferenceMatch)\n        : normalizedBaleReferenceMatch;\n\n"
          source = source.replace(marker, prefix + marker, 1)
          old_where = '        .where(\n          and(\n            sql`LOWER(TRIM(${factoryBales.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`,\n            eq(factoryBales.companyId, companyId)\n          )\n        )\n        .limit(1);'
          new_where = '        .where(and(eq(factoryBales.companyId, companyId), factoryBaleMatch))\n        .limit(1);'
          if source.count(old_where) != 1:
              raise SystemExit(f'Expected one normalized factory bale where block, found {source.count(old_where)}')
          source = source.replace(old_where, new_where, 1)
          source = source.replace('      // ── Enrich with factory_bales data (matched by referenceNumber) ──', '      // ── Enrich with factory_bales data (stable id first, normalized reference fallback) ──', 1)
          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed file
        run: node node_modules/prettier/bin/prettier.cjs --write server/routes/baleLookupRoutes.ts

      - name: Typecheck
        run: npm run check

      - name: Verify changed-file formatting
        run: npm run format:check:changed

      - name: Commit verified hardening and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-bale-id-link-fix.yml
          git add server/routes/baleLookupRoutes.ts
          git diff --cached --check
          git commit -m "fix: prefer production bale id during reference lookup"
          git push origin HEAD:fix/location-weight-and-bale-reference-link
