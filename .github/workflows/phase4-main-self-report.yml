name: Phase 4 Main Self Report

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phase-4-forms-dialogs
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Report merge conflicts against current main
        shell: bash
        run: |
          set -euo pipefail
          report=.github/phase4-main-conflicts.txt
          git fetch --no-tags origin main:refs/remotes/origin/main --depth=200
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            printf 'MERGE_CLEAN\n' > "$report"
            git merge --abort || true
          else
            {
              echo "CONFLICT_FILES_BEGIN"
              git diff --name-only --diff-filter=U
              echo "CONFLICT_FILES_END"
            } > "$report"
            git merge --abort || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          if git diff --cached --quiet; then
            echo "Report already current"
            exit 0
          fi
          git commit -m "Record Phase 4 main merge conflicts"
          git push origin HEAD:agent/mobile-responsive-phase-4-forms-dialogs
