name: God Files Waves 13-14 Re-certification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: god-files-waves13-14-recert-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recert:
    if: github.event.pull_request.head.ref == 'agent/god-files-recovery-latest-main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-latest-main
          fetch-depth: 0
      - name: Reconcile Waves 13-14 against latest main
        shell: bash
        run: |
          set -euo pipefail
          if git log --format=%B -100 | grep -Fq '[waves13-14-recert]'; then
            echo 'Waves 13-14 already re-certified.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git fetch origin agent/god-files-waves-05-19:refs/remotes/origin/god-files-old
          BASE=4e2eb176ddfb141c3d1407e0a61cd6cdf3823da4
          OLD=origin/god-files-old

          dirs=(
            client/src/pages/barcodelookup
            client/src/pages/factory/factory-suppliers
            client/src/pages/supplierprofitcheck
            client/src/pages/sp/gclshimigration
            client/src/pages/factory/factorysettings
            client/src/pages/settings/datatoolstab
          )

          for d in "${dirs[@]}"; do
            git checkout "$OLD" -- "$d"
          done

          git diff --name-only "$BASE" origin/main -- "${dirs[@]}" | sort -u >/tmp/main-touched-support.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "$f" = 'client/src/pages/barcodelookup/types.ts' ]; then
              continue
            fi
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              git checkout origin/main -- "$f"
            else
              git rm -f --ignore-unmatch -- "$f"
            fi
          done </tmp/main-touched-support.txt
          git checkout "$OLD" -- client/src/pages/barcodelookup/types.ts

          git checkout "$OLD" -- \
            client/src/pages/BarcodeLookup.tsx \
            client/src/pages/factory/FactorySuppliers.tsx \
            client/src/pages/SupplierProfitCheck.tsx \
            client/src/pages/sp/GcLshiMigration.tsx \
            client/src/pages/factory/FactorySettings.tsx \
            client/src/pages/settings/DataToolsTab.tsx

          python - <<'PY'
          from pathlib import Path

          p=Path('client/src/pages/settings/datatoolstab/DataToolsView.tsx')
          s=p.read_text()
          if 'LocationCostPriceOverride' not in s:
              s=s.replace(
                  'import { ReconcileOTWNamesCard } from "./components/ReconcileOTWNamesCard";',
                  'import { ReconcileOTWNamesCard } from "./components/ReconcileOTWNamesCard";\nimport { LocationCostPriceOverride } from "./components/LocationCostPriceOverride";'
              )
          fix_card='''        <Card>\n          <CardHeader>\n            <CardTitle className="flex items-center gap-2">\n              <Calculator className="h-4 w-4" />\n              Fix Cost Prices\n            </CardTitle>\n            <CardDescription>Recalculate sales cost prices based on inventory records</CardDescription>\n          </CardHeader>\n          <CardContent>\n            <Button\n              variant="outline"\n              className="w-full"\n              onClick={() => recalculateCostsMutation.mutate()}\n              disabled={recalculateCostsMutation.isPending}\n              data-testid="button-fix-cost-prices"\n            >\n              <RefreshCw className={`h-4 w-4 mr-2 ${recalculateCostsMutation.isPending ? "animate-spin" : ""}`} />\n              {recalculateCostsMutation.isPending ? "Updating..." : "Fix Cost Prices"}\n            </Button>\n          </CardContent>\n        </Card>'''
          override='''\n\n        {dtCurrentUser?.role === "Developer" && appMode !== "factory" && (\n          <LocationCostPriceOverride locations={locations} />\n        )}'''
          if override.strip() not in s:
              if fix_card not in s:
                  raise SystemExit('DataTools Fix Cost Prices insertion point not found')
              s=s.replace(fix_card, fix_card+override)
          p.write_text(s)

          p=Path('client/src/pages/barcodelookup/types.ts')
          s=p.read_text()
          s=s.replace(
              'export type LookupLabelPrint = BaleLabelPrint & {',
              'export type LookupLabelPrint = Omit<BaleLabelPrint, "scannedAt" | "scannedByUserId"> & {'
          )
          p.write_text(s)

          p=Path('client/src/pages/barcodelookup/useBarcodeLookupModel.tsx')
          s=p.read_text()
          s=s.replace('onError: (error: Error) => {\n      if (isGloballyHandledError(error)) return;', 'onError: (error: unknown) => {\n      if (isGloballyHandledError(error)) return;')
          s=s.replace('description: error.message, variant: "destructive"', 'description: error instanceof Error ? error.message : "Request failed", variant: "destructive"')
          s=s.replace(
              '                scannedByUserId: data.scannedByUserId,\n                scannedByName: data.scannedByName,',
              '                scannedByUserId: data.scannedByUserId == null ? null : String(data.scannedByUserId),\n                scannedByName: data.scannedByName ?? null,'
          )
          p.write_text(s)

          p=Path('client/src/pages/factory/factory-suppliers/SupplierDialogs.tsx')
          s=p.read_text()
          old='''  dueDialogSupplier: null;\n  setDueDialogSupplier: React.Dispatch<React.SetStateAction<null>>;'''
          new='''  dueDialogSupplier: { name: string; containers: unknown[] } | null;\n  setDueDialogSupplier: React.Dispatch<\n    React.SetStateAction<{ name: string; containers: unknown[] } | null>\n  >;'''
          if old not in s:
              raise SystemExit('Factory Suppliers due-dialog type block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY

          for f in \
            client/src/pages/BarcodeLookup.tsx \
            client/src/pages/factory/FactorySuppliers.tsx \
            client/src/pages/SupplierProfitCheck.tsx \
            client/src/pages/sp/GcLshiMigration.tsx \
            client/src/pages/factory/FactorySettings.tsx \
            client/src/pages/settings/DataToolsTab.tsx
          do
            lines=$(wc -l < "$f")
            echo "$f -> $lines lines"
            [ "$lines" -le 900 ] || { echo "Root remains over 900 lines: $f"; exit 1; }
          done

          npm ci
          npm run check
          node scripts/audit-god-file-boundaries.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'Waves 13-14 already match the certified tree; no commit needed.'
            exit 0
          fi
          git commit -m 'refactor: reconcile and re-certify God Files Waves 13-14 [waves13-14-recert]'
          git push origin HEAD:agent/god-files-recovery-latest-main
