name: One-off Supplier Profit Check format

on:
  push:
    branches:
      - fix/supplier-profit-check-full-integrity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/supplier-profit-check-full-integrity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Register reviewed translation inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/audit-i18n-phase14.mjs")
          source = path.read_text()
          entry = '  "client/src/i18n/supplierProfitCheckTranslations.ts",\n'
          if entry not in source:
              marker = '  "client/src/i18n/factoryInsuranceTranslations.ts",\n'
              if marker not in source:
                  raise SystemExit("translation inventory marker not found")
              source = source.replace(marker, marker + entry, 1)
              path.write_text(source)
          PY

      - name: Format Supplier Profit Check repair
        shell: bash
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/supplierprofitcheck/safeModel.ts \
            client/src/pages/supplierprofitcheck/useSupplierProfitCheckSafeModel.tsx \
            client/src/i18n/supplierProfitCheckTranslations.ts \
            server/routes/supplier-profit-check/add-stock-item.ts \
            server/routes/supplier-profit-check/analyze.ts \
            server/routes/supplier-profit-check/export.ts \
            server/routes/supplier-profit-check/import-by-codes.ts \
            server/routes/supplier-profit-check/po-overrides.ts \
            server/routes/supplier-profit-check/proforma.ts \
            scripts/audit-i18n-phase14.mjs

      - name: Commit formatting repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            client/src/pages/supplierprofitcheck/safeModel.ts \
            client/src/pages/supplierprofitcheck/useSupplierProfitCheckSafeModel.tsx \
            client/src/i18n/supplierProfitCheckTranslations.ts \
            server/routes/supplier-profit-check/add-stock-item.ts \
            server/routes/supplier-profit-check/analyze.ts \
            server/routes/supplier-profit-check/export.ts \
            server/routes/supplier-profit-check/import-by-codes.ts \
            server/routes/supplier-profit-check/po-overrides.ts \
            server/routes/supplier-profit-check/proforma.ts \
            scripts/audit-i18n-phase14.mjs
          git commit -m 'chore(profit-check): format repair and register translations'
          git push origin HEAD:fix/supplier-profit-check-full-integrity
