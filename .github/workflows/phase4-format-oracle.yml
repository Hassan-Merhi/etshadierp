name: Phase 4 Format Oracle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/prettier/bin/prettier.cjs --write server/routes/sp/spGoldenCoastPhase4CutoverRoutes.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase4-formatted-route
          path: server/routes/sp/spGoldenCoastPhase4CutoverRoutes.ts
          retention-days: 1
