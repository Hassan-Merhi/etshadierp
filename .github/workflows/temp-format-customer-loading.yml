name: Temporary Customer Loading Format Capture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#https://packages\\.replit\\.com/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Customer Loading exactly
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/factory/CustomerLoading.tsx

      - name: Verify formatted file
        run: node node_modules/prettier/bin/prettier.cjs --check client/src/pages/factory/CustomerLoading.tsx

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- client/src/pages/factory/CustomerLoading.tsx
          if git diff --cached --quiet; then
            echo "CustomerLoading.tsx is already formatter-clean."
            exit 0
          fi
          git commit -m "Format Customer Loading with Prettier"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload formatted Customer Loading
        uses: actions/upload-artifact@v4
        with:
          name: formatted-customer-loading
          path: client/src/pages/factory/CustomerLoading.tsx
          if-no-files-found: error
          retention-days: 1
