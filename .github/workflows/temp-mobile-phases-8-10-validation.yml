name: Temporary mobile Phases 8-10 validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-phases-8-10-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/mobile-phases-8-10-validation-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-phases-8-10-validation-current-main
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and repair audited lockfile
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm audit fix --package-lock-only --omit=dev || true
          npm ci --no-audit --bin-links=true

      - name: Dependency and lockfile gates
        run: |
          npm run verify:lockfile
          npm run verify:dependency-audit
          npm run verify:production-dependencies

      - name: Verify Phase 8 POS contracts
        run: |
          node scripts/verify-mobile-responsive-phase8-pos.mjs
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts \
            tests/ui/mobile-responsive-phase8-pos.test.ts \
            --maxWorkers=1 --no-file-parallelism

      - name: Verify Phase 9 dashboard and report contracts
        run: |
          node scripts/verify-mobile-responsive-phase9-reports.mjs
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts \
            tests/ui/mobile-responsive-phase9-reports.test.ts \
            --maxWorkers=1 --no-file-parallelism

      - name: Verify Phase 10 performance and offline contracts
        run: |
          node --check client/public/sw.js
          node scripts/verify-mobile-responsive-phase10-performance.mjs
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts \
            tests/ui/mobile-responsive-phase10-performance.test.ts \
            --maxWorkers=1 --no-file-parallelism

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run check

      - name: Release safety contracts
        run: |
          npm run verify:bandwidth
          npm run verify:program1-observability
          npm run verify:final-production-readiness

      - name: Production build
        run: npm run build

      - name: Commit verified lockfile repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already audited."
            exit 0
          fi
          git commit -m "Patch vulnerable ip-address dependency"
          git push origin HEAD:agent/mobile-phases-8-10-validation-current-main
