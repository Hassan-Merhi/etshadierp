name: Phase 18 Inference Removal Harvest

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[phase18-inference-removal]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Remove redundant any annotations and compiler-gate by file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run check
          cat >.phase18-infer-remove.cjs <<'NODE'
          const ts=require('typescript'),fs=require('fs'),path=require('path');
          const roots=['client/src','server','shared'],changed=new Set();
          function hasAny(n){let y=false;const v=x=>{if(x.kind===ts.SyntaxKind.AnyKeyword)y=true;else if(!y)ts.forEachChild(x,v)};if(n)v(n);return y}
          function rec(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())rec(p);else if(/\.(ts|tsx)$/.test(e.name)&&!e.name.endsWith('.d.ts'))walk(p)}}
          function walk(file){let text=fs.readFileSync(file,'utf8'),sf=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS),edits=[];
            function add(a,b,r=''){edits.push({a,b,r})}
            function v(n){
              if((ts.isParameter(n)||ts.isVariableDeclaration(n)||ts.isPropertyDeclaration(n))&&n.type&&hasAny(n.type)&&n.initializer){add(n.name.end,n.initializer.pos,' =');}
              if((ts.isArrowFunction(n)||ts.isFunctionExpression(n))){for(const p of n.parameters)if(p.type&&hasAny(p.type))add(p.name.end,p.initializer?p.initializer.pos:p.type.end,'');if(n.type&&hasAny(n.type))add(n.parameters.end,n.body.pos,' ')}
              if((ts.isFunctionDeclaration(n)||ts.isMethodDeclaration(n)||ts.isGetAccessorDeclaration(n))&&n.type&&hasAny(n.type))add(n.parameters.end,n.body?n.body.pos:n.type.end,' ');
              if((ts.isAsExpression(n)||ts.isTypeAssertionExpression(n))&&hasAny(n.type)){if(ts.isAsExpression(n))add(n.expression.end,n.end,'');}
              if((ts.isCallExpression(n)||ts.isNewExpression(n))&&n.typeArguments?.length&&n.typeArguments.some(hasAny)){const a=n.typeArguments.pos-1,b=n.typeArguments.end+1,raw=text.slice(a,b);if(raw.startsWith('<')&&raw.endsWith('>'))add(a,b,'')}
              ts.forEachChild(n,v)
            }v(sf);
            if(!edits.length)return;edits.sort((x,y)=>y.a-x.a);let last=Infinity;for(const e of edits){if(e.b>last)continue;text=text.slice(0,e.a)+e.r+text.slice(e.b);last=e.a}fs.writeFileSync(file,text);changed.add(file.replaceAll('\\','/'));
          }
          roots.forEach(rec);fs.writeFileSync('.phase18-infer-remove.files',[...changed].sort().join('\n')+(changed.size?'\n':''));console.log('INFERENCE_CANDIDATE_FILES='+changed.size);
          NODE
          cat >.phase18-infer-gate.cjs <<'NODE'
          const fs=require('fs'),cp=require('child_process');const list='.phase18-infer-remove.files',changed=new Set(fs.readFileSync(list,'utf8').trim().split(/\n/).filter(Boolean)),log=fs.readFileSync('.phase18-infer-remove.check','utf8');const errs=new Set([...log.matchAll(/^(.+?\.(?:ts|tsx))\(\d+,\d+\):\s+error\s+TS\d+:/gm)].map(m=>m[1].replaceAll('\\','/')));let n=0;for(const f of errs){if(!changed.has(f))continue;try{cp.execFileSync('git',['restore','--source=HEAD','--worktree','--',f]);changed.delete(f);n++}catch{}}console.log(`ERROR_FILES=${errs.size} REVERTED=${n} REMAINING=${changed.size}`);if(errs.size&&n===0)fs.writeFileSync('.phase18-infer-unresolved','1');fs.writeFileSync(list,[...changed].sort().join('\n')+(changed.size?'\n':''));
          NODE
          node .phase18-infer-remove.cjs
          green=0
          for attempt in $(seq 1 20); do
            set +e; npm run check >.phase18-infer-remove.check 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then green=1; echo "INFERENCE_GREEN_ATTEMPT=$attempt"; break; fi
            rm -f .phase18-infer-unresolved; node .phase18-infer-gate.cjs
            if [ -f .phase18-infer-unresolved ] || [ ! -s .phase18-infer-remove.files ]; then break; fi
          done
          if [ "$green" != 1 ]; then git reset --hard HEAD; exit 0; fi
          echo "INFERENCE_SURVIVOR_FILES=$(wc -l <.phase18-infer-remove.files | tr -d ' ')"
          rm -f .phase18-infer-*
          git add client/src server shared
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: remove redundant any annotations via inference [phase18-inference-safe] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
