name: One-shot stock entry multi-select patch

on:
  push:
    branches:
      - agent/stock-entry-history-multiselect-filters

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stock-entry-history-multiselect-filters
          fetch-depth: 0

      - name: Apply multi-select filter changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Frontend: StockEntryHistory
          # ------------------------------------------------------------------
          path = Path("client/src/pages/StockEntryHistory.tsx")
          text = path.read_text()

          text = replace_once(
              text,
              'import {ChevronDown, ChevronRight, Download, Search, RotateCcw, List, AlignJustify, FileDown, MoreVertical, CalendarRange, MessageCircle, Loader2, History, Users, Package, MapPin, Tag, Layers, Check} from "lucide-react";',
              'import {ChevronDown, ChevronRight, Download, Search, RotateCcw, List, AlignJustify, FileDown, MoreVertical, CalendarRange, MessageCircle, Loader2, History, Users, Package, MapPin, Tag, Layers} from "lucide-react";',
              "remove obsolete Check import",
          )
          text = replace_once(
              text,
              'import ProductionPlannerDialog from "./factory/ProductionPlannerDialog";\n',
              'import ProductionPlannerDialog from "./factory/ProductionPlannerDialog";\nimport {MultiSelectFilter} from "./factory/productioncomparison/components/MultiSelectFilter";\n',
              "add MultiSelectFilter import",
          )
          text = replace_once(
              text,
              'import {Popover, PopoverContent, PopoverTrigger} from "@/components/ui/popover";\n',
              '',
              "remove obsolete popover imports",
          )

          text = replace_once(
              text,
              '''  const [categoryFilter, setCategoryFilter] = useState("all");
          const [productCategoryFilter, setProductCategoryFilter] = useState<string[]>([]);
          const [workerIdFilter, setWorkerIdFilter] = useState("all");
          const [productIdFilter, setProductIdFilter] = useState("all");
          const [locationIdFilter, setLocationIdFilter] = useState("all");
          const [statusFilter, setStatusFilter] = useState("all");''',
              '''  const [categoryFilter, setCategoryFilter] = useState<string[]>([]);
          const [productCategoryFilter, setProductCategoryFilter] = useState<string[]>([]);
          const [workerIdFilter, setWorkerIdFilter] = useState<string[]>([]);
          const [productIdFilter, setProductIdFilter] = useState<string[]>([]);
          const [locationIdFilter, setLocationIdFilter] = useState<string[]>([]);
          const [statusFilter, setStatusFilter] = useState<string[]>([]);''',
              "convert filter state to arrays",
          )

          text = replace_once(
              text,
              '''        workerIdFilter,
                  productIdFilter,
                  locationIdFilter,
                  categoryFilter,
                  productCategoryFilter.join(","),
                  statusFilter,''',
              '''        workerIdFilter.join(","),
                  productIdFilter.join(","),
                  locationIdFilter.join(","),
                  categoryFilter.join(","),
                  productCategoryFilter.join(","),
                  statusFilter.join(","),''',
              "serialize multi-select filter cache key",
          )

          text = replace_once(
              text,
              '''  if (workerIdFilter !== "all") params.set("workerId", workerIdFilter);
          if (productIdFilter !== "all") params.set("productId", productIdFilter);
          if (locationIdFilter !== "all") params.set("locationId", locationIdFilter);
          if (productCategoryFilter.length > 0) params.set("categoryId", productCategoryFilter.join(","));
          if (statusFilter !== "all") params.set("status", statusFilter);''',
              '''  if (workerIdFilter.length > 0) params.set("workerId", workerIdFilter.join(","));
          if (productIdFilter.length > 0) params.set("productId", productIdFilter.join(","));
          if (locationIdFilter.length > 0) params.set("locationId", locationIdFilter.join(","));
          if (categoryFilter.length > 0) params.set("workerCategoryId", categoryFilter.join(","));
          if (productCategoryFilter.length > 0) params.set("categoryId", productCategoryFilter.join(","));
          if (statusFilter.length > 0) params.set("status", statusFilter.join(","));''',
              "send comma-separated multi-select params",
          )

          text = replace_once(
              text,
              '''  const selectedCategoryWorkerIds: number[] | null = useMemo(() => {
              if (categoryFilter === "all") return null;
              const cat = categories.find((c: any) => String(c.id) === categoryFilter);
              if (!cat) return null;
              const ids = Array.isArray(cat.workerIds) ? (cat.workerIds as number[]) : [];
              return workers.filter((w: any) => w.active && ids.includes(w.id)).map((w: any) => w.id);
            }, [categoryFilter, categories, workers]);

            const filteredWorkers = useMemo(() => {
              if (!selectedCategoryWorkerIds) return workers;
              return workers.filter((w: any) => selectedCategoryWorkerIds.includes(w.id));
            }, [workers, selectedCategoryWorkerIds]);

            const filteredGroups = useMemo(() => {
              if (!selectedCategoryWorkerIds || workerIdFilter !== "all") return groups;
              return groups.filter((g) => g.workerId !== null && selectedCategoryWorkerIds.includes(g.workerId));
            }, [groups, selectedCategoryWorkerIds, workerIdFilter]);''',
              '''  const selectedCategoryWorkerIds: number[] | null = useMemo(() => {
              if (categoryFilter.length === 0) return null;
              const selectedCategoryIds = new Set(categoryFilter);
              const ids = new Set<number>();
              for (const cat of categories) {
                if (!selectedCategoryIds.has(String(cat.id))) continue;
                for (const id of Array.isArray(cat.workerIds) ? (cat.workerIds as number[]) : []) {
                  ids.add(Number(id));
                }
              }
              return workers.filter((w: any) => w.active && ids.has(w.id)).map((w: any) => w.id);
            }, [categoryFilter, categories, workers]);

            const filteredWorkers = useMemo(() => {
              if (!selectedCategoryWorkerIds) return workers;
              return workers.filter((w: any) => selectedCategoryWorkerIds.includes(w.id));
            }, [workers, selectedCategoryWorkerIds]);

            // All history filters are applied by the API so totals, exports, condensed rows,
            // and detailed rows always use the exact same filtered dataset.
            const filteredGroups = groups;''',
              "support multiple worker groups",
          )

          text = replace_once(
              text,
              '''      for (const workerIdStr of Object.keys(workerTargets)) {
                const wid = Number(workerIdStr);
                const key = String(wid);''',
              '''      const selectedWorkerIds = new Set(workerIdFilter.map(Number));
              const categoryWorkerIds = selectedCategoryWorkerIds ? new Set(selectedCategoryWorkerIds) : null;
              for (const workerIdStr of Object.keys(workerTargets)) {
                const wid = Number(workerIdStr);
                if (selectedWorkerIds.size > 0 && !selectedWorkerIds.has(wid)) continue;
                if (categoryWorkerIds && !categoryWorkerIds.has(wid)) continue;
                const key = String(wid);''',
              "keep zero-bale planner rows inside active worker filters",
          )
          text = replace_once(
              text,
              '  }, [filteredGroups, workerTargets, workers]);',
              '  }, [filteredGroups, workerTargets, workers, workerIdFilter, selectedCategoryWorkerIds]);',
              "update worker group memo dependencies",
          )

          text = replace_once(
              text,
              '''    setCategoryFilter("all");
              setProductCategoryFilter([]);
              setWorkerIdFilter("all");
              setProductIdFilter("all");
              setLocationIdFilter("all");
              setStatusFilter("all");''',
              '''    setCategoryFilter([]);
              setProductCategoryFilter([]);
              setWorkerIdFilter([]);
              setProductIdFilter([]);
              setLocationIdFilter([]);
              setStatusFilter([]);''',
              "reset array filters",
          )

          panel_start = text.index('        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">')
          panel_end = text.index('      </div>\n\n      {/* ── Date + Search band ── */}', panel_start)
          new_panel = '''        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
            <div className="space-y-1">
              <div className="flex items-center gap-1 text-xs text-muted-foreground font-medium">
                <Layers className="h-3 w-3" />
                Bale Category
              </div>
              <MultiSelectFilter
                options={productCategories.map((c: any) => ({ value: String(c.id), label: c.name }))}
                selected={productCategoryFilter}
                onChange={setProductCategoryFilter}
                placeholder="Bale categories"
                allLabel="All Categories"
                className="h-8 w-full min-w-0 px-2 py-0 text-xs"
                testId="select-product-category"
              />
            </div>
            <div className="space-y-1">
              <div className="flex items-center gap-1 text-xs text-muted-foreground font-medium">
                <Users className="h-3 w-3" />
                Worker Group
              </div>
              <MultiSelectFilter
                options={categories.map((c: any) => ({ value: String(c.id), label: c.name }))}
                selected={categoryFilter}
                onChange={(next) => {
                  setCategoryFilter(next);
                  if (next.length === 0) return;
                  const selectedGroups = new Set(next);
                  const allowedWorkerIds = new Set<number>();
                  for (const category of categories) {
                    if (!selectedGroups.has(String(category.id))) continue;
                    for (const workerId of Array.isArray(category.workerIds) ? category.workerIds : []) {
                      allowedWorkerIds.add(Number(workerId));
                    }
                  }
                  setWorkerIdFilter((prev) => prev.filter((id) => allowedWorkerIds.has(Number(id))));
                }}
                placeholder="Worker groups"
                allLabel="All Groups"
                className="h-8 w-full min-w-0 px-2 py-0 text-xs"
                testId="select-category"
              />
            </div>
            <div className="space-y-1">
              <div className="flex items-center gap-1 text-xs text-muted-foreground font-medium">
                <Users className="h-3 w-3" />
                Worker
              </div>
              <MultiSelectFilter
                options={filteredWorkers.map((w: any) => ({
                  value: String(w.id),
                  label: w.fullName || w.full_name || w.name || String(w.id),
                }))}
                selected={workerIdFilter}
                onChange={setWorkerIdFilter}
                placeholder="Workers"
                allLabel="All Workers"
                className="h-8 w-full min-w-0 px-2 py-0 text-xs"
                testId="select-worker"
              />
            </div>
            <div className="space-y-1">
              <div className="flex items-center gap-1 text-xs text-muted-foreground font-medium">
                <Package className="h-3 w-3" />
                Product
              </div>
              <MultiSelectFilter
                options={products.map((p: any) => ({ value: String(p.id), label: p.name }))}
                selected={productIdFilter}
                onChange={setProductIdFilter}
                placeholder="Products"
                allLabel="All Products"
                className="h-8 w-full min-w-0 px-2 py-0 text-xs"
                testId="select-product"
              />
            </div>
            <div className="space-y-1">
              <div className="flex items-center gap-1 text-xs text-muted-foreground font-medium">
                <MapPin className="h-3 w-3" />
                Location
              </div>
              <MultiSelectFilter
                options={locations.map((l: any) => ({ value: String(l.id), label: l.name }))}
                selected={locationIdFilter}
                onChange={setLocationIdFilter}
                placeholder="Locations"
                allLabel="All Locations"
                className="h-8 w-full min-w-0 px-2 py-0 text-xs"
                testId="select-location"
              />
            </div>
            <div className="space-y-1">
              <div className="flex items-center gap-1 text-xs text-muted-foreground font-medium">
                <Tag className="h-3 w-3" />
                Status
              </div>
              <MultiSelectFilter
                options={STATUS_OPTIONS}
                selected={statusFilter}
                onChange={setStatusFilter}
                placeholder="Statuses"
                allLabel="All Statuses"
                className="h-8 w-full min-w-0 px-2 py-0 text-xs"
                testId="select-status"
              />
            </div>
          </div>
'''
          text = text[:panel_start] + new_panel + text[panel_end:]
          path.write_text(text)

          # ------------------------------------------------------------------
          # Shared comparison multi-select: preserve test ids for Stock Entry.
          # ------------------------------------------------------------------
          path = Path("client/src/pages/factory/productioncomparison/components/MultiSelectFilter.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              '''  allLabel,
            className,
          }: {''',
              '''  allLabel,
            className,
            testId,
          }: {''',
              "add testId destructuring",
          )
          text = replace_once(
              text,
              '''  allLabel: string;
            className?: string;
          }) {''',
              '''  allLabel: string;
            className?: string;
            testId?: string;
          }) {''',
              "add testId prop type",
          )
          text = replace_once(
              text,
              '''        <button
                    type="button"
                    className={cn(''',
              '''        <button
                    type="button"
                    data-testid={testId}
                    className={cn(''',
              "add multi-select test id",
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # Backend: accept comma-separated lists for every Stock Entry filter.
          # ------------------------------------------------------------------
          path = Path("server/routes/factory/factoryStockEntryHistoryPaginationRoutes.ts")
          text = path.read_text()

          text = replace_once(
              text,
              '''function parseOptionalId(value: unknown): number | undefined {
            const parsed = Number.parseInt(String(value ?? ""), 10);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : undefined;
          }''',
              '''function parseCsvPositiveIds(value: unknown): number[] {
            if (typeof value !== "string" || !value.trim()) return [];
            const seen = new Set<number>();
            for (const raw of value.split(",")) {
              const parsed = Number.parseInt(raw.trim(), 10);
              if (Number.isFinite(parsed) && parsed > 0) seen.add(parsed);
            }
            return [...seen];
          }

          function parseCsvStrings(value: unknown): string[] {
            if (typeof value !== "string" || !value.trim()) return [];
            return [...new Set(value.split(",").map((part) => part.trim()).filter(Boolean))];
          }''',
              "add CSV filter parsers",
          )

          text = replace_once(
              text,
              '''        const workerId = parseOptionalId(req.query.workerId);
                  const workerCategoryId = parseOptionalId(req.query.workerCategoryId);
                  const productId = parseOptionalId(req.query.productId);
                  const locationId = parseOptionalId(req.query.locationId);''',
              '''        const workerIds = parseCsvPositiveIds(req.query.workerId);
                  const workerCategoryIds = parseCsvPositiveIds(req.query.workerCategoryId);
                  const productIds = parseCsvPositiveIds(req.query.productId);
                  const locationIds = parseCsvPositiveIds(req.query.locationId);''',
              "parse multi-value id filters",
          )
          text = replace_once(
              text,
              '''        const status = typeof req.query.status === "string" && req.query.status ? req.query.status : undefined;''',
              '''        const statuses = parseCsvStrings(req.query.status);''',
              "parse multi-value statuses",
          )

          text = replace_once(
              text,
              '''        if (!(isPrivileged && search)) conditions.push(`fb.status NOT IN ('DELETED', 'REMOVED')`);
                  if (workerId) conditions.push(`fb.finalized_by = ${bind(workerId)}`);
                  if (workerCategoryId) {
                    const workerCategoryParam = bind(workerCategoryId);
                    conditions.push(`fb.finalized_by IN (
                      SELECT category_worker.id
                      FROM factory_worker_categories fwc
                      CROSS JOIN LATERAL jsonb_array_elements_text(COALESCE(fwc.worker_ids, '[]'::jsonb)) AS category_ids(worker_id)
                      INNER JOIN factory_workers category_worker
                        ON category_worker.id = category_ids.worker_id::int
                        AND category_worker.company_id = ${companyParam}
                        AND category_worker.active = TRUE
                      WHERE fwc.id = ${workerCategoryParam}
                        AND fwc.company_id = ${companyParam}
                    )`);
                  }
                  if (productId) conditions.push(`fb.product_id = ${bind(productId)}`);
                  if (locationId) conditions.push(`fb.erp_location_id = ${bind(locationId)}`);''',
              '''        if (!(isPrivileged && search)) conditions.push(`fb.status NOT IN ('DELETED', 'REMOVED')`);
                  if (workerIds.length > 0) {
                    const placeholders = workerIds.map((id) => bind(id)).join(", ");
                    conditions.push(`fb.finalized_by IN (${placeholders})`);
                  }
                  if (workerCategoryIds.length > 0) {
                    const workerCategoryPlaceholders = workerCategoryIds.map((id) => bind(id)).join(", ");
                    conditions.push(`fb.finalized_by IN (
                      SELECT category_worker.id
                      FROM factory_worker_categories fwc
                      CROSS JOIN LATERAL jsonb_array_elements_text(COALESCE(fwc.worker_ids, '[]'::jsonb)) AS category_ids(worker_id)
                      INNER JOIN factory_workers category_worker
                        ON category_worker.id = category_ids.worker_id::int
                        AND category_worker.company_id = ${companyParam}
                        AND category_worker.active = TRUE
                      WHERE fwc.id IN (${workerCategoryPlaceholders})
                        AND fwc.company_id = ${companyParam}
                    )`);
                  }
                  if (productIds.length > 0) {
                    const placeholders = productIds.map((id) => bind(id)).join(", ");
                    conditions.push(`fb.product_id IN (${placeholders})`);
                  }
                  if (locationIds.length > 0) {
                    const placeholders = locationIds.map((id) => bind(id)).join(", ");
                    conditions.push(`fb.erp_location_id IN (${placeholders})`);
                  }''',
              "apply multi-value id conditions",
          )
          text = replace_once(
              text,
              '''        if (status) conditions.push(`fb.status = ${bind(status)}`);''',
              '''        if (statuses.length > 0) {
                  const placeholders = statuses.map((status) => bind(status)).join(", ");
                  conditions.push(`fb.status IN (${placeholders})`);
                }''',
              "apply multi-value status condition",
          )
          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/one-shot-stock-entry-multiselect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/StockEntryHistory.tsx \
            client/src/pages/factory/productioncomparison/components/MultiSelectFilter.tsx \
            server/routes/factory/factoryStockEntryHistoryPaginationRoutes.ts \
            .github/workflows/one-shot-stock-entry-multiselect.yml
          git commit -m "feat: add multi-select stock entry history filters"
          git push origin HEAD:agent/stock-entry-history-multiselect-filters
