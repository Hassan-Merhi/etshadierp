name: Temporary Main CI Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'ci: activate temporary report repair runner'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: ci/main-green-20260812-1102
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Repair hook dependencies
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'client/src/pages/StockInSalesReportDetail.tsx';
          let source = fs.readFileSync(path, 'utf8');
          if (source.includes('import { useMemo, useState } from "react";')) {
            source = source.replace(
              'import { useMemo, useState } from "react";',
              'import { useCallback, useMemo, useState } from "react";'
            );
          }
          const oldBlock = `  const locationName = (id: number | null) => (id ? locationNameById.get(id) || \`Location #\${id}\` : "—");
  const sourceLocationName = (row: MovementRow) =>
    row.movementType === "Transfer In" ? locationName(row.counterpartyLocationId) : locationName(row.locationId);
  const destinationLocationName = (row: MovementRow) =>
    row.movementType === "Transfer In"
      ? locationName(row.locationId)
      : row.movementType === "Transfer Out"
        ? locationName(row.counterpartyLocationId)
        : "—";`;
          const newBlock = `  const locationName = useCallback(
    (id: number | null) => (id ? locationNameById.get(id) || \`Location #\${id}\` : "—"),
    [locationNameById]
  );
  const sourceLocationName = useCallback(
    (row: MovementRow) =>
      row.movementType === "Transfer In" ? locationName(row.counterpartyLocationId) : locationName(row.locationId),
    [locationName]
  );
  const destinationLocationName = useCallback(
    (row: MovementRow) =>
      row.movementType === "Transfer In"
        ? locationName(row.locationId)
        : row.movementType === "Transfer Out"
          ? locationName(row.counterpartyLocationId)
          : "—",
    [locationName]
  );`;
          if (source.includes(oldBlock)) source = source.replace(oldBlock, newBlock);
          const oldDeps = '    [movements?.rows, locationNameById]\n  );';
          const newDeps = '    [movements?.rows, sourceLocationName, destinationLocationName]\n  );';
          if (source.includes(oldDeps)) source = source.replace(oldDeps, newDeps);
          fs.writeFileSync(path, source);
          NODE
      - name: Apply repository formatting
        run: |
          npx prettier --write \
            client/src/pages/StockInSalesReport.tsx \
            client/src/pages/StockInSalesReportDetail.tsx
      - name: Verify lint and types
        run: |
          npm run lint
          npm run check
      - name: Remove temporary workflow from repair branch
        run: rm -f .github/workflows/temp-main-ci-repair.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix main report formatting and hook lint'
          git push origin HEAD:ci/main-green-20260812-1102
