name: Phase 18 Current Targeted Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  CI: true
jobs:
  targeted:
    if: contains(github.event.head_commit.message, '[phase18-current-targeted]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Baseline compiler gate
        run: npm run check
      - name: Apply compiler-proven export row typing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          set +e
          git cherry-pick --no-commit 2c61c713999b3556ba12bece1df5226e9f204a9b
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'EXPORT_CHERRY_PICK_CONFLICT=1'
            git status --short
            git cherry-pick --abort || true
            git reset --hard "$before"
          else
            echo 'EXPORT_CHERRY_PICK_APPLIED=1'
          fi
      - name: Fix current auto-fixable ESLint error
        shell: bash
        run: |
          set -euo pipefail
          npx eslint client/src/pages/BarcodeLookup.tsx --fix || true
      - name: Compiler gate after targeted changes
        run: npm run check
      - name: Measure targeted result
        shell: bash
        run: |
          set +e
          node scripts/audit-type-escapes.mjs > /tmp/type.log 2>&1
          trc=$?
          npm run lint > /tmp/lint.log 2>&1
          lrc=$?
          npm run audit:god-files > /tmp/god.log 2>&1
          grc=$?
          set -e
          tail -n 8 /tmp/type.log || true
          grep -A8 'Warnings by rule:' /tmp/lint.log || tail -n 25 /tmp/lint.log || true
          cat /tmp/god.log || true
          echo "TYPE_EXIT=$trc LINT_EXIT=$lrc GOD_EXIT=$grc"
      - name: Commit and push proven source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/services/export-data/fetch.ts server/services/export-data/types.ts client/src/pages/BarcodeLookup.tsx
          if git diff --cached --quiet; then
            echo 'NO_SOURCE_CHANGES=1'
            exit 0
          fi
          git commit -m 'refactor: type export rows and clear lint error [phase18-targeted-result] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          git push origin HEAD:main
