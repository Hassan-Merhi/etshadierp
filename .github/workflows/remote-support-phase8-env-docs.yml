name: Remote support Phase 8 environment docs

on:
  push:
    branches:
      - agent/remote-support-phase-8-current-main
    paths:
      - .github/workflows/remote-support-phase8-env-docs.yml

permissions:
  contents: write

concurrency:
  group: remote-support-phase8-env-docs
  cancel-in-progress: true

jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-8-current-main
      - name: Add rollout variables to the environment template
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.env.example')
          text = path.read_text()
          if 'REMOTE_SUPPORT_ROLLOUT_STAGE=' not in text:
              anchor = '# DISABLE_SCREEN_FEED=false\n'
              addition = '''# DISABLE_SCREEN_FEED=false

# ── Guarded remote-support rollout ─────────────────────────────────────────
# Interactive mouse and keyboard support remains disabled until both the
# runtime flags and this staged rollout gate allow it.        (default: disabled)
# disabled | internal | canary | general
# REMOTE_SUPPORT_ROLLOUT_STAGE=disabled

# Comma-separated positive company IDs allowed during the canary stage.
# REMOTE_SUPPORT_CANARY_COMPANY_IDS=

# Comma-separated user IDs allowed during the internal stage in addition to
# Developer-role controllers.
# REMOTE_SUPPORT_INTERNAL_CONTROLLER_IDS=
'''
              if anchor not in text:
                  raise SystemExit('DISABLE_SCREEN_FEED anchor missing')
              text = text.replace(anchor, addition, 1)
              path.write_text(text)
          Path('.github/workflows/remote-support-phase8-env-docs.yml').unlink()
          PY
          node scripts/verify-env-documentation.mjs
      - name: Commit environment documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(remote-support): document rollout environment variables"
          git push --no-verify origin HEAD:agent/remote-support-phase-8-current-main
