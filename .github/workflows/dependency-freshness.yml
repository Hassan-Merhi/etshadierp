name: Maintenance - Dependency Freshness

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report outdated packages
        shell: bash
        run: |
          set +e
          npm outdated
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          exit 0
