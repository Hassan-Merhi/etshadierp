name: CodeQL Phase 2 Validation

on:
  push:
    branches: ["security/codeql-phase2-parameter-tampering"]
    paths:
      - ".github/workflows/codeql-phase2-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Prepare focused test database
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Format changed files
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write server/routes/accountStatementRoutes.ts server/routes/inventory-movement/movement.ts server/routes/sp/spExportRoutes.ts tests/account-statement-routes-behavior.test.ts tests/codeql-phase2-query-boundaries.test.ts
          if git diff --quiet; then
            echo "No formatting changes required."
          else
            git config user.name "ets-ci-repair[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/routes/accountStatementRoutes.ts server/routes/inventory-movement/movement.ts server/routes/sp/spExportRoutes.ts tests/account-statement-routes-behavior.test.ts tests/codeql-phase2-query-boundaries.test.ts
            git commit -m "style: format Phase 2 security repairs"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Type-check
        run: npm run check

      - name: Check changed-file formatting
        run: node node_modules/prettier/bin/prettier.cjs --check server/routes/accountStatementRoutes.ts server/routes/inventory-movement/movement.ts server/routes/sp/spExportRoutes.ts tests/account-statement-routes-behavior.test.ts tests/codeql-phase2-query-boundaries.test.ts

      - name: Run Phase 2 regression tests
        run: node node_modules/vitest/vitest.mjs run tests/account-statement-routes-behavior.test.ts tests/codeql-phase2-query-boundaries.test.ts
