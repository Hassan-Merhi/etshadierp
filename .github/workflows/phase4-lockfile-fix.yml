name: Phase 4 lockfile security fix

on:
  push:
    branches:
      - agent/remote-support-phase-4-control-sessions
    paths:
      - .github/workflows/phase4-lockfile-fix.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-4-control-sessions
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Apply available production audit fixes
        run: npm audit fix --omit=dev --package-lock-only --ignore-scripts

      - name: Commit corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change was required."
          else
            git commit -m "Fix ip-address production advisory"
            git push origin HEAD:agent/remote-support-phase-4-control-sessions
          fi
