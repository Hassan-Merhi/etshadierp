name: Phase 18 PR Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
jobs:
  execute:
    if: github.event.pull_request.head.ref == 'agent/phase18-executor'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: {ref: agent/phase18-executor, fetch-depth: 0}
      - name: Guard result commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[phase18-executor-result]'; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Baseline
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/before.json; set -e
          node -e "const r=require('/tmp/before.json'); console.log('BEFORE='+JSON.stringify(r.summary))"
      - name: Iteratively solve and compiler-gate live type escapes
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          start=$(count)
          echo "WAVE2_START=$start"
          for pass in $(seq 1 6); do
            pass_base=$(git rev-parse HEAD)
            pass_start=$(count)
            echo "WAVE2_PASS_START pass=$pass count=$pass_start"
            node scripts/phase18-current-candidate-solver.cjs
            if git diff --quiet -- client/src server shared; then
              echo "WAVE2_NO_MORE_MECHANICAL_CHANGES pass=$pass"
              break
            fi
            green=0
            for attempt in $(seq 1 20); do
              set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
              if [ "$rc" -eq 0 ]; then green=1; echo "WAVE2_COMPILER_GREEN pass=$pass attempt=$attempt"; break; fi
              mapfile -t errs < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
              changed=0
              for f in "${errs[@]}"; do
                if git diff --quiet "$pass_base" -- "$f"; then continue; fi
                git checkout "$pass_base" -- "$f"
                changed=$((changed+1))
              done
              echo "WAVE2_ROLLBACK pass=$pass attempt=$attempt error_files=${#errs[@]} changed=$changed"
              if [ "$changed" -gt 0 ]; then continue; fi
              mapfile -t modified < <(git diff --name-only "$pass_base" -- client/src server shared)
              for f in "${modified[@]}"; do
                git checkout "$pass_base" -- "$f"
                set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
                if [ "$rc" -eq 0 ]; then green=1; echo "WAVE2_DEPENDENCY_ROLLBACK pass=$pass file=$f"; break; fi
              done
              break
            done
            if [ "$green" -ne 1 ]; then
              git reset --hard "$pass_base"
              echo "WAVE2_PASS_REJECTED pass=$pass"
              break
            fi
            pass_end=$(count)
            if [ "$pass_end" -ge "$pass_start" ]; then
              git reset --hard "$pass_base"
              echo "WAVE2_NO_STRICT_IMPROVEMENT pass=$pass $pass_start->$pass_end"
              break
            fi
            git add client/src server shared
            git commit -m "refactor: Phase 18 live type reduction pass $pass [phase18-wave2-pass]"
            echo "WAVE2_PASS_ACCEPTED pass=$pass $pass_start->$pass_end"
            if [ "$pass_end" -eq 0 ]; then break; fi
          done
          npm run check
          final=$(count)
          echo "WAVE2_FINAL=$start->$final"
      - name: Report and push result branch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/after.json; set -e
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));
          const top=(r.files||[]).filter(f=>f.total).sort((a,b)=>b.total-a.total).slice(0,150);
          fs.writeFileSync('phase18-executor-report.md',['# Phase 18 Executor Report','',`Type escapes: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,`Files with escapes: ${r.summary.filesWithEscapes}`,'','## Top files','',...top.map(f=>`- ${f.total} — ${f.path}`),''].join('\n'));
          console.log('AFTER='+JSON.stringify(r.summary));
          NODE
          git add phase18-executor-report.md
          git commit -m 'chore: publish Phase 18 executor result [phase18-executor-result]'
          git push origin HEAD:agent/phase18-executor
