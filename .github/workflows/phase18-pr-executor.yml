name: Phase 18 PR Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
concurrency:
  group: phase18-pr-executor-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  execute:
    if: github.event.pull_request.head.ref == 'agent/phase18-wave2-staged'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.event.pull_request.head.ref }}', fetch-depth: 0}
      - name: Guard result commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[phase18-executor-result]'; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Baseline
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/before.json; set -e
          node -e "const r=require('/tmp/before.json'); console.log('BEFORE='+JSON.stringify(r.summary))"
      - name: Global grouped type reductions
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          wave_start=$(count)
          echo "GLOBAL_WAVE_START=$wave_start"
          for mode in safe param array generic property union cast unknown; do
            mode_base=$(git rev-parse HEAD)
            mode_start=$(count)
            echo "GLOBAL_MODE_START mode=$mode count=$mode_start"
            PHASE18_MODE="$mode" node scripts/phase18-wave2-bulk.cjs
            if git diff --quiet -- client/src server shared; then
              echo "GLOBAL_MODE_NO_CHANGES mode=$mode"
              continue
            fi
            mode_end=$(count)
            if [ "$mode_end" -ge "$mode_start" ]; then
              git reset --hard "$mode_base"
              echo "GLOBAL_MODE_REJECTED mode=$mode $mode_start->$mode_end"
              continue
            fi
            git add client/src server shared
            git commit -m "refactor: Phase 18 ${mode} global type reduction [phase18-wave2-global] [skip ci]"
            echo "GLOBAL_MODE_ACCEPTED mode=$mode $mode_start->$mode_end"
            [ "$mode_end" -eq 0 ] && break
          done
          npm run check
          echo "GLOBAL_WAVE_FINAL=$wave_start->$(count)"
      - name: Target small residual
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          start=$(count)
          if [ "$start" -gt 0 ] && [ "$start" -le 400 ]; then
            base=$(git rev-parse HEAD)
            node scripts/phase18-current-candidate-solver.cjs
            if ! git diff --quiet -- client/src server shared && npm run check; then
              finish=$(count)
              if [ "$finish" -lt "$start" ]; then
                git add client/src server shared
                git commit -m 'refactor: Phase 18 targeted residual type reduction [phase18-wave2-targeted] [skip ci]'
                echo "TARGET_RESIDUAL_ACCEPTED $start->$finish"
              else
                git reset --hard "$base"
              fi
            else
              git reset --hard "$base"
            fi
          else
            echo "TARGET_RESIDUAL_SKIPPED count=$start"
          fi
          npm run check
      - name: Report and push result branch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_branch='${{ github.event.pull_request.head.ref }}'
          npm run check
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/after.json; set -e
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));
          const top=(r.files||[]).filter(f=>f.total).sort((a,b)=>b.total-a.total).slice(0,300);
          fs.writeFileSync('phase18-executor-report.md',['# Phase 18 Executor Report','',`Type escapes: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,`Files with escapes: ${r.summary.filesWithEscapes}`,'','## Top files','',...top.map(f=>`- ${f.total} — ${f.path}`),''].join('\n'));
          console.log('AFTER='+JSON.stringify(r.summary));
          NODE
          git add phase18-executor-report.md
          git commit -m 'chore: publish Phase 18 executor result [phase18-executor-result]'
          git push origin HEAD:"$target_branch"
