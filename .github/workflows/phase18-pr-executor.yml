name: Phase 18 PR Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
jobs:
  execute:
    if: github.event.pull_request.head.ref == 'agent/phase18-executor'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: {ref: agent/phase18-executor, fetch-depth: 0}
      - name: Guard result commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[phase18-executor-result]'; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Baseline
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/before.json; set -e
          node -e "const r=require('/tmp/before.json'); console.log('BEFORE='+JSON.stringify(r.summary))"
      - name: Bulk harvest compiler-green files
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          phase_check(){ node node_modules/typescript/bin/tsc --noEmit --incremental --tsBuildInfoFile /tmp/phase18-wave2.tsbuildinfo; }
          rm -f /tmp/phase18-wave2.tsbuildinfo
          : > /tmp/phase18-blocked.txt
          wave_start=$(count)
          echo "BULK_WAVE_START=$wave_start"
          for pass in $(seq 1 6); do
            pass_base=$(git rev-parse HEAD)
            pass_start=$(count)
            PHASE18_BLOCKLIST=/tmp/phase18-blocked.txt node scripts/phase18-wave2-bulk.cjs
            if git diff --quiet -- client/src server shared; then echo "BULK_NO_CHANGES pass=$pass"; break; fi
            green=0
            for attempt in $(seq 1 40); do
              set +e; phase_check >/tmp/check.log 2>&1; rc=$?; set -e
              if [ "$rc" -eq 0 ]; then green=1; echo "BULK_COMPILER_GREEN pass=$pass attempt=$attempt"; break; fi
              mapfile -t errs < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
              reverted=0
              for f in "${errs[@]}"; do
                if git diff --quiet "$pass_base" -- "$f"; then continue; fi
                git checkout "$pass_base" -- "$f"
                echo "$f" >> /tmp/phase18-blocked.txt
                reverted=$((reverted+1))
              done
              echo "BULK_ROLLBACK pass=$pass attempt=$attempt errors=${#errs[@]} reverted=$reverted"
              if [ "$reverted" -gt 0 ]; then continue; fi
              mapfile -t modified < <(git diff --name-only "$pass_base" -- client/src server shared)
              if [ "${#modified[@]}" -eq 0 ]; then break; fi
              f="${modified[0]}"
              git checkout "$pass_base" -- "$f"
              echo "$f" >> /tmp/phase18-blocked.txt
              echo "BULK_DEPENDENCY_ROLLBACK pass=$pass file=$f"
            done
            if [ "$green" -ne 1 ]; then git reset --hard "$pass_base"; rm -f /tmp/phase18-wave2.tsbuildinfo; echo "BULK_PASS_REJECTED pass=$pass"; break; fi
            pass_end=$(count)
            if [ "$pass_end" -ge "$pass_start" ]; then git reset --hard "$pass_base"; rm -f /tmp/phase18-wave2.tsbuildinfo; echo "BULK_NO_STRICT_IMPROVEMENT pass=$pass $pass_start->$pass_end"; break; fi
            git add client/src server shared
            git commit -m "refactor: Phase 18 bulk type reduction pass $pass [phase18-wave2-bulk]"
            echo "BULK_PASS_ACCEPTED pass=$pass $pass_start->$pass_end blocked=$(sort -u /tmp/phase18-blocked.txt | wc -l)"
            sort -u /tmp/phase18-blocked.txt -o /tmp/phase18-blocked.txt
            if [ "$pass_end" -eq 0 ]; then break; fi
          done
          npm run check
          echo "BULK_WAVE_FINAL=$wave_start->$(count)"
      - name: Target remaining compiler-safe escapes
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          phase_check(){ node node_modules/typescript/bin/tsc --noEmit --incremental --tsBuildInfoFile /tmp/phase18-wave2-targeted.tsbuildinfo; }
          rm -f /tmp/phase18-wave2-targeted.tsbuildinfo
          for pass in $(seq 1 3); do
            pass_base=$(git rev-parse HEAD)
            pass_start=$(count)
            [ "$pass_start" -eq 0 ] && break
            node scripts/phase18-current-candidate-solver.cjs
            if git diff --quiet -- client/src server shared; then echo "TARGET_NO_CHANGES pass=$pass"; break; fi
            if phase_check; then
              pass_end=$(count)
              if [ "$pass_end" -lt "$pass_start" ]; then
                git add client/src server shared
                git commit -m "refactor: Phase 18 targeted type reduction pass $pass [phase18-wave2-targeted]"
                echo "TARGET_PASS_ACCEPTED pass=$pass $pass_start->$pass_end"
                continue
              fi
            fi
            git reset --hard "$pass_base"
            rm -f /tmp/phase18-wave2-targeted.tsbuildinfo
            echo "TARGET_PASS_REJECTED pass=$pass"
            break
          done
          npm run check
      - name: Report and push result branch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/after.json; set -e
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));
          const top=(r.files||[]).filter(f=>f.total).sort((a,b)=>b.total-a.total).slice(0,200);
          fs.writeFileSync('phase18-executor-report.md',['# Phase 18 Executor Report','',`Type escapes: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,`Files with escapes: ${r.summary.filesWithEscapes}`,'','## Top files','',...top.map(f=>`- ${f.total} — ${f.path}`),''].join('\n'));
          console.log('AFTER='+JSON.stringify(r.summary));
          NODE
          git add phase18-executor-report.md
          git commit -m 'chore: publish Phase 18 executor result [phase18-executor-result]'
          git push origin HEAD:agent/phase18-executor
