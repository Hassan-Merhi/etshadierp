name: Phase 2 Main Reconcile

on:
  push:
    branches: [program/erp-90-phase-2]
    paths:
      - ".github/workflows/phase2-main-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge latest main into Phase 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Merge conflicts:"
            git diff --name-only --diff-filter=U
            echo "Status:"
            git status --short
            exit "$status"
          fi
          git push origin HEAD:program/erp-90-phase-2
