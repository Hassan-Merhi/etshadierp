name: Postgres Repair Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-regression:
    if: github.event.pull_request.head.ref == 'agent/postgres-regression-isolate-879e5a8f'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      SESSION_SECRET: diagnostic-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify disposable database schema
        run: node scripts/verify-ci-disposable-schema.mjs
      - name: Full backend suite with captured log
        shell: bash
        run: |
          set +e
          timeout 14m node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism 2>&1 | tee backend-vitest-full.log
          status=${PIPESTATUS[0]}
          echo "backend_status=$status" >> "$GITHUB_ENV"
          echo "backend_status=$status"
          exit 0
      - name: Upload backend report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-vitest-full-repair-report
          path: backend-vitest-full.log
      - name: Fail if backend tests failed or timed out
        run: test "${backend_status}" -eq 0
