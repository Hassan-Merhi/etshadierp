name: Temporary QueryClient Formatter

on:
  push:
    branches:
      - agent/fix-tracking-and-session-error-storm

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-tracking-and-session-error-storm
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize registry URLs
        run: |
          sed -i 's#https://registry\.replit\.com/#https://registry.npmjs.org/#g' package-lock.json || true
          sed -i 's#https://storage\.googleapis\.com/replit-npm/#https://registry.npmjs.org/#g' package-lock.json || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format query client
        run: npx prettier --write client/src/lib/queryClient.ts

      - name: Commit formatted file
        run: |
          if git diff --quiet -- client/src/lib/queryClient.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/lib/queryClient.ts
          git commit -m "format query client"
          git push origin HEAD:agent/fix-tracking-and-session-error-storm
