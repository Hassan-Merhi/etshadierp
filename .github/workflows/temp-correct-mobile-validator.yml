name: Correct mobile Phase 5-7 validator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'fix/mobile-phases-5-7-validation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-phases-5-7-validation
      - name: Use frontend Vitest configuration
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temp-mobile-phases-5-7-validation.yml')
          text = path.read_text()
          old = '          node node_modules/vitest/vitest.mjs run \\\n'
          new = '          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts \\\n'
          if old not in text:
              raise SystemExit('Expected Vitest command not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temp-correct-mobile-validator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use frontend config for mobile Phase 5-7 tests"
          git push origin HEAD:fix/mobile-phases-5-7-validation
