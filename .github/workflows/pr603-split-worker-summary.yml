name: PR 603 split worker summary

on:
  push:
    branches:
      - fix/production-comparison-arabic-workers-hover

permissions:
  contents: write

jobs:
  split:
    if: ${{ !contains(github.event.head_commit.message, '[pr603-split-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Extract worker summary UI from ProductionComparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/factory/ProductionComparison.tsx')
          s = path.read_text()

          old_import = 'import { HoverCard, HoverCardContent, HoverCardTrigger } from "@/components/ui/hover-card";\n'
          if s.count(old_import) != 1:
              raise SystemExit(f'hover import: expected one match, found {s.count(old_import)}')
          s = s.replace(old_import, '', 1)

          anchor = 'import { StatCard } from "./productioncomparison/components/StatCard";\n'
          new_import = (
              anchor
              + 'import {\n'
              + '  buildWorkerSummaryByArticle,\n'
              + '  WorkerSummaryHover,\n'
              + '} from "./productioncomparison/components/WorkerSummaryHover";\n'
          )
          if s.count(anchor) != 1:
              raise SystemExit(f'import anchor: expected one match, found {s.count(anchor)}')
          s = s.replace(anchor, new_import, 1)

          start_marker = '  const workerSummaryByArticle = useMemo(() => {\n'
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('worker summary start not found')
          end_marker = '  }, [qA.data, qB.data]);\n'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('worker summary end not found')
          end += len(end_marker)
          replacement = (
              '  const workerSummaryByArticle = useMemo(\n'
              '    () =>\n'
              '      buildWorkerSummaryByArticle(\n'
              '        qA.data?.production.byProduct ?? [],\n'
              '        qB.data?.production.byProduct ?? []\n'
              '      ),\n'
              '    [qA.data, qB.data]\n'
              '  );\n'
          )
          s = s[:start] + replacement + s[end:]

          cell_start = (
              '                          <td className="px-3 py-2.5 border-r border-border/30">\n'
              '                            {workerSummary.length > 0 ? (\n'
          )
          start = s.find(cell_start)
          if start < 0:
              raise SystemExit('worker hover cell start not found')
          next_cell = '                          <td className="px-4 py-2.5 text-right tabular-nums font-semibold text-foreground">\n'
          end = s.find(next_cell, start)
          if end < 0:
              raise SystemExit('worker hover cell end not found')
          replacement = (
              '                          <td className="px-3 py-2.5 border-r border-border/30">\n'
              '                            <WorkerSummaryHover workers={workerSummary} labelA={labelA} labelB={labelB} />\n'
              '                          </td>\n'
          )
          s = s[:start] + replacement + s[end:]

          path.write_text(s)
          PY

          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/ProductionComparison.tsx \
            client/src/pages/factory/productioncomparison/components/WorkerSummaryHover.tsx

      - name: Commit split
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/factory/ProductionComparison.tsx client/src/pages/factory/productioncomparison/components/WorkerSummaryHover.tsx
          git commit -m "refactor: split production worker summary [pr603-split-done]"
          git push origin HEAD:fix/production-comparison-arabic-workers-hover
