name: Temporary SP Phases 3-4 Prepare

on:
  push:
    branches:
      - agent/sp-finalization-phases-3-4-lifecycle
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: sp-phases-3-4-test-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sp-finalization-phases-3-4-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize package registry URLs
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Apply pinned formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/containers/ContainerSpView.tsx \
            client/src/pages/sp/SpOverview.tsx \
            server/routes/sp/index.ts \
            server/routes/sp/spLifecycleGuards.ts \
            server/routes/sp/spLifecycleRoutes.ts \
            server/services/sp/spLifecyclePolicy.ts \
            tests/sp-lifecycle-phases-3-4.test.ts
      - name: Prepare disposable database
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify reviewed route additions
        run: node node_modules/vitest/vitest.mjs run tests/route-manifest.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Type-check
        run: npm run check
      - name: Build production application
        run: npm run build
      - name: Run production startup migrations
        run: |
          node dist/index.js > sp-phases-3-4-startup.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error http://127.0.0.1:${PORT}/api/health/db > sp-phases-3-4-health.json; then
              cat sp-phases-3-4-health.json
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before startup migrations became ready."
              cat sp-phases-3-4-startup.log
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for startup migrations."
          cat sp-phases-3-4-startup.log
          exit 1
      - name: Run Supplier Partner lifecycle integration tests
        run: node node_modules/vitest/vitest.mjs run tests/sp-lifecycle-phases-3-4.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Commit prepared source
        run: |
          if git diff --quiet; then
            echo "Source and tests are already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/containers/ContainerSpView.tsx \
            client/src/pages/sp/SpOverview.tsx \
            server/routes/sp/index.ts \
            server/routes/sp/spLifecycleGuards.ts \
            server/routes/sp/spLifecycleRoutes.ts \
            server/services/sp/spLifecyclePolicy.ts \
            tests/sp-lifecycle-phases-3-4.test.ts \
            config/ci-ratchet-allowances.json
          git commit -m "Prepare Supplier Partner phases 3-4"
          git push origin HEAD:agent/sp-finalization-phases-3-4-lifecycle
