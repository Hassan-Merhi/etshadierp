name: God Files Wave 5 Reconcile Dry Run

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event.pull_request.head.ref == 'agent/god-files-recovery-main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-main
          fetch-depth: 0
      - name: Map newer-main edits into Wave 5 split modules
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin agent/god-files-waves-05-19:refs/remotes/origin/god-files-old
          python - <<'PY'
          import difflib, subprocess

          BASE='4e2eb176ddfb141c3d1407e0a61cd6cdf3823da4'
          MAIN='origin/main'
          OLD='origin/god-files-old'
          roots={
            'client/src/components/StockItemDetailsDialog.tsx': ['client/src/components/stockitemdetailsdialog/'],
            'client/src/pages/factory/FactoryLocationInventory.tsx': ['client/src/pages/factory/FactoryLocationInventory', 'client/src/pages/factory/factorylocationinventory/'],
            'client/src/pages/StockItems.tsx': ['client/src/pages/stockitems/'],
            'client/src/pages/StockEntryHistory.tsx': ['client/src/pages/stockentryhistory/'],
          }

          def out(*args):
            return subprocess.check_output(args, text=True)
          def show(ref,path):
            return out('git','show',f'{ref}:{path}').splitlines(keepends=True)
          tree=out('git','ls-tree','-r','--name-only',OLD).splitlines()

          grand_total=grand_mapped=0
          any_unresolved=False
          for root,prefixes in roots.items():
            candidates=[root]
            for p in tree:
              if p == root: continue
              if any(p.startswith(prefix) for prefix in prefixes): candidates.append(p)
            blobs={p:show(OLD,p) for p in candidates}
            base=show(BASE,root); main=show(MAIN,root)
            ops=[op for op in difflib.SequenceMatcher(None,base,main,autojunk=False).get_opcodes() if op[0] != 'equal']
            mapped=[]; unresolved=[]
            for idx,(tag,i1,i2,j1,j2) in enumerate(ops,1):
              oldblock=base[i1:i2]
              matches=[]
              for ctx in (6,4,2,1,0):
                before=base[max(0,i1-ctx):i1]
                after=base[i2:min(len(base),i2+ctx)]
                if tag == 'insert':
                  needle=before+after
                else:
                  needle=before+oldblock+after
                if not needle: continue
                found=[]
                for path,lines in blobs.items():
                  n=len(needle)
                  for k in range(0,len(lines)-n+1):
                    if lines[k:k+n] == needle:
                      found.append((path,k+len(before)))
                if len(found)==1:
                  matches=found; break
                if len(found)>1 and ctx==6:
                  matches=found
              if len(matches)==1:
                mapped.append((idx,tag,i2-i1,j2-j1,matches[0][0],matches[0][1]+1))
              else:
                unresolved.append((idx,tag,i1+1,i2-i1,j2-j1,len(matches)))
            grand_total += len(ops); grand_mapped += len(mapped)
            print(f'ROOT {root}')
            print(f'  delta_hunks={len(ops)} mapped={len(mapped)} unresolved={len(unresolved)} candidates={len(candidates)}')
            for row in mapped:
              print('  MAP', *row)
            for row in unresolved:
              print('  UNRESOLVED', *row)
            if unresolved: any_unresolved=True
          print(f'TOTAL delta_hunks={grand_total} mapped={grand_mapped} unresolved={grand_total-grand_mapped}')
          if any_unresolved:
            raise SystemExit(2)
          PY
