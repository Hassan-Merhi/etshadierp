name: Apply revision unused cleanup

on:
  push:
    branches:
      - agent/fix-stock-transfer-revision-save-flow

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stock-transfer-revision-save-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-stock-transfer-revision-unused-cleanup.cjs
      - run: |
          rm scripts/apply-stock-transfer-revision-unused-cleanup.cjs
          rm .github/workflows/apply-stock-transfer-revision-unused-cleanup.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/vouchers/StockTransferForm.tsx \
            scripts/apply-stock-transfer-revision-unused-cleanup.cjs \
            .github/workflows/apply-stock-transfer-revision-unused-cleanup.yml
          git commit -m "fix: remove unused revision save state"
          git push origin HEAD:agent/fix-stock-transfer-revision-save-flow
