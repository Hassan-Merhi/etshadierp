name: PR780 Phase 3 Format

on:
  push:
    branches:
      - agent/god-files-recovery-latest-main
    paths:
      - .github/workflows/pr780-phase3-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/god-files-recovery-latest-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format Phase 3 residual files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/accountslegacy/EditAccountDialog.tsx \
            client/src/pages/accountslegacy/useAccountsLegacyModel.ts \
            client/src/pages/daybook/voucherdetailsdialog/PurchaseVoucherEntries.tsx \
            client/src/pages/pos/posimport/usePosImportModel.ts \
            client/src/pages/settings/datatoolstab/useDataToolsModel.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            client/src/pages/accountslegacy/EditAccountDialog.tsx \
            client/src/pages/accountslegacy/useAccountsLegacyModel.ts \
            client/src/pages/daybook/voucherdetailsdialog/PurchaseVoucherEntries.tsx \
            client/src/pages/pos/posimport/usePosImportModel.ts \
            client/src/pages/settings/datatoolstab/useDataToolsModel.ts
          git commit -m "format: normalize PR780 Phase 3 residual files"
          git push origin HEAD:agent/god-files-recovery-latest-main
