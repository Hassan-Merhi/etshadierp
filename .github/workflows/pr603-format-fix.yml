name: PR 603 format fix

on:
  push:
    branches:
      - fix/production-comparison-arabic-workers-hover

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[pr603-format-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format changed file
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/factory/ProductionComparison.tsx
      - name: Commit formatting and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr603-format-fix.yml
          git add client/src/pages/factory/ProductionComparison.tsx
          git commit -m "fix: format production comparison [pr603-format-fixed]"
          git push origin HEAD:fix/production-comparison-arabic-workers-hover
