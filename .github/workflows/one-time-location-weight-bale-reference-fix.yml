name: One-time inventory weight and bale reference fix

on:
  push:
    branches:
      - fix/location-weight-and-bale-reference-link

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/location-weight-and-bale-reference-link
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          inventory_path = Path('server/routes/factory/stock/locationInventoryRoutes.ts')
          inventory = inventory_path.read_text()
          old_statuses = "AND co.status IN ('FINALIZED','DISPATCHED','SOLD')"
          new_statuses = "AND co.status IN ('LOADING','PENDING_VERIFICATION','VERIFIED','FINALIZED','DISPATCHED','SOLD')"
          count = inventory.count(old_statuses)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 location inventory outbound-status filters, found {count}')
          inventory = inventory.replace(old_statuses, new_statuses)
          inventory = inventory.replace(
              '// Exclude bales that are on a finalized/dispatched/sold order but whose\n            // DB status was never updated (stale IN_STOCK after order finalization).',
              '// Exclude bales already assigned to active or completed outbound orders,\n            // even when their stored DB status is still IN_STOCK.'
          )
          inventory = inventory.replace(
              '// Exclude bales on finalized orders whose DB status was never updated',
              '// Exclude bales already assigned to active or completed outbound orders'
          )
          inventory_path.write_text(inventory)

          lookup_path = Path('server/routes/baleLookupRoutes.ts')
          lookup = lookup_path.read_text()

          raw_ref = 'decodeURIComponent(req.params.referenceNumber).toUpperCase()'
          normalized_ref = 'decodeURIComponent(req.params.referenceNumber).trim().toUpperCase()'
          if raw_ref not in lookup:
              raise SystemExit('Expected reference-number normalization pattern was not found')
          lookup = lookup.replace(raw_ref, normalized_ref)

          direct_match = 'sql`LOWER(${factoryBales.referenceNumber}) = LOWER(${referenceNumber})`'
          normalized_direct_match = 'sql`LOWER(TRIM(${factoryBales.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`'
          if direct_match not in lookup:
              raise SystemExit('Expected direct factory bale reference matcher was not found')
          lookup = lookup.replace(direct_match, normalized_direct_match)

          exact_bale_match = 'eq(factoryBales.referenceNumber, referenceNumber)'
          if exact_bale_match not in lookup:
              raise SystemExit('Expected factory bale exact reference matcher was not found')
          lookup = lookup.replace(
              exact_bale_match,
              'sql`LOWER(TRIM(${factoryBales.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`'
          )

          exact_order_bale_match = 'eq(customerOrderBales.baleReference, referenceNumber)'
          if exact_order_bale_match not in lookup:
              raise SystemExit('Expected order bale exact reference matcher was not found')
          lookup = lookup.replace(
              exact_order_bale_match,
              'sql`LOWER(TRIM(${customerOrderBales.baleReference})) = LOWER(TRIM(${referenceNumber}))`'
          )

          exact_label_match = 'eq(baleLabelPrints.referenceNumber, referenceNumber)'
          if exact_label_match in lookup:
              lookup = lookup.replace(
                  exact_label_match,
                  'sql`LOWER(TRIM(${baleLabelPrints.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`'
              )

          lookup_path.write_text(lookup)

          storage_path = Path('server/storage/factory/products.ts')
          storage = storage_path.read_text()
          old_storage = 'and(eq(schema.baleLabelPrints.referenceNumber, referenceNumber), eq(schema.baleLabelPrints.companyId, companyId))'
          new_storage = 'and(\n        sql`LOWER(TRIM(${schema.baleLabelPrints.referenceNumber})) = LOWER(TRIM(${referenceNumber}))`,\n        eq(schema.baleLabelPrints.companyId, companyId)\n      )'
          if old_storage not in storage:
              raise SystemExit('Expected bale label storage reference matcher was not found')
          storage = storage.replace(old_storage, new_storage, 1)
          storage_path.write_text(storage)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: node node_modules/prettier/bin/prettier.cjs --write server/routes/factory/stock/locationInventoryRoutes.ts server/routes/baleLookupRoutes.ts server/storage/factory/products.ts

      - name: Typecheck
        run: npm run check

      - name: Verify changed-file formatting
        run: npm run format:check:changed

      - name: Commit verified fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-location-weight-bale-reference-fix.yml
          git add server/routes/factory/stock/locationInventoryRoutes.ts server/routes/baleLookupRoutes.ts server/storage/factory/products.ts
          git diff --cached --check
          git commit -m "fix: align inventory weights and bale reference lookup"
          git push origin HEAD:fix/location-weight-and-bale-reference-link
