name: Phase 5 Exact Self Formatting

on:
  push:
    branches:
      - agent/mobile-responsive-phase-5-tables-data-lists

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-responsive-phase-5-tables-data-lists
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Phase 5 formatting
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/components/ui/pagination.tsx
          client/src/components/ui/responsive-accessibility.tsx
          client/src/components/ui/responsive-data-list.tsx

      - name: Commit exact output when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            client/src/components/ui/pagination.tsx \
            client/src/components/ui/responsive-accessibility.tsx \
            client/src/components/ui/responsive-data-list.tsx; then
            echo "Formatting already exact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/ui/pagination.tsx \
            client/src/components/ui/responsive-accessibility.tsx \
            client/src/components/ui/responsive-data-list.tsx
          git commit -m "Phase 5: apply exact shared list formatting"
          git push origin HEAD:agent/mobile-responsive-phase-5-tables-data-lists
