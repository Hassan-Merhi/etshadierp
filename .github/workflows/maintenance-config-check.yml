name: Maintenance - Config Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check workflow files are non-empty
        run: test -s .github/workflows/repository-janitor.yml && test -s .github/workflows/production-canary.yml && test -s .github/workflows/backup-restore-verification.yml && test -s .github/workflows/maintenance-scorecard.yml && test -s .github/workflows/architecture-drift.yml
