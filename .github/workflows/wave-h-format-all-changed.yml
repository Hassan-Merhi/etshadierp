name: Wave H Format All Changed

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-format-all-changed.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@v6
        with: { node-version: "22.14.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format every changed source file
        shell: bash
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts | grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          printf 'Formatting %s changed source file(s)\n' "${#changed_files[@]}"
          printf ' - %s\n' "${changed_files[@]}"
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
            node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"
          fi
      - name: Commit formatting and self-remove
        run: |
          rm -f .github/workflows/wave-h-format-all-changed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- client/src server shared tests scripts .github/workflows/wave-h-format-all-changed.yml
          git diff --cached --quiet || git commit -m "style: format all changed Phase 2 source files"
          git push origin HEAD:wave-i/convergence-automation
