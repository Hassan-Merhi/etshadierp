name: Phase 2.2 Frontend Prop Codemod

on:
  push:
    branches:
      - phase-2.2-frontend-type-safety
    paths:
      - scripts/phase-2.2-frontend-prop-codemod.mjs
      - .github/workflows/phase-2.2-frontend-prop-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.2-frontend-type-safety
      - name: Apply frontend prop typing
        run: node scripts/phase-2.2-frontend-prop-codemod.mjs
      - name: Commit generated frontend changes
        shell: bash
        run: |
          if git diff --quiet -- client/src; then
            echo "No frontend changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src
          git commit -m "refactor: type extracted frontend component props"
          git push origin HEAD:phase-2.2-frontend-type-safety
