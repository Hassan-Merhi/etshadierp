name: Phase 2.2 Frontend Prop Codemod

on:
  push:
    branches:
      - phase-2.2-frontend-type-safety
    paths:
      - scripts/phase-2.2-frontend-prop-codemod.mjs
      - scripts/phase-2.2-frontend-fixups.mjs
      - .github/workflows/phase-2.2-frontend-prop-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.2-frontend-type-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Apply frontend prop typing
        run: node scripts/phase-2.2-frontend-prop-codemod.mjs
      - name: Apply compiler-safe frontend fixups
        run: node scripts/phase-2.2-frontend-fixups.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format changed frontend source
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          mapfile -t working < <(git diff --name-only -- client/src)
          files+=("${working[@]}")
          if [ ${#files[@]} -gt 0 ]; then
            printf '%s\n' "${files[@]}" | sort -u | xargs npx prettier --write
          fi
      - name: Lock reduced type-escape baseline
        run: UPDATE_TYPE_ESCAPE_BASELINE=1 npm run audit:type-escapes
      - name: Commit generated frontend and ratchet changes
        shell: bash
        run: |
          if git diff --quiet -- client/src config/type-escape-boundaries.json; then
            echo "No generated changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src config/type-escape-boundaries.json
            git commit -m "refactor: fix Phase 2.2 frontend type contracts"
            git push origin HEAD:phase-2.2-frontend-type-safety
          fi
      - name: TypeScript
        run: npm run check
      - name: ESLint
        run: npm run lint
