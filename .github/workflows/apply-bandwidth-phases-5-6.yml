name: Apply bandwidth phases 5-6

on:
  push:
    branches:
      - agent/bandwidth-phases-5-6

permissions:
  contents: write

concurrency:
  group: apply-bandwidth-phases-5-6
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bandwidth-phases-5-6
          fetch-depth: 0

      - name: Apply Phase 5-6 implementation
        run: python scripts/apply-bandwidth-phases-5-6.py

      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "Phase 5-6 source is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete bandwidth container, Daybook and voucher batching phases"
          git push origin HEAD:agent/bandwidth-phases-5-6
