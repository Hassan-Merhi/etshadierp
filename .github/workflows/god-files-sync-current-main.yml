name: God Files Sync Current Main

on:
  push:
    branches: [agent/god-files-recovery-main]

permissions:
  contents: write

concurrency:
  group: god-files-sync-current-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-recovery-main
          fetch-depth: 0
      - name: Merge latest main and preserve recovered Stock Items split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Latest main already integrated.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort -u >/tmp/conflicts.txt
            echo 'Merge conflicts:'
            cat /tmp/conflicts.txt
            unexpected=$(grep -v '^client/src/pages/StockItems.tsx$' /tmp/conflicts.txt || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected current-main conflicts require explicit reconciliation:'
              echo "$unexpected"
              exit 1
            fi
            git checkout --ours client/src/pages/StockItems.tsx
            git add client/src/pages/StockItems.tsx
          fi

          python - <<'PY'
          from pathlib import Path

          p=Path('client/src/pages/stockitems/useStockItems.ts')
          s=p.read_text()
          s=s.replace('import { useEffect, useState, type MouseEvent } from "react";', 'import { useState, type MouseEvent } from "react";')
          if 'useCompany' not in s:
              s=s.replace('import { useCurrencyContext } from "@/contexts/CurrencyContext";', 'import { useCurrencyContext } from "@/contexts/CurrencyContext";\nimport { useCompany } from "@/contexts/CompanyContext";')
          if 'useStockItemsFilters' not in s:
              s=s.replace('import { PAGE_SIZE } from "./utils";', 'import { PAGE_SIZE } from "./utils";\nimport { useStockItemsFilters } from "./useStockItemsFilters";')
          old='''  const [searchTerm, setSearchTerm] = useState("");\n  const [debouncedSearch, setDebouncedSearch] = useState("");\n  const [selectedGroupFilter, setSelectedGroupFilter] = useState<number | null>(null);\n  const [selectedGradeFilter, setSelectedGradeFilter] = useState<number | null>(null);\n  const [selectedCategoryFilter, setSelectedCategoryFilter] = useState<number | "none" | null>(null);\n  const [currentPage, setCurrentPage] = useState(1);'''
          new='''  const { selectedCompany } = useCompany();\n  const {\n    filters: { searchTerm, selectedGroupFilter, selectedGradeFilter, selectedCategoryFilter },\n    page: currentPage,\n    setPage: setCurrentPage,\n    resetFilters,\n    hasActiveFilters,\n    setSearchTerm,\n    setSelectedGroupFilter,\n    setSelectedGradeFilter,\n    setSelectedCategoryFilter,\n    debouncedSearch,\n  } = useStockItemsFilters(selectedCompany?.id);'''
          if old not in s:
              raise SystemExit('Stock Items local filter state block not found')
          s=s.replace(old,new)
          start='''  useEffect(() => {\n    const timer = setTimeout(() => {\n      setDebouncedSearch(searchTerm);\n      setCurrentPage(1);\n    }, 300);\n    return () => clearTimeout(timer);\n  }, [searchTerm]);\n\n  useEffect(() => {\n    setCurrentPage(1);\n  }, [selectedGroupFilter, selectedGradeFilter, selectedCategoryFilter]);\n\n'''
          if start not in s:
              raise SystemExit('Stock Items legacy filter effects not found')
          s=s.replace(start,'')
          s=s.replace('    currentPage,\n    setCurrentPage,', '    currentPage,\n    setCurrentPage,\n    resetFilters,\n    hasActiveFilters,')
          p.write_text(s)

          p=Path('client/src/pages/stockitems/StockItemsView.tsx')
          s=p.read_text()
          s=s.replace('  Trash2,\n} from "lucide-react";', '  Trash2,\n  X,\n} from "lucide-react";')
          s=s.replace('    currentPage,\n    setCurrentPage,', '    currentPage,\n    setCurrentPage,\n    resetFilters,\n    hasActiveFilters,')
          marker='''        {stockCategories.length > 0 && (\n          <Select\n            value={selectedCategoryFilter === null ? "all" : String(selectedCategoryFilter)}\n            onValueChange={(value) =>\n              setSelectedCategoryFilter(value === "all" ? null : value === "none" ? "none" : parseInt(value))\n            }\n          >\n            <SelectTrigger className="w-40" data-testid="select-category-filter">\n              <SelectValue placeholder="All Categories" />\n            </SelectTrigger>\n            <SelectContent>\n              <SelectItem value="all">All Categories</SelectItem>\n              <SelectItem value="none">No Category</SelectItem>\n              {stockCategories.map((category) => (\n                <SelectItem key={category.id} value={String(category.id)}>\n                  {category.name}\n                </SelectItem>\n              ))}\n            </SelectContent>\n          </Select>\n        )}'''
          addition=marker+'''\n        {hasActiveFilters && (\n          <Button variant="outline" type="button" onClick={resetFilters} data-testid="button-reset-filters">\n            <X className="mr-2 h-4 w-4" />\n            Reset filters\n          </Button>\n        )}'''
          if marker not in s:
              raise SystemExit('Stock Items category filter view block not found')
          s=s.replace(marker,addition)
          p.write_text(s)
          PY

          npm ci
          npm run check
          node scripts/audit-god-file-boundaries.mjs
          git add -A
          git commit -m 'merge: sync latest main into God Files recovery [sync-current-main]'
          git push origin HEAD:agent/god-files-recovery-main
