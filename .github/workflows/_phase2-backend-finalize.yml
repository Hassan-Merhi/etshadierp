name: Phase 2 Backend Finalize

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Configure Git identity
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge current main
        run: git fetch origin main && git -c core.hooksPath=/dev/null merge --no-edit origin/main
      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Prepare test database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Apply backend repairs
        run: node scripts/_phase2-backend-finalize.mjs
      - name: Format repaired files
        run: npx prettier --write tests/customer-order-excel-export-behavior.test.ts tests/stats-net-position-excel-behavior.test.ts tests/ui/authenticated-request-gating.test.ts config/ci-ratchet-allowances.json
      - name: Verify repaired backend gates
        run: npm run test:backend -- tests/customer-order-excel-export-behavior.test.ts tests/stats-net-position-excel-behavior.test.ts tests/ui/authenticated-request-gating.test.ts tests/source-text-assertions.test.ts
      - name: Verify source-text audit
        run: node scripts/audit-source-text-assertions.mjs
      - name: Commit verified repairs
        run: |
          git rm .github/workflows/_phase2-backend-finalize.yml scripts/_phase2-backend-finalize.mjs
          git add tests/customer-order-excel-export-behavior.test.ts tests/stats-net-position-excel-behavior.test.ts tests/ui/authenticated-request-gating.test.ts config/ci-ratchet-allowances.json
          git -c core.hooksPath=/dev/null commit -m 'fix: close Phase 2 backend verification gaps'
          git -c core.hooksPath=/dev/null push origin HEAD:program/erp-90-phase-2
