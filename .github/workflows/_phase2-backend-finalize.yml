name: Phase 2 Backend Finalize

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: program/erp-90-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Merge current main
        run: git fetch origin main && git -c core.hooksPath=/dev/null merge --no-edit origin/main
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply backend repairs
        run: node scripts/_phase2-backend-finalize.mjs
      - name: Format repaired files
        run: npx prettier --write tests/customer-order-excel-export-behavior.test.ts tests/stats-net-position-excel-behavior.test.ts config/ci-ratchet-allowances.json
      - name: Verify repaired backend gates
        run: npx vitest run tests/customer-order-excel-export-behavior.test.ts tests/stats-net-position-excel-behavior.test.ts tests/source-text-assertions.test.ts
      - name: Verify source-text audit
        run: node scripts/audit-source-text-assertions.mjs
      - name: Commit verified repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_phase2-backend-finalize.yml scripts/_phase2-backend-finalize.mjs
          git add tests/customer-order-excel-export-behavior.test.ts tests/stats-net-position-excel-behavior.test.ts config/ci-ratchet-allowances.json
          git -c core.hooksPath=/dev/null commit -m 'fix: close Phase 2 backend verification gaps'
          git -c core.hooksPath=/dev/null push origin HEAD:program/erp-90-phase-2
