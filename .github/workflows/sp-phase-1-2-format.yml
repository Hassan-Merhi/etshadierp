name: Temporary SP Phase 1-2 Format

on:
  push:
    branches:
      - agent/sp-finalization-phases-1-2-atomicity
    paths:
      - server/routes/sp/spOffloadRoutes.ts
      - server/routes/sp/spOpeningStockRoutes.ts
      - server/routes/sp/spSalesRoutes.ts
      - server/services/sp/spInventoryIntegrity.ts
      - server/services/sp/spReleasePolicy.ts
      - .github/workflows/sp-phase-1-2-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sp-finalization-phases-1-2-atomicity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize Replit registry URLs
        run: sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format Supplier Partner Phase 1-2 source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/sp/spOffloadRoutes.ts \
            server/routes/sp/spOpeningStockRoutes.ts \
            server/routes/sp/spSalesRoutes.ts \
            server/services/sp/spInventoryIntegrity.ts \
            server/services/sp/spReleasePolicy.ts
      - name: Commit exact pinned formatting
        run: |
          if git diff --quiet; then
            echo "Source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/routes/sp/spOffloadRoutes.ts \
            server/routes/sp/spOpeningStockRoutes.ts \
            server/routes/sp/spSalesRoutes.ts \
            server/services/sp/spInventoryIntegrity.ts \
            server/services/sp/spReleasePolicy.ts
          git commit -m "Format Supplier Partner phases 1-2"
          git push origin HEAD:agent/sp-finalization-phases-1-2-atomicity
