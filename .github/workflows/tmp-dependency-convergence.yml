name: Temporary Dependency Convergence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-dependency-convergence.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch current main without marketplace actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Update manifests and action pins
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const updateJson = (file, mutate) => {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            mutate(json);
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          };

          updateJson('package.json', (pkg) => {
            pkg.dependencies['@napi-rs/canvas'] = '^1.0.0';
            pkg.dependencies['@vitejs/plugin-react'] = '^6.0.0';
            pkg.dependencies.archiver = '^8.0.0';
            pkg.dependencies.express = '^5.0.0';
            pkg.devDependencies['@types/archiver'] = '^8.0.0';
            pkg.devDependencies['@types/express'] = '5.0.6';
            pkg.devDependencies.typescript = '7.0.2';
          });

          updateJson('artifacts/mockup-sandbox/package.json', (pkg) => {
            const bucket = pkg.devDependencies?.['@vitejs/plugin-react'] !== undefined ? pkg.devDependencies : pkg.dependencies;
            bucket['@vitejs/plugin-react'] = '^6.0.0';
          });

          const workflowDir = '.github/workflows';
          const replacements = [
            ['actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6', 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7'],
            ['actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4', 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7'],
            ['actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4', 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7']
          ];
          for (const name of fs.readdirSync(workflowDir)) {
            if (!name.endsWith('.yml') && !name.endsWith('.yaml')) continue;
            const file = path.join(workflowDir, name);
            let text = fs.readFileSync(file, 'utf8');
            for (const [from, to] of replacements) text = text.split(from).join(to);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Regenerate npm lockfile
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate pnpm lockfile
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npx --yes pnpm@10.17.1 install --lockfile-only --ignore-scripts

      - name: Commit converged dependency state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json pnpm-lock.yaml artifacts/mockup-sandbox/package.json .github/workflows
          if git diff --cached --quiet; then
            echo 'Dependency state already converged.'
            exit 0
          fi
          git commit -m 'fix(deps): converge remaining major upgrades'
          git push origin HEAD:main
