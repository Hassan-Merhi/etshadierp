name: Combo 4D Apply 5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: combo4d-apply-5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/combo-4d-stock-pos-vouchers-typescript'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Combo 4D branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply audited fifth safe slice
        run: node scripts/combo-4d-safe-slice-5.mjs
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/stock/stockMergeRoutes.ts \
                  server/routes/vouchers/voucherSalesUpdateRoutes.ts
          if git diff --cached --quiet; then
            echo "Combo 4D fifth safe slice already applied."
          else
            git commit -m "Apply Combo 4D merge-audit and sales-item typing fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
