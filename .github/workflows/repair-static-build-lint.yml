name: Repair Static Build Lint
on:
  push:
    branches: [fix/static-build-lint-green-20260818]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/static-build-lint-green-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Apply targeted lint repairs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'client/src/pages/factory/CustomerLoading.tsx';
          let s = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              '  const products = loadingQuery.data?.products ?? [];',
              '  const products = useMemo(() => loadingQuery.data?.products ?? [], [loadingQuery.data?.products]);'
            ],
            [
              '  const validSelectedLines = selectedLines.filter((line) => line.quantity > 0 && line.priceValid && Boolean(line.product.articleCode || line.product.code));',
              '  const validSelectedLines = selectedLines.filter((line) => line.quantity > 0 && line.priceValid && (line.product.articleCode || line.product.code));'
            ],
            [
              '  const hasInvalidSelectedLine = selectedLines.some((line) => line.quantity <= 0 || !line.priceValid || !Boolean(line.product.articleCode || line.product.code));',
              '  const hasInvalidSelectedLine = selectedLines.some((line) => line.quantity <= 0 || !line.priceValid || !(line.product.articleCode || line.product.code));'
            ]
          ];
          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error(`Expected source not found: ${from}`);
            s = s.replace(from, to);
          }
          fs.writeFileSync(file, s);
          NODE
      - name: Verify real lint gates
        run: |
          npm run lint
          npm run audit:lint-ratchet
      - name: Format changed source
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/factory/CustomerLoading.tsx
      - name: Reverify after formatting
        run: |
          npm run lint
          npm run audit:lint-ratchet
          npm run check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/factory/CustomerLoading.tsx
          git commit -m 'fix(factory): remove customer loading lint regressions'
          git push
