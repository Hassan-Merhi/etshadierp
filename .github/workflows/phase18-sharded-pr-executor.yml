name: Phase 18 Sharded PR Executor
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
env:
  CI: true
jobs:
  shard:
    if: github.event.pull_request.head.ref == 'agent/phase18-sharded-executor'
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {ref: agent/phase18-sharded-executor, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Solve shard
        shell: bash
        env:
          PHASE18_SHARD_INDEX: ${{ matrix.shard }}
          PHASE18_SHARD_TOTAL: 8
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          node scripts/phase18-shard-solver.cjs
          if git diff --quiet -- client/src server shared; then echo "SHARD_NO_CHANGES=${PHASE18_SHARD_INDEX}"; exit 0; fi
          git add client/src server shared
          git commit -m "refactor: Phase 18 shard ${PHASE18_SHARD_INDEX} candidate [phase18-shard-result]"
          git push --force origin HEAD:agent/phase18-shard-${PHASE18_SHARD_INDEX}-result

  integrate:
    if: github.event.pull_request.head.ref == 'agent/phase18-sharded-executor'
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: {ref: agent/phase18-sharded-executor, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci
      - name: Integrate shard candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git log -1 --pretty=%B | grep -Fq '[phase18-sharded-result]'; then echo 'Already integrated'; exit 0; fi
          count(){ set +e; node scripts/audit-type-escapes.mjs --json >/tmp/count.json 2>/dev/null; set -e; node -e "const r=require('/tmp/count.json');process.stdout.write(String(r.summary.typeEscapeTotal))"; }
          git fetch origin '+refs/heads/agent/phase18-shard-*-result:refs/remotes/origin/agent/phase18-shard-*-result' || true
          base=$(git rev-parse HEAD)
          start=$(count)
          for shard in $(seq 0 7); do
            branch="origin/agent/phase18-shard-${shard}-result"
            git rev-parse --verify "$branch" >/dev/null 2>&1 || continue
            merge_base=$(git merge-base "$base" "$branch" || true)
            [ -n "$merge_base" ] || continue
            git diff --binary "$merge_base" "$branch" -- client/src server shared >/tmp/shard.patch
            [ -s /tmp/shard.patch ] || continue
            git apply --3way /tmp/shard.patch
          done
          if git diff --quiet -- client/src server shared && git diff --cached --quiet -- client/src server shared; then echo 'SHARDED_NO_CHANGES'; exit 1; fi
          candidate=$(count)
          echo "SHARDED_CANDIDATE $start->$candidate"
          [ "$candidate" -lt "$start" ] || { echo 'No strict improvement'; exit 1; }
          for attempt in $(seq 1 30); do
            set +e; npm run check >/tmp/check.log 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then echo "SHARDED_COMPILER_GREEN attempt=$attempt"; break; fi
            mapfile -t errs < <(sed -nE 's#^([^ (]+\.(ts|tsx))\([0-9]+,[0-9]+\): error TS[0-9]+:.*#\1#p' /tmp/check.log | sort -u)
            reverted=0
            for f in "${errs[@]}"; do
              if git diff --quiet "$base" -- "$f"; then continue; fi
              git checkout "$base" -- "$f"
              reverted=$((reverted+1))
            done
            echo "SHARDED_ROLLBACK attempt=$attempt errors=${#errs[@]} reverted=$reverted"
            if [ "$reverted" -gt 0 ]; then continue; fi
            mapfile -t modified < <(git diff --name-only "$base" -- client/src server shared)
            [ "${#modified[@]}" -gt 0 ] || exit 1
            git checkout "$base" -- "${modified[0]}"
          done
          npm run check
          final=$(count)
          echo "SHARDED_FINAL $start->$final"
          [ "$final" -lt "$start" ] || exit 1
          git add client/src server shared
          git commit -m 'refactor: integrate Phase 18 parallel type reductions [phase18-sharded-source]'
          set +e; node scripts/audit-type-escapes.mjs --json >/tmp/after.json; set -e
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));
          const top=(r.files||[]).filter(f=>f.total).sort((a,b)=>b.total-a.total).slice(0,200);
          fs.writeFileSync('phase18-sharded-report.md',['# Phase 18 Sharded Result','',`Type escapes: ${r.summary.typeEscapeTotal}`,`Explicit any: ${r.summary.explicitAny}`,`as any: ${r.summary.asAny}`,`Suppressions: ${r.summary.suppressions}`,`Files with escapes: ${r.summary.filesWithEscapes}`,'','## Top files','',...top.map(f=>`- ${f.total} — ${f.path}`),''].join('\n'));
          NODE
          git add phase18-sharded-report.md
          git commit -m 'chore: publish Phase 18 sharded result [phase18-sharded-result]'
          git push origin HEAD:agent/phase18-sharded-executor
