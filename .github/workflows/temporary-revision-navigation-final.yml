name: Temporary final revision navigation repair
on:
  push:
    branches: [agent/fix-stock-transfer-revision-history]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stock-transfer-revision-history
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/vouchers/StockTransferForm.tsx')
          s = p.read_text()
          old = '      if (isEditMode && !savingTransferRevisionRef.current) {\n        setLocation(`${modePrefix}/daybook`);\n      } else {\n        stockTransferForm.reset({'
          new = '      if (isEditMode) {\n        if (!savingTransferRevisionRef.current) {\n          setLocation(`${modePrefix}/daybook`);\n        }\n      } else {\n        stockTransferForm.reset({'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/temporary-revision-navigation-final.yml
          rm .github/workflows/temporary-fix-stock-transfer-revision-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/vouchers/StockTransferForm.tsx .github/workflows
          git commit -m "fix: preserve transfer form while saving revision"
          git push origin HEAD:agent/fix-stock-transfer-revision-history
