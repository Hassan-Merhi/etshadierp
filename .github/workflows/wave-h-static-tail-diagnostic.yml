name: Wave H Static Tail Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wave-h-static-tail-diagnostic.yml
      - package.json
      - package-lock.json
      - scripts/verify-server-bundle.mjs
      - scripts/verify-runtime-dependencies.mjs
      - scripts/verify-program1-observability-foundation.mjs
      - scripts/verify-final-production-readiness.mjs
      - scripts/verify-bandwidth-phases-1-2.mjs

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      SESSION_SECRET: wave-h-static-tail-diagnostic
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Run static tail checks
        id: static_tail
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > wave-h-static-tail-diagnostic.log
          status=success
          run_step() {
            label="$1"; shift
            echo "===== ${label} =====" >> wave-h-static-tail-diagnostic.log
            "$@" >> wave-h-static-tail-diagnostic.log 2>&1
            code=$?
            echo "exit=${code}" >> wave-h-static-tail-diagnostic.log
            if [ "$code" -ne 0 ]; then status=failure; fi
            echo >> wave-h-static-tail-diagnostic.log
          }
          run_step verify_lockfile npm run verify:lockfile
          run_step verify_production_dependencies npm run verify:production-dependencies
          run_step build npm run build
          run_step verify_server_bundle npm run verify:server-bundle
          run_step verify_observability npm run verify:observability
          run_step verify_final_readiness npm run verify:final-production-readiness
          run_step verify_bandwidth npm run verify:bandwidth
          echo "static_tail_status=${status}" | tee -a wave-h-static-tail-diagnostic.log
          test "$status" = success
      - name: Publish diagnostic summary
        if: always()
        env:
          OUTCOME: ${{ steps.static_tail.outcome }}
        run: |
          {
            echo "## Wave H static-tail diagnostic"
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Static production tail | $OUTCOME |"
            echo
            echo "This diagnostic is read-only and does not commit, delete, or push repository files."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$OUTCOME" = success
      - name: Upload static-tail diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wave-h-static-tail-diagnostic
          path: wave-h-static-tail-diagnostic.log
          if-no-files-found: error
          retention-days: 7
