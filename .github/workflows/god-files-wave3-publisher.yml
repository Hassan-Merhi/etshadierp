      - name: Update Wave 3 ratchets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (path) => fs.readFileSync(path, 'utf8');
          const write = (path, text) => fs.writeFileSync(path, text.endsWith('\n') ? text : text + '\n');
          const lineCount = (path) => read(path).split(/\r?\n/).length;
          const configPath = 'config/god-file-boundaries.json';
          const config = JSON.parse(read(configPath));
          const retired = [
            'client/src/pages/factory/WasteDispatch.tsx',
            'client/src/pages/SalesReportLegacy.tsx',
            'client/src/pages/factory/FactoryOtwTrackingTab.tsx',
            'client/src/pages/PendingInvoiceVerify.tsx',
          ];
          config.version = 28;
          config.description = 'Version 28 completes cumulative God Files Wave 3 by retiring four small frontend pages through dialog, export, keyboard and CSV-tool extractions. ' + config.description;
          for (const path of retired) delete config.repositoryScan.grandfathered[path];
          write(configPath, JSON.stringify(config, null, 2));
          const remaining = Object.keys(config.repositoryScan.grandfathered);
          let excess = 0;
          for (const path of remaining) {
            const count = lineCount(path);
            if (count <= config.repositoryScan.softMaxLines) throw new Error(`${path} is stale grandfathering at ${count} lines`);
            excess += count - config.repositoryScan.softMaxLines;
          }
          if (remaining.length !== 12) throw new Error(`Expected 12 remaining God Files, got ${remaining.length}`);
          console.log(`WAVE3_BACKLOG files=${remaining.length} excess=${excess}`);
          let boundaryTest = read('tests/god-file-boundaries.test.ts');
          boundaryTest = boundaryTest.replace('expect(report.version).toBe(27);', 'expect(report.version).toBe(28);');
          boundaryTest = boundaryTest.replace(/expect\(report\.summary\.grandfatheredFiles\)\.toBeLessThanOrEqual\(\d+\);/, `expect(report.summary.grandfatheredFiles).toBeLessThanOrEqual(${remaining.length});`);
          boundaryTest = boundaryTest.replace(/expect\(report\.summary\.grandfatheredExcessLines\)\.toBeLessThanOrEqual\(\d+\);/, `expect(report.summary.grandfatheredExcessLines).toBeLessThanOrEqual(${excess});`);
          write('tests/god-file-boundaries.test.ts', boundaryTest);
          let godDoc = read('docs/god-file-split-program.md');
          godDoc = godDoc.replace(/\*\*Backlog: [\d,]+ files, [\d,]+ lines over the limit\*\*/, `**Backlog: ${remaining.length.toLocaleString('en-US')} files, ${excess.toLocaleString('en-US')} lines over the limit**`);
          write('docs/god-file-split-program.md', godDoc);
          let qualityDoc = read('docs/system-quality-program.md');
          qualityDoc = qualityDoc.replace(/God-file backlog \| [\d,]+ files, [\d,]+ excess lines/, `God-file backlog | ${remaining.length.toLocaleString('en-US')} files, ${excess.toLocaleString('en-US')} excess lines`);
          write('docs/system-quality-program.md', qualityDoc);
          NODE

