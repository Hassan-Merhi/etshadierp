name: God Files Wave 3 Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  publish:
    if: github.event.pull_request.base.ref == 'agent/god-files-final-wave1-tests' && github.event.pull_request.head.ref == 'tmp/god-files-wave3-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/god-files-final-wave1-tests
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Apply parent extractions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"Missing replacement target: {label}")
              return text.replace(old, new, 1)

          def replace_block(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0 or end <= start:
                  raise RuntimeError(f"Missing block: {label}")
              return text[:start] + replacement + text[end + len(end_marker):]

          # WasteDispatch: move print mechanics + confirmation/delete/receipt dialogs.
          p = Path('client/src/pages/factory/WasteDispatch.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { Dialog, DialogContent, DialogHeader, DialogTitle, DialogFooter } from "@/components/ui/dialog";\n', '', 'waste dialog imports')
          s = s.replace('  Printer,\n', '', 1).replace('  Package,\n', '', 1)
          s = replace_once(s, 'import { fmt, fmtKg, today } from "./wastedispatch/utils";', 'import { fmt, fmtKg, today } from "./wastedispatch/utils";\nimport { WasteDispatchDialogs } from "./wastedispatch/components/WasteDispatchDialogs";', 'waste dialog component import')
          s = s.replace('  const printRef = useRef<HTMLDivElement>(null);\n', '', 1)
          s = replace_block(s, '  const handlePrint = () => {', '  return (\n', '  return (\n', 'waste handlePrint')
          usage = '''      <WasteDispatchDialogs
            confirming={confirming}
            setConfirming={setConfirming}
            selectedCount={selected.size}
            totalWeight={totalWeight}
            totalCost={totalCost}
            dispatchDate={dispatchDate}
            notes={notes}
            submitPending={submitMutation.isPending}
            onSubmit={() => submitMutation.mutate()}
            deleteDispatchId={deleteDispatchId}
            setDeleteDispatchId={setDeleteDispatchId}
            deletePending={deleteDispatchMutation.isPending}
            onDelete={(id) => deleteDispatchMutation.mutate(id)}
            printData={printData}
            setPrintData={setPrintData}
          />
    </div>
  );
}'''
          s = replace_block(s, '      {/* ── CONFIRM DISPATCH DIALOG', '    </div>\n  );\n}', usage, 'waste dialogs')
          p.write_text(s)

          # SalesReportLegacy: move date keyboard navigation + Excel exporter.
          p = Path('client/src/pages/SalesReportLegacy.tsx')
          s = p.read_text()
          s = s.replace('import { writeFile, ExcelJS } from "@/lib/excelHelper";\n', '', 1)
          s = s.replace('import { format, parseISO, startOfDay, startOfMonth, startOfYear, addDays } from "date-fns";', 'import { format, parseISO, startOfDay, startOfMonth, startOfYear } from "date-fns";', 1)
          s = replace_once(s, 'import type { DailySummary, GroupingType, ProfitFilter, SalesReportItem } from "./salesreportlegacy/types";', 'import type { DailySummary, GroupingType, ProfitFilter, SalesReportItem } from "./salesreportlegacy/types";\nimport { useSalesReportDateKeyboard } from "./salesreportlegacy/useSalesReportDateKeyboard";\nimport { exportSalesReportExcel } from "./salesreportlegacy/exportExcel";', 'sales helper imports')
          s = replace_block(s, '  // Keyboard date navigation: "-" = back 1 day, "+" or "=" = forward 1 day\n  useEffect(() => {', '  const [selectedLocations, setSelectedLocations] = useState<string[]>([]);', '  useSalesReportDateKeyboard(setPeriodFilter);\n\n  const [selectedLocations, setSelectedLocations] = useState<string[]>([]);', 'sales keyboard hook')
          s = replace_block(s, '  const handleExportExcel = async () => {', '  const handleExportPDF = () => {', '  const handleExportExcel = () => exportSalesReportExcel(salesData);\n\n  const handleExportPDF = () => {', 'sales excel exporter')
          p.write_text(s)

          # OTW Tracking: move CSV import/export state + mechanics.
          p = Path('client/src/pages/factory/FactoryOtwTrackingTab.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { TrackNowProgressLog } from "./factoryotwtrackingtab/components/TrackNowProgressLog";', 'import { TrackNowProgressLog } from "./factoryotwtrackingtab/components/TrackNowProgressLog";\nimport { useOtwCsvTools } from "./factoryotwtrackingtab/hooks/useOtwCsvTools";', 'otw csv hook import')
          s = replace_block(s, '  const [importing, setImporting] = useState(false);\n  // ── Dev-only: Export filtered containers as CSV', '  async function trackAll() {', '  const { importing, exportCsv, handleImportFile } = useOtwCsvTools(filtered, otwContainers);\n\n  async function trackAll() {', 'otw csv tools')
          p.write_text(s)

          # PendingInvoiceVerify: move four large modal/alert-dialog render blocks.
          p = Path('client/src/pages/PendingInvoiceVerify.tsx')
          s = p.read_text()
          s = s.replace('import { Dialog, DialogContent, DialogHeader, DialogTitle } from "@/components/ui/dialog";\n', '', 1)
          alert_import = '''import {
            AlertDialog,
            AlertDialogAction,
            AlertDialogCancel,
            AlertDialogContent,
            AlertDialogDescription,
            AlertDialogFooter,
            AlertDialogHeader,
            AlertDialogTitle,
          } from "@/components/ui/alert-dialog";
'''
          s = s.replace(alert_import, '', 1)
          s = replace_once(s, 'import type { ComparisonItem, FinalizePreview, OrderDetail, VerificationSummary } from "./pendinginvoiceverify/types";', 'import type { ComparisonItem, FinalizePreview, OrderDetail, VerificationSummary } from "./pendinginvoiceverify/types";\nimport { PendingInvoiceDialogs } from "./pendinginvoiceverify/PendingInvoiceDialogs";', 'pending dialog import')
          usage = '''      <PendingInvoiceDialogs
            showApproveDialog={showApproveDialog}
            setShowApproveDialog={setShowApproveDialog}
            approveNotes={approveNotes}
            setApproveNotes={setApproveNotes}
            verifyPending={verifyMutation.isPending}
            onVerify={(notes) => verifyMutation.mutate({ approved: true, notes: notes || undefined })}
            showReturnDialog={showReturnDialog}
            setShowReturnDialog={setShowReturnDialog}
            returnPending={returnToLoadingMutation.isPending}
            onReturn={() => returnToLoadingMutation.mutate()}
            showFinalizePreview={showFinalizePreview}
            setShowFinalizePreview={setShowFinalizePreview}
            finalizePreview={finalizePreview}
            finalizePending={finalizeMutation.isPending}
            onFinalize={() => finalizeMutation.mutate()}
            showFixBalesDialog={showFixBalesDialog}
            setShowFixBalesDialog={setShowFixBalesDialog}
            onFixBales={() => forceSyncMutation.mutate()}
          />
    </div>
  );
}'''
          s = replace_block(s, '      <Dialog open={showApproveDialog} onOpenChange={setShowApproveDialog}>', '    </div>\n  );\n}', usage, 'pending invoice dialogs')
          p.write_text(s)
          PY

      - name: Write extracted modules
        shell: bash
        run: |
          mkdir -p client/src/pages/factory/wastedispatch/components
          cat > client/src/pages/factory/wastedispatch/components/WasteDispatchDialogs.tsx <<'EOF'
          import { useRef } from "react";
          import { Button } from "@/components/ui/button";
          import { Dialog, DialogContent, DialogFooter, DialogHeader, DialogTitle } from "@/components/ui/dialog";
          import { Loader2, Package, Printer, Trash2 } from "lucide-react";
          import { fmt, fmtKg } from "../utils";

          interface WasteDispatchPrintBale {
            id: number;
            referenceNumber: string;
            weightKg: number;
            totalCost: number;
          }

          interface WasteDispatchPrintData {
            dispatch: { dispatchNumber: string; dispatchDate: string; notes?: string | null };
            bales: WasteDispatchPrintBale[];
            totalBales: number;
            totalWeightKg: number;
            totalCostWrittenOff: number;
          }

          interface WasteDispatchDialogsProps {
            confirming: boolean;
            setConfirming: (open: boolean) => void;
            selectedCount: number;
            totalWeight: number;
            totalCost: number;
            dispatchDate: string;
            notes: string;
            submitPending: boolean;
            onSubmit: () => void;
            deleteDispatchId: number | null;
            setDeleteDispatchId: (id: number | null) => void;
            deletePending: boolean;
            onDelete: (id: number) => void;
            printData: WasteDispatchPrintData | null;
            setPrintData: (data: WasteDispatchPrintData | null) => void;
          }

          export function WasteDispatchDialogs(props: WasteDispatchDialogsProps) {
            const printRef = useRef<HTMLDivElement>(null);

            const handlePrint = () => {
              if (!printRef.current) return;
              const win = window.open("", "_blank");
              if (!win) return;
              win.document.write(
                `<html><head><title>Waste Disposal — ${props.printData?.dispatch.dispatchNumber ?? ""}</title><style>body{font-family:Arial,sans-serif;font-size:12px;margin:20px}h1{font-size:18px;margin-bottom:4px}.sub{color:#555;font-size:11px;margin-bottom:16px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#f3f4f6;font-weight:bold}.footer{margin-top:24px;font-size:10px;color:#777}</style></head><body>${printRef.current.innerHTML}</body></html>`
              );
              win.document.close();
              win.focus();
              win.print();
              win.close();
            };

            return (
              <>
                <Dialog open={props.confirming} onOpenChange={props.setConfirming}>
                  <DialogContent>
                    <DialogHeader>
                      <DialogTitle className="flex items-center gap-2 text-destructive">
                        <Trash2 className="w-5 h-5" /> Confirm Waste Disposal
                      </DialogTitle>
                    </DialogHeader>
                    <div className="space-y-3 py-2">
                      <p className="text-sm text-muted-foreground">You are about to permanently remove the following from stock as waste:</p>
                      <div className="bg-destructive/5 border border-destructive/20 rounded-md p-3 space-y-1.5">
                        <div className="flex justify-between text-sm"><span className="text-muted-foreground">Bales</span><span className="font-medium">{props.selectedCount}</span></div>
                        <div className="flex justify-between text-sm"><span className="text-muted-foreground">Total Weight</span><span className="font-medium">{fmtKg(props.totalWeight)} kg</span></div>
                        <div className="flex justify-between text-sm"><span className="text-muted-foreground">Cost Written Off</span><span className="font-medium text-destructive">{fmt(props.totalCost)}</span></div>
                        <div className="flex justify-between text-sm"><span className="text-muted-foreground">Date</span><span className="font-medium">{props.dispatchDate}</span></div>
                        {props.notes && <div className="flex justify-between text-sm"><span className="text-muted-foreground">Notes</span><span className="font-medium max-w-xs text-right">{props.notes}</span></div>}
                      </div>
                      <p className="text-xs text-muted-foreground">This will remove these bales from inventory and log a waste disposal expense in the factory daybook. This action cannot be undone.</p>
                    </div>
                    <DialogFooter className="gap-2">
                      <Button variant="outline" onClick={() => props.setConfirming(false)} disabled={props.submitPending}>Cancel</Button>
                      <Button variant="destructive" onClick={props.onSubmit} disabled={props.submitPending} data-testid="button-confirm-dispatch">
                        {props.submitPending ? <><Loader2 className="w-4 h-4 animate-spin mr-2" />Processing...</> : <><Trash2 className="w-4 h-4 mr-2" />Confirm Disposal</>}
                      </Button>
                    </DialogFooter>
                  </DialogContent>
                </Dialog>

                <Dialog open={props.deleteDispatchId !== null} onOpenChange={(open) => { if (!open) props.setDeleteDispatchId(null); }}>
                  <DialogContent>
                    <DialogHeader><DialogTitle className="flex items-center gap-2 text-destructive"><Trash2 className="w-5 h-5" /> Delete Waste Dispatch?</DialogTitle></DialogHeader>
                    <p className="text-sm text-muted-foreground">This will permanently delete the dispatch record and restore all linked bales back to stock. The daybook entry will also be removed. This cannot be undone.</p>
                    <DialogFooter className="gap-2">
                      <Button variant="outline" onClick={() => props.setDeleteDispatchId(null)} disabled={props.deletePending}>Cancel</Button>
                      <Button variant="destructive" disabled={props.deletePending} onClick={() => props.deleteDispatchId !== null && props.onDelete(props.deleteDispatchId)} data-testid="button-confirm-delete-dispatch">
                        {props.deletePending ? <><Loader2 className="w-4 h-4 animate-spin mr-2" />Deleting...</> : <><Trash2 className="w-4 h-4 mr-2" />Delete &amp; Restore Stock</>}
                      </Button>
                    </DialogFooter>
                  </DialogContent>
                </Dialog>

                {props.printData && (
                  <Dialog open onOpenChange={() => props.setPrintData(null)}>
                    <DialogContent className="max-w-2xl">
                      <DialogHeader><DialogTitle className="flex items-center gap-2"><Package className="w-5 h-5 text-green-600" /> Disposal Complete — {props.printData.dispatch.dispatchNumber}</DialogTitle></DialogHeader>
                      <div ref={printRef} className="space-y-3">
                        <div><h1 style={{ fontSize: 18, fontWeight: "bold", marginBottom: 4 }}>Waste Disposal Record</h1><p style={{ color: "#555", fontSize: 11, marginBottom: 16 }}>Dispatch No: {props.printData.dispatch.dispatchNumber}&nbsp;|&nbsp;Date: {props.printData.dispatch.dispatchDate}{props.printData.dispatch.notes && <>&nbsp;|&nbsp;Note: {props.printData.dispatch.notes}</>}</p></div>
                        <table style={{ width: "100%", borderCollapse: "collapse" }}>
                          <thead><tr>{["Reference", "Weight (kg)", "Cost Written Off"].map((heading, index) => <th key={heading} style={{ border: "1px solid #ccc", padding: "6px 8px", background: "#f3f4f6", textAlign: index === 0 ? "left" : "right", fontWeight: "bold" }}>{heading}</th>)}</tr></thead>
                          <tbody>{props.printData.bales.map((bale) => <tr key={bale.id}><td style={{ border: "1px solid #ccc", padding: "5px 8px", fontFamily: "monospace" }}>{bale.referenceNumber}</td><td style={{ border: "1px solid #ccc", padding: "5px 8px", textAlign: "right" }}>{fmtKg(bale.weightKg)}</td><td style={{ border: "1px solid #ccc", padding: "5px 8px", textAlign: "right" }}>{fmt(bale.totalCost)}</td></tr>)}</tbody>
                          <tfoot><tr><td style={{ border: "1px solid #ccc", padding: "6px 8px", fontWeight: "bold" }}>TOTAL — {props.printData.totalBales} bale(s)</td><td style={{ border: "1px solid #ccc", padding: "6px 8px", textAlign: "right", fontWeight: "bold" }}>{fmtKg(props.printData.totalWeightKg)}</td><td style={{ border: "1px solid #ccc", padding: "6px 8px", textAlign: "right", fontWeight: "bold", color: "#dc2626" }}>{fmt(props.printData.totalCostWrittenOff)}</td></tr></tfoot>
                        </table>
                        <p style={{ marginTop: 24, fontSize: 10, color: "#777" }}>This document confirms the waste disposal of factory bales. A daybook expense entry has been created automatically.</p>
                      </div>
                      <DialogFooter className="gap-2"><Button variant="outline" onClick={() => props.setPrintData(null)}>Close</Button><Button onClick={handlePrint} className="gap-2"><Printer className="w-4 h-4" /> Print</Button></DialogFooter>
                    </DialogContent>
                  </Dialog>
                )}
              </>
            );
          }
          EOF

          mkdir -p client/src/pages/salesreportlegacy
          cat > client/src/pages/salesreportlegacy/useSalesReportDateKeyboard.ts <<'EOF'
          import type { Dispatch, SetStateAction } from "react";
          import { useEffect } from "react";
          import { addDays, format } from "date-fns";
          import { hasAnyOpenDialog } from "@/hooks/use-escape-back";
          import type { PeriodFilterValue } from "@/components/ui/period-filter";

          export function useSalesReportDateKeyboard(setPeriodFilter: Dispatch<SetStateAction<PeriodFilterValue>>) {
            useEffect(() => {
              const handleKeyDown = (event: KeyboardEvent) => {
                const target = event.target as HTMLElement;
                const tag = target?.tagName?.toLowerCase();
                if (tag === "textarea") return;
                if (tag === "input") {
                  const inputType = (target as HTMLInputElement).type || "text";
                  if (["text", "number", "email", "password", "search", "tel", "url"].includes(inputType)) return;
                }
                if (tag === "select" || hasAnyOpenDialog()) return;
                const isBack = event.key === "-" || event.code === "Minus";
                const isForward = (event.key === "+" && event.shiftKey) || (event.code === "Equal" && event.shiftKey) || event.key === "=";
                if (!isBack && !isForward) return;
                event.preventDefault();
                const delta = isBack ? -1 : 1;
                setPeriodFilter((previous) => ({
                  fromDate: format(addDays(new Date(previous.fromDate), delta), "yyyy-MM-dd"),
                  toDate: format(addDays(new Date(previous.toDate), delta), "yyyy-MM-dd"),
                  preset: "custom",
                }));
              };
              window.addEventListener("keydown", handleKeyDown, true);
              return () => window.removeEventListener("keydown", handleKeyDown, true);
            }, [setPeriodFilter]);
          }
          EOF

          cat > client/src/pages/salesreportlegacy/exportExcel.ts <<'EOF'
          import { ExcelJS, writeFile } from "@/lib/excelHelper";
          import { format } from "date-fns";
          import type { SalesReportItem } from "./types";

          export async function exportSalesReportExcel(salesData: SalesReportItem[]) {
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet("Detailed Sales Report");
            const currencyCols = [5, 6, 7, 8, 9, 10, 11, 13];
            const percentCols = [12, 14];
            const profitCols = [8, 11, 12, 13, 14];
            worksheet.columns = [
              { header: "Location", key: "location", width: 15 },
              { header: "Item Code", key: "itemCode", width: 15 },
              { header: "Item Name", key: "itemName", width: 30 },
              { header: "Quantity", key: "quantity", width: 10 },
              { header: "Sold Price", key: "soldPrice", width: 12 },
              { header: "Cost Price", key: "costPrice", width: 12 },
              { header: "Hassan's Price", key: "hassansPrice", width: 14 },
              { header: "Unit Profit", key: "unitProfit", width: 12 },
              { header: "Total Sales", key: "totalSales", width: 12 },
              { header: "Total Cost", key: "totalCost", width: 12 },
              { header: "Cost Profit", key: "costProfit", width: 12 },
              { header: "Cost %", key: "costPercent", width: 10 },
              { header: "Hassan's Profit", key: "hassansProfit", width: 14 },
              { header: "Hassan's %", key: "hassansPercent", width: 12 },
            ];
            const headerRow = worksheet.getRow(1);
            headerRow.font = { bold: true };
            headerRow.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF5F5F5" } };
            headerRow.eachCell((cell) => {
              cell.border = {
                top: { style: "medium", color: { argb: "FF999999" } },
                bottom: { style: "medium", color: { argb: "FF999999" } },
                left: { style: "medium", color: { argb: "FF999999" } },
                right: { style: "medium", color: { argb: "FF999999" } },
              };
            });
            salesData.forEach((item) => {
              const unitProfit = parseFloat(item.actualSellingPrice) - parseFloat(item.costPrice);
              const row = worksheet.addRow({
                location: item.locationName || "N/A",
                itemCode: item.stockItemCode || "",
                itemName: item.stockItemName,
                quantity: parseFloat(item.quantity),
                soldPrice: parseFloat(item.actualSellingPrice),
                costPrice: parseFloat(item.costPrice),
                hassansPrice: parseFloat(item.configuredSellingPrice),
                unitProfit,
                totalSales: parseFloat(item.totalSales),
                totalCost: parseFloat(item.totalCost),
                costProfit: parseFloat(item.costProfit),
                costPercent: item.costProfitPercentage,
                hassansProfit: item.configuredProfit,
                hassansPercent: item.configuredProfitPercentage,
              });
              row.eachCell((cell, colNumber) => {
                cell.border = {
                  top: { style: "medium", color: { argb: "FF999999" } },
                  bottom: { style: "medium", color: { argb: "FF999999" } },
                  left: { style: "medium", color: { argb: "FF999999" } },
                  right: { style: "medium", color: { argb: "FF999999" } },
                };
                if (currencyCols.includes(colNumber)) cell.numFmt = '"$"#,##0.00';
                if (percentCols.includes(colNumber)) cell.numFmt = '0.0"%"';
                const value = typeof cell.value === "number" ? cell.value : parseFloat(String(cell.value || 0));
                if (profitCols.includes(colNumber) && !Number.isNaN(value)) {
                  if (value < 0) cell.font = { color: { argb: "FFE57373" } };
                  else if (value > 0) cell.font = { color: { argb: "FF4CAF50" } };
                }
              });
            });
            await writeFile(workbook, `detailed-sales-report-${format(new Date(), "yyyy-MM-dd")}.xlsx`);
          }
          EOF

          mkdir -p client/src/pages/factory/factoryotwtrackingtab/hooks
          cat > client/src/pages/factory/factoryotwtrackingtab/hooks/useOtwCsvTools.ts <<'EOF'
          import type { ChangeEvent } from "react";
          import { useState } from "react";
          import { useQueryClient } from "@tanstack/react-query";
          import { getErrorDetails } from "@shared/errorUtils";
          import { useToast } from "@/hooks/use-toast";
          import { factoryApiRequest } from "@/lib/factoryApi";
          import type { ContainerWithSupplier } from "../types";
          import { containerCost, num } from "../utils";

          function parseCsvLine(line: string): string[] {
            const output: string[] = [];
            let current = "";
            let inQuotes = false;
            for (let index = 0; index < line.length; index++) {
              const char = line[index];
              if (inQuotes) {
                if (char === '"' && line[index + 1] === '"') {
                  current += '"';
                  index++;
                } else if (char === '"') inQuotes = false;
                else current += char;
              } else if (char === '"') inQuotes = true;
              else if (char === ",") {
                output.push(current.trim());
                current = "";
              } else current += char;
            }
            output.push(current.trim());
            return output;
          }

          function normaliseDate(raw: string): string | null {
            const value = raw.trim();
            if (!value) return null;
            if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
            const slashDate = value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
            if (slashDate) {
              const [, month, day, rawYear] = slashDate;
              const year = rawYear.length === 2 ? "20" + rawYear : rawYear;
              return year + "-" + month.padStart(2, "0") + "-" + day.padStart(2, "0");
            }
            const namedDate = value.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/);
            if (namedDate) {
              const months: Record<string, string> = { jan: "01", feb: "02", mar: "03", apr: "04", may: "05", jun: "06", jul: "07", aug: "08", sep: "09", oct: "10", nov: "11", dec: "12" };
              const [, day, monthName, rawYear] = namedDate;
              const month = months[monthName.toLowerCase()];
              if (month) {
                const year = rawYear.length === 2 ? "20" + rawYear : rawYear;
                return year + "-" + month + "-" + day.padStart(2, "0");
              }
            }
            return null;
          }

          export function useOtwCsvTools(filtered: ContainerWithSupplier[], otwContainers: ContainerWithSupplier[]) {
            const { toast } = useToast();
            const queryClient = useQueryClient();
            const [importing, setImporting] = useState(false);

            function exportCsv() {
              const rows = [["Container #", "Supplier", "ETA (YYYY-MM-DD)", "Status", "Cost", "Freight", "Weight (KG)", "Notes"]];
              for (const container of filtered) {
                rows.push([
                  container.containerNumber || "",
                  container.supplierName || "",
                  container.arrivalDate ? container.arrivalDate.slice(0, 10) : "",
                  container.status || "",
                  containerCost(container).amount > 0 ? String(containerCost(container).amount) : "",
                  num(container.freight) > 0 ? String(num(container.freight)) : "",
                  container.totalKg ? String(container.totalKg) : "",
                  container.otwNote || "",
                ]);
              }
              const csv = rows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
              const blob = new Blob([csv], { type: "text/csv" });
              const url = URL.createObjectURL(blob);
              const anchor = document.createElement("a");
              anchor.href = url;
              anchor.download = `containers-otw-${new Date().toISOString().slice(0, 10)}.csv`;
              anchor.click();
              URL.revokeObjectURL(url);
            }

            async function handleImportFile(event: ChangeEvent<HTMLInputElement>) {
              const file = event.target.files?.[0];
              event.target.value = "";
              if (!file) return;
              setImporting(true);
              try {
                const text = await file.text();
                const csvLines = text.split(/\r?\n/).filter((line) => line.trim());
                const headerColumns = parseCsvLine(csvLines[0] || "").map((heading) => heading.toLowerCase());
                const containerColumn = headerColumns.findIndex((heading) => heading.includes("container"));
                const etaColumn = headerColumns.findIndex((heading) => heading.includes("eta"));
                const containerIndex = containerColumn >= 0 ? containerColumn : 0;
                const etaIndex = etaColumn >= 0 ? etaColumn : 2;
                const lookup = new Map<string, number>(otwContainers.map((container) => [container.containerNumber?.trim().toUpperCase() ?? "", container.id]));
                let updated = 0;
                let skipped = 0;
                for (const line of csvLines.slice(1)) {
                  const columns = parseCsvLine(line);
                  const containerNumber = (columns[containerIndex] ?? "").toUpperCase().trim();
                  const eta = normaliseDate((columns[etaIndex] ?? "").trim());
                  const id = lookup.get(containerNumber);
                  if (!containerNumber || !eta || !id) {
                    skipped++;
                    continue;
                  }
                  try {
                    await factoryApiRequest("PATCH", `/api/factory/containers/${id}`, { arrivalDate: eta });
                    updated++;
                  } catch {
                    skipped++;
                  }
                }
                queryClient.invalidateQueries({ queryKey: ["/api/factory/containers"] });
                toast({ title: "Import complete", description: `${updated} ETA(s) updated, ${skipped} skipped.` });
              } catch (error) {
                toast({ title: "Import failed", description: getErrorDetails(error).optionalMessage, variant: "destructive" });
              } finally {
                setImporting(false);
              }
            }

            return { importing, exportCsv, handleImportFile };
          }
          EOF

