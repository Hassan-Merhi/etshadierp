name: Remote support Phase 6 formatter

on:
  push:
    branches:
      - agent/remote-support-phase-6-keyboard-control
  pull_request:
    branches:
      - agent/remote-support-phase-5-mouse-control

permissions:
  contents: write

concurrency:
  group: remote-support-phase6-format
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-6-keyboard-control'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-6-keyboard-control
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format Phase 6 source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/RemoteKeyboardControllerOverlay.tsx \
            client/src/components/RemoteKeyboardControlTarget.tsx \
            client/src/components/RemoteMouseControlTarget.tsx \
            client/src/components/RemoteSupportIndicator.tsx \
            client/src/components/remote-support-indicator-policy.ts \
            client/src/hooks/remote-keyboard-control-policy.test.ts \
            client/src/hooks/remote-keyboard-control-policy.ts \
            client/src/hooks/remote-mouse-control-policy.ts \
            client/src/i18n/remoteSupportPhase6Translations.ts \
            server/routes/applicationRoutes.ts \
            server/routes/remoteKeyboardControlRoutes.ts \
            server/services/remoteControlSessionService.ts \
            server/services/remoteKeyboardCommandService.ts \
            tests/remote-control-session-service.test.ts \
            tests/remote-keyboard-command-service.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client server tests
          git commit -m "style(remote-support): format Phase 6 source"
          git push origin HEAD:agent/remote-support-phase-6-keyboard-control
