name: Release Verification - Main Dispatcher

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: release-verification-main-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact-main release verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Dispatching Release Verification for main SHA ${TARGET_SHA}"
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/release-verification.yml/dispatches" \
            --data '{"ref":"main"}'
