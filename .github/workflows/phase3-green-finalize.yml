name: Phase 3 Green Finalize

on:
  push:
    branches:
      - agent/bandwidth-phase-3-cache-etag-keys

permissions:
  contents: write

concurrency:
  group: phase3-green-finalize
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SESSION_SECRET: phase3-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase3_test
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - run: npm ci --no-audit --bin-links=true

      - name: Rebuild clean Phase 3 branch on main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/phase3-green-finalizer.py /tmp/phase3-green-finalizer.py
          git fetch origin main
          git diff --binary origin/main...HEAD -- . ':(exclude).github' > /tmp/phase3-source.patch
          git checkout --detach origin/main
          git apply --index /tmp/phase3-source.patch
          python /tmp/phase3-green-finalizer.py
          git add -A

      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json

      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Verify disposable database schema
        run: node scripts/verify-ci-disposable-schema.mjs

      - name: Format changed source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          mapfile -d '' changed_files < <(
            git diff --cached --name-only --diff-filter=ACMR -z -- client/src server shared tests scripts config |
              grep -zE '\.(ts|tsx|css|mjs|json)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi
          git add -A
          git diff --check --cached

      - name: TypeScript
        run: npm run check

      - name: Full backend tests
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism

      - name: Full frontend tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts --maxWorkers=1 --no-file-parallelism

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Repository contracts
        run: |
          npm run verify:server-bundle
          npm run verify:program1-observability
          npm run verify:final-production-readiness
          npm run verify:bandwidth
          npm run verify:dependency-audit

      - name: Publish one clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git -c user.name='OpenAI Agent' -c user.email='noreply@openai.com' commit \
            -m 'Bandwidth Phase 3: cache stable reference reads'
          git push --force origin HEAD:agent/bandwidth-phase-3-cache-etag-keys
