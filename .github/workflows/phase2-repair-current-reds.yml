name: Phase 2 Repair Current Reds

on:
  push:
    branches:
      - program/erp-90-phase-2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: program/erp-90-phase-2
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install dependencies
        run: npm ci
      - name: Fix confirmed formatting failure
        run: npx prettier --write server/routes/factory/employee-pos/netPositionHistoricalCorrection.ts
      - name: Refresh stale bound documentation figures
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('docs/god-file-split-program.md'): [('25,419 lines over the limit', '25,420 lines over the limit')],
              Path('docs/system-quality-program.md'): [
                  ('25,419', '25,420'),
                  ('9,461', '9,457'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  print(f'No stale replacements needed in {path}')
              else:
                  path.write_text(text)
                  print(f'Updated {path}')
          PY
      - name: Verify mechanical repairs
        run: |
          npx prettier --check server/routes/factory/employee-pos/netPositionHistoricalCorrection.ts
          npm run audit:doc-index
          npm run check
      - name: Commit and push repaired state
        run: |
          git add server/routes/factory/employee-pos/netPositionHistoricalCorrection.ts docs/god-file-split-program.md docs/system-quality-program.md
          if ! git diff --cached --quiet; then
            git commit -m "fix(phase2): repair formatting and bound documentation drift"
          fi
          git rm .github/workflows/phase2-repair-current-reds.yml
          git commit -m "chore(phase2): remove temporary repair workflow"
          git push origin HEAD:program/erp-90-phase-2
