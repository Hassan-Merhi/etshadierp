name: Phase 5 Refresh Route Manifest

on:
  push:
    branches:
      - feature/location-whatsapp-phase1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/location-whatsapp-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Normalize lockfile registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Prepare test database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Regenerate reviewed route snapshot
        shell: bash
        run: |
          set +e
          UPDATE_ROUTE_MANIFEST=1 npm run test:backend -- route-manifest
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'config/ci-ratchet-allowances.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.routeManifestAdditions = [];
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          node node_modules/prettier/bin/prettier.cjs --write config/route-manifest.json config/ci-ratchet-allowances.json
      - name: Verify refreshed route contract
        run: npm run test:backend -- route-manifest
      - name: Commit refreshed contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/route-manifest.json config/ci-ratchet-allowances.json
          if git diff --cached --quiet; then
            echo "No route manifest changes to commit."
            exit 0
          fi
          git commit -m "Phase 5: refresh reviewed route manifest"
          git push origin HEAD:feature/location-whatsapp-phase1
