name: PR 818 Governance Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.number == 818
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update live god-file figures
        shell: bash
        run: |
          sed -i 's/49 files, 24,985/47 files, 24,565/g' docs/god-file-split-program.md docs/system-quality-program.md
          git diff --check
          git diff -- docs/god-file-split-program.md docs/system-quality-program.md
          if git diff --quiet -- docs/god-file-split-program.md docs/system-quality-program.md; then
            echo "God-file documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/god-file-split-program.md docs/system-quality-program.md
          git commit -m "Sync god-file documentation metrics"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
