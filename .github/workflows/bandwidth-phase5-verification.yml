# Cumulative bandwidth verification for the final repaired Phase 1–4 tree.
name: Bandwidth Phase 5 Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandwidth-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Historical bandwidth contract
        run: npm run verify:bandwidth

      - name: Sales report bandwidth contract
        run: node scripts/verify-bandwidth-phase-3-sales-report.mjs

      - name: Global request-pressure contract
        run: node scripts/verify-bandwidth-phase-4-global-pressure.mjs

      - name: Focused route-template regression
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts
          tests/ui/trace-context-route-template.test.ts

      - name: Focused frontend bandwidth regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts
          tests/ui/bandwidth-phase-1-invalidation-policy.test.ts
          tests/ui/bandwidth-phase-2-payloads.test.ts
          tests/ui/bandwidth-phase-4-heavy-pages.test.ts