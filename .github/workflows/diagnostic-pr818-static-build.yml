name: PR 818 Static Build Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 818
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up canonical Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.14.0"

      - name: Normalize registry and install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Verify lockfile and production dependencies
        run: |
          npm run verify:lockfile
          npm run verify:production-dependencies

      - name: Check formatting for PR source changes
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed source files require formatting checks."
            exit 0
          fi
          printf 'Checking formatting for %s changed source file(s):\n' "${#changed_files[@]}"
          printf ' - %s\n' "${changed_files[@]}"
          node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"

      - name: Lint
        run: npm run lint

      - name: Lint warning ratchet
        if: always()
        run: npm run audit:lint-ratchet

      - name: TypeScript
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify server bundle
        run: npm run verify:server-bundle

      - name: Repository safety contracts
        run: |
          npm run verify:observability
          npm run verify:final-production-readiness
          npm run verify:bandwidth
