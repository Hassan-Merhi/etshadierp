name: PR 818 Static Build Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 818
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up canonical Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.14.0"

      - name: Normalize registry and install dependencies
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true

      - name: Show Prettier diff for translation aggregator
        run: |
          cp client/src/i18n/sharedUiPhase3Translations.ts /tmp/sharedUiPhase3Translations.before.ts
          node node_modules/prettier/bin/prettier.cjs --write client/src/i18n/sharedUiPhase3Translations.ts
          diff -u /tmp/sharedUiPhase3Translations.before.ts client/src/i18n/sharedUiPhase3Translations.ts || true
          node node_modules/prettier/bin/prettier.cjs --check client/src/i18n/sharedUiPhase3Translations.ts
