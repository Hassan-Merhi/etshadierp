name: One-shot format PO import SP parent JV test

on:
  push:
    branches:
      - fix/po-import-sp-parent-jv
    paths:
      - .github/workflows/format-po-import-sp-parent-jv-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/po-import-sp-parent-jv
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format regression test
        run: node node_modules/prettier/bin/prettier.cjs --write tests/po-import-sp-parent-jv.test.ts
      - name: Remove formatter and commit
        run: |
          rm .github/workflows/format-po-import-sp-parent-jv-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/po-import-sp-parent-jv.test.ts .github/workflows/format-po-import-sp-parent-jv-once.yml
          git commit -m "style: format PO import SP parent JV behavior test"
          git push origin HEAD:fix/po-import-sp-parent-jv
