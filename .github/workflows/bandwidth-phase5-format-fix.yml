name: Bandwidth Phase 5 Format Fix

on:
  push:
    branches: [agent/bandwidth-phase-1-waste-dispatch]
    paths: [.github/workflows/bandwidth-phase5-format-fix.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/bandwidth-phase-1-waste-dispatch
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --ignore-scripts
      - name: Apply exact Waste Dispatch TypeScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('client/src/pages/factory/WasteDispatchOptimized.tsx')
          text = client.read_text()
          old = '  HistoryBale,\n  HistoryResponse,'
          if old not in text:
              raise SystemExit('HistoryItem import insertion point not found')
          text = text.replace(old, '  HistoryBale,\n  HistoryItem,\n  HistoryResponse,', 1)
          count = text.count('readJson(')
          if count != 2:
              raise SystemExit(f'expected 2 leftover readJson calls, found {count}')
          text = text.replace('readJson(', 'readWasteJson(')
          client.write_text(text)

          server = Path('server/routes/factory/employee-pos/wasteDispatchBandwidthRoutes.ts')
          text = server.read_text()
          old = '''function getCompanyId(req: Request): number | null {\n  const value = req.session?.factoryCompanyId || req.session?.currentCompanyId;\n  const parsed = Number(value);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : null;\n}\n'''
          new = '''type FactorySession = Request["session"] & { factoryCompanyId?: number };\n\nfunction getCompanyId(req: Request): number | null {\n  const session = req.session as FactorySession;\n  const value = session.factoryCompanyId || session.currentCompanyId;\n  const parsed = Number(value);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : null;\n}\n'''
          if old not in text:
              raise SystemExit('getCompanyId replacement target not found')
          server.write_text(text.replace(old, new, 1))
          PY
      - name: Format every changed source file exactly like Circle parity
        run: |
          git fetch origin main:refs/remotes/origin/main
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          fi
      - name: TypeScript verification
        run: npm run check
      - name: Prettier verification
        run: |
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
              grep -zE '\.(ts|tsx|css|mjs)$' || true
          )
          node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 5: fix final TypeScript and formatting failures"
          git push origin HEAD:agent/bandwidth-phase-1-waste-dispatch
