name: Remote support Phase 3 formatter export

on:
  push:
    branches:
      - agent/remote-support-phase-3-viewing-quality
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  formatter-export:
    if: github.event_name == 'push' || github.head_ref == 'agent/remote-support-phase-3-viewing-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/remote-support-phase-3-viewing-quality
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Normalize registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format metadata test
        run: node node_modules/prettier/bin/prettier.cjs --write tests/screen-feed-viewing-metadata.test.ts
      - name: Upload formatted test
        uses: actions/upload-artifact@v6
        with:
          name: phase3-formatted-metadata-test
          path: tests/screen-feed-viewing-metadata.test.ts
          if-no-files-found: error
          retention-days: 1
