name: Phase 2 Format

on:
  push:
    branches:
      - codex/voucher-idempotency-phase2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/voucher-idempotency-phase2
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Format Phase 2 files
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          server/services/accounting/centralPostingEngine.ts
          server/services/accounting/databasePostingDependencies.ts
          shared/schema/erp/accounting-posting-requests.ts
          tests/central-posting-idempotency.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/accounting/centralPostingEngine.ts \
            server/services/accounting/databasePostingDependencies.ts \
            shared/schema/erp/accounting-posting-requests.ts \
            tests/central-posting-idempotency.test.ts
          git commit -m "format phase 2 idempotency files"
          git -c core.hooksPath=/dev/null push origin HEAD:codex/voucher-idempotency-phase2
