name: Phase 2 formatter

on:
  push:
    branches:
      - agent/phase-2-pos-transfer-isolation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-pos-transfer-isolation
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize package registry
        run: sed -i 's#https://registry.npmjs.org/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 2 files
        run: npx prettier --write server/routes/fiscal-transfers/pos-detail.ts tests/pos-transfer-detail-company-isolation.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/fiscal-transfers/pos-detail.ts tests/pos-transfer-detail-company-isolation.test.ts
          git commit -m "style: format Phase 2 isolation files"
          git push origin HEAD:agent/phase-2-pos-transfer-isolation
