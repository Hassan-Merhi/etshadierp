name: Number 6 focused diagnostics

on:
  push:
    branches:
      - claude/format-ratchet-database-tls-5nvvde
    paths:
      - .github/workflows/number6-focused-debug.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/format-ratchet-database-tls-5nvvde
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Locate focused tests
        run: |
          grep -RIl "calculatedCost.toFixed(2)" server tests || true
          grep -RIl "DB_SSL_REJECT_UNAUTHORIZED=false" server tests || true
          grep -RIl "stdout-regression-audit" server tests || true
          grep -RIn "console.warn(" server/db.ts server/lib/databaseSsl.mjs || true
      - name: Run focused failing tests
        run: |
          mapfile -t files < <(grep -RIlE "calculatedCost\.toFixed\(2\)|DB_SSL_REJECT_UNAUTHORIZED=false|stdout-regression-audit" server tests | grep -E '\.test\.ts$' || true)
          printf 'Focused files:\n%s\n' "${files[*]}"
          if ((${#files[@]})); then
            node node_modules/vitest/vitest.mjs run "${files[@]}" --reporter=verbose
          fi
