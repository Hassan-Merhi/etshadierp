name: Wave H Phase 2 Remeasure

on:
  push:
    branches: [wave-i/convergence-automation]
    paths:
      - .github/workflows/wave-h-phase2-remeasure.yml

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: phase2-remeasure-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@v6
        with: { node-version: "22.14.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Backend coverage
        id: coverage
        continue-on-error: true
        run: npm run test:backend:coverage
      - name: Save backend diagnostics
        if: always()
        run: |
          mkdir -p phase2-backend
          cp coverage/backend/coverage-summary.json phase2-backend/coverage-summary.json 2>/dev/null || true
          printf '%s\n' '${{ steps.coverage.outcome }}' > phase2-backend/outcome.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: phase2-backend-remeasure, path: phase2-backend, retention-days: 7 }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/setup-node@v6
        with: { node-version: "22.14.0", cache: npm }
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - name: Frontend coverage
        id: coverage
        continue-on-error: true
        run: npm run test:frontend:coverage
      - name: Save frontend diagnostics
        if: always()
        run: |
          mkdir -p phase2-frontend
          cp coverage/frontend/coverage-summary.json phase2-frontend/coverage-summary.json 2>/dev/null || true
          printf '%s\n' '${{ steps.coverage.outcome }}' > phase2-frontend/outcome.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: phase2-frontend-remeasure, path: phase2-frontend, retention-days: 7 }

  record:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: wave-i/convergence-automation }
      - uses: actions/download-artifact@v8
        with: { name: phase2-backend-remeasure, path: phase2-backend }
      - uses: actions/download-artifact@v8
        with: { name: phase2-frontend-remeasure, path: phase2-frontend }
      - name: Record result
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j = p => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : null;
          const t = p => fs.existsSync(p) ? fs.readFileSync(p,'utf8').trim() : 'missing';
          const b=j('phase2-backend/coverage-summary.json'), f=j('phase2-frontend/coverage-summary.json');
          const result={measuredAtSha:process.env.GITHUB_SHA,backendLinesPct:b?.total?.lines?.pct??null,backendTargetPct:35,frontendLinesPct:f?.total?.lines?.pct??null,frontendTargetPct:20,backendStep:t('phase2-backend/outcome.txt'),frontendStep:t('phase2-frontend/outcome.txt')};
          result.backendPassed=result.backendStep==='success'&&result.backendLinesPct!==null&&result.backendLinesPct>=35;
          result.frontendPassed=result.frontendStep==='success'&&result.frontendLinesPct!==null&&result.frontendLinesPct>=20;
          result.passed=result.backendPassed&&result.frontendPassed;
          fs.writeFileSync('phase2-measurement-result.json',JSON.stringify(result,null,2)+'\n');
          NODE
      - name: Commit result and self-remove
        run: |
          rm -f .github/workflows/wave-h-phase2-remeasure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-measurement-result.json .github/workflows/wave-h-phase2-remeasure.yml
          git commit -m "test: record Wave H Phase 2 remeasurement"
          git push origin HEAD:wave-i/convergence-automation
