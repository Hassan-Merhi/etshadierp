name: Phase 18 Data Tools Retry

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[phase18-datatools-retry]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Replay corrected extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/phase18-datatools-fix.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=='- name: Extract direct location-cost tool and translate it')
          run_i=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
          out=[]
          for l in lines[run_i+1:]:
              if l.startswith('      - name:'):
                  break
              out.append(l[10:] if l.startswith('          ') else l)
          script='\n'.join(out)+'\n'
          script=script.replace("s=s.replace('  FileDown,\\n', '')", "# FileDown is shared by other export actions; keep the import.")
          Path('/tmp/datatools-transform.sh').write_text(script)
          PY
          bash /tmp/datatools-transform.sh
      - name: Verify compiler, i18n, and Data Tools boundary
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node scripts/verify-i18n-audit-classifier.mjs
          node scripts/audit-i18n-phase14.mjs --json-out /tmp/i18n.json --markdown-out /tmp/i18n.md
          set +e
          npm run audit:god-files >/tmp/god.log 2>&1
          rc=$?
          set -e
          cat /tmp/god.log
          if grep -Fq 'client/src/pages/settings/DataToolsTab.tsx' /tmp/god.log; then exit 1; fi
          echo "OTHER_GOD_FILE_FAILURES_REMAIN=$rc"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add client/src/pages/settings/DataToolsTab.tsx client/src/pages/settings/datatoolstab/components/LocationCostPriceOverride.tsx client/src/i18n/applicationTranslations.ts
          git commit -m 'refactor: extract and translate location cost override [phase18-datatools] [skip ci]'
          git fetch origin main
          git rebase origin/main
          npm run check
          node scripts/audit-i18n-phase14.mjs --json-out /tmp/i18n-rebase.json --markdown-out /tmp/i18n-rebase.md
          git push origin HEAD:main
