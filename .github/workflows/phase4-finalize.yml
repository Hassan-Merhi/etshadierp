name: Phase 4 Finalize

on:
  push:
    branches: [phase-4-remaining-type-safety]

permissions:
  contents: write

concurrency:
  group: phase4-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-4-remaining-type-safety
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - name: Lock earned type-escape baseline
        run: UPDATE_TYPE_ESCAPE_BASELINE=1 npm run audit:type-escapes
      - name: Retire Phase 4-only scaffolding
        run: |
          git rm \
            .github/workflows/phase4-classify-escapes.yml \
            .github/workflows/phase4-manual-cert.yml \
            .github/workflows/phase4-finalize.yml \
            scripts/phase4-classify-escapes.mjs \
            scripts/phase4-bisect-inference.mjs
      - name: Final source certification
        run: |
          npm run check
          npm run audit:type-escapes
          npm run lint
          git diff --check
      - name: Commit final Phase 4 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/type-escape-boundaries.json
          git commit -m "chore: lock Phase 4 type-safety gains"
          git push origin HEAD:phase-4-remaining-type-safety
