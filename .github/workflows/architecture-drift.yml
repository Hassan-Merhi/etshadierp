name: Maintenance - Architecture Drift

on:
  schedule:
    - cron: '29 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Detect dependency and repository drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Detect outdated dependencies
        shell: bash
        run: |
          set +e
          npm outdated
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          echo "npm outdated exit status $status is informational for scheduled drift reporting."

      - name: Check migration naming collisions
        shell: bash
        run: |
          set -euo pipefail
          if [ -d migrations ]; then
            duplicates=$(find migrations -maxdepth 1 -type f -printf '%f\n' | sed -E 's/^([0-9]+).*/\1/' | sort | uniq -d)
            if [ -n "$duplicates" ]; then
              echo "Duplicate migration sequence prefixes detected:"
              echo "$duplicates"
              exit 1
            fi
          else
            echo "No top-level migrations directory; skipping migration-prefix check."
          fi
