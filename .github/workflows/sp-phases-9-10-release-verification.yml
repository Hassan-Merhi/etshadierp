name: Supplier Partner Phases 9-10 Release Verification

on:
  pull_request:
    branches:
      - agent/sp-finalization-phases-7-8-controls-reports
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-release:
    name: Full SP release verification
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: sp-phases-9-10-release-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Normalize package registry URLs
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: TypeScript
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: node node_modules/prettier/bin/prettier.cjs --check server/routes/sp tests scripts docs .github/workflows/sp-phases-9-10-release-verification.yml
      - name: Prepare disposable database schema
        run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Verify migration registry
        run: node scripts/verify-migration-registry.mjs --json
      - name: Run production startup migrations
        run: |
          node dist/index.js > sp-release-startup.log 2>&1 &
          app_pid=$!
          cleanup() { kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:${PORT}/api/health/db > sp-release-health.json; then
              cat sp-release-health.json
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat sp-release-startup.log; exit 1; fi
            sleep 1
          done
          cat sp-release-startup.log
          exit 1
      - name: Migration and rollback rehearsal
        run: node scripts/verify-sp-migration-rehearsal.mjs
      - name: SP lifecycle and reconciliation tests
        run: node node_modules/vitest/vitest.mjs run tests/sp-lifecycle-phases-3-4.test.ts tests/sp-finalization-phases-5-6.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Backend regression tests
        run: npm run test:backend
      - name: API smoke sweep
        run: npm run test:smoke-sweep
      - name: Frontend interaction tests
        run: npm run test:frontend
      - name: Company isolation and permissions contracts
        run: node node_modules/vitest/vitest.mjs run tests/company-isolation*.test.ts tests/*permission*.test.ts --maxWorkers=1 --no-file-parallelism
      - name: I18n English Arabic French audit
        run: node scripts/audit-i18n-phase14.mjs
      - name: Production readiness and bandwidth contracts
        run: |
          npm run verify:final-production-readiness
          npm run verify:bandwidth
      - name: Dependency audit
        run: npm run verify:dependency-audit

  node22-postgres:
    name: Node 22 PostgreSQL serial regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: sp-node22-release-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
      - name: Normalize package registry URLs
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          sed -i 's#https://registry.replit.com/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: npm run verify:lockfile
      - run: npm run verify:production-dependencies
      - run: node node_modules/drizzle-kit/bin.cjs push --force
      - run: node scripts/verify-ci-disposable-schema.mjs
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism
      - run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts --maxWorkers=1 --no-file-parallelism
      - run: npm run verify:server-bundle

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.90.4
        with:
          extra_args: --results=verified,unknown
