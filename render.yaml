services:
  - type: web
    name: erp-pos-system
    runtime: node
    plan: starter
    buildCommand: npm install --production=false && npm run build && npm run db:push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erp-database
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /api/health/db
    autoDeploy: true

databases:
  - name: erp-database
    databaseName: erp_db
    user: erp_user
    plan: basic-256mb
