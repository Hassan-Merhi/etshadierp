version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true
  wait_for_postgres:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1
  prepare_schema:
    steps:
      - run:
          name: Verify migration registry
          command: node scripts/verify-migration-registry.mjs --json
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - run:
          name: Verify disposable database schema
          command: node scripts/verify-ci-disposable-schema.mjs

jobs:
  one-test:
    parameters:
      test_name:
        type: string
    executor: node22-postgres
    steps:
      - install_dependencies
      - wait_for_postgres
      - prepare_schema
      - run:
          name: Workbook assertion diagnostic
          command: >-
            node node_modules/vitest/vitest.mjs run
            tests/factory-arabic-translation-workbook-diagnostic.test.ts
            -t "<< parameters.test_name >>"
            --maxWorkers=1 --no-file-parallelism

workflows:
  workbook-export-diagnostics:
    jobs:
      - one-test: { name: wb-diag-headers, test_name: diagnostic headers }
      - one-test: { name: wb-diag-format, test_name: diagnostic article code text format }
      - one-test: { name: wb-diag-value, test_name: diagnostic article code value }
      - one-test: { name: wb-diag-lock, test_name: diagnostic reference cell lock }
      - one-test: { name: wb-diag-unlock, test_name: diagnostic Arabic cell unlock }
