version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true
  wait_for_postgres:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1
  prepare_schema:
    steps:
      - run:
          name: Verify migration registry
          command: node scripts/verify-migration-registry.mjs --json
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - run:
          name: Verify disposable database schema
          command: node scripts/verify-ci-disposable-schema.mjs

jobs:
  one-test:
    parameters:
      target:
        type: string
      test_name:
        type: string
    executor: node22-postgres
    steps:
      - install_dependencies
      - wait_for_postgres
      - prepare_schema
      - run:
          name: One Phase 4 regression
          command: >-
            node node_modules/vitest/vitest.mjs run
            << parameters.target >>
            -t "<< parameters.test_name >>"
            --maxWorkers=1 --no-file-parallelism

workflows:
  phase4-test-case-diagnostics:
    jobs:
      - one-test: { name: wb-export, target: tests/factory-arabic-translation-workbook.test.ts, test_name: exports the exact template columns }
      - one-test: { name: wb-roundtrip, target: tests/factory-arabic-translation-workbook.test.ts, test_name: round-trips article codes }
      - one-test: { name: wb-headers, target: tests/factory-arabic-translation-workbook.test.ts, test_name: rejects workbooks whose columns }
      - one-test: { name: wb-exact, target: tests/factory-arabic-translation-workbook.test.ts, test_name: matches by normalized exact article code only }
      - one-test: { name: wb-duplicates, target: tests/factory-arabic-translation-workbook.test.ts, test_name: blocks duplicate article codes }
      - one-test: { name: wb-ambiguous, target: tests/factory-arabic-translation-workbook.test.ts, test_name: blocks ambiguous normalized article codes }
      - one-test: { name: wb-category, target: tests/factory-arabic-translation-workbook.test.ts, test_name: blocks conflicting translations }
      - one-test: { name: wb-idempotent, target: tests/factory-arabic-translation-workbook.test.ts, test_name: is idempotent when translations already match }
      - one-test: { name: wb-fill, target: tests/factory-arabic-translation-workbook.test.ts, test_name: does not replace existing Arabic values }
      - one-test: { name: wb-unknown, target: tests/factory-arabic-translation-workbook.test.ts, test_name: reports unknown article codes }
      - one-test: { name: wb-empty, target: tests/factory-arabic-translation-workbook.test.ts, test_name: rejects empty translation rows }
      - one-test: { name: wb-token, target: tests/factory-arabic-translation-workbook.test.ts, test_name: changes the preview token }
      - one-test: { name: wb-error-file, target: tests/factory-arabic-translation-workbook.test.ts, test_name: creates an error workbook }
      - one-test: { name: rt-auth, target: tests/factory-arabic-translation-routes.test.ts, test_name: keeps authentication in front }
      - one-test: { name: rt-export, target: tests/factory-arabic-translation-routes.test.ts, test_name: exports a protected company-scoped }
      - one-test: { name: rt-token, target: tests/factory-arabic-translation-routes.test.ts, test_name: requires a preview token }
      - one-test: { name: rt-apply, target: tests/factory-arabic-translation-routes.test.ts, test_name: applies only Arabic fields }
      - one-test: { name: rt-stale, target: tests/factory-arabic-translation-routes.test.ts, test_name: rejects a stale preview }
      - one-test: { name: rt-duplicates, target: tests/factory-arabic-translation-routes.test.ts, test_name: blocks duplicate workbook article codes }
      - one-test: { name: rt-rollback, target: tests/factory-arabic-translation-routes.test.ts, test_name: rolls product and category updates back }
      - one-test: { name: rt-filetype, target: tests/factory-arabic-translation-routes.test.ts, test_name: rejects non-xlsx uploads }
