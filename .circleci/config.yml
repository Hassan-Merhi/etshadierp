version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  prepare_test_schema:
    steps:
      - run:
          name: Prepare PostgreSQL schema
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                node node_modules/drizzle-kit/bin.cjs push --force
                exit 0
              fi
              sleep 1
            done
            exit 1

jobs:
  test-initial-sp-offload:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run:
          name: Initial Supplier Partner offload
          command: >-
            node node_modules/vitest/vitest.mjs run tests/factory-container-lifecycle.test.ts
            -t 'offloads once, posts balanced vouchers and applies inventory'
            --maxWorkers=1 --no-file-parallelism

  test-stable-main-flow:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run:
          name: Stable receipt-rate main workflow
          command: >-
            node node_modules/vitest/vitest.mjs run tests/factory-mix-batch-stable-cost.test.ts
            -t 'stays fixed through batch operations and only moves on a new offload'
            --maxWorkers=1 --no-file-parallelism

  test-stable-adjustment-flow:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run:
          name: Stable adjustment workflow
          command: >-
            node node_modules/vitest/vitest.mjs run tests/factory-mix-batch-stable-cost.test.ts
            -t 'keeps ADD/REMOVE quantity-only while using them in the next receipt base'
            --maxWorkers=1 --no-file-parallelism

workflows:
  primary-factory-path-diagnostics:
    jobs:
      - test-initial-sp-offload
      - test-stable-main-flow
      - test-stable-adjustment-flow
