version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

jobs:
  range-ts:
    parameters:
      target:
        type: string
      start:
        type: integer
      end:
        type: integer
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: TypeScript line range
          command: node scripts/phase4-typecheck-range.mjs << parameters.target >> << parameters.start >> << parameters.end >>

workflows:
  phase4-range-diagnostics:
    jobs:
      - range-ts: { name: wb-1-100, target: server/services/factoryArabicTranslationWorkbook.ts, start: 1, end: 100 }
      - range-ts: { name: wb-101-200, target: server/services/factoryArabicTranslationWorkbook.ts, start: 101, end: 200 }
      - range-ts: { name: wb-201-300, target: server/services/factoryArabicTranslationWorkbook.ts, start: 201, end: 300 }
      - range-ts: { name: wb-301-500, target: server/services/factoryArabicTranslationWorkbook.ts, start: 301, end: 500 }
      - range-ts: { name: ar-1-150, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 1, end: 150 }
      - range-ts: { name: ar-151-300, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 151, end: 300 }
      - range-ts: { name: ar-301-450, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 301, end: 450 }
      - range-ts: { name: ar-451-650, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 451, end: 650 }
      - range-ts: { name: cat-1-150, target: server/routes/factory/factoryBilingualCatalogRoutes.ts, start: 1, end: 150 }
      - range-ts: { name: cat-151-350, target: server/routes/factory/factoryBilingualCatalogRoutes.ts, start: 151, end: 350 }
