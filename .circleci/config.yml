version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

jobs:
  phase4-format-parser:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Parser formatting
          command: node node_modules/prettier/bin/prettier.cjs --check tests/setupXlsxBinaryParser.ts

  phase4-format-config:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Vitest config formatting
          command: node node_modules/prettier/bin/prettier.cjs --check vitest.config.ts

  phase4-lint:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Lint
          command: npm run lint

  phase4-typescript:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: TypeScript
          command: npm run check

  phase4-build:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Production build and contracts
          command: |
            npm run verify:lockfile
            npm run verify:production-dependencies
            npm run build
            npm run verify:server-bundle
            npm run verify:program1-observability
            npm run verify:final-production-readiness
            npm run verify:bandwidth

workflows:
  phase4-static-diagnostics:
    jobs:
      - phase4-format-parser
      - phase4-format-config
      - phase4-lint
      - phase4-typescript
      - phase4-build
