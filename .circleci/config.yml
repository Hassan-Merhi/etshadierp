version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"
  node22-postgres:
    docker:
      - image: cimg/node:22.14.0
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.19
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install:
    steps:
      - checkout
      - run:
          name: Pin checkout and install
          command: |
            git fetch --no-tags --prune origin "+refs/heads/${CIRCLE_BRANCH}:refs/remotes/origin/${CIRCLE_BRANCH}"
            git reset --hard "${CIRCLE_SHA1}"
            git clean -ffdx
            sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            npm ci --no-audit --bin-links=true
  prepare_db:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
  split:
    steps:
      - run:
          name: Apply Wave 1 split
          command: node scripts/god-files-wave1-split.mjs

jobs:
  transform-audit:
    executor: node22
    steps:
      - install
      - split
      - run:
          name: Audit + typecheck
          command: |
            npm run audit:god-files
            npm run audit:doc-index
            npm run check
  pg-schema-only:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - run:
          name: Confirm schema setup
          command: node scripts/verify-ci-disposable-schema.mjs
  pg-unsplit-xlsx:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - run:
          name: Current-main XLSX file without split
          command: node node_modules/vitest/vitest.mjs run tests/xlsx-export.test.ts --maxWorkers=1 --no-file-parallelism
  pg-split-xlsx:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run:
          name: XLSX after split
          command: |
            node node_modules/vitest/vitest.mjs run tests/xlsx-export.test.ts tests/xlsx-export-sp-sales-form.test.ts --maxWorkers=1 --no-file-parallelism

workflows:
  wave1-harness-diagnosis:
    jobs:
      - transform-audit
      - pg-schema-only
      - pg-unsplit-xlsx
      - pg-split-xlsx
