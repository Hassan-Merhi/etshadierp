version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  prepare_test_schema:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                echo "PostgreSQL is accepting connections."
                break
              fi
              sleep 1
            done
            node node_modules/drizzle-kit/bin.cjs push --force

jobs:
  test-factory-container-lifecycle:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run:
          name: Factory container lifecycle
          command: node node_modules/vitest/vitest.mjs run tests/factory-container-lifecycle.test.ts --maxWorkers=1 --no-file-parallelism

  test-factory-landed-cost:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run:
          name: Factory landed-cost reconciliation
          command: node node_modules/vitest/vitest.mjs run tests/factory-landed-cost-reconciliation.test.ts --maxWorkers=1 --no-file-parallelism

  test-factory-stable-cost:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run:
          name: Factory stable-cost rules
          command: node node_modules/vitest/vitest.mjs run tests/factory-mix-batch-stable-cost.test.ts --maxWorkers=1 --no-file-parallelism

  test-factory-historical-replay:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run:
          name: Factory historical replay
          command: node node_modules/vitest/vitest.mjs run tests/factory-raw-material-moving-avg.test.ts --maxWorkers=1 --no-file-parallelism

workflows:
  factory-regression-file-diagnostics:
    jobs:
      - test-factory-container-lifecycle
      - test-factory-landed-cost
      - test-factory-stable-cost
      - test-factory-historical-replay
