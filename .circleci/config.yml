version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Pin checkout to triggering commit
          command: |
            git fetch --no-tags --prune origin "${CIRCLE_SHA1}"
            git reset --hard "${CIRCLE_SHA1}"
            git clean -ffdx
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

jobs:
  format-ts:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Check changed TypeScript and CSS
          command: |
            git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            mapfile -d '' changed_files < <(
              git diff --name-only --diff-filter=ACMR -z origin/main HEAD -- client/src server shared tests scripts |
                grep -zE '\.(ts|tsx|css)$' || true
            )
            if [ "${#changed_files[@]}" -eq 0 ]; then exit 0; fi
            node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"

  format-mjs-a:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Check security and bilingual bridges
          command: node node_modules/prettier/bin/prettier.cjs --check server/criticalSecuritySchemaBridge.mjs server/factoryBilingualSchemaBridge.mjs

  format-mjs-b:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Check container and trilingual bridges
          command: node node_modules/prettier/bin/prettier.cjs --check server/factoryContainerSchemaBridge.mjs server/factoryTrilingualSchemaBridge.mjs

  format-mjs-c:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Check TLS helper and runtime guard
          command: node node_modules/prettier/bin/prettier.cjs --check server/lib/databaseSsl.mjs server/runtimeHealthGuard.mjs

  format-mjs-d:
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Check startup and supplier bridges
          command: node node_modules/prettier/bin/prettier.cjs --check server/startupWarningRepair.mjs server/supplierCompanyScopeBridge.mjs

workflows:
  isolate-formatting-failure:
    jobs:
      - format-ts
      - format-mjs-a
      - format-mjs-b
      - format-mjs-c
      - format-mjs-d
