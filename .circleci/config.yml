version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Pin checkout to triggering commit
          command: |
            git fetch --no-tags --prune origin "${CIRCLE_SHA1}"
            git reset --hard "${CIRCLE_SHA1}"
            git clean -ffdx
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  wait_for_postgres:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1

  format_files:
    parameters:
      files:
        type: string
    steps:
      - install_dependencies
      - run:
          name: Check formatting group
          command: node node_modules/prettier/bin/prettier.cjs --check << parameters.files >>

jobs:
  format-group-1:
    executor: node22
    steps:
      - format_files:
          files: server/lib/databaseSsl.test.ts server/lib/inventoryMath.test.ts server/lib/inventoryMath.ts server/lib/reportPrecision.test.ts server/routes/admin/repair/rebuild-inventory.ts server/routes/containers/offload/create.ts server/routes/containers/offload/update.ts server/routes/creditNoteRoutes.ts

  format-group-2:
    executor: node22
    steps:
      - format_files:
          files: server/routes/factory/bale-exports/daily-report.ts server/routes/posImportRoutes.ts server/routes/stats/netProfitRentalSection.ts server/routes/stats/netProfitStockSection.ts server/routes/stats/statsDataRoutes.ts server/routes/stats/statsReportsRoutes.ts server/routes/stats/statsSalesRoutes.ts server/routes/stock/merge/bulk-merge.ts

  format-group-3:
    executor: node22
    steps:
      - format_files:
          files: server/routes/stock/merge/merge.ts server/services/pos/createSaleService.ts server/services/pos/deductSaleInventory.ts server/services/pos/edit/rebuildSaleItems.ts server/services/pos/edit/reverseOriginalSaleInventory.ts server/services/syncSalesItemCosts.ts server/storage/containers-store/offload.ts server/storage/stock-ops/transfers-create.ts

  format-group-4:
    executor: node22
    steps:
      - format_files:
          files: server/storage/stock-ops/transfers-update.ts tests/god-file-boundaries.test.ts tests/phase14-i18n-release-gate.test.ts tests/ui/pos-negative-stock-permission.test.ts server/db.ts server/index.ts

  postgres-backend-tests:
    executor: node22-postgres
    steps:
      - install_dependencies
      - wait_for_postgres
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - run:
          name: Backend tests
          command: node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism

workflows:
  diagnose-remaining-failures:
    jobs:
      - format-group-1
      - format-group-2
      - format-group-3
      - format-group-4
      - postgres-backend-tests
