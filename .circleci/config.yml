version: 2.1

jobs:
  format-and-push:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            npm ci --no-audit --bin-links=true
      - run:
          name: Format Phase 1 and restore normal CI
          command: |
            set -euo pipefail
            node node_modules/prettier/bin/prettier.cjs --write \
              client/src/lib/accountStatementPaginationClient.ts \
              client/src/lib/containerPaginationClient.ts \
              client/src/main.tsx \
              server/routes/accountTransactionPaginationRoutes.ts \
              server/routes/containers/containerListPaginationRoutes.ts \
              server/routes/daybookPaginationRoutes.ts \
              server/routes/ledgerAccountPaginationRoutes.ts \
              server/routes/ledgerRoutes.ts \
              server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts \
              server/routes/vouchers/voucherPaginationRoutes.ts
            git fetch origin main --depth=1
            git checkout origin/main -- .circleci/config.yml
      - run:
          name: Commit and push formatted files
          command: |
            set -euo pipefail
            git config user.name "circleci-phase1-bot"
            git config user.email "circleci-phase1-bot@users.noreply.github.com"
            git add .circleci/config.yml client/src/lib/accountStatementPaginationClient.ts client/src/lib/containerPaginationClient.ts client/src/main.tsx server/routes/accountTransactionPaginationRoutes.ts server/routes/containers/containerListPaginationRoutes.ts server/routes/daybookPaginationRoutes.ts server/routes/ledgerAccountPaginationRoutes.ts server/routes/ledgerRoutes.ts server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts server/routes/vouchers/voucherPaginationRoutes.ts
            git commit -m "chore: format Phase 1 pagination"
            git push origin HEAD:agent/phase1-sql-pagination

workflows:
  format-and-push:
    jobs:
      - format-and-push
