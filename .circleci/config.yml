version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Pin checkout to triggering commit
          command: |
            git fetch --no-tags --prune origin "${CIRCLE_SHA1}"
            git reset --hard "${CIRCLE_SHA1}"
            git clean -ffdx
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  wait_for_postgres:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1

  run_backend_shard:
    parameters:
      shard:
        type: integer
      total:
        type: integer
        default: 8
    steps:
      - install_dependencies
      - wait_for_postgres
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - run:
          name: Run backend test shard << parameters.shard >>
          command: |
            mapfile -t all_tests < <(
              find server tests shared -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) | sort
            )
            selected=()
            for index in "${!all_tests[@]}"; do
              if (( index % << parameters.total >> == << parameters.shard >> )); then
                selected+=("${all_tests[$index]}")
              fi
            done
            printf 'Running %s test file(s) in shard << parameters.shard >>:\n' "${#selected[@]}"
            printf ' - %s\n' "${selected[@]}"
            test "${#selected[@]}" -gt 0
            node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism "${selected[@]}"

jobs:
  backend-shard-0:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 0
  backend-shard-1:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 1
  backend-shard-2:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 2
  backend-shard-3:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 3
  backend-shard-4:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 4
  backend-shard-5:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 5
  backend-shard-6:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 6
  backend-shard-7:
    executor: node22-postgres
    steps:
      - run_backend_shard:
          shard: 7

workflows:
  isolate-backend-failure:
    jobs:
      - backend-shard-0
      - backend-shard-1
      - backend-shard-2
      - backend-shard-3
      - backend-shard-4
      - backend-shard-5
      - backend-shard-6
      - backend-shard-7
