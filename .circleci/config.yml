version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

  node22-postgres:
    docker:
      - image: cimg/node:22.14.0
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.19
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install:
    steps:
      - checkout
      - run:
          name: Pin checkout
          command: |
            git fetch --no-tags --prune origin "+refs/heads/${CIRCLE_BRANCH}:refs/remotes/origin/${CIRCLE_BRANCH}"
            git reset --hard "${CIRCLE_SHA1}"
            git clean -ffdx
            sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            npm ci --no-audit --bin-links=true
  wait_for_postgres:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1
  split:
    steps:
      - run:
          name: Apply Wave 1 split
          command: node scripts/god-files-wave1-split.mjs

jobs:
  wave1-transform-audit:
    executor: node22
    steps:
      - install
      - split
      - run:
          name: God-file audit
          command: npm run audit:god-files
      - run:
          name: Documentation audit
          command: npm run audit:doc-index

  wave1-typecheck:
    executor: node22
    steps:
      - install
      - split
      - run:
          name: TypeScript
          command: npm run check

  wave1-targeted-tests:
    executor: node22-postgres
    steps:
      - install
      - wait_for_postgres
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - split
      - run:
          name: Wave 1 suites
          command: |
            node node_modules/vitest/vitest.mjs run \
              tests/xlsx-export.test.ts \
              tests/xlsx-export-sp-sales-form.test.ts \
              tests/workflow.test.ts \
              tests/workflow-daybook-isolation.test.ts \
              tests/inventory.test.ts \
              tests/inventory-reconciliation.test.ts \
              tests/excel-export-v2.test.ts \
              tests/excel-export-v2-totals-cash.test.ts \
              tests/excel-export-v2-historical-cash.test.ts \
              --maxWorkers=1 \
              --no-file-parallelism

  wave1-publisher:
    executor: node22-postgres
    steps:
      - install
      - wait_for_postgres
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - split
      - run:
          name: Reconfirm audits and TypeScript
          command: |
            npm run audit:god-files
            npm run audit:doc-index
            npm run check
      - run:
          name: Reconfirm Wave 1 suites
          command: |
            node node_modules/vitest/vitest.mjs run \
              tests/xlsx-export.test.ts \
              tests/xlsx-export-sp-sales-form.test.ts \
              tests/workflow.test.ts \
              tests/workflow-daybook-isolation.test.ts \
              tests/inventory.test.ts \
              tests/inventory-reconciliation.test.ts \
              tests/excel-export-v2.test.ts \
              tests/excel-export-v2-totals-cash.test.ts \
              tests/excel-export-v2-historical-cash.test.ts \
              --maxWorkers=1 \
              --no-file-parallelism
      - run:
          name: Publish certified split
          command: |
            git fetch --no-tags origin "+refs/heads/${CIRCLE_BRANCH}:refs/remotes/origin/${CIRCLE_BRANCH}"
            remote_head="$(git rev-parse refs/remotes/origin/${CIRCLE_BRANCH})"
            if [ "${remote_head}" != "${CIRCLE_SHA1}" ]; then
              echo "Branch advanced to ${remote_head}; newer run owns publication."
              exit 0
            fi
            git show a1b3e57f63af1c4847e8851027868dc067bf68e8:.circleci/config.yml > .circleci/config.yml
            rm -f .github/workflows/god-files-wave1-test-split.yml scripts/god-files-wave1-split.mjs
            git config user.name "CircleCI Wave 1"
            git config user.email "circleci-wave1@users.noreply.github.com"
            git add -- \
              .circleci/config.yml \
              .github/workflows/god-files-wave1-test-split.yml \
              scripts/god-files-wave1-split.mjs \
              tests/xlsx-export.test.ts \
              tests/xlsx-export-sp-sales-form.test.ts \
              tests/workflow.test.ts \
              tests/workflow-daybook-isolation.test.ts \
              tests/inventory.test.ts \
              tests/inventory-reconciliation.test.ts \
              tests/excel-export-v2.test.ts \
              tests/excel-export-v2-totals-cash.test.ts \
              tests/excel-export-v2-historical-cash.test.ts \
              config/god-file-boundaries.json \
              tests/god-file-boundaries.test.ts \
              docs/god-file-split-program.md \
              docs/system-quality-program.md
            git diff --cached --check
            git commit -m "refactor(god-files): split oversized Wave 1 test suites"
            git push origin HEAD:${CIRCLE_BRANCH}

workflows:
  wave1-certification:
    jobs:
      - wave1-transform-audit
      - wave1-typecheck
      - wave1-targeted-tests
      - wave1-publisher:
          requires:
            - wave1-transform-audit
            - wave1-typecheck
            - wave1-targeted-tests
