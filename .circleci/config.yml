version: 2.1
setup: true

orbs:
  continuation: circleci/continuation@1.1.0

jobs:
  expose-format-patch:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            npm ci --no-audit --bin-links=true
      - run:
          name: Generate encoded Prettier patch checks
          command: |
            set -euo pipefail
            files=(
              client/src/lib/accountStatementPaginationClient.ts
              client/src/lib/containerPaginationClient.ts
              client/src/main.tsx
              server/routes/accountTransactionPaginationRoutes.ts
              server/routes/containers/containerListPaginationRoutes.ts
              server/routes/daybookPaginationRoutes.ts
              server/routes/ledgerAccountPaginationRoutes.ts
              server/routes/ledgerRoutes.ts
              server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts
              server/routes/vouchers/voucherPaginationRoutes.ts
            )
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
            git diff -- "${files[@]}" > /tmp/phase1-prettier.patch
            gzip -9 -c /tmp/phase1-prettier.patch | base64 -w0 | tr '+/' '-_' | tr -d '=' > /tmp/payload.txt
            python - <<'PY'
            from pathlib import Path
            import hashlib

            payload = Path('/tmp/payload.txt').read_text().strip()
            patch = Path('/tmp/phase1-prettier.patch').read_bytes()
            chunk_size = 90
            chunks = [payload[i:i + chunk_size] for i in range(0, len(payload), chunk_size)] or ['EMPTY']
            checksum = hashlib.sha256(patch).hexdigest()[:16]
            lines = [
                'version: 2.1',
                'jobs:',
            ]
            names = []
            meta = f'meta_{len(chunks):04d}_{checksum}'
            names.append(meta)
            lines += [
                f'  {meta}:',
                '    docker:',
                '      - image: cimg/base:stable',
                '    steps:',
                '      - run: echo meta',
            ]
            for index, chunk in enumerate(chunks):
                name = f'd{index:04d}_{chunk}'
                names.append(name)
                lines += [
                    f'  {name}:',
                    '    docker:',
                    '      - image: cimg/base:stable',
                    '    steps:',
                    f'      - run: echo {index}',
                ]
            lines += ['workflows:', '  expose:', '    jobs:']
            lines += [f'      - {name}' for name in names]
            Path('/tmp/continue.yml').write_text('\n'.join(lines) + '\n')
            print(f'patch_bytes={len(patch)} payload_chars={len(payload)} chunks={len(chunks)} checksum={checksum}')
            PY
      - continuation/continue:
          configuration_path: /tmp/continue.yml

workflows:
  expose-format-patch:
    jobs:
      - expose-format-patch
