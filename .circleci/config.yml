version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

  node22-postgres:
    docker:
      - image: cimg/node:22.14.0
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.19
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install:
    steps:
      - checkout
      - run:
          name: Pin checkout
          command: |
            git fetch --no-tags --prune origin "+refs/heads/${CIRCLE_BRANCH}:refs/remotes/origin/${CIRCLE_BRANCH}"
            git reset --hard "${CIRCLE_SHA1}"
            git clean -ffdx
            sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            npm ci --no-audit --bin-links=true
  prepare_db:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
  split:
    steps:
      - run:
          name: Apply Wave 1 split
          command: node scripts/god-files-wave1-split.mjs

jobs:
  wave1-transform-audit:
    executor: node22
    steps:
      - install
      - split
      - run:
          name: Audits
          command: |
            npm run audit:god-files
            npm run audit:doc-index
  wave1-typecheck:
    executor: node22
    steps:
      - install
      - split
      - run:
          name: TypeScript
          command: npm run check

  test-xlsx-core:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: xlsx-export.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/xlsx-export.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-xlsx-sp:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: xlsx-export-sp-sales-form.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/xlsx-export-sp-sales-form.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-workflow-core:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: workflow.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/workflow.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-workflow-daybook:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: workflow-daybook-isolation.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/workflow-daybook-isolation.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-inventory-core:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: inventory.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/inventory.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-inventory-reconcile:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: inventory-reconciliation.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/inventory-reconciliation.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-excel-v2-core:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: excel-export-v2.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/excel-export-v2.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-excel-v2-totals:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: excel-export-v2-totals-cash.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/excel-export-v2-totals-cash.test.ts --maxWorkers=1 --no-file-parallelism" }
  test-excel-v2-historical:
    executor: node22-postgres
    steps:
      - install
      - prepare_db
      - split
      - run: { name: excel-export-v2-historical-cash.test.ts, command: "node node_modules/vitest/vitest.mjs run tests/excel-export-v2-historical-cash.test.ts --maxWorkers=1 --no-file-parallelism" }

workflows:
  wave1-diagnosis:
    jobs:
      - wave1-transform-audit
      - wave1-typecheck
      - test-xlsx-core
      - test-xlsx-sp
      - test-workflow-core
      - test-workflow-daybook
      - test-inventory-core
      - test-inventory-reconcile
      - test-excel-v2-core
      - test-excel-v2-totals
      - test-excel-v2-historical
