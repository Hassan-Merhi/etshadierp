version: 2.1

jobs:
  dns-control:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    steps:
      - run: echo control-ok

  dns-resolve:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    steps:
      - run:
          name: Verify Pastepile DNS resolution
          command: |
            set -euo pipefail
            ip=$(getent ahostsv4 pastepile.com | awk '{print $1}' | sort -u | head -n1)
            test -n "$ip"

workflows:
  resolve-pastepile:
    jobs:
      - dns-control
      - dns-resolve
