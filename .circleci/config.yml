version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

jobs:
  phase1-format-artifact:
    executor: node22
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true
      - run:
          name: Format Phase 1 files
          command: |
            node node_modules/prettier/bin/prettier.cjs --write \
              build/vitePhase1PaginationPlugin.ts \
              client/src/lib/accountStatementPaginationClient.ts \
              client/src/lib/containerPaginationClient.ts \
              client/src/lib/daybookPaginationClient.ts \
              client/src/lib/erpDaybookPaginationClient.ts \
              client/src/lib/supplierPurchaseOrderPaginationClient.ts \
              scripts/verify-phase1-sql-pagination.mjs \
              server/routes/accountTransactionPaginationRoutes.ts \
              server/routes/containerRoutes.ts \
              server/routes/containers/containerListPaginationRoutes.ts \
              server/routes/daybookPaginationRoutes.ts \
              server/routes/ledgerAccountPaginationRoutes.ts \
              server/routes/ledgerRoutes.ts \
              server/routes/voucherRoutes.ts \
              server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts \
              server/routes/vouchers/voucherPaginationRoutes.ts \
              vite.config.ts
      - run:
          name: Package formatted files
          command: |
            mkdir -p artifacts
            tar -czf artifacts/phase1-formatted.tar.gz \
              build/vitePhase1PaginationPlugin.ts \
              client/src/lib/accountStatementPaginationClient.ts \
              client/src/lib/containerPaginationClient.ts \
              client/src/lib/daybookPaginationClient.ts \
              client/src/lib/erpDaybookPaginationClient.ts \
              client/src/lib/supplierPurchaseOrderPaginationClient.ts \
              scripts/verify-phase1-sql-pagination.mjs \
              server/routes/accountTransactionPaginationRoutes.ts \
              server/routes/containerRoutes.ts \
              server/routes/containers/containerListPaginationRoutes.ts \
              server/routes/daybookPaginationRoutes.ts \
              server/routes/ledgerAccountPaginationRoutes.ts \
              server/routes/ledgerRoutes.ts \
              server/routes/voucherRoutes.ts \
              server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts \
              server/routes/vouchers/voucherPaginationRoutes.ts \
              vite.config.ts
      - store_artifacts:
          path: artifacts/phase1-formatted.tar.gz
          destination: phase1-formatted.tar.gz

workflows:
  phase1-format-only:
    jobs:
      - phase1-format-artifact
