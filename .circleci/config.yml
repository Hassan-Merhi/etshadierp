version: 2.1

jobs:
  dns-bit:
    parameters:
      bit:
        type: integer
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Encode resolved IPv4 bit << parameters.bit >>
          command: |
            set -euo pipefail
            ip=$(getent ahostsv4 pastepile.com | awk '{print $1}' | sort -u | head -n1)
            test -n "$ip"
            IFS=. read -r a b c d <<< "$ip"
            value=$(( a * 16777216 + b * 65536 + c * 256 + d ))
            bit=<< parameters.bit >>
            divisor=$(( 2 ** bit ))
            if (( (value / divisor) % 2 )); then
              echo "bit $bit = 1"
              exit 0
            fi
            echo "bit $bit = 0"
            exit 1

