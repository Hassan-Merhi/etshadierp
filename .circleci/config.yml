version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

jobs:
  scoped-ts:
    parameters:
      target:
        type: string
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Scoped TypeScript
          command: node scripts/phase4-typecheck-scope.mjs << parameters.target >>

  single-format:
    parameters:
      target:
        type: string
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: Single file formatting
          command: node node_modules/prettier/bin/prettier.cjs --check << parameters.target >>

workflows:
  phase4-scope-diagnostics:
    jobs:
      - scoped-ts:
          name: ts-client
          target: client/src
      - scoped-ts:
          name: ts-routes
          target: server/routes/factory
      - scoped-ts:
          name: ts-workbook
          target: server/services/factoryArabicTranslationWorkbook.ts
      - scoped-ts:
          name: ts-policy
          target: server/services/security/operationalPermissionRoutePolicy.ts
      - single-format:
          name: fmt-catalog
          target: server/routes/factory/factoryBilingualCatalogRoutes.ts
      - single-format:
          name: fmt-policy
          target: server/services/security/operationalPermissionRoutePolicy.ts
      - single-format:
          name: fmt-ui-test
          target: tests/ui/factory-arabic-translation-actions.test.tsx
