version: 2.1

executors:
  dns:
    docker:
      - image: cimg/node:22.14
    resource_class: medium

jobs:
  dns-control:
    executor: dns
    steps:
      - run: echo control-ok

  dns-resolve:
    executor: dns
    steps:
      - run:
          name: Verify Pastepile DNS resolution
          command: |
            set -euo pipefail
            ip=$(getent ahostsv4 pastepile.com | awk '{print $1}' | sort -u | head -n1)
            test -n "$ip"

  dnsbit-00:
    executor: dns
    environment:
      BIT: "0"
    steps: &dnssteps
      - run:
          name: Resolve encoded IPv4 bit
          command: |
            set -euo pipefail
            ip=$(getent ahostsv4 pastepile.com | awk '{print $1}' | sort -u | head -n1)
            test -n "$ip"
            IFS=. read -r a b c d < <(printf '%s\n' "$ip")
            value=$(( a * 16777216 + b * 65536 + c * 256 + d ))
            divisor=$(( 2 ** BIT ))
            if (( (value / divisor) % 2 )); then exit 0; fi
            exit 1
  dnsbit-01:
    executor: dns
    environment:
      BIT: "1"
    steps: *dnssteps
  dnsbit-02:
    executor: dns
    environment:
      BIT: "2"
    steps: *dnssteps
  dnsbit-03:
    executor: dns
    environment:
      BIT: "3"
    steps: *dnssteps
  dnsbit-04:
    executor: dns
    environment:
      BIT: "4"
    steps: *dnssteps
  dnsbit-05:
    executor: dns
    environment:
      BIT: "5"
