version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

jobs:
  range-ts:
    parameters:
      target:
        type: string
      start:
        type: integer
      end:
        type: integer
    executor: node22
    steps:
      - install_dependencies
      - run:
          name: TypeScript line range
          command: node scripts/phase4-typecheck-range.mjs << parameters.target >> << parameters.start >> << parameters.end >>

workflows:
  phase4-exact-range-diagnostics:
    jobs:
      - range-ts: { name: ar-1-10, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 1, end: 10 }
      - range-ts: { name: ar-11-20, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 11, end: 20 }
      - range-ts: { name: ar-21-30, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 21, end: 30 }
      - range-ts: { name: ar-31-40, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 31, end: 40 }
      - range-ts: { name: ar-41-50, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 41, end: 50 }
      - range-ts: { name: ar-201-210, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 201, end: 210 }
      - range-ts: { name: ar-211-220, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 211, end: 220 }
      - range-ts: { name: ar-221-230, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 221, end: 230 }
      - range-ts: { name: ar-231-240, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 231, end: 240 }
      - range-ts: { name: ar-241-250, target: server/routes/factory/factoryArabicTranslationRoutes.ts, start: 241, end: 250 }
      - range-ts: { name: wb-101-110, target: server/services/factoryArabicTranslationWorkbook.ts, start: 101, end: 110 }
      - range-ts: { name: wb-111-120, target: server/services/factoryArabicTranslationWorkbook.ts, start: 111, end: 120 }
