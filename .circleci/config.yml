version: 2.1

jobs:
  dnsbit-00:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - run:
          name: Resolve bit 0
          command: |
            set -euo pipefail
            ip=$(getent ahostsv4 pastepile.com | awk '{print $1}' | sort -u | head -n1)
            test -n "$ip"
            IFS=. read -r a b c d <<< "$ip"
            value=$(( a * 16777216 + b * 65536 + c * 256 + d ))
            if (( value % 2 )); then exit 0; fi
            exit 1

  dnsbit-01:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - run:
          name: Resolve bit 1
          command: |
            set -euo pipefail
            ip=$(getent ahostsv4 pastepile.com | awk '{print $1}' | sort -u | head -n1)
            test -n "$ip"
            IFS=. read -r a b c d <<< "$ip"
            value=$(( a * 16777216 + b * 65536 + c * 256 + d ))
            if (( (value / 2) % 2 )); then exit 0; fi
            exit 1

workflows:
  resolve-pastepile:
    jobs:
      - dnsbit-00
      - dnsbit-01
