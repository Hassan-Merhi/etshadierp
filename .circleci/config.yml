version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project

jobs:
  phase1-control:
    executor: node22
    steps:
      - run:
          name: Confirm runner startup
          command: echo phase1-runner-ok

  phase1-checkout:
    executor: node22
    steps:
      - checkout
      - run:
          name: Confirm repository checkout
          command: test -f package.json

workflows:
  phase1-diagnostics-only:
    jobs:
      - phase1-control
      - phase1-checkout
