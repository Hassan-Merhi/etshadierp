version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  wait_for_postgres:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
              sleep 1
            done
            exit 1

  prepare_postgres_schema:
    steps:
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - run:
          name: Verify disposable database schema
          command: node scripts/verify-ci-disposable-schema.mjs

  run_backend_pattern:
    parameters:
      pattern:
        type: string
      label:
        type: string
    steps:
      - install_dependencies
      - wait_for_postgres
      - prepare_postgres_schema
      - run:
          name: Backend tests << parameters.label >>
          command: |
            shopt -s nullglob
            files=(tests/<< parameters.pattern >>.test.ts)
            printf 'Matched files:\n'
            printf ' - %s\n' "${files[@]}"
            if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
            node node_modules/vitest/vitest.mjs run "${files[@]}" --maxWorkers=1 --no-file-parallelism

jobs:
  factory-con-a-r:
    executor: node22-postgres
    steps:
      - run_backend_pattern:
          pattern: "factory-con[a-r]*"
          label: Factory CON A-R

  factory-cons:
    executor: node22-postgres
    steps:
      - run_backend_pattern:
          pattern: "factory-cons*"
          label: Factory CONS

  factory-cont:
    executor: node22-postgres
    steps:
      - run_backend_pattern:
          pattern: "factory-cont*"
          label: Factory CONT

  factory-con-u-z:
    executor: node22-postgres
    steps:
      - run_backend_pattern:
          pattern: "factory-con[u-z]*"
          label: Factory CON U-Z

workflows:
  phase3-con-diagnostics:
    jobs:
      - factory-con-a-r
      - factory-cons
      - factory-cont
      - factory-con-u-z
