version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22-postgres:
    docker:
      - image: cimg/node:22.14
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=2048
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  prepare_test_schema:
    steps:
      - run:
          name: Prepare PostgreSQL schema
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                node node_modules/drizzle-kit/bin.cjs push --force
                exit 0
              fi
              sleep 1
            done
            exit 1

  run_test_pattern:
    parameters:
      file:
        type: string
      pattern:
        type: string
    steps:
      - run:
          name: Run focused regression
          command: >-
            node node_modules/vitest/vitest.mjs run << parameters.file >>
            -t '<< parameters.pattern >>'
            --maxWorkers=1 --no-file-parallelism

jobs:
  lifecycle-setup-create:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run_test_pattern:
          file: tests/factory-container-lifecycle.test.ts
          pattern: SP lifecycle setup|SP container creation

  lifecycle-offload:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run_test_pattern:
          file: tests/factory-container-lifecycle.test.ts
          pattern: SP container offload

  stable-receipt-rate:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run_test_pattern:
          file: tests/factory-mix-batch-stable-cost.test.ts
          pattern: Stable receipt-weighted supplier cost rate

  stable-adjustments:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run_test_pattern:
          file: tests/factory-mix-batch-stable-cost.test.ts
          pattern: Adjustments, tamper resistance and explicit corrections

  stable-landed-correction:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run_test_pattern:
          file: tests/factory-mix-batch-stable-cost.test.ts
          pattern: Landed-cost correction

  stable-diagnostics:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run_test_pattern:
          file: tests/factory-mix-batch-stable-cost.test.ts
          pattern: Diagnostic endpoint

  stable-delete-kpi:
    executor: node22-postgres
    steps:
      - install_dependencies
      - prepare_test_schema
      - run_test_pattern:
          file: tests/factory-mix-batch-stable-cost.test.ts
          pattern: Delete/reverse|KPI reconciliation

workflows:
  factory-regression-block-diagnostics:
    jobs:
      - lifecycle-setup-create
      - lifecycle-offload
      - stable-receipt-rate
      - stable-adjustments
      - stable-landed-correction
      - stable-diagnostics
      - stable-delete-kpi
