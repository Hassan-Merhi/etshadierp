version: 2.1
setup: true

orbs:
  node: circleci/node@7.1.0
  continuation: circleci/continuation@1.0.0

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    resource_class: medium+
    working_directory: ~/project

jobs:
  encode-source-format-patch:
    executor: node22
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true
      - run:
          name: Generate encoded formatter patch
          command: |
            node node_modules/prettier/bin/prettier.cjs --write \
              client/src/components/FactoryArabicTranslationActions.tsx \
              client/src/pages/factory/FactoryBalesHub.tsx \
              server/routes/factory/factoryArabicTranslationRoutes.ts \
              server/services/factoryArabicTranslationWorkbook.ts
            git diff --no-ext-diff -- \
              client/src/components/FactoryArabicTranslationActions.tsx \
              client/src/pages/factory/FactoryBalesHub.tsx \
              server/routes/factory/factoryArabicTranslationRoutes.ts \
              server/services/factoryArabicTranslationWorkbook.ts > /tmp/format.patch
            gzip -9c /tmp/format.patch | base64 -w0 | tr '+/' '-_' | tr -d '=' > /tmp/payload
            python - <<'PY'
            from pathlib import Path
            payload = Path('/tmp/payload').read_text().strip()
            chunk_size = 160
            chunks = [payload[i:i + chunk_size] for i in range(0, len(payload), chunk_size)] or ['EMPTY']
            if len(chunks) > 90:
                raise SystemExit(f'Formatter patch needs {len(chunks)} chunks; maximum is 90')
            lines = [
                'version: 2.1',
                'jobs:',
                '  reveal:',
                '    parameters:',
                '      marker:',
                '        type: string',
                '    docker:',
                '      - image: cimg/base:stable',
                '    steps:',
                '      - run: echo "<< parameters.marker >>"',
                'workflows:',
                '  reveal-source-format:',
                '    jobs:',
            ]
            manifest = f'm{len(chunks):03d}_{len(payload):06d}'
            lines.extend(['      - reveal:', f'          name: {manifest}', f'          marker: {manifest}'])
            for index, chunk in enumerate(chunks):
                marker = f's{index:03d}_{chunk}'
                lines.extend(['      - reveal:', f'          name: {marker}', f'          marker: {marker}'])
            Path('/tmp/continue.yml').write_text('\n'.join(lines) + '\n')
            print(f'Encoded {len(chunks)} chunks / {len(payload)} characters')
            PY
      - continuation/continue:
          configuration_path: /tmp/continue.yml

workflows:
  extract-source-format:
    jobs:
      - encode-source-format-patch
