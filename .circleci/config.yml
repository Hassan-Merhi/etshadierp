version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node20:
    docker:
      - image: cimg/node:20.19
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  ts_file_check:
    parameters:
      pattern:
        type: string
    steps:
      - run:
          name: TypeScript file isolation
          command: |
            set +e
            npm run check > /tmp/typescript.txt 2>&1
            if grep -E '<< parameters.pattern >>' /tmp/typescript.txt; then
              exit 1
            fi
            exit 0

jobs:
  fmt-account-statement-client:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check client/src/lib/accountStatementPaginationClient.ts
  fmt-container-client:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check client/src/lib/containerPaginationClient.ts
  fmt-factory-daybook-client:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check client/src/lib/daybookPaginationClient.ts
  fmt-erp-daybook-client:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check client/src/lib/erpDaybookPaginationClient.ts
  fmt-supplier-po-client:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check client/src/lib/supplierPurchaseOrderPaginationClient.ts
  fmt-main-client:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check client/src/main.tsx
  fmt-account-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/accountTransactionPaginationRoutes.ts
  fmt-daybook-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/daybookPaginationRoutes.ts
  fmt-voucher-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/vouchers/voucherPaginationRoutes.ts
  fmt-ledger-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/ledgerAccountPaginationRoutes.ts
  fmt-container-list-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/containers/containerListPaginationRoutes.ts
  fmt-supplier-po-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts
  fmt-container-registry:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/containerRoutes.ts
  fmt-ledger-registry:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/ledgerRoutes.ts
  fmt-voucher-registry:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/voucherRoutes.ts

  ts-account-statement-client:
    executor: node20
    steps:
      - install_dependencies
      - ts_file_check:
          pattern: accountStatementPaginationClient
  ts-container-client:
    executor: node20
    steps:
      - install_dependencies
      - ts_file_check:
          pattern: containerPaginationClient
  ts-factory-daybook-client:
    executor: node20
    steps:
      - install_dependencies
      - ts_file_check:
          pattern: daybookPaginationClient
  ts-erp-daybook-client:
    executor: node20
    steps:
      - install_dependencies
      - ts_file_check:
          pattern: erpDaybookPaginationClient
  ts-supplier-po-client:
    executor: node20
    steps:
      - install_dependencies
      - ts_file_check:
          pattern: supplierPurchaseOrderPaginationClient
  ts-main-client:
    executor: node20
    steps:
      - install_dependencies
      - ts_file_check:
          pattern: client/src/main

  client-accounts-page:
    executor: node20
    steps:
      - install_dependencies
      - run:
          command: |
            sed -i 's#const ACCOUNT_STATEMENT_SUFFIX = .*#const ACCOUNT_STATEMENT_SUFFIX = "/__disabled_statement__";#' build/vitePhase1PaginationPlugin.ts
            sed -i 's#const ACCOUNT_TYPES_SUFFIX = .*#const ACCOUNT_TYPES_SUFFIX = "/__disabled_types__";#' build/vitePhase1PaginationPlugin.ts
            PHASE1_TRANSFORM_SCOPE=accounts node --max-old-space-size=4096 node_modules/vite/bin/vite.js build
  client-account-statement:
    executor: node20
    steps:
      - install_dependencies
      - run:
          command: |
            sed -i 's#const ACCOUNTS_SUFFIX = .*#const ACCOUNTS_SUFFIX = "/__disabled_accounts__";#' build/vitePhase1PaginationPlugin.ts
            sed -i 's#const ACCOUNT_TYPES_SUFFIX = .*#const ACCOUNT_TYPES_SUFFIX = "/__disabled_types__";#' build/vitePhase1PaginationPlugin.ts
            PHASE1_TRANSFORM_SCOPE=accounts node --max-old-space-size=4096 node_modules/vite/bin/vite.js build
  client-account-types:
    executor: node20
    steps:
      - install_dependencies
      - run:
          command: |
            sed -i 's#const ACCOUNTS_SUFFIX = .*#const ACCOUNTS_SUFFIX = "/__disabled_accounts__";#' build/vitePhase1PaginationPlugin.ts
            sed -i 's#const ACCOUNT_STATEMENT_SUFFIX = .*#const ACCOUNT_STATEMENT_SUFFIX = "/__disabled_statement__";#' build/vitePhase1PaginationPlugin.ts
            PHASE1_TRANSFORM_SCOPE=accounts node --max-old-space-size=4096 node_modules/vite/bin/vite.js build

workflows:
  phase1-pinpoint:
    jobs:
      - fmt-account-statement-client
      - fmt-container-client
      - fmt-factory-daybook-client
      - fmt-erp-daybook-client
      - fmt-supplier-po-client
      - fmt-main-client
      - fmt-account-route
      - fmt-daybook-route
      - fmt-voucher-route
      - fmt-ledger-route
      - fmt-container-list-route
      - fmt-supplier-po-route
      - fmt-container-registry
      - fmt-ledger-registry
      - fmt-voucher-registry
      - ts-account-statement-client
      - ts-container-client
      - ts-factory-daybook-client
      - ts-erp-daybook-client
      - ts-supplier-po-client
      - ts-main-client
      - client-accounts-page
      - client-account-statement
      - client-account-types
