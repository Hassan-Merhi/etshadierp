version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node20:
    docker:
      - image: cimg/node:20.19
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

  node20-postgres:
    docker:
      - image: cimg/node:20.19
        environment:
          NODE_ENV: test
          SESSION_SECRET: circleci-session-secret
          CSRF_ENFORCE: "0"
          ENABLE_SCHEDULERS: "false"
          NODE_OPTIONS: --max-old-space-size=4096
          PORT: "5000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
          PGSSLMODE: disable
      - image: cimg/postgres:15.13
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
    resource_class: medium+
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true
      - run:
          name: Dependency diagnostics
          command: |
            node --version
            npm --version
            npm config get bin-links
            node -p "'TypeScript ' + require('typescript/package.json').version"
            node -p "'jsdom ' + require('jsdom/package.json').version"
            for binary in tsc vite eslint vitest; do
              test -x "node_modules/.bin/$binary" || { echo "$binary is missing"; exit 1; }
            done

  wait_for_postgres:
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                echo "PostgreSQL is accepting connections."
                exit 0
              fi
              sleep 1
            done
            echo "PostgreSQL did not become ready."
            exit 1

jobs:
  static-build:
    executor: node20
    steps:
      - install_dependencies
      - run:
          name: Phase 1 branch formatting and diagnostic report
          command: |
            if [ "${CIRCLE_BRANCH}" != "agent/phase1-sql-pagination" ]; then
              echo "Not the Phase 1 branch; skipping."
              exit 0
            fi

            node node_modules/prettier/bin/prettier.cjs --write \
              client/src/lib/accountStatementPaginationClient.ts \
              client/src/lib/containerPaginationClient.ts \
              client/src/lib/daybookPaginationClient.ts \
              client/src/lib/erpDaybookPaginationClient.ts \
              client/src/lib/supplierPurchaseOrderPaginationClient.ts \
              client/src/main.tsx \
              server/routes/accountTransactionPaginationRoutes.ts \
              server/routes/containerRoutes.ts \
              server/routes/containers/containerListPaginationRoutes.ts \
              server/routes/daybookPaginationRoutes.ts \
              server/routes/ledgerAccountPaginationRoutes.ts \
              server/routes/ledgerRoutes.ts \
              server/routes/voucherRoutes.ts \
              server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts \
              server/routes/vouchers/voucherPaginationRoutes.ts

            set +e
            mkdir -p docs
            {
              echo "PHASE 1 VALIDATION REPORT"
              echo "commit=$(git rev-parse HEAD)"
              echo
              echo "=== TYPESCRIPT ==="
              npm run check
              CHECK_STATUS=$?
              echo "typescript_status=$CHECK_STATUS"
              echo
              echo "=== STATIC VERIFIER ==="
              node scripts/verify-phase1-sql-pagination.mjs
              VERIFY_STATUS=$?
              echo "verifier_status=$VERIFY_STATUS"
              echo
              echo "=== PRODUCTION BUILD ==="
              npm run build
              BUILD_STATUS=$?
              echo "build_status=$BUILD_STATUS"
              echo
              echo "SUMMARY typescript=$CHECK_STATUS verifier=$VERIFY_STATUS build=$BUILD_STATUS"
            } > docs/phase1-validation-report.txt 2>&1
            cat docs/phase1-validation-report.txt
            set -e

            git config user.name "circleci"
            git config user.email "circleci@users.noreply.github.com"
            git fetch origin main --depth=1
            git checkout origin/main -- .circleci/config.yml
            rm -f .github/workflows/phase1-pagination-validate.yml
            git add .circleci/config.yml .github/workflows/phase1-pagination-validate.yml client/src server/routes docs/phase1-validation-report.txt
            if git diff --cached --quiet; then
              echo "Nothing to commit."
            else
              git commit -m "chore: format and diagnose Phase 1 pagination"
              git push origin HEAD:${CIRCLE_BRANCH}
            fi
            exit 1
      - run:
          name: Verify lockfile and production dependencies
          command: |
            npm run verify:lockfile
            npm run verify:production-dependencies
      - run:
          name: Check formatting for changed source files
          command: |
            git fetch origin main --depth=1
            mapfile -d '' changed_files < <(
              git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- client/src server shared tests scripts |
                grep -zE '\.(ts|tsx|css|mjs)$' || true
            )
            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "No changed source files require formatting checks."
              exit 0
            fi
            printf 'Checking formatting for %s changed source file(s):\n' "${#changed_files[@]}"
            printf ' - %s\n' "${changed_files[@]}"
            node node_modules/prettier/bin/prettier.cjs --check "${changed_files[@]}"
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: TypeScript
          command: npm run check
      - run:
          name: Production build
          command: npm run build
      - run:
          name: Verify server bundle
          command: npm run verify:server-bundle
      - run:
          name: Repository safety contracts
          command: |
            npm run verify:program1-observability
            npm run check:program-6-security
            npm run verify:final-production-readiness
            npm run verify:bandwidth
      - store_artifacts:
          path: dist
          destination: production-build

  postgres-regression:
    executor: node20-postgres
    steps:
      - install_dependencies
      - wait_for_postgres
      - run:
          name: Verify migration registry
          command: node scripts/verify-migration-registry.mjs --json
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - run:
          name: Verify disposable database schema
          command: node scripts/verify-ci-disposable-schema.mjs
      - run:
          name: Build application
          command: npm run build
      - run:
          name: Backend tests
          command: npm run test:backend
      - run:
          name: Frontend tests
          command: npm run test:frontend

  security-readiness:
    executor: node20-postgres
    steps:
      - install_dependencies
      - wait_for_postgres
      - run:
          name: Prepare disposable database schema
          command: node node_modules/drizzle-kit/bin.cjs push --force
      - run:
          name: Critical dependency audit
          command: npm audit --audit-level=critical
      - run:
          name: Production dependency verification
          command: npm run verify:production-dependencies
      - run:
          name: Program 6 security checks
          command: npm run check:program-6-security
      - run:
          name: Final production readiness contract
          command: npm run verify:final-production-readiness

workflows:
  full-erp-verification:
    jobs:
      - static-build
      - postgres-regression
      - security-readiness
