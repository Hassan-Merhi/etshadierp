version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install:
    steps:
      - checkout
      - run:
          name: Pin checkout and install
          command: |
            git fetch --no-tags --prune origin "+refs/heads/${CIRCLE_BRANCH}:refs/remotes/origin/${CIRCLE_BRANCH}"
            git reset --hard "${CIRCLE_SHA1}"
            git clean -ffdx
            sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            npm ci --no-audit --bin-links=true

jobs:
  wave1-generate-only:
    executor: node22
    steps:
      - install
      - run:
          name: Generate and verify split
          command: |
            node scripts/god-files-wave1-split.mjs
            npm run audit:god-files
            npm run audit:doc-index
            npm run check
            git diff --check
  wave1-push-probe:
    executor: node22
    steps:
      - checkout
      - run:
          name: Probe branch write permission without changing it
          command: git push origin HEAD:${CIRCLE_BRANCH}

workflows:
  wave1-publication-diagnosis:
    jobs:
      - wave1-generate-only
      - wave1-push-probe
