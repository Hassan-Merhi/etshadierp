version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node20:
    docker:
      - image: cimg/node:20.19
    resource_class: medium+
    working_directory: ~/project
    environment:
      NODE_ENV: test
      SESSION_SECRET: circleci-session-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: "5000"

commands:
  install_dependencies:
    steps:
      - checkout
      - run:
          name: Normalize package registry URLs
          command: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --no-audit --bin-links=true

  run_typescript_group:
    parameters:
      pattern:
        type: string
    steps:
      - run:
          name: TypeScript group
          command: |
            set +e
            npm run check > /tmp/typescript.txt 2>&1
            if grep -E '<< parameters.pattern >>' /tmp/typescript.txt; then
              exit 1
            fi
            exit 0

jobs:
  fmt-clients:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check client/src/lib/accountStatementPaginationClient.ts client/src/lib/containerPaginationClient.ts client/src/lib/daybookPaginationClient.ts client/src/lib/erpDaybookPaginationClient.ts client/src/lib/supplierPurchaseOrderPaginationClient.ts client/src/main.tsx

  fmt-account-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/accountTransactionPaginationRoutes.ts

  fmt-daybook-routes:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/daybookPaginationRoutes.ts server/routes/vouchers/voucherPaginationRoutes.ts server/routes/ledgerAccountPaginationRoutes.ts

  fmt-container-routes:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/containers/containerListPaginationRoutes.ts server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts

  fmt-registries:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/containerRoutes.ts server/routes/ledgerRoutes.ts server/routes/voucherRoutes.ts

  lint-clients:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/eslint/bin/eslint.js client/src/lib/accountStatementPaginationClient.ts client/src/lib/containerPaginationClient.ts client/src/lib/daybookPaginationClient.ts client/src/lib/erpDaybookPaginationClient.ts client/src/lib/supplierPurchaseOrderPaginationClient.ts client/src/main.tsx

  lint-account-route:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/eslint/bin/eslint.js server/routes/accountTransactionPaginationRoutes.ts

  lint-daybook-routes:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/eslint/bin/eslint.js server/routes/daybookPaginationRoutes.ts server/routes/vouchers/voucherPaginationRoutes.ts server/routes/ledgerAccountPaginationRoutes.ts

  lint-container-routes:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/eslint/bin/eslint.js server/routes/containers/containerListPaginationRoutes.ts server/routes/vouchers/supplierPurchaseOrderPaginationRoutes.ts

  lint-registries:
    executor: node20
    steps:
      - install_dependencies
      - run: node node_modules/eslint/bin/eslint.js server/routes/containerRoutes.ts server/routes/ledgerRoutes.ts server/routes/voucherRoutes.ts

  ts-account-route:
    executor: node20
    steps:
      - install_dependencies
      - run_typescript_group:
          pattern: accountTransactionPaginationRoutes

  ts-daybook-routes:
    executor: node20
    steps:
      - install_dependencies
      - run_typescript_group:
          pattern: daybookPaginationRoutes|voucherPaginationRoutes|ledgerAccountPaginationRoutes

  ts-container-routes:
    executor: node20
    steps:
      - install_dependencies
      - run_typescript_group:
          pattern: containerListPaginationRoutes|supplierPurchaseOrderPaginationRoutes

  ts-clients:
    executor: node20
    steps:
      - install_dependencies
      - run_typescript_group:
          pattern: accountStatementPaginationClient|containerPaginationClient|daybookPaginationClient|erpDaybookPaginationClient|supplierPurchaseOrderPaginationClient|client/src/main

  ts-plugin:
    executor: node20
    steps:
      - install_dependencies
      - run_typescript_group:
          pattern: vitePhase1PaginationPlugin|vite.config

  client-main:
    executor: node20
    steps:
      - install_dependencies
      - run:
          command: PHASE1_TRANSFORM_SCOPE=main node --max-old-space-size=4096 node_modules/vite/bin/vite.js build

  client-daybook:
    executor: node20
    steps:
      - install_dependencies
      - run:
          command: PHASE1_TRANSFORM_SCOPE=daybook node --max-old-space-size=4096 node_modules/vite/bin/vite.js build

  client-accounts:
    executor: node20
    steps:
      - install_dependencies
      - run:
          command: PHASE1_TRANSFORM_SCOPE=accounts node --max-old-space-size=4096 node_modules/vite/bin/vite.js build

  client-all:
    executor: node20
    steps:
      - install_dependencies
      - run:
          command: PHASE1_TRANSFORM_SCOPE=all node --max-old-space-size=4096 node_modules/vite/bin/vite.js build

workflows:
  phase1-diagnostics:
    jobs:
      - fmt-clients
      - fmt-account-route
      - fmt-daybook-routes
      - fmt-container-routes
      - fmt-registries
      - lint-clients
      - lint-account-route
      - lint-daybook-routes
      - lint-container-routes
      - lint-registries
      - ts-account-route
      - ts-daybook-routes
      - ts-container-routes
      - ts-clients
      - ts-plugin
      - client-main
      - client-daybook
      - client-accounts
      - client-all
